<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gameverse Studio</title>
  <link rel="stylesheet" href="/v2/web/studio.css">
  <script type="module" src="/v2/web/studio-app.js"></script>
</head>
<body>
  <aside class="rail" aria-label="Your games">
    <a class="brand" href="/v2">Gameverse <span>studio</span></a>
    <form id="create" class="create">
      <label for="prompt">Describe a game</label>
      <textarea id="prompt" rows="3" placeholder="A penguin ninja sliding through an ice fortress, throwing snowballs at walrus guards" required></textarea>
      <button type="submit" class="primary" id="make">Make it</button>
    </form>
    <section id="questions" class="questions" hidden aria-live="polite"></section>
    <div class="list-head"><h2>Your games</h2><button id="clear" class="quiet" type="button">Clear all</button></div>
    <ul id="games" class="games"></ul>
  </aside>
  <main id="stage" class="stage"></main>
  <aside id="sheet" class="sheet" aria-label="Build details" hidden>
    <h2>Build</h2><ol id="timeline" class="timeline"></ol>
    <h2>Checks</h2><div id="checks" class="checks"></div>
    <h2>Versions</h2><ol id="versions" class="versions"></ol>
  </aside>
</body>
</html>
