<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gameverse v2</title>
  <link rel="stylesheet" href="/v2/web/app.css">
  <script type="module" src="/v2/web/app.js"></script>
</head>
<body>
  <main>
    <header><h1>Gameverse <span>v2</span></h1><p id="status" role="status">Loading…</p></header>
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="Game"></canvas>
    <p class="help">Arrows / WASD move · Space / Z = A (jump) · X = B (fire) · R restarts</p>
    <pre id="report" aria-label="Playtest report"></pre>
  </main>
</body>
</html>
