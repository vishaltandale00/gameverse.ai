proposed_concepts:
- id: frontend.boot.language_select
  label: Boot language select
  definition: A language choice shown before or instead of the publisher logos on first boot, stored for later sessions.
  is_a:
  - frontend.flow.mode_state_machine
- id: frontend.menu.character_select
  label: Character select
  definition: Front-end choice among playable characters that share a core rule set but differ in abilities.
- id: frontend.save.checksummed_flash_record
  label: Checksummed single save record
  definition: One whole-game save record (progress, settings, records) written to non-volatile memory with a magic
    number and checksum, rotated across sectors.
- id: frontend.game_over.lives_restart_checkpoint
  label: Lives with checkpoint restart
  definition: Each death consumes a life and restarts the level from the last checkpoint; zero lives ends the run.
  seed_source: 'gdp: Lives'
- id: mechanics.goal.time_limit
  label: Level time limit
  definition: A per-level clock that kills or fails the player when it reaches a fixed maximum.
  seed_source: 'gdp: Time Limits'
- id: mechanics.mode.time_attack
  label: Time attack mode
  definition: Separate mode that replays levels for fastest completion with stored best times.
  seed_source: 'gdp: High Score Lists'
- id: projection.pseudo_3d.scaled_sprite_depth
  label: Scaled-sprite depth
  definition: Fakes forward motion through depth by scaling sprites with a per-object depth value instead of transforming
    a background plane.
- id: camera.follow.deadzone_window
  label: Dead-zone follow window
  definition: The camera stays still while the target is inside a window around the screen centre and moves at a capped
    speed once it leaves, possibly with different windows per axis and state.
- id: camera.look.directional_peek
  label: Directional peek
  definition: Holding a direction while idle pans the camera ahead in that direction after a delay, returning when
    the player moves.
- id: movement_physics.momentum.surface_ground_speed
  label: Surface ground-speed momentum
  definition: Movement keeps one scalar speed along the current surface that is projected through the surface angle,
    so momentum carries around slopes, walls and ceilings.
  is_a:
  - movement_physics.locomotion.accel_to_cap_run
  seed_source: 'vgdl: InertialAvatar'
- id: movement_physics.momentum.slope_slip_detach
  label: Slope slip and detach
  definition: On surfaces steeper than a threshold the character falls off and loses control briefly unless moving
    faster than a minimum speed.
  is_a:
  - movement_physics.locomotion.slope_speed_modifier
- id: movement_physics.collision.heightmap_tile_sensors
  label: Height-map tile sensors
  definition: Terrain collision by probing per-tile height maps and angles along the character's local axes, giving
    smooth slopes and arbitrary-angle surfaces on a tile grid.
- id: movement_physics.collision.layer_switch_loop
  label: Layer-switched loops
  definition: Overlapping terrain is split into collision layers and invisible triggers switch the character's active
    layer, enabling loops and crossing paths in a 2D tile map.
- id: movement_physics.jump.surface_normal_impulse
  label: Surface-normal jump
  definition: The jump impulse is applied perpendicular to the current surface instead of straight up, preserving
    tangential momentum.
  is_a:
  - movement_physics.jump.fixed_impulse_gravity_arc
- id: movement_physics.air_control.air_drag
  label: Air drag
  definition: A small proportional loss of horizontal airborne speed per frame under certain conditions.
- id: movement_physics.launcher.spring_set_velocity
  label: Spring launcher
  definition: A contact object that overwrites the character's velocity along its axis with a fixed strength.
- id: movement_physics.launcher.dash_panel
  label: Dash panel
  definition: A floor object that sets ground speed to a fixed high value if the character is slower.
- id: movement_physics.locomotion.rail_grind
  label: Rail grind
  definition: A rail-riding state with its own friction, minimum speed and slope gain, exited by jumping.
- id: movement_physics.air_action.air_dash
  label: Air dash
  definition: A one-per-jump mid-air horizontal impulse triggered by input.
- id: movement_physics.air_action.timed_flight
  label: Stamina-limited flight
  definition: Repeated mid-air flaps give lift until a stamina timer runs out.
- id: movement_physics.air_action.glide
  label: Glide
  definition: Mid-air state with slow capped descent and horizontal speed that builds over time, steered by input.
- id: movement_physics.air_action.free_flight
  label: Free flight
  definition: Unrestricted 2D movement in the air without gravity, usually in a special mode.
- id: movement_physics.wall.wall_climb
  label: Wall climb
  definition: Grabbing a wall from a glide or jump and moving vertically along it with optional kick-off.
- id: mechanics.hazard.drowning_timer
  label: Drowning timer
  definition: Staying submerged runs down an air timer with on-screen countdown that kills at zero unless air is
    replenished.
  is_a:
  - mechanics.hazard.environmental_damage_over_time
- id: mechanics.combat.melee_weapon_swing
  label: Melee weapon swing
  definition: A button-triggered attack hitbox from a held weapon, separate from body-contact attacks.
- id: mechanics.roster.shared_core_character_variants
  label: Shared-core character roster
  definition: Several playable characters run the same physics core and differ by an action layer of special moves.
- id: mechanics.combat.ring_buffer_health
  label: Collectible-buffer health
  definition: A collected resource acts as health; any hit with at least one unit drops the whole stock instead of
    killing, and a hit with none is lethal.
  seed_source: 'gdp: Lives'
- id: economy.drain.recoverable_scatter
  label: Recoverable scatter
  definition: On loss, part of a resource is spawned as short-lived pickups the player can recover.
- id: economy.source.chain_score_multiplier
  label: Chain score
  definition: Consecutive scoring events without a reset condition award increasing points.
- id: mechanics.powerup.timed_powerup
  label: Timed power-up
  definition: A pickup that grants a temporary state (invincibility, speed, shield) for a fixed duration or one hit.
- id: economy.source.item_container
  label: Item container
  definition: A breakable object that yields one predefined or random reward.
- id: mechanics.respawn.checkpoint
  label: Checkpoint respawn
  definition: Touching a marker stores the respawn point (and possibly time) used after death.
- id: mechanics.goal.ring_quota_checkpoint
  label: Collection quota gates
  definition: A bonus course where reaching each gate requires having collected a minimum count, failing the stage
    otherwise.
- id: progression.collectible.bonus_stage_token
  label: Bonus-stage token
  definition: A persistent collectible earned only by clearing an optional bonus stage.
- id: mechanics.resource.draining_timer_resource
  label: Draining resource timer
  definition: A resource that decreases at a fixed rate and ends the attempt when empty, refilled by pickups.
- id: ai.companion.delayed_input_follower
  label: Delayed-input follower
  definition: A companion character driven by the leader's recorded inputs after a fixed delay, with corrections to
    stay close and catch-up respawn when lost.
  seed_source: 'gdp: Companions'
- id: ai.enemy.patrol_ranged_attack
  label: Patrol with ranged attack
  definition: An enemy patrolling a fixed span that fires projectiles when the player enters a detection region.
- id: ai.boss.hit_counter_pinch_phase
  label: Hit-counter boss with pinch phase
  definition: A boss defeated after a fixed number of hits, with brief post-hit invulnerability and faster behaviour
    after a threshold.
- id: progression.structure.linear_level_sequence
  label: Linear level sequence
  definition: Levels are played in a fixed order and unlocked by clearing the previous one.
- id: progression.gating.collect_all_tokens
  label: Collect-all gate
  definition: Access to final content or the true ending requires every one of a set of optional collectibles.
- id: economy.converter.threshold_reward
  label: Threshold reward
  definition: Crossing each multiple of a counter (rings, score) grants a reward such as an extra life.
- id: economy.source.time_bonus_tiers
  label: Tiered time bonus
  definition: Completion awards points from a table of time thresholds; faster clears earn more.
- id: ui_hud.input.configurable_button_layout
  label: Configurable button layout
  definition: An option that swaps or remaps action buttons, stored in the save.
- id: setting.theme.cartoon_mascot_adventure
  label: Cartoon mascot adventure
  definition: Colourful cartoon world with an animal mascot hero opposing a comic villain and his robots.
- id: setting.tone.upbeat_speed
  label: Upbeat speed
  definition: Optimistic, fast-paced tone emphasising speed and spectacle over threat.
- id: audio.music.tempo_modulated_music
  label: Tempo-modulated music
  definition: Gameplay state changes the playback tempo of the current track rather than switching tracks.
open_questions:
- 'Region mismatch: SAT-R/sa2 builds the European SA1 ROM (config.mk GAME_REGION EUROPE, sa1.sha1 eb00f101...,
  5 languages), our ROM is USA ASOE (d842af..., En/Ja). All decomp citations are EU code. Spindash tables and
  special-stage quotas were confirmed directly in the USA ROM at shifted offsets (-0x7004 and -0x7100 vs EU), so code
  and data are not byte-aligned across regions; other EU-only data (incbin tables) were not checked.'
- 'Decomp completeness: SA1 links entirely from C but ~159 function bodies are still non-matching asm includes and
  most SA1 functions are unnamed (sub_80xxxxx). Non-matching ones used here: Knuckles glide update (sub_8048980), CPU
  Tails respawn (Player_Tails_804571C), rail jump (sub_8044434), look-down (Player_80447D8).'
- 'Spindash charge clamp: the code uses MAX(charge+2, Q(8)), so the first press saturates to index 8 (9 px/frame) and
  quick re-presses can index 9, reading the next table (8.25 normal) or unrelated bytes 0x4342 in boosted mode. Whether
  this matches real behaviour needs a frame-stepped capture.'
- MOVESTATE_2000 swaps in 7.5 px/frame top speed and the fast spindash table but no setter was found in SA1 sources;
  it may be Super Sonic-related or unused.
- 'Air drag condition compares (u16)qSpeedAirY > (u16)(-Q(67)-1), i.e. applies for any upward speed; the Genesis rule
  limits it to the top of the arc. Confirm with capture.'
- Special-stage depth units, hazard types (bombs) and ring loss on hazards were not traced in special_stage/main.c
  (2841 lines); the component relies partly on low-confidence recall.
- Bosses 2, 3, 4, 6 and the X Zone trio hit counts and attack patterns were not read; only Egg Hammer Tank, Mecha
  Knuckles and Super Egg Robo counts are cited.
- Captures cover only front end and the first seconds of Neo Green Hill 1 (paused by the scripted START presses). No
  gameplay physics, special stage, boss or attract-demo footage exists to confirm derived values.
- Amy's unlock condition and the exact options menu contents were not traced in options.c/course_select.c.
- 'gUnknown_080D650C/080D661C per-level teleport offsets in sub_80232D0 look like level wrap/shift points but their
  data (incbin) was not decoded.'
- SA2 and SA3 share this engine (src/game/shared); once decomposed, ground_momentum, slope_physics, spin_dash and
  stage_camera should get variant_of relations to them.
