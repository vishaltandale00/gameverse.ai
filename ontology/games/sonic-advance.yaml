  summary: 'Each grounded frame adds a slope term proportional to sin(surface angle): 3/32 of the sine (max 24/256
    px/frame^2) when running, and 60/256 of the sine when rolling, quartered when it opposes motion (uphill). The run
    term is applied only while moving and away from ceilings. On a surface steeper than 45 degrees, ground speed below
    1.875 px/frame drops the player off (air state) and locks horizontal control for 30 frames; that is what forces
    momentum into loops and quarter-pipes.'
