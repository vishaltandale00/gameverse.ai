schema_version: 0
id: sonic-advance
game:
  title: Sonic Advance
  platform: gba
  game_code: ASOE
  rom_sha1: d842afa7dd1e84de08addb94a51506f1bcafd551
  year: 2002
  developer: Dimps / Sonic Team
  derived_genres:
  - momentum_platformer
  - action_platformer
  evidence_basis:
  - decomp_source
  - static_signature
  - capture_telemetry
  - capture_frame
  - derived
  - llm_knowledge
  sources:
  - kind: decomp
    ref: https://github.com/SAT-R/sa2 @ 393357f7c9d46b5c10b6c41a57b80fe3b58f3c8d (no license file; local/decomps/sa2). SA1 is
      built with GAME_NAME=sa1 (config.mk GAME_REGION EUROPE, sa1.sha1 eb00f101... = 'Sonic Advance (Europe) (En,Ja,Fr,De,Es)'
      per README), not our USA ASOE ROM. SA1 code lives in src/game/sa1/** (173 .c files, ~82k lines) plus engine code
      shared with SA2 in src/game/shared/** behind '#if GAME == GAME_SA1' guards; sa1_ldscript links only C objects
      (no asm/*.o), with ~159 function bodies still pulled from asm/non_matching (*sa1*). Data tables are incbin'd
      from a EU baserom, so values were cross-checked in the USA ROM where noted.
  - kind: rom_header
    ref: local/re/roms.json id=sonic-advance (header title SONICADVANCE, maker 78, version 0, 8 MiB, file 'Sonic Advance
      (USA) (En,Ja).gba')
  - kind: rom_scan
    ref: 'USA ROM byte scans (values only, no bytes committed): gPlayerCharacterIdleAnims signature {0,99,199,298} found
      once at 0x4A6F04 (EU 0x4ADF08); spindash tables follow at +0x180 and match EU layout (next bytes 42 43 44 45 =
      gCharStatesKnucklesGlideTurn). Special-stage Background template with layoutVram 0x0600C01A found at 0x47FF34;
      stage->special-stage map and ring-quota table at +0x100.'
  - kind: captures
    ref: local/captures/sonic-advance run 20261015T234415-8f46cf (harness 0.1.0, libmgba 0.10.5 HLE BIOS, source commit
      d431b81 dirty tree); phases attract (3600 frames, no input) and frontend (5400 frames, START/A alternating every
      90 frames from frame 180)
  - kind: extraction_run
    ref: claude-opus-5-5, brief v1, 2026-10-16T03:56:00Z-2026-10-16T04:13:00Z (~17 min wall), ~45 decomp files opened
      or grepped (~25 read in depth) plus 2 capture phases (summary, phase.json, telemetry.csv, 8 keyframes) and 2 ROM
      byte scans
conventions:
  units_convention: 'Positions and speeds are Q24.8 fixed point (global.h Q()/I()): 1 native unit = 1/256 px, so speeds
    are 1/256 px/frame and accelerations 1/256 px/frame^2. The player keeps a scalar ground speed (qSpeedGround) along
    the surface and an air velocity (qSpeedAirX/Y); on ground the air velocity is recomputed each frame as ground speed
    projected through the surface angle (cos/sin). Screen-space +Y is down; negative Y speed is upward. Params below
    are converted to px, px/frame, px/frame^2 and frames; native values are in native_value or evidence notes.'
  angle_convention: 'p->rotation is a u8 angle, 256 steps per full turn (0 = flat floor; 0x40 = quarter turn). Trig
    uses a Q2.14 sine table indexed by rotation*4 (trig.h SIN_24_8/COS_24_8 convert to Q24.8).'
  time_convention: 60 frames per second (GBA_FRAMES_PER_SECOND); TIME(m,s) = (m*60+s)*60 frames.
  space_convention: 'Screen 240x160 px. Background tiles are 8 px; stage metatiles are 12x12 tiles = 96 px (camera.h
    METATILE_DIM); entity placement regions are 256 px (CAM_REGION_WIDTH).'
  region_note: Decomp targets the European ROM; every decomp citation is EU-build code assumed identical in mechanics
    for USA ASOE unless a USA ROM scan (static_signature) is cited. See open_questions.
components:
- id: boot_and_mode_flow
  facet: frontend
  label: Language select, SEGA logo, title and task-driven mode flow
  summary: The USA cart boots to a two-option language select (Japanese/English), then a 'Presented by SEGA' logo, an
    intro animation and the title screen ('PRESS START'), followed by a main menu with single player, multiplayer,
    time attack, options and a Tiny Chao Garden entry. Flow is not a central mode switch but chained task callbacks
    (gCurTask->main reassignment) with brightness fades between screens.
  instantiates:
  - concept: frontend.flow.mode_state_machine
    weight: 0.7
  - concept: frontend.boot.language_select
  reads:
  - input.buttons.pressed
  - save.language
  writes:
  - frontend.active_task
  - save.language
  params:
    title_start_ignore_frames:
      value: 60
      unit: frames
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/sa1/menus/title_screen.c (title->unkE2 > 60 before START is read)
        confidence: 0.85
    main_menu_secondary_items:
      value: multiplayer, time attack, options, Tiny Chao Garden
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/sa1/menus/title_screen.c:sMainMenuSecondaryItems
        confidence: 0.9
  invariants:
  - Each screen is a task; transitions replace the task callback rather than returning to a dispatcher.
  relations:
  - type: part_of
    target: title_and_attract_demo
  evidence:
  - kind: capture_frame
    ref: capture:attract:frame 300 keyframe (language select, Japanese/English only, idles without input)
    confidence: 0.9
  - kind: capture_frame
    ref: capture:frontend:frames 561 (SEGA logo), 1203 (title), 1451 (character select)
    confidence: 0.9
  - kind: capture_telemetry
    ref: capture:frontend:frames 7-1587 DISPCNT 0x5140 (language) -> 0x0440 (logo) -> 0x1541 mode1 (title) -> 0x3e40
      (stage)
    confidence: 0.85
  - kind: decomp_source
    ref: sa2:src/game/sa1/menus/title_screen.c
    confidence: 0.8
  - kind: decomp_source
    ref: sa2:src/game/sa1/ui/edit_language_screen.c
    confidence: 0.5
    note: file exists; EU build offers 5 languages, USA capture shows only 2 (region difference)
- id: title_and_attract_demo
  facet: frontend
  label: Title idle timer and rotating recorded-input attract demos
  summary: After 900 idle frames on the title the game starts one of four attract demos in rotation, each a fixed
    (character, level) pair driven by recorded input through the normal stage code with a 'DEMO PLAY' sprite. The demo
    manager forces default button mapping and normal difficulty and ends playback after 30 s of stage time or on a
    real button press.
  instantiates:
  - concept: frontend.title.attract_demo
  - concept: frontend.attract.input_playback_demo
  reads:
  - title.idle_timer
  - demo.play_counter
  - stage.checkpoint_time
  writes:
  - input.playback_stream
  - game.selected_character
  - game.current_level
  - demo.play_counter
  params:
    demo_idle_timeout:
      value: 900
      unit: frames (15 s)
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/sa1/menus/title_screen.c (title->unkE2 > 900 -> Task_SwitchToDemoInit)
        confidence: 0.9
    demo_playback_time:
      value: 1800
      unit: frames (30 s)
      native_value: TIME(0, 30)
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/shared/stage/demo_manager.c:DEMO_PLAYBACK_TIME (SA1 branch)
        confidence: 0.9
    demo_count:
      value: 4
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/sa1/menus/title_screen.c:Task_SwitchToDemoInit (gDemoPlayCounter % 4)
        confidence: 0.9
  tables:
    demos:
      description: Demo rotation order (character id 0 Sonic, 1 Tails, 2 Knuckles, 3 Amy; level index = zone*2+act).
      columns:
      - slot
      - character
      - level
      rows:
      - [0, Sonic, Neo Green Hill act 1]
      - [1, Tails, Secret Base act 1]
      - [2, Amy, Casino Paradise act 1]
      - [3, Knuckles, Ice Mountain act 1]
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/sa1/menus/title_screen.c:gUnknown_080BB323/gUnknown_080BB327
        confidence: 0.85
  invariants:
  - Demo playback uses the real stage update; only the input source differs.
  - Demo runs with STAGE_FLAG__DEMO_RUNNING, which also suppresses death on a ringless hit.
  relations:
  - type: part_of
    target: boot_and_mode_flow
  evidence:
  - kind: decomp_source
    ref: sa2:src/game/shared/stage/demo_manager.c:CreateDemoManager
    confidence: 0.85
  - kind: decomp_source
    ref: sa2:src/game/shared/stage/demo_manager.c:Task_DemoManagerMain
    confidence: 0.8
  - kind: capture_telemetry
    ref: capture:attract:frames 0-3600 (no input; stuck on language select, so no demo observed)
    confidence: 0.6
- id: character_and_course_select
  facet: frontend
  label: Four-character select, per-character course unlocks and CPU-Tails secret code
  summary: Single player picks Sonic, Tails, Knuckles or Amy; each character keeps its own highest unlocked level
    (unlockedLevels[character]) and a fresh character starts directly at Neo Green Hill act 1 while others go through
    course select. A nine-key input on character select (Up, Right, Down, Right, L, Right, R, Right, A) turns on a
    CPU partner Tails that follows the player.
  instantiates:
  - concept: frontend.menu.character_select
  - concept: frontend.menu.unlockable_extras
    weight: 0.4
  reads:
  - input.buttons.pressed
  - save.unlocked_levels[character]
  writes:
  - game.selected_character
  - game.tails_partner_enabled
  - game.current_level
  params:
    partner_code_length:
      value: 9
      unit: key presses
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/sa1/ui/character_select.c:sTailsUnlockKeys
        confidence: 0.9
  invariants:
  - A wrong key in the code sequence locks the check (index 0xFF) until Up restarts it.
  relations:
  - type: requires
    target: cpu_partner_follow_ai
    condition: code entered
  - type: part_of
    target: zone_act_progression
  evidence:
  - kind: decomp_source
    ref: sa2:src/game/sa1/ui/character_select.c:CheckCPUPartnerUnlock
    confidence: 0.9
  - kind: decomp_source
    ref: sa2:src/game/sa1/ui/character_select.c (gTailsEnabled, unlockedLevels == 0 -> ApplyGameStageSettingsAndStart)
    confidence: 0.85
  - kind: capture_frame
    ref: capture:frontend:frame 1451 keyframe (character select carousel)
    confidence: 0.85
  - kind: llm_knowledge
    ref: Amy must be unlocked by clearing the game with the other three characters
    confidence: 0.5
- id: flash_save
  facet: frontend
  label: Single flash save with emeralds, per-character progress, settings and records
  summary: One SaveGame record is kept in flash (two-sector rotation with erase/program/verify) holding a magic number,
    per-character unlocked level, player name, difficulty, language, time-limit toggle, button layout, a chaos-emerald
    bitfield, time-attack records, multiplayer scores, total score and a checksum. Saving happens on results screens,
    not at in-level save points.
  instantiates:
  - concept: frontend.save.checksummed_flash_record
  reads:
  - save.*
  writes:
  - save.*
  params:
    save_record_size:
      value: 1072
      unit: bytes
      native_value: '0x430'
      evidence:
      - kind: decomp_source
        ref: sa2:include/game/sa1/save.h:struct SaveGame
        confidence: 0.9
  invariants:
  - A missing flash chip (FLAGS_NO_FLASH_MEMORY) disables saving rather than blocking play.
  relations:
  - type: part_of
    target: zone_act_progression
  evidence:
  - kind: decomp_source
    ref: sa2:src/game/sa1/save.c:WriteSaveGame
    confidence: 0.9
  - kind: decomp_source
    ref: sa2:src/game/sa1/save.c:SaveGameExists
    confidence: 0.85
- id: lives_and_game_over
  facet: frontend
  label: Lives, time-over and game over
  summary: Single player starts with 3 lives (1 in some modes). Death (ringless hit, pit, drowning, or time over
    at 10:00 when the time limit is enabled) costs a life and restarts from the last checkpoint; reaching zero shows
    game over. Extra lives come from 1-UP boxes, every 100 rings and every 50,000 points.
  instantiates:
  - concept: frontend.game_over.lives_restart_checkpoint
  - concept: mechanics.goal.time_limit
    weight: 0.4
  reads:
  - game.lives
  - stage.course_time
  - save.time_limit_disabled
  writes:
  - game.lives
  - frontend.active_task
  params:
    starting_lives:
      value: 3
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/shared/stage/stage.c (gNumLives = 3)
        confidence: 0.9
    course_time_limit:
      value: 36000
      unit: frames (10:00)
      native_value: TIME(10, 0)
      evidence:
      - kind: decomp_source
        ref: sa2:include/constants/zones.h:MAX_COURSE_TIME
        confidence: 0.95
  invariants:
  - With the options toggle timeLimitDisabled set, passing 10:00 does not kill the player.
  relations:
  - type: requires
    target: ring_damage_rule
  - type: part_of
    target: checkpoints
  evidence:
  - kind: decomp_source
    ref: sa2:src/game/shared/stage/stage.c (gCourseTime > MAX_COURSE_TIME branch)
    confidence: 0.85
  - kind: decomp_source
    ref: sa2:src/game/sa1/ui/time_over.c
    confidence: 0.6
  - kind: decomp_source
    ref: sa2:src/game/sa1/ui/game_over.c
    confidence: 0.6
- id: extra_modes
  facet: frontend
  label: Time attack, link multiplayer modes and Tiny Chao Garden
  summary: Besides the story, the game offers time attack (best three times per course and character), link-cable
    multiplayer (race, Chao hunt, team play, and a single-pak ring-collection mode sent by multiboot) and a Tiny Chao
    Garden mini-game. Time attack and multiplayer force normal difficulty for the session.
  instantiates:
  - concept: frontend.menu.unlockable_extras
    weight: 0.5
  - concept: mechanics.mode.time_attack
  reads:
  - save.time_records
  writes:
  - save.time_records
  - game.mode
  params:
    game_modes:
      value: single, time attack, race, chao hunt, team play, collect rings (multiboot)
      evidence:
      - kind: decomp_source
        ref: sa2:include/game/globals.h:GAME_MODE_* (SA1 branch)
        confidence: 0.85
  relations:
  - type: modulates
    target: difficulty_modes
    note: forces DIFFICULTY_NORMAL during time attack, race and multiplayer
  evidence:
  - kind: decomp_source
    ref: sa2:src/game/shared/stage/stage.c (LOADED_SAVE->difficultyLevel = DIFFICULTY_NORMAL for these modes)
    confidence: 0.85
  - kind: decomp_source
    ref: sa2:src/game/sa1/menus/time_attack.c
    confidence: 0.5
  - kind: decomp_source
    ref: sa2:src/game/sa1/save.c:RegisterTimeRecord
    confidence: 0.7
- id: stage_bg_layer_stack
  facet: rendering
  label: Mode-0 stage stack of two metatile collision layers plus scenery BG
  summary: Stages run in DISPCNT mode 0 with BG1 (front metatile layer, priority 1), BG2 (back metatile layer, priority
    2) and BG3 (zone scenery, priority 3), OBJ in 1D mapping and WIN0 enabled. The two metatile layers mirror the two
    collision layers the player can switch between (loops). The extra stage switches to mode 1 with BG0-BG2.
  instantiates:
  - concept: rendering.background.tile_layer_stack
  reads:
  - camera.x
  - camera.y
  writes:
  - vram.bg_tilemaps
  - io.dispcnt
  - io.bgcnt
  params:
    metatile_size:
      value: 96
      unit: px (12x12 tiles)
      evidence:
      - kind: decomp_source
        ref: sa2:include/game/shared/stage/camera.h:METATILE_DIM
        confidence: 0.95
    stage_video_mode:
      value: 0
      variants:
      - when: extra stage (The Moon)
        value: 1
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/shared/stage/camera.c:InitCamera
        confidence: 0.9
      - kind: capture_telemetry
        ref: capture:frontend:frames 1587-5400 DISPCNT 0x3e40/0x1e40 (mode 0, BG1-3, OBJ, WIN0)
        confidence: 0.9
  relations:
  - type: requires
    target: loops_and_collision_layers
  evidence:
  - kind: decomp_source
    ref: sa2:src/game/shared/stage/camera.c:InitCamera
    confidence: 0.9
  - kind: decomp_source
    ref: sa2:src/game/shared/stage/camera.c:RenderMetatileLayers
    confidence: 0.7
  - kind: capture_telemetry
    ref: capture:frontend:max_sprites_visible 52, mode-0 frames 8577 / mode-1 409
    confidence: 0.8
- id: hblank_line_scroll_parallax
  facet: rendering
  label: Per-scanline BG scroll table for cloud bands and perspective water
  summary: Zone background updaters fill a 160-entry horizontal-offset table that an HBlank copy writes into a BG
    scroll register each line. In Neo Green Hill the top bands scroll on a timer at three speeds (clouds), middle
    rows stay static, and the bottom 'water' rows scroll by (line-86)/256 of camera X so lower lines move faster,
    giving a perspective water plane. Other zones (2 interior, 3, 6, 7 act 2) use the same mechanism.
  instantiates:
  - concept: rendering.raster.hblank_dma_scroll_distortion
  - concept: camera.parallax.layer_ratio_scroll
    weight: 0.6
  reads:
  - camera.x
  - stage.time
  writes:
  - io.bg3hofs[line]
  params:
    cloud_band_speeds:
      value: [0.0625, 0.03125, 0.015625]
      unit: px/frame (time-driven, rows 0-7, 8-23, 24-39)
      native_value: gStageTime >> 4, >> 5, >> 6
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/sa1/stage/backgrounds/zone_1.inc.c:StageBgUpdate_Zone1Acts12
        confidence: 0.95
    water_line_ratio:
      value: (line - 86) / 256
      unit: fraction of camera X per scanline, lines 88-159
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/sa1/stage/backgrounds/zone_1.inc.c:StageBgUpdate_Zone1Acts12
        confidence: 0.9
  invariants:
  - Lines 40-87 (big clouds and islands) carry zero offset in Neo Green Hill.
  relations:
  - type: part_of
    target: stage_bg_layer_stack
  - type: modulates
    target: stage_camera
    note: reads camera X each frame
  evidence:
  - kind: decomp_source
    ref: sa2:src/game/sa1/stage/backgrounds/zone_1.inc.c:StageBgUpdate_Zone1Acts12
    confidence: 0.95
  - kind: capture_telemetry
    ref: capture:frontend:hblank_dma_targets ch0->0x04000018 and ch0->0x0400001C (BG2/BG3 HOFS), bg_scroll hdma_frames_ge32=4268
    confidence: 0.9
- id: affine_title_zoom
  facet: rendering
  label: Title emblem zoom with mode-1 affine BG2
  summary: The title screen switches to mode 1 and scales the affine BG2 emblem from a large magnification down to
    1:1 over about 12 frames (BG2PA/PD ramp 0x41 -> 0x100) before showing PRESS START. Only one affine OBJ is ever
    visible in the captured front end.
  instantiates:
  - concept: rendering.background.affine_rotscale
  reads:
  - title.anim_timer
  writes:
  - io.bg2pa
  - io.bg2pd
  params:
    zoom_frames:
      value: 12
      unit: frames
      evidence:
      - kind: capture_telemetry
        ref: capture:frontend:frames 1042-1054 BG2PA 0x0041 -> 0x0100
        confidence: 0.85
  relations:
  - type: part_of
    target: boot_and_mode_flow
  evidence:
  - kind: capture_telemetry
    ref: capture:frontend:frames 992-1263 DISPCNT 0x1541 (mode 1, BG0/BG2, OBJ)
    confidence: 0.85
  - kind: capture_frame
    ref: capture:frontend:frame 1203 keyframe (title)
    confidence: 0.85
- id: special_stage_renderer
  facet: rendering
  label: Sprite-scaled pseudo-3D special stage over palette-cycled backgrounds
  summary: The special stage stays in tile mode 0 (DISPCNT 0x1C40) with four text BG panels and a full background;
    depth is faked by OBJ affine scaling of rings, bombs and the character as a forward-progress counter advances,
    while palette-loader tasks cycle 'big orthogonal' and 'small diagonal' light palettes per stage.
  instantiates:
  - concept: rendering.sprite.affine_rotscale
  - concept: projection.pseudo_3d.scaled_sprite_depth
  - concept: rendering.palette.runtime_palette_effects
    weight: 0.5
  reads:
  - special_stage.depth_progress
  - special_stage.forward_speed
  writes:
  - oam.affine_params
  - palette.bg
  params:
    stage_dispcnt:
      value: '0x1C40'
      unit: DISPCNT (mode 0, BG2+BG3+OBJ, 1D OBJ)
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/sa1/special_stage/main.c:sub_8029B74
        confidence: 0.85
  relations:
  - type: part_of
    target: special_stage
  evidence:
  - kind: decomp_source
    ref: sa2:src/game/sa1/special_stage/main.c:sub_8029B74
    confidence: 0.8
  - kind: decomp_source
    ref: sa2:src/game/sa1/special_stage/main.c (tf->qScaleX/qScaleY, Div(0x10000, qScale) into OAM affine)
    confidence: 0.75
- id: fades_and_transitions
  facet: rendering
  label: Brightness fades and zig-zag title-card wipe
  summary: Screen transitions use BLDY brightness fades (BLDCNT 0x3FFF/0x3F9F style full-screen fades), a zig-zag colour
    wipe at act start, and windows to mask regions; capture shows brightness fade and windows used but no alpha
    blending or mosaic in the observed front end and first act.
  instantiates:
  - concept: rendering.blending.brightness_fade
  reads:
  - transition.timer
  writes:
  - io.bldcnt
  - io.bldy
  - io.win0
  params:
    special_stage_fail_fade_step:
      value: 0.25
      unit: BLDY levels/frame (16 = full)
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/sa1/special_stage/main.c:Task_8029AC4 (qBlend += Q(0.25))
        confidence: 0.9
  evidence:
  - kind: capture_telemetry
    ref: capture:derived flags brightness_fade=true, windows=true, alpha_blend=false, mosaic=false
    confidence: 0.85
  - kind: capture_frame
    ref: capture:frontend:frame 1600 keyframe (zig-zag wipe at act start)
    confidence: 0.8
- id: stage_camera
  facet: camera
  label: Dead-zone follow camera with air band, look up/down and spindash hold
  summary: 'The camera target is the player centred (x-120, y-80 plus a sprite-height offset that eases 5 px/frame).
    Horizontally the camera only moves once the target leaves an 8 px dead band and then by at most 16 px/frame;
    there is no velocity look-ahead in SA1 (SA2 added one). Vertically the dead band is 0 on ground and grows by
    4 px/frame to 24 px in the air, with a 12 px/frame cap. Holding Up/Down while standing still for 120 frames pans
    the view 2 px/frame to 72 px up or 60 px down. Releasing a spindash freezes the camera for 10 frames, letting the
    player outrun the screen.'
  instantiates:
  - concept: camera.follow.deadzone_window
  - concept: camera.follow.speed_adaptive_lag
    weight: 0.4
  - concept: camera.look.directional_peek
  - concept: camera.follow.region_bounded_scroll
    weight: 0.5
  reads:
  - player.position
  - player.move_state.in_air
  - input.buttons.held.dpad_vertical
  writes:
  - camera.x
  - camera.y
  - camera.look_offset
  - camera.hold_frames
  params:
    horizontal_deadzone_half_width:
      value: 8
      unit: px
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/shared/stage/camera.c:InitCamera (unk44 = 8)
        confidence: 0.9
    horizontal_max_speed:
      value: 16
      unit: px/frame
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/shared/stage/camera.c:InitCamera (SA1 unk8 = 16, used as integer)
        confidence: 0.85
    vertical_max_speed:
      value: 12
      unit: px/frame
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/shared/stage/camera.c:InitCamera (unkC = 12)
        confidence: 0.9
    vertical_air_band:
      value: 24
      unit: px (grows/shrinks 4 px/frame)
      evidence:
      - kind: decomp_source
        ref: sa2:src/game/shared/stage/camera.c:UpdateCamera (unk48 += 4, MIN 24)
        confidence: 0.9
    look_delay:
      value: 120
