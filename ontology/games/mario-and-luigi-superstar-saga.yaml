proposed_concepts:
- id: mechanics.engine.priority_callback_scheduler
  label: Priority callback scheduler
  definition: An engine schedules stateful callbacks in priority order, with explicit enable and wait gates.
- id: mechanics.engine.protected_priority_pause
  label: Protected priority pause
  definition: A global pause gate preserves designated service-priority callbacks while disabling other processes.
- id: mechanics.engine.iteration_safe_process_removal
  label: Iteration safe process removal
  definition: Callback objects can remove themselves without leaving the scheduler pointing at the removed object.
- id: frontend.hardware.logo_phase_peripheral_probe
  label: Logo phase peripheral probe
  definition: Startup presentation samples an input timing signature to enable a peripheral-specific feature.
- id: frontend.intro.condition_gated_skip
  label: Condition gated skip
  definition: Presentation skipping is accepted only in an explicit permissive state.
- id: ui_hud.menu.cyclic_list_selection
  label: Cyclic list selection
  definition: Directional navigation wraps through a finite menu list.
- id: frontend.menu.multimode_dispatch
  label: Multimode dispatch
  definition: One launcher selects among separate games or settings after a presentation transition.
- id: ui_hud.input.modal_animation_gate
  label: Modal animation gate
  definition: Normal menu actions are blocked while a modal transition or cooldown is active.
- id: frontend.options.capability_gated_flags
  label: Capability gated flags
  definition: Some persistent settings are editable only when a detected capability is present.
- id: frontend.options.enable_confirmation
  label: Enable confirmation
  definition: Turning on a feature passes through an explicit acknowledgment state.
- id: frontend.save.result_checked_option_write
  label: Result checked option write
  definition: A front-end settings write branches on an explicit success result.
- id: frontend.save.timed_error_acknowledgement
  label: Timed error acknowledgement
  definition: A failed persistence operation displays a dedicated dismissible error state.
- id: movement_physics.presentation.scripted_ballistic_motion
  label: Scripted ballistic motion
  definition: A presentation actor follows velocity-and-acceleration animation independent of the playable locomotion
    system.
- id: rendering.registers.ewram_shadow_registers
  label: Ewram shadow registers
  definition: Rendering code updates a RAM shadow of hardware display or sound registers before a later commit.
- id: rendering.assets.expanded_resource_vram_upload
  label: Expanded resource vram upload
  definition: An engine stages expanded resources in RAM and uploads tile or map data into VRAM.
- id: setting.style.bright_outlined_pixel_interior
  label: Bright outlined pixel interior
  definition: Interior scene art uses saturated colors, strong outlines and readable tiled decoration.
- id: ui_hud.menu.animated_selection_preview
  label: Animated selection preview
  definition: Selecting a menu item changes a visual preview through an animation transition.
- id: ui_hud.strategy.shortest_cyclic_menu_route
  label: Shortest cyclic menu route
  definition: A user exploits wraparound to minimize navigation actions in a finite cyclic menu.
- id: ui_hud.skill.state_aware_action_timing
  label: State aware action timing
  definition: A user times interaction to states in which the interface accepts the intended action.
- id: audio.hardware.pcm_psg_coexistence
  label: PCM and PSG hardware coexistence
  definition: A measured capture uses PCM FIFOs and hardware PSG tone/noise channels together, without establishing
    sequencer architecture.
- id: audio.ui.navigation_confirmation_cues
  label: Navigation and confirmation cues
  definition: Menu navigation and confirmation events dispatch distinct sound resources.
- id: narrative_delivery.presentation.scene_based_character_staging
  label: Scene-based character staging
  definition: Presentation places characters within a decorated environmental scene; control and scripting remain
    independently qualified.
open_questions:
- Which actor is controllable in the opening room, and which movement is scripted? Reproduce exact inputs with isolated
  counterfactual action traces before declaring the gameplay phase successful.
- Recover dual-character control bindings, jump/hammer rules, field ability cooperation, turn order, action-command
  timing, damage formulas and counterattack logic from actual code or controlled captures; none are established
  by this partial document.
- Enemy AI, item effects, equipment, experience/level progression, economy, encounter transitions and full save-game
  structure remain unmined.
- The recovered C includes NONMATCHING alternatives and reverse-engineer names. No byte-identical rebuild was performed;
  source-to-ROM identity is README-supported rather than locally verified.
- Alternative MLSuperstarSaga SHA1 differs from this corpus and is startup/hexdump material. Establish region/revision
  identity before using its addresses.
- The startup animation acceleration is not an avatar gravity estimate; player speed, acceleration, collision units,
  jump arcs and timing windows remain unknown.
- The new run records thousands of game_error log entries despite overall outcome ok (6478 frontend;7311 gameplay).
  Determine whether these reflect harmless unmapped IO or execution defects before gameplay qualification.
- No Ghidra export exists for this game. Source files named asm/text08000000.s mostly contain byte arrays; byte
  presence is not semantic decompilation.
- Audio engine identity, music semantics, instrument mapping and asset-to-ROM offsets remain unresolved. No WAV
  listening or content-level asset extraction was performed.
- AI/camera/economy/progression facets are intentionally absent rather than filled from game recall. Captures cover
  an opening room, not the campaign.
