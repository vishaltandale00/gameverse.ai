  - kind: extraction_run
    ref: Codex GPT-6-family agent, exact serving model identifier unavailable; brief v1; reading stage start/total
      wall not instrumented; timed synthesis/writing stage 2026-10-16T04:46:06Z to 2026-10-16T04:48:45+00:00. Read
      mlss README, include/common.h, include/buffer_io_reg.h, src/process.c/.h, src/title_screen.c/.h (selected
      functions), src/option_screens.c/.h, src/game_boy_player_logo.c, initial asm/text08000000.s bytes (not decoded);
      alternative README/main.asm; capture summary and all three phase.json files; visually inspected nine keyframes.
      No additional provider API request or provider secret was used. Review/validation completed 2026-10-16T04:49:15+00:00.
conventions:
  coverage_scope: PARTIAL extraction. Strong frontend, engine lifecycle and captured hardware evidence; playable
    movement, battle mechanics, enemy AI, economy, progression and most narrative are not recovered. Counts are
    not completeness scores.
  capture_scope: All capture references in this document use the explicit experiment directory, not the older local/captures
    run. Aggregate observations mix independent cold boots and scripted startup. Outcome ok means harness completion,
    not validated player control.
  frontend_units: COMPProcess presentation coordinates divide by256 when written to Sprite positions. Per-callback
    increments are update ticks; hardware-frame cadence and seconds conversion are not independently established.
    No player physics constants are proposed.
  state_types: Frontend/menu selections are small signed integer indexes; process priority is u8; Process.frames
    is u32; input fields are u16 masks. Read/write paths are semantic aliases introduced by this extraction, not
    claims of recovered engine variable names.
  option_semantics: Names easy sleep/rumble/auto are recovered definitions, while actual sleep mechanisms and peripheral
    hardware effects remain unknown.
  inference_policy: Components explicitly labeled inferred strategy/skill describe rule-derived frontend affordances
    only. They are neither optimized policies nor empirically playtested skills.
components:
- id: priority_process_scheduler
  facet: mechanics
  label: Priority-ordered engine process scheduling
  summary: 'Implementation component, not a combat rule: process_add inserts a process in an ascending-priority
    linked list, placing it after existing equal priorities. process_execute_all calls enabled nonwaiting process
    callbacks and increments their local update counter; repeated execution and signed executeMax branches exist,
    but their gameplay use is unknown.'
  instantiates:
  - concept: mechanics.engine.priority_callback_scheduler
  evidence:
  - kind: decomp_source
    ref: mlss:src/process.c:process_add;process_execute_all
    confidence: 0.88
  - kind: decomp_source
    ref: mlss:include/common.h:Process;GameState
    confidence: 0.88
  reads:
  - engine.process.priority
  - engine.process.enabled
  - engine.process.wait
  - engine.process.executeMax
  writes:
  - engine.process.links
  - engine.process.frames
  - engine.current_process
  invariants:
  - A newly added process starts enabled, waiting, executeMax=1, executeCounter=0, frames=0.
  - This extraction does not equate one scheduler update with one hardware video frame.
- id: protected_priority_pause
  facet: mechanics
  label: Selective process suspension
  summary: process_disable_all suspends processes except priorities 0 and 255. process_enable_all enables every
    listed process and marks each waiting, allowing engine service callbacks to remain distinct from paused activity;
    which gameplay systems use the protected priorities is not established.
  instantiates:
  - concept: mechanics.engine.protected_priority_pause
  evidence:
  - kind: decomp_source
    ref: mlss:src/process.c:process_disable_all;process_enable_all
    confidence: 0.88
  reads:
  - engine.process.priority
  writes:
  - engine.process.enabled
  - engine.process.wait
  relations:
  - type: modulates
    target: priority_process_scheduler
  params:
    protected_priorities:
      value:
      - 0
      - 255
      unit: priority codes
      evidence:
      - kind: decomp_source
        ref: mlss:src/process.c:process_disable_all
        confidence: 0.88
- id: safe_process_unlink
  facet: mechanics
  label: Process removal repairs active iteration links
  summary: process_remove repairs neighboring linked-list pointers and adjusts currentProcess or nextProcess when
    the removed object is being visited. Storage is freed only when the FREE flag is set; this is a lifecycle primitive
    rather than proof of a save or gameplay rollback mechanism.
  instantiates:
  - concept: mechanics.engine.iteration_safe_process_removal
  evidence:
  - kind: decomp_source
    ref: mlss:src/process.c:process_remove
    confidence: 0.88
  - kind: decomp_source
    ref: mlss:src/process.h:PROCESS_REMOVE_FLAGS_FREE
    confidence: 0.88
  reads:
  - engine.process.previous
  - engine.process.next
  - engine.remove_flags
  writes:
  - engine.process.links
  - engine.current_process
  - engine.next_process
  - engine.process_count
  invariants:
  - FREE flag controls storage release.
  relations:
  - type: part_of
    target: priority_process_scheduler
- id: publisher_logo_sequence
  facet: frontend
  label: Stateful publisher-logo presentation
  summary: comp_init constructs Mario, Luigi and AlphaDream logo sprites and a drawing subprocess. comp_update advances
    an authored fall, shake, hold and brightness sequence before creating the title process; A/B/START are tested
    in the AlphaDream presentation states rather than universally in every logo state.
  instantiates:
  - concept: frontend.boot.publisher_logos
  evidence:
  - kind: decomp_source
    ref: mlss:src/title_screen.c:comp_init;comp_update
    confidence: 0.88
  reads:
  - frontend.logo.state
  - input.field_2A
  writes:
  - frontend.logo.state
  - frontend.title_process
  relations:
  - type: requires
    target: priority_process_scheduler
- id: game_boy_player_probe
  facet: frontend
  label: Logo-phase peripheral signal detection
  summary: gbpl_update reads active-low D-pad hardware, computes newly asserted directions and detects a narrow
    all-directions timing pattern during the logo process. Two qualifying events with a nonzero previous timestamp
    and spacing under four process-counter ticks set a capability flag later used by the rumble option; physical
    Game Boy Player compatibility was not tested.
  instantiates:
  - concept: frontend.hardware.logo_phase_peripheral_probe
  evidence:
  - kind: decomp_source
    ref: mlss:src/game_boy_player_logo.c:gbpl_init;gbpl_update
    confidence: 0.88
  reads:
  - input.hardware.dpad
  - frontend.probe.previous_dpad
  - engine.process.frames
  writes:
  - system.peripheral_flag
  invariants:
  - The prior qualifying timestamp must be nonzero.
  params:
    max_spacing_exclusive:
      value: 4
      unit: process-counter ticks
      evidence:
      - kind: decomp_source
        ref: mlss:src/game_boy_player_logo.c:gbpl_update
        confidence: 0.88
- id: title_state_machine
  facet: frontend
  label: Suitcase-based title-state machine
  summary: The recovered title has fade-in, title-animation, press-start-show, press-start-wait, suitcase-opens,
    game-select and fade-out states. Individual suitcase and logo items advance their own substates, keeping presentation
    completion distinct from accepting a menu choice.
  instantiates:
  - concept: frontend.flow.mode_state_machine
  evidence:
  - kind: decomp_source
    ref: mlss:src/title_screen.h:TitleScreenStates;TitleScreenItems
    confidence: 0.88
  - kind: decomp_source
    ref: mlss:src/title_screen.c:open_update
    confidence: 0.88
  reads:
  - frontend.title.state
  - frontend.title.item_states
  writes:
  - frontend.title.state
  - frontend.title.item_states
  relations:
  - type: requires
    target: priority_process_scheduler
- id: conditional_title_skip
  facet: frontend
  label: Conditioned title-animation skip
  summary: During title animation, A/B/SELECT/START trigger skipping only when skipSuitcaseAnim is true and a skip
    is not already underway. The transition fades, reconstructs the title state and resumes through fade-in; this
    is not evidence that all story scenes can be skipped.
  instantiates:
  - concept: frontend.intro.condition_gated_skip
  evidence:
  - kind: decomp_source
    ref: mlss:src/title_screen.c:open_update:TS_STATE_TITLE_ANIMATION
    confidence: 0.88
  reads:
  - frontend.title.skip_allowed
  - frontend.title.skipping
  - input.field_2A
  writes:
  - frontend.title.skipping
  - frontend.title.brightness
  - frontend.title.state
  invariants:
  - Skip input is gated by skipSuitcaseAnim.
  relations:
  - type: part_of
    target: title_state_machine
- id: title_press_start
  facet: frontend
  label: Title waits for A or START
  summary: The title visibly presents a start prompt. In its press-start-wait state, A or START starts a suitcase/menu
    transition and queues sound effect 96; unrelated input does not take this branch.
  instantiates:
