      indexed USA ROM; local rebuild not performed; recovered C is largely frontend/process code.
  - kind: excluded_alternative
    ref: https://github.com/nstearns96/MLSuperstarSaga @ baae10311925d1f498ff0ad3c43a748b453be239; README and main.asm
