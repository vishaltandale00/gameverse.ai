- id: three_way_game_selector
  facet: ui_hud
  label: Cyclic three-entry game selector
  summary: The recovered menu distinguishes Mario & Luigi, Mario Bros. and options. UP/DOWN wrap the selected index
    across 0..2, while A/START has priority over navigation in the same update; the bean pointer moves to y=92+20*selection.
  instantiates:
  - concept: ui_hud.menu.cyclic_list_selection
  evidence:
  - kind: decomp_source
    ref: mlss:src/title_screen.c:open_update:TS_STATE_GAME_SELECT
    confidence: 0.88
  - kind: decomp_source
    ref: mlss:src/title_screen.h:TitleScreenSprites
    confidence: 0.88
  reads:
  - input.field_2A
  - input.field_2E
  - frontend.menu.selection
  writes:
  - frontend.menu.selection
  - frontend.menu.pointer_y
  invariants:
  - Selection wraps into 0..2.
  - A/START is tested before directional navigation.
  params:
    entry_count:
      value: 3
      unit: entries
      evidence:
      - kind: decomp_source
        ref: mlss:src/title_screen.c:open_update:TS_STATE_GAME_SELECT
        confidence: 0.88
    pointer_row_spacing:
      value: 20
      unit: px
      evidence:
      - kind: decomp_source
        ref: mlss:src/title_screen.c:open_update:TS_STATE_GAME_SELECT
        confidence: 0.88
- id: menu_dispatch
  facet: frontend
  label: Fade-boundary dispatch to game, bundled mode or options
  summary: After a 16-count fade-out, the selected route creates the LOAD process for Mario & Luigi, calls the bundled
    Mario Bros. entry, or creates OPTN. The title removes its drawing process, stops DMA0 and releases its own process
    before dispatch; downstream game-load/save semantics remain unknown.
  instantiates:
  - concept: frontend.menu.multimode_dispatch
  evidence:
  - kind: decomp_source
    ref: mlss:src/title_screen.c:open_update:TS_STATE_FADE_OUT
    confidence: 0.88
  reads:
  - frontend.menu.selection
  - frontend.title.brightness
  writes:
  - frontend.active_process
  - hardware.dma0.enabled
  relations:
  - type: requires
    target: three_way_game_selector
  - type: part_of
    target: title_state_machine
- id: options_input_gates
  facet: ui_hud
  label: Options interaction is gated during modal animation
  summary: optn_update refuses normal selection processing while the window animates, while a cooldown is active,
    or when A is asserted in that state. Otherwise UP/DOWN wrap across three rows and B attempts persistence; the
    source exposes different input fields for navigation and direct actions without fully recovering their repeat
    semantics.
  instantiates:
  - concept: ui_hud.input.modal_animation_gate
  evidence:
  - kind: decomp_source
    ref: mlss:src/option_screens.c:optn_update:OPTS_STATE_SELECT_OPTION
    confidence: 0.88
  reads:
  - frontend.options.window_scale
  - frontend.options.cooldown
  - input.field_2A
  - input.field_2E
  writes:
  - frontend.options.selection
  - frontend.options.state
  invariants:
  - Window animation and positive cooldown gate normal option processing.
- id: option_feature_bits
  facet: frontend
  label: Three persistent feature-option bits
  summary: The recovered option definitions label bits as easy sleep, rumble and auto feature. Directional input
    changes staged bits; rumble is editable only when the peripheral flag equals one. The actual sleep trigger and
    timeout behavior is not recovered, so these labels establish stored configuration rather than implementation
    of sleeping.
  instantiates:
  - concept: frontend.options.capability_gated_flags
  evidence:
  - kind: decomp_source
    ref: mlss:src/option_screens.h:OPTION_FLAGS_*
    confidence: 0.88
  - kind: decomp_source
    ref: mlss:src/option_screens.c:optn_update;try_save_options
    confidence: 0.88
  reads:
  - system.peripheral_flag
  - frontend.options.bits
  - input.field_2A
  writes:
  - frontend.options.bits
  invariants:
  - Rumble changes require field_888_1==1.
  params:
    bit_positions:
      value:
      - 0
      - 1
      - 2
      unit: bit indexes
      evidence:
      - kind: decomp_source
        ref: mlss:src/option_screens.h:OPTION_FLAGS_SHIFT_*
        confidence: 0.88
- id: option_confirmation_modal
  facet: frontend
  label: Feature-enable confirmation and animated return
  summary: Enabling each labeled feature enters its own confirmation state. A acknowledges only after the window
    animation reaches zero; rumble acknowledgment additionally sets the runtime flag and a 16-update cooldown. This
    establishes acknowledgement ordering, not the human meaning of every confirmation text.
  instantiates:
  - concept: frontend.options.enable_confirmation
  evidence:
  - kind: decomp_source
    ref: mlss:src/option_screens.c:optn_update:OPTS_STATE_EASY_SLEEP_CONFIRMATION;OPTS_STATE_RUMBLE_FEATURE_CONFIRMATION;OPTS_STATE_AUTO_SLEEP_CONFIRMATION
    confidence: 0.88
  reads:
  - frontend.options.state
  - frontend.options.window_scale
  - input.field_2A
  writes:
  - frontend.options.state
  - frontend.options.cooldown
  relations:
  - type: modulates
    target: options_input_gates
  params:
    rumble_ack_cooldown:
      value: 16
      unit: option-update ticks
      evidence:
      - kind: decomp_source
        ref: mlss:src/option_screens.c:optn_update:OPTS_STATE_RUMBLE_FEATURE_CONFIRMATION
        confidence: 0.88
- id: option_persistence_attempt
  facet: frontend
  label: Staged option persistence with explicit return value
  summary: try_save_options copies staged bits into runtime fields and an EEPROM-related structure before invoking
    sub_812454C. On B in the selection state, its boolean result chooses leave or save-error state. No power-loss
    atomicity, record checksum or complete save format is established by the recovered wrapper.
  instantiates:
  - concept: frontend.save.result_checked_option_write
  evidence:
  - kind: decomp_source
    ref: mlss:src/option_screens.c:try_save_options;optn_update
    confidence: 0.88
  reads:
  - frontend.options.bits
  writes:
  - system.option_flags
  - save.option_bits
  - frontend.options.state
  invariants:
  - Runtime option fields are assigned before the low-level writer returns.
  relations:
  - type: requires
    target: option_feature_bits
- id: option_save_error
  facet: frontend
  label: Failed settings save receives a separate acknowledgement state
  summary: A failed option-write result enters a save-error state rather than the success transition. After modal
    opening finishes, the error screen leaves after 240 countdown updates or A/B/START; this is a settings error
    path and does not establish safe campaign-save recovery.
  instantiates:
  - concept: frontend.save.timed_error_acknowledgement
  evidence:
  - kind: decomp_source
    ref: mlss:src/option_screens.c:optn_update:OPTS_STATE_SAVE_ERROR;OPTS_STATE_SAVE_ERROR_CONFIRMATION
    confidence: 0.88
  reads:
  - frontend.options.state
  - input.field_2A
  - frontend.options.window_scale
  writes:
  - frontend.options.error_countdown
  - frontend.options.state
  relations:
  - type: part_of
    target: option_persistence_attempt
  params:
    error_countdown:
      value: 240
      unit: option-update ticks
      evidence:
      - kind: decomp_source
        ref: mlss:src/option_screens.c:optn_update:OPTS_STATE_SAVE_ERROR_CONFIRMATION
        confidence: 0.88
- id: scripted_logo_ballistics
  facet: movement_physics
  label: Presentation-only fixed-point falling and rebound
  summary: comp_update applies explicit velocity and acceleration to the startup Mario/Luigi sprites and background
    offset, with a fixed rebound velocity after the landing threshold. Sprite coordinates are rendered by division
    by 256. These are authored logo-animation dynamics, not playable-character gravity, jump strength or collision
    behavior.
  instantiates:
  - concept: movement_physics.presentation.scripted_ballistic_motion
  evidence:
  - kind: decomp_source
    ref: mlss:src/title_screen.c:comp_init;comp_update
    confidence: 0.88
  reads:
  - frontend.logo.position
  - frontend.logo.velocity
  - frontend.logo.acceleration
  writes:
  - frontend.logo.position
  - frontend.logo.velocity
  invariants:
  - The conversion applies only to COMPProcess presentation coordinates.
  params:
    presentation_acceleration:
      value: 0.45703125
      unit: px/logo-update^2
      evidence:
      - kind: decomp_source
        ref: mlss:src/title_screen.c:comp_init;comp_update
        confidence: 0.88
      native_value: 117
      native_unit: 1/256 px/logo-update^2
