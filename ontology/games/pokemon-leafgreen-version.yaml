schema_version: 0
id: pokemon-leafgreen-version
game:
  title: Pokémon LeafGreen Version
  platform: gba
  game_code: BPGE
  rom_sha1: 7862c67bdecbe21d1d69ce082ce34327e1c6ed5e
  evidence_basis:
  - decomp_source
  - capture_telemetry
  - capture_frame
  sources:
  - kind: decomp
    ref: https://github.com/pret/pokefirered @ 037335f4c725d7c9aecdac87066f2002b4bd7e14; leafgreen_rev1.sha1 matches
      the local indexed ROM SHA1. Actual matching build not run.
  - kind: capture
    ref: local/captures/pokemon-leafgreen-version run 20261015T234415-8f46cf; harness 0.1.0, libmgba 0.10.5 HLE
      BIOS; 9000 total frames; 6.613 s prior capture wall. Two phases only; not whole-game qualification.
  - kind: extraction_run
    ref: 'Codex/GPT, exact runtime model unavailable; brief v1; source reading began before first recorded clock
      observation 2026-10-16T04:42:28Z; completed 2026-10-16T04:46:13.576023+00:00. Three variants extracted together
      from independently inspected pokeruby and pokefirered trees. Total extraction/queue/token cost unavailable;
      no provider calls. Source files read or inspected by symbol/excerpt: include/constants/global.h, include/random.h,
      src/battle_ai_script_commands.c, src/battle_main.c, src/data/wild_encounters.json, src/field_camera.c, src/field_player_avatar.c,
      src/help_system.c, src/main.c, src/new_menu_helpers.c, src/overworld.c, src/party_menu.c, src/pokemon.c, src/random.c,
      src/save.c, src/script.c, src/sound.c, src/start_menu.c, src/title_screen.c, src/vs_seeker.c, src/wild_encounter.c;
      applicable hash file/README, capture summary and one inspected presenter keyframe.'
conventions:
  scope: Partial evidence-backed variant extraction; core modules share Gen-3 abstractions but each citation points
    to this game source tree. Emerald relations mean implementation variants, not proof of identical complete behavior.
    Untouched facets and deeper subsystems remain explicit questions.
  units: Source-native update counts, points and indices are retained. Integer division order is preserved; no uniform
    RNG assumption or exact probability calibration. Hardware audio Hz differs from export WAV rate.
  version: Local ROM revision 1 and hash match the source repository hash file; preprocessor-specific branches beyond
    those explicitly inspected are not assumed identical.
  inference: Strategy implications are marked inference and do not measure player skill or prove optimal play.
components:
- id: main_loop_and_callbacks
  facet: frontend
  label: Key-sampling frame loop with reset guard
  summary: AgbMain reads keys, checks the A+B+Start+Select chord unless soft reset is disabled, coordinates link
    processing, updates play time/map music and waits for VBlank. This Rev1-supported source initializes RFU, GPU
    managers and a heap and disables help at boot; reset also stops RFU.
  instantiates:
  - concept: frontend.flow.mode_state_machine
  - concept: frontend.soft_reset.button_combo
  reads:
  - input.raw_held:u16
  - runtime.soft_reset_disabled:bool
  - link.queues
  writes:
  - runtime.callbacks
  - runtime.frame_state
  invariants:
  - Reset uses raw held keys rather than L=A remapped keys.
  evidence:
  - kind: decomp_source
    ref: pokefirered:src/main.c:AgbMain
    confidence: 0.9
  relations:
  - type: variant_of
    target: pokemon-emerald-version/main_loop_and_callbacks
    note: Compared as a Gen-3 implementation variant; source for this game was inspected independently. No claim
      of byte-identical behavior.
- id: input_controls
  facet: ui_hud
  label: Physical, edge and repeated keys with L=A remapping
  summary: ReadKeys derives new keys before applying L=A to held/new fields. The source explicitly records that
    repeat compares raw input with the remapped previous held keys and never remaps newAndRepeatedKeys, so L=A repeat
    has a known discrepancy. Watched-key masks latch new presses for waiting callers.
  instantiates:
  - concept: ui_hud.input.context_button_mapping
  reads:
  - input.hardware:u16
  - input.previous_held:u16
  - settings.button_mode:u8
  writes:
  - input.new:u16
  - input.held:u16
  - input.repeat:u16
  - input.watched_pressed:bool
  invariants:
  - L=A affects held/new keys but not the repeat field.
  evidence:
  - kind: decomp_source
    ref: pokefirered:src/main.c:ReadKeys
    confidence: 0.9
  relations:
  - type: variant_of
    target: pokemon-emerald-version/input_controls
    note: Compared as a Gen-3 implementation variant; source for this game was inspected independently. No claim
      of byte-identical behavior.
- id: rng_lcg
  facet: mechanics
  label: Global high-word LCG also advances at VBlank
  summary: Random updates a 32-bit state using multiplier 1103515245 and increment 24691, returning the upper 16
    bits. The inspected VBlank path calls Random in addition to event-specific callers; frame timing therefore affects
    future battle/encounter outcomes. No claim of uniform event probabilities or replay determinism follows from
    the recurrence alone.
  instantiates:
  - concept: mechanics.randomness.lcg_prng
  reads:
  - rng.state:u32
  writes:
  - rng.state:u32
  - query.random:u16
  invariants:
  - Return is the high 16 bits after state advance.
  evidence:
  - kind: decomp_source
    ref: pokefirered:src/random.c:Random
    confidence: 0.9
  - kind: decomp_source
    ref: pokefirered:src/main.c:VBlankIntr
    confidence: 0.9
  - kind: decomp_source
    ref: pokefirered:include/random.h:ISO_RANDOMIZE1
    confidence: 0.9
  params:
    multiplier:
      value: 1103515245
      unit: u32 multiplier
      native_value: 1103515245
      native_unit: u32 multiplier
      evidence:
      - kind: decomp_source
        ref: pokefirered:include/random.h:ISO_RANDOMIZE1
        confidence: 0.9
    increment:
      value: 24691
      unit: u32 increment
      native_value: 24691
      native_unit: u32 increment
      evidence:
      - kind: decomp_source
        ref: pokefirered:include/random.h:ISO_RANDOMIZE1
        confidence: 0.9
  relations:
