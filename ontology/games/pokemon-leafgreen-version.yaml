    target: pokemon-emerald-version/rng_lcg
    note: Compared as a Gen-3 implementation variant; source for this game was inspected independently. No claim
      of byte-identical behavior.
- id: script_engine
  facet: mechanics
  label: Yielding bytecode and native-function script context
  summary: RunScriptCommand switches stopped/native/bytecode modes. Bytecode dispatch runs until a handler requests
    a yield, the script pointer becomes null or the opcode lies beyond the command table. Native mode resumes bytecode
    when the callback reports completion. The source comments document removal of an initial redundant stopped-mode
    check relative to Ruby/Emerald.
  instantiates:
  - concept: narrative_delivery.engine.bytecode_script_vm
  - concept: progression.world.persistent_world_flags
    weight: 0.6
  reads:
  - script.mode:u8
  - script.pc:pointer
  - script.command_table
  - script.native_callback
  writes:
  - script.pc:pointer
  - script.mode:u8
  - script.return_stack
  invariants:
  - A yielding command stops the current dispatch loop.
  evidence:
  - kind: decomp_source
    ref: pokefirered:src/script.c:RunScriptCommand
    confidence: 0.9
  - kind: decomp_source
    ref: pokefirered:src/script.c:ScriptCall
    confidence: 0.9
  - kind: decomp_source
    ref: pokefirered:src/script.c:ScriptReturn
    confidence: 0.9
  relations:
  - type: variant_of
    target: pokemon-emerald-version/script_engine
    note: Compared as a Gen-3 implementation variant; source for this game was inspected independently. No claim
      of byte-identical behavior.
- id: flash_save_system
  facet: frontend
  label: Rotating checksummed sector save slots
  summary: A full save increments its counter, rotates the starting sector modulo 14 and writes 14 chunks. Each
    chunk is placed into one of two physical slot sets selected by saveCounter%2, with ID, signature, counter and
    checksum in its footer. If damaged sectors are reported, the writer restores its prior counter/start index.
    This is source architecture, not a tested power-loss recovery campaign.
  instantiates:
  - concept: frontend.save.checksummed_flash_record
    weight: 0.5
  - concept: frontend.save.redundant_slot_backup
  - concept: frontend.save.save_anywhere
  reads:
  - save.blocks
  - save.counter:u32
  - save.first_sector:u16
  writes:
  - flash.sectors
  - save.counter:u32
  - save.first_sector:u16
  invariants:
  - Each written chunk includes a checksum and shared save counter.
  evidence:
  - kind: decomp_source
    ref: pokefirered:src/save.c:WriteSaveSectorOrSlot
    confidence: 0.9
  - kind: decomp_source
    ref: pokefirered:src/save.c:HandleWriteSector
    confidence: 0.9
  - kind: decomp_source
    ref: pokefirered:src/save.c:CalculateChecksum
    confidence: 0.9
  params:
    chunks_per_slot:
      value: 14
      unit: sectors
      native_value: 14
      native_unit: sectors
      evidence:
      - kind: decomp_source
        ref: pokefirered:src/save.c:WriteSaveSectorOrSlot
        confidence: 0.9
    physical_slots:
      value: 2
      unit: slots
      native_value: 2
      native_unit: slots
      evidence:
      - kind: decomp_source
        ref: pokefirered:src/save.c:HandleWriteSector
        confidence: 0.9
  relations:
  - type: variant_of
    target: pokemon-emerald-version/flash_save_system
    note: Compared as a Gen-3 implementation variant; source for this game was inspected independently. No claim
      of byte-identical behavior.
- id: whiteout_respawn
  facet: frontend
  label: Defeat heals and warps with badge/level-dependent money loss
  summary: ComputeWhiteOutMoneyLoss multiplies highest party level by 4 and a badge-count-indexed multiplier [2,4,6,9,12,16,20,25,30],
    capped at current money. DoWhiteOut removes that amount, heals the party, resets state and warps to the whiteout
    respawn point. This differs materially from Ruby/Emerald half-wallet rules.
  instantiates:
  - concept: frontend.game_over.respawn_at_checkpoint_with_penalty
  reads:
  - economy.money:u32
  - party.hp:u16[]
  - party.highest_level:u8
  - progress.badges:bool[8]
  writes:
  - economy.money:u32
  - party.hp:u16[]
  - world.warp_destination
  invariants:
  - The wallet cannot become negative in the inspected penalty path.
  evidence:
  - kind: decomp_source
    ref: pokefirered:src/overworld.c:DoWhiteOut
    confidence: 0.9
  - kind: decomp_source
    ref: pokefirered:src/overworld.c:ComputeWhiteOutMoneyLoss
    confidence: 0.9
  - kind: decomp_source
    ref: pokefirered:src/overworld.c:sWhiteOutMoneyLossMultipliers
    confidence: 0.9
  params:
    highest_level_multiplier:
      value: 4
      unit: money/level/multiplier
      native_value: 4
      native_unit: money/level/multiplier
      evidence:
      - kind: decomp_source
        ref: pokefirered:src/overworld.c:ComputeWhiteOutMoneyLoss
        confidence: 0.9
  relations:
  - type: variant_of
    target: pokemon-emerald-version/whiteout_respawn
    note: Compared as a Gen-3 implementation variant; source for this game was inspected independently. No claim
      of byte-identical behavior.
- id: grid_step_locomotion
  facet: movement_physics
  label: Turn-first grid movement and gated B-running
  summary: The movement classifier distinguishes idle, turn-in-place and moving from input direction and current
    movement state. Moving tests collisions before dispatch; surfing uses a fast step and held B requests running
    only after FLAG_SYS_B_DASH and a terrain permission check. Rock stairs select slow running/walking variants.
  instantiates:
  - concept: movement_physics.grid.interpolated_tile_animation
    weight: 0.6
  - concept: movement_physics.grid.four_direction_tile_step
  - concept: movement_physics.speed.hold_to_run
    weight: 0.6
  reads:
  - input.direction:u8
  - input.held:u16
  - avatar.running_state:u8
  - world.terrain
  - progress.running_shoes:bool
  writes:
  - avatar.movement_action:u8
  - avatar.running_state:u8
  - avatar.flags:u16
  invariants:
  - A blocked destination prevents the normal movement branch.
  evidence:
  - kind: decomp_source
    ref: pokefirered:src/field_player_avatar.c:CheckMovementInputNotOnBike
    confidence: 0.9
  - kind: decomp_source
    ref: pokefirered:src/field_player_avatar.c:PlayerNotOnBikeMoving
    confidence: 0.9
  relations:
  - type: variant_of
    target: pokemon-emerald-version/grid_step_locomotion
    note: Compared as a Gen-3 implementation variant; source for this game was inspected independently. No claim
      of byte-identical behavior.
- id: forced_movement_tiles
  facet: movement_physics
  label: Terrain-selected movement overrides
  summary: The forced-movement dispatch maps terrain predicates to slip, forced cardinal walking, currents, slides,
    waterfall and mat actions. The inspected FRLG table explicitly includes four spin-direction predicates. These
    are source-supported modes; exact speeds, stopping distances and puzzle timing remain to be extracted.
  instantiates:
  - concept: movement_physics.surface.ice_slide_until_blocked
  - concept: movement_physics.surface.conveyor_push
  reads:
  - world.metatile_behavior:u8
  - avatar.flags:u16
  writes:
  - avatar.forced_direction:u8
  - avatar.movement_action:u8
  invariants:
  - Dispatch depends on the terrain behavior and avatar control flags.
  evidence:
  - kind: decomp_source
    ref: pokefirered:src/field_player_avatar.c:sForcedMovementFuncs
    confidence: 0.9
  relations:
  - type: variant_of
    target: pokemon-emerald-version/forced_movement_tiles
    note: Compared as a Gen-3 implementation variant; source for this game was inspected independently. No claim
      of byte-identical behavior.
- id: player_locked_tile_camera
  facet: camera
  label: Per-pixel camera movement with metatile streaming
  summary: CameraUpdate runs an optional callback, accumulates movement offsets modulo 16 and moves/redraws map
    slices when a cell boundary is crossed. It updates object events and global camera-pixel offsets alongside tilemap
    streaming. Those Ruby rotating-gate/berry callback calls are commented out in this source.
  instantiates:
  - concept: camera.follow.player_centered_tile_camera
  reads:
  - camera.speed:vec2i
  - camera.offset:vec2i
  writes:
  - camera.offset:vec2i
  - world.visible_cells
  - entities.screen_positions
  invariants:
  - Cell offsets wrap at the 16-pixel boundary.
  evidence:
  - kind: decomp_source
    ref: pokefirered:src/field_camera.c:CameraUpdate
    confidence: 0.9
  params:
    cell_extent:
      value: 16
      unit: px
      native_value: 16
      native_unit: px
      evidence:
      - kind: decomp_source
        ref: pokefirered:src/field_camera.c:CameraUpdate
        confidence: 0.9
  relations:
  - type: variant_of
    target: pokemon-emerald-version/player_locked_tile_camera
    note: Compared as a Gen-3 implementation variant; source for this game was inspected independently. No claim
      of byte-identical behavior.
- id: metatile_map_renderer
  facet: rendering
  label: Two-layer metatiles distributed over hardware background planes
  summary: DrawMetatile writes four bottom and four top tile entries per metatile, choosing target background buffers
    by layer type and inserting transparent entries where needed. The inspected split case differs in exact buffer
    numbering between Ruby and FRLG; only the compositional behavior is shared here. Source-specific buffer references
    remain in citations.
  instantiates:
  - concept: rendering.background.metatile_occlusion_layers
  - concept: rendering.background.metatile_streaming
  - concept: rendering.tiles.animated_tile_swap
  - concept: rendering.background.tile_layer_stack
    weight: 0.5
  reads:
  - world.metatile_tiles:u16[8]
  - world.layer_type:u8
  writes:
  - gpu.bg_tilemap_buffers
  invariants:
  - A metatile supplies four bottom and four top tile entries.
  evidence:
  - kind: decomp_source
    ref: pokefirered:src/field_camera.c:DrawMetatile
    confidence: 0.9
  params:
    tile_entries_per_metatile:
      value: 8
      unit: entries
      native_value: 8
      native_unit: entries
