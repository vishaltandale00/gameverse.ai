- id: evolution_rules
  facet: progression
  label: Rule-table evolution with mode and held-item checks
  summary: GetEvolutionTargetSpecies scans species evolution methods for normal, trade or item-use modes, checking
    level, friendship, stats, beauty and personality conditions. The prevent-evolve hold effect blocks real evolution
    but permits item-check mode. Day/night friendship branches are deliberately inactive in FRLG; comments explain
    removal of RTC-based evolution.
  instantiates:
  - concept: progression.character.conditional_evolution
  reads:
  - creature.species:u16
  - creature.level:u8
  - creature.friendship:u8
  - creature.held_item:u16
  - evolution.mode:u8
  - creature.personality:u32
  writes:
  - query.evolution_target:u16
  - creature.held_item:u16
  invariants:
  - Mode-specific evolution rules do not imply every listed method is available in every game.
  evidence:
  - kind: decomp_source
    ref: pokefirered:src/pokemon.c:GetEvolutionTargetSpecies
    confidence: 0.9
  params:
    friendship_threshold:
      value: 220
      unit: friendship
      native_value: 220
      native_unit: friendship
      evidence:
