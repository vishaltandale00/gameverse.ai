- id: inventory_and_storage
  facet: economy
  label: Version-specific bag pocket capacities
  summary: Constants allocate separate item, key-item, ball, TM/HM and berry pockets. FRLG uses 42/30/13/58/43 slots
    and 30 PC-item slots; these differ from Ruby. These are storage capacities, not catalogues or a claim that all
    items are currently unlocked.
  instantiates:
  - concept: economy.inventory.categorized_pockets
  - concept: economy.inventory.creature_storage_boxes
  reads:
  - inventory.pocket_arrays
  writes:
  - inventory.pocket_slots
  invariants:
  - Pocket capacities differ by category and game.
