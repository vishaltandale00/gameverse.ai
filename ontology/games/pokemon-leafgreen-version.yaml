open_questions:
- Complete battle damage/capture/status/type/ability/held-item mechanisms and per-move timings from this game source;
  Emerald values were intentionally not copied as if reverified.
- Extract actual evolution species tables, full encounters, trainers, items and authored quest/gate graphs, including
  version-exclusive differences beyond the sampled starter route and title.
- Map sprites/tiles/palettes/audio into an asset dependency inventory; the presenter screenshot does not describe
  the whole visual style or setting.
- Read narrative scripts, dialogue and story conditions. Current extraction only records visible introductory staging;
  full setting/plot/factions are unestablished.
- Run gameplay-directed recaptures and label temporal/control evidence; model screen classifiers can confuse intros
  with gameplay. Existing baseline captures are frontend-heavy and do not establish interactive exploration.
- Extract collision/elevation, ledges, bikes/water movement, NPC perception/AI, economy prices/rewards and full
  resource-flow dependencies; partial modules here are not a complete game ontology.
- Record exact source-build configuration and perform matching build/runtime probes before treating source semantics
  as ROM-verified. No build benchmark, complete campaign, player-skill measurements, GPT-versus-Claude quality estimate
  or source-asset reuse entitlement was established.
