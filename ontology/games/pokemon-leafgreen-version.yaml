- id: stat_calculation
  facet: mechanics
  label: Integer IV/EV/level/nature statistic calculation
  summary: For ordinary species maxHP is floor((2*baseHP+IV+floor(EV/4))*level/100)+level+10; Shedinja instead gets
    1. Other stats add 5 before a nature modifier. Current HP adjusts by the change in maxHP when nonzero, rather
    than unconditionally refilling. The source records an HP underflow edge behind an optional BUGFIX guard, which
    is not assumed enabled for a matching cartridge build.
  instantiates:
  - concept: mechanics.progression.stat_formula_iv_ev
  reads:
  - creature.species:u16
  - creature.iv:u8[6]
  - creature.ev:u8[6]
  - creature.level:u8
  - creature.nature:u8
  - creature.hp:u16
  writes:
  - creature.stats:u16[6]
  - creature.max_hp:u16
  - creature.hp:u16
  invariants:
  - EV division by 4 occurs before multiplying by level.
  - A previously fainted established creature is not automatically revived by this helper.
  evidence:
  - kind: decomp_source
    ref: pokefirered:src/pokemon.c:CalculateMonStats
    confidence: 0.9
  - kind: decomp_source
    ref: pokefirered:src/pokemon.c:CALC_STAT
    confidence: 0.9
  params:
    ev_divisor:
      value: 4
      unit: EV/stat term
      native_value: 4
      native_unit: EV/stat term
      evidence:
      - kind: decomp_source
        ref: pokefirered:src/pokemon.c:CALC_STAT
        confidence: 0.9
    level_divisor:
      value: 100
      unit: level normalization
      native_value: 100
      native_unit: level normalization
      evidence:
      - kind: decomp_source
        ref: pokefirered:src/pokemon.c:CALC_STAT
        confidence: 0.9
    ordinary_hp_constant:
      value: 10
      unit: HP
      native_value: 10
      native_unit: HP
      evidence:
