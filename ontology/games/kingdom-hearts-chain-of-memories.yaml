- id: card_break_rule
  facet: mechanics
  label: Card break - higher or zero value cancels the opponent's play
  summary: 'The value of the play currently in effect (one card, or the sum of a stocked sleight) is held as activeValue.
    A new player play succeeds against it if its value n >= activeValue, or n == 0; otherwise the new play is the one
    broken. Equal values break both. The broken side''s cards are discarded and the actor is staggered (12-frame global
    hit-stop, then break animation; enemies at least 40 frames). breakDifference = n - activeValue (capped 9; for a 0
    card, min(activeValue, 9)) feeds Riku''s dark points. In US/JP builds an enemy''s 0 card does not auto-break; only
    EU applies the 0 rule to enemies. Bracer effects make a play unbreakable.'
  instantiates:
  - concept: mechanics.cards.card_break_contest
  - concept: mechanics.combat.interrupt_priority
    weight: 0.5
  reads:
  - battle.active_value
  - card.value
  - effects.bracer
  writes:
  - battle.active_card
  - battle.active_value
  - battle.break_difference
  - actor.state
  params:
    break_hitstop:
      value: 12
      unit: frames
      evidence:
      - kind: decomp_source
        ref: khcom:src/btl/battle_runtime.c:UpdateBtlObjReaction
        confidence: 0.9
    enemy_break_stagger_min:
      value: 40
      unit: frames
      evidence:
      - kind: decomp_source
        ref: khcom:src/btl/emy_common.c:EmyUpdateCommonStates (EMY_STATE_CARD_BROKEN)
        confidence: 0.85
    break_difference_cap:
      value: 9
      evidence:
      - kind: decomp_source
        ref: khcom:src/card/card_battle.c:TrySoraCardBreak
        confidence: 0.85
  invariants:
  - A player play fails iff activeValue > n and n != 0.
  - Ties cancel both plays; neither action executes.
  - A 0 card always breaks the active play when the player plays it second; played first, its activeValue of 0 is
    beaten by any card.
  relations:
  - type: part_of
    target: real_time_card_battle
  - type: modulates
    target: enemy_card_play_ai
    note: the same comparison resolves enemy plays
  evidence:
  - kind: decomp_source
    ref: khcom:src/card/card_battle.c:TrySoraCardBreak
    confidence: 0.95
  - kind: decomp_source
    ref: khcom:src/card/card_battle.c:TrySoraStockBreak
    confidence: 0.9
  - kind: decomp_source
    ref: khcom:src/card/card_enemy.c:UseEnemyCard (VERSION_EU 0-card branch)
    confidence: 0.95
