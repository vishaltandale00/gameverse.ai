  sources:
  - kind: decomp
    ref: 'https://github.com/Pheenoh/khcom @ 5dc49b75068bfe24e07bdaf365570d64682680c3 (CC0; local/decomps/khcom; matching
      decomp of USA B8CE, also JP/EU). Code is essentially all C: src/ has 269 .c files (~258k lines incl. data tables);
      asm/ holds only 7 hand-written files (crt0, header, libagbsyscall, m4a_1 sound driver, movie_codec FMV decoder,
      transform + veneers, ~5.8k lines). Byte-weighted progress is published on decomp.dev, not in the repo; not measured
      here.'
  - kind: rom_header
    ref: local/re/roms.json id=kingdom-hearts-chain-of-memories (header title KINGDOMHEART, maker GD, version 0, 32 MiB)
  - kind: captures
    ref: 'local/captures/kingdom-hearts-chain-of-memories run 20261015T234415-8f46cf (mGBA 0.10.5 HLE BIOS, harness 0.1.0,
      source commit d431b81 dirty tree): attract 3600 frames idle, frontend 5400 frames alternating Start/A every 90 frames
      (reaches New Game opening FMV); 9000 frames total, 4.46 s wall'
  - kind: extraction_run
    ref: 'claude-opus-5-5, brief v1, 2026-10-16T03:56Z-2026-10-16T04:14Z (~18 min wall), ~100 decomp files opened or grepped
      (4 parallel read-only research subagents for card system, battle runtime, field/rooms/progression and enemy/boss
      AI, each listing files opened; ~106 file:symbol citations re-checked by grep), plus capture summary, 2 phase
      telemetry CSVs, 10 keyframes and 4 repo inputs'
conventions:
  units_convention: 'Positions and velocities in battle and field code are s32 fixed point with 8 fractional bits:
    256 units = 1 px, velocities in 1/256 px per frame, accelerations in 1/256 px per frame per frame. Battle space is
    (x, y=depth on the ground plane, z=height, negative up); screen y = y + z. Field cells are 32x16 px. Angles are u8
    (256 = 360 degrees); gSineTable has amplitude 256. Multipliers such as attack power, HP/attack scaling and affine
    scale are Q8.8 (256 = 1.0). Timers are frames at ~59.73 Hz (60 used for seconds). "1-in-N" intervals are per-frame
    random odds. Screen is 240x160 px. Params below are converted to px, frames and plain multipliers with the native
    value kept where it differs.'
  card_value_convention: Card values are 0-9; a deck card id is group*10 + value with bit 0x8000 marking premium.
components:
- id: game_mode_flow
  facet: frontend
  label: Mode manager with deferred mode switch, boot repair and soft reset
  summary: 'AgbMain runs UpdateKeyState then ModeUpdate once per VBlank. Every screen (copyright, title, field map,
    battle, deck menu, event, movie, staff roll, link battle, Pooh minigame, ...) is a Mode struct {name, init, update,
    exit}; ModeRequest queues the next mode, which starts after the current one exits, optionally with a heap reset.
    The first mode is the copyright screen, which also checks and repairs every save block before handing on. A+B+Select+Start
    (Start or Select newly pressed) soft-resets unless SYSTEM_FLAG_NO_SOFT_RESET is set (link play sets it); the movie
    player polls the same combo itself.'
  instantiates:
  - concept: frontend.flow.mode_state_machine
  - concept: frontend.soft_reset.button_combo
  - concept: frontend.boot.publisher_logos
    weight: 0.5
  reads:
  - input.buttons.held
  - input.buttons.pressed
  - system.flags.no_soft_reset
  - frontend.pending_mode
  writes:
  - frontend.mode
  - frontend.pending_mode
  params:
    soft_reset_keys:
      value: A+B+Select+Start
      evidence:
      - kind: decomp_source
        ref: khcom:src/mode.c:ModeUpdate
        confidence: 0.95
      - kind: decomp_source
        ref: khcom:include/gba/keys.h:SOFT_RESET_KEYS
        confidence: 0.95
    copyright_hold:
      value: 60
      unit: frames
      evidence:
      - kind: decomp_source
        ref: khcom:src/title/mode_copyright1.c:sCopyright1Timer
        confidence: 0.85
    rng_boot_seed:
      value: 1234567
      evidence:
      - kind: decomp_source
        ref: khcom:src/main.c:InitSystem (SeedRandom(1234567))
        confidence: 0.95
  invariants:
  - At most one mode runs; a requested mode starts only after the current mode's exit hook ran and the display was
    blanked.
  - Soft reset is ignored while SYSTEM_FLAG_NO_SOFT_RESET is set.
  evidence:
  - kind: decomp_source
    ref: khcom:src/main.c:AgbMain
    confidence: 0.95
  - kind: decomp_source
    ref: khcom:src/mode.c:ModeUpdate
    confidence: 0.95
  - kind: decomp_source
    ref: khcom:include/mode.h:Mode
    confidence: 0.95
  - kind: decomp_source
    ref: khcom:src/title/mode_copyright1.c:mode_copyright1_0 (SaveRepair* calls)
    confidence: 0.85
  - kind: capture_telemetry
    ref: 'capture:attract:frames 10-606 mode 0 BG0 only, three ~200-frame screens (Licensed by Nintendo, Disney
      Interactive + Square Enix logos, legal/copyright text)'
    confidence: 0.8
- id: title_screen
  facet: frontend
  label: Affine-zoom title with context-sensitive menu and no attract demo
  summary: 'The title fades in, then zooms its BG2 logo plate over 100 frames by easing the affine scale and centre
    (different target X when the Riku title flag is set), white-fades, cross-fades the background in 16 alpha steps
    and slides in the logo/character sprites. A or Start skips the intro. PRESS START opens a menu whose default entry
    is chosen from save state: Resume (suspend save present), Continue (a file is valid), New Game; Reverse/Rebirth
    (Riku) entries appear after a Sora clear, and Link Battle opens the cable versus mode. There is no idle timeout
    or demo: the capture sits on PRESS START from frame ~1000 to 3600.'
  instantiates:
  - concept: frontend.title.press_start_menu
  - concept: rendering.background.affine_rotscale
    weight: 0.4
  - concept: frontend.menu.unlockable_extras
    weight: 0.3
  reads:
  - input.buttons.pressed
  - save.system.valid
  - save.files_large[*].valid
  - game.flags.sora_clear
  - game.flags.riku_title
  writes:
  - frontend.mode
  - title.menu_choice
  params:
    zoom_frames:
      value: 100
      unit: frames
      evidence:
      - kind: decomp_source
        ref: khcom:src/title/mode_title.c:mode_title_1 (TITLE_STATE_ZOOM, sTitleTimer=100)
        confidence: 0.9
    zoom_target_scale:
      value: 0.738
      unit: x (BG2 magnification 0xBD0/16 / 256)
      native_value: 3024
      native_unit: gTitleBgScale (Q8.8 x16)
      evidence:
      - kind: derived
        ref: 0xBD0 / 16 / 256
        inputs:
        - khcom:src/title/mode_title.c:mode_title_1
        confidence: 0.7
    white_fade_frames:
      value: 70
      unit: frames
      evidence:
      - kind: decomp_source
        ref: khcom:src/title/mode_title.c:mode_title_1 (FadeStartOut(FADE_MODE_WHITE, 0x46))
        confidence: 0.85
    crossfade_steps:
      value: 16
      unit: BLDALPHA steps, 4 frames each
      evidence:
      - kind: decomp_source
        ref: khcom:src/title/mode_title.c:mode_title_1 (sTitleBlendStep, sTitleTimer=4)
        confidence: 0.85
  invariants:
  - Title never times out to a demo or intro movie.
  - Default menu choice is Resume if a valid suspend save exists, else Continue if a file is valid, else New Game.
  relations:
  - type: part_of
