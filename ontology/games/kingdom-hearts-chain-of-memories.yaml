id: kingdom-hearts-chain-of-memories
game:
  title: 'Kingdom Hearts: Chain of Memories'
  platform: gba
  game_code: B8CE
  rom_sha1: 10729bd884f8fdca7a310b6d606c52e46657aa48
  year: 2004
  developer: Jupiter / Square Enix
  derived_genres:
