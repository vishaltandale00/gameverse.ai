- id: battle_camera
  facet: camera
  label: Battle camera biased toward arena centre with capped easing, zoom and shake-rotation
  summary: 'The battle camera target is the midpoint between the player and a fixed arena point, clamped to stay within
    48 px of the player, raised by the player''s height. Each frame the camera moves 1/8 of the remaining distance,
    capped at 4 px/frame, then is clamped to the arena bounds (top bound 144 px, bottom extended 32 px). Scripted zooms
    ease scale and position by half-steps over N frames and tighten the bounds. A 32-step shake pattern also rotates
    the affine floor slightly.'
  instantiates:
  - concept: camera.follow.region_bounded_scroll
  - concept: camera.follow.eased_target_lerp
  - concept: camera.effect.screen_shake
  reads:
  - player.position
  - player.height
  - battle.arena.bounds
  writes:
  - battle.camera.view
  - battle.camera.scale
  - battle.camera.rotation
  params:
    ease_fraction:
      value: 0.125
      unit: of remaining distance per frame
      evidence:
      - kind: decomp_source
        ref: khcom:src/btl/btl_map.c:task_btl_map_1 (>> 3)
        confidence: 0.95
    max_camera_speed:
      value: 4
      unit: px/frame
      native_value: '0x400'
      native_unit: 1/256 px
      evidence:
      - kind: decomp_source
        ref: khcom:src/btl/btl_map.c:task_btl_map_1
        confidence: 0.95
    player_leash:
      value: 48
      unit: px
      native_value: '0x3000'
      evidence:
      - kind: decomp_source
        ref: khcom:src/btl/btl_map.c:BtlMapFollowPosition
        confidence: 0.95
    centre_bias:
      value: 0.5
      unit: weight of arena anchor (256, 324 px) vs player
      evidence:
      - kind: decomp_source
        ref: khcom:src/btl/btl_map.c:BtlMapFollowPosition ((px + 0x10000) >> 1)
        confidence: 0.9
    shake_steps:
      value: 32
      unit: frames
      evidence:
      - kind: decomp_source
        ref: khcom:src/btl/btl_map.c:BtlMapUpdateShake
        confidence: 0.9
    view_y_min:
      value: 144
      unit: px
      evidence:
      - kind: decomp_source
        ref: khcom:src/btl/btl_map.c:BTL_MAP_VIEW_Y_MIN
        confidence: 0.95
  invariants:
  - The view never leaves the arena bounds.
  - The camera target never sits more than 48 px from the player on either axis (before easing).
  evidence:
  - kind: decomp_source
    ref: khcom:src/btl/btl_map.c:task_btl_map_1
    confidence: 0.95
  - kind: decomp_source
    ref: khcom:src/btl/btl_map.c:BtlMapFollowPosition
