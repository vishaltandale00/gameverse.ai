- id: save_system
  facet: frontend
  label: Mirrored SRAM blocks, suspend save and save rooms
  summary: 'Battery SRAM holds a header, a "system" suspend block, two large Sora files and two small Riku files, each
    block stored twice with a signature and 16-bit checksum. At boot each block is checked; if one copy is bad and the
    other good, the good copy is rewritten over the bad one. The title''s Resume loads the suspend block and immediately
    clears it (one-shot quick save). Regular saves happen at save points in field rooms, which also restore HP. The card
    collection (up to 999 cards) and 3 decks are persisted.'
  instantiates:
  - concept: frontend.save.redundant_slot_backup
  - concept: frontend.save.suspend_save
  - concept: frontend.save.save_station
  reads:
  - player.*
  - cards.collection
  - decks[*]
  - world.floors[*]
  writes:
  - save.header
  - save.system
  - save.files_large[*]
  - save.files_small[*]
  - player.hp
  params:
    large_file_size:
      value: 3860
      unit: bytes
      native_value: '0xF14'
      evidence:
      - kind: decomp_source
        ref: khcom:include/save.h:SAVE_FILE_LARGE_SIZE
        confidence: 0.95
    small_file_size:
      value: 1048
      unit: bytes
      native_value: '0x418'
      evidence:
      - kind: decomp_source
        ref: khcom:include/save.h:SAVE_FILE_SMALL_SIZE
        confidence: 0.95
    copies_per_block:
      value: 2
      evidence:
      - kind: decomp_source
        ref: khcom:include/save.h:SAVE_SLOTS
        confidence: 0.9
    max_cards:
      value: 999
      evidence:
      - kind: decomp_source
        ref: khcom:include/save_types.h:SAVE_CARDS
        confidence: 0.9
    decks:
      value: 3
      evidence:
      - kind: decomp_source
        ref: khcom:include/save_types.h:SAVE_DECKS
        confidence: 0.9
    sram_used:
      value: 27.5
      unit: KiB (ends near 0x0E006B70)
      evidence:
      - kind: derived
        ref: block offsets and sizes in save.h (large files at 0x0E002F20, 2 files x 2 copies x 0xF14)
        inputs:
        - khcom:include/save.h:SRAM_FILE_SMALL
        - khcom:include/save.h:SAVE_FILE_LARGE_SIZE
        confidence: 0.6
  invariants:
  - A suspend save is consumed on load (SaveClearSystem right after SaveLoadSystem).
  - A block is valid only if both signature and checksum match; one good copy repairs the other.
  relations:
  - type: part_of
    target: game_mode_flow
  evidence:
  - kind: decomp_source
    ref: khcom:src/save.c:SaveRepairFileLarge
    confidence: 0.95
  - kind: decomp_source
    ref: khcom:src/save.c:SaveChecksum
    confidence: 0.9
  - kind: decomp_source
    ref: khcom:src/title/mode_title.c:TitleExitToChoice (TITLE_MENU_RESUME)
    confidence: 0.9
  - kind: decomp_source
    ref: khcom:src/lib/agb_sram.c (SRAM_F_V103 library string, SRAM wait states)
    confidence: 0.85
  - kind: decomp_source
    ref: khcom:src/map/map.c:Task_MapSave_0
    confidence: 0.8
  - kind: capture_frame
    ref: capture:frontend:f000934 (file select shows two slots with Sora level and time)
    confidence: 0.85
- id: fmv_movie_player
  facet: rendering
  label: Mode-3 bitmap FMV player with IWRAM codecs and ADPCM audio stream
  summary: 'Five pre-rendered movies (opening, 6F goal, 12F, Sora ending, Riku ending) play in a dedicated mode. Each
    movie header gives width (multiple of 8, at most 288), height, float frame rate, frame count and audio format;
    hand-written ARM key-frame and delta-frame decoders are copied to IWRAM and patched for the frame width, frames
    decode into an EWRAM buffer and are blitted to the Mode-3 framebuffer. Audio is IMA-style ADPCM (89-step table)
    or PCM16 streamed through DirectSound FIFOs with a timer-driven SndStream. Two subtitle lines are drawn with OBJ
    text and alpha-faded per language.'
  instantiates:
  - concept: rendering.bitmap.fmv_playback
  - concept: audio.stream.compressed_pcm_stream
    weight: 0.5
  reads:
  - movie.data
  - movie.subtitles
  writes:
  - vram.bitmap
  - io.dispcnt
  - sound.directsound_fifo
