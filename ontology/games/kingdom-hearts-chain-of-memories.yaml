    striking a closed door opens a card picker, and the map card spent there creates the room behind it. The card''s
    kind selects a room type whose shape row sets room form/size, max simultaneous enemies, total enemies, battle-id
    range, a room effect and prize cards; colour families are red (enemy quantity/strength/behaviour), green (battle
    modifiers such as first-strike strength, friend drops, magic/attack/item boosts) and blue (treasure, save/Moogle
    rooms, card shops). Mingling Worlds picks a random type. Rooms persist for the floor visit and are rebuilt from
    cards on return.'
