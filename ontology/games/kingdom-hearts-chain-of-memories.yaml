- id: sound_engine
  facet: audio
  label: MP2K (m4a) sequencer at 15768 Hz plus streamed PCM paths
  summary: 'Music and SFX use Nintendo''s m4a/MP2K engine (hand-written m4a_1.s SoundMain/ply_* commands, C m4a2.c)
    initialised at 15768 Hz, 8 PCM channels, master volume 14, 8-bit DAC. Battle BGM is chosen per battle type (world
    boss, Organization, Riku, final boss); events schedule sound cues by frame. Separately, the staff roll streams
    a block-compressed vocal track at 21024 Hz via a dedicated VBlank handler and Timer/DMA, and movies stream their
    own audio (see fmv_movie_player).'
