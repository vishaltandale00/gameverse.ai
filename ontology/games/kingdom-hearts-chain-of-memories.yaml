proposed_concepts:
- id: ai.attack.telegraphed_lunge
  label: Telegraphed lunge
  definition: Enemy attack with a fixed windup, an active dash over a set distance with a hitbox, and a recovery window.
  seed_source: 'game_ai_taxonomy: Scripted / pattern-based AI'
- id: ai.boss.hp_phase_escalation
  label: HP-phase escalation
  definition: Boss behaviour parameters (attack odds, attack set, projectile counts) switch at health thresholds.
  seed_source: 'gdp: Boss Monsters'
- id: ai.boss.random_effect_roll
  label: Random effect roll
  definition: Boss produces a randomly chosen effect (heal, attack, summon) from an equiprobable set, often shown as dice
    or a roulette.
- id: ai.decision.distance_banded_action_odds
  label: Distance-banded action odds
  definition: Action selection probabilities depend on which distance band the target is in.
  seed_source: 'game_ai_taxonomy: Utility AI'
- id: ai.decision.per_frame_probability_trigger
  label: Per-frame probability trigger
  definition: Behaviours start with a fixed 1-in-N chance each frame instead of explicit timers, giving memoryless pacing.
- id: ai.enemy.directional_guard
  label: Directional guard
  definition: Enemy blocks a damage type from one side, forcing the player to attack from behind or switch damage type.
  seed_source: 'gdp: Guard'
- id: ai.enemy.hover_and_dive
  label: Hover and dive
  definition: Flying enemy idles at altitude with a bob, repositions in straight flights and attacks with a diving lunge.
  seed_source: VGDL Chaser (aerial)
- id: ai.enemy.submerge_ambush
  label: Submerge ambush
  definition: Enemy sinks into the ground, moves untouchable and resurfaces to attack.
- id: ai.opponent.symmetric_rules_virtual_input
  label: Symmetric-rules virtual-input opponent
  definition: AI opponent plays under the same rules and resources as the player by emitting virtual button presses into the
    player-side game logic.
  seed_source: 'game_ai_taxonomy: Artificial player'
- id: ai.perception.vision_cone
  label: Vision cone
  definition: Enemy perceives the player only inside an angular sector in front of it, optionally limited to the same height
    level.
  seed_source: 'game_ai_taxonomy: Aggro / detection range / line of sight'
- id: ai.spawn.budgeted_random_spawner
  label: Budgeted random spawner
  definition: Spawner adds enemies with a random per-frame chance while caps on simultaneous count, total count and sprite
    memory allow.
- id: audio.stream.compressed_pcm_stream
  label: Compressed PCM stream
  definition: Long audio (voice, licensed song, movie sound) decoded from a compressed sample stream and fed to the DAC by
    timer/DMA, bypassing the sequencer.
- id: camera.follow.eased_target_lerp
  label: Eased target lerp
  definition: Camera moves a fixed fraction of the remaining distance to its target each frame, with a speed cap.
  seed_source: 'movement_physics_game_feel: Polish'
- id: economy.converter.sell_back
  label: Sell-back converter
  definition: Owned items can be converted back into currency at a value derived from their cost.
  seed_source: 'machinations: Converter'
- id: economy.source.timed_pickup_drop
  label: Timed pickup drop
  definition: Defeated enemies or broken objects release collectibles that must be picked up before they expire.
  seed_source: 'gdp: Pick-Ups'
- id: economy.trade.random_pack_shop
  label: Random pack shop
  definition: Currency buys packs whose contents are drawn randomly from weighted tables (booster packs).
  seed_source: 'gdp: Trading / Loot'
- id: frontend.ending.credits_roll
  label: Credits roll
  definition: Scrolling staff credits shown after the ending, often with music and illustration panels.
- id: frontend.game_over.pre_encounter_rollback
  label: Pre-encounter rollback
  definition: On defeat the game restores the state from just before the fatal encounter, discarding gains made during it,
    and returns the player to the field.
  seed_source: 'gdp: Death Consequences'
- id: frontend.save.suspend_save
  label: Suspend save
  definition: Single-use quick save that resumes play exactly where it was suspended and is deleted when loaded.
  seed_source: 'progression_structure: Save Files'
- id: frontend.title.press_start_menu
  label: Press-start title menu
  definition: Title screen waits for Start, then shows a menu whose default and available entries depend on existing saves
    and unlocks.
  seed_source: 'front_end_flow: Title screen'
- id: mechanics.cards.card_as_level_modifier
  label: Card as level modifier
  definition: Cards are spent to set or alter level/room properties (enemy count, strength, rewards, special rooms) rather
    than to act in combat.
- id: mechanics.cards.card_break_contest
  label: Card break contest
  definition: Played cards carry values; a later play with a higher (or special wildcard) value cancels and stuns an opponent's
    play in progress.
- id: mechanics.cards.combination_sleight
  label: Combination sleight
  definition: Several held cards are played together as one action; specific card combinations and value-sum windows map to
    special moves.
  seed_source: 'gdp: Combos'
- id: mechanics.cards.deck_as_action_set
  label: Deck as action set
  definition: The player's available actions in real-time play are exactly the cards remaining in a deck/hand, consumed on
    use.
  seed_source: 'ludii: equipment / moves'
- id: mechanics.cards.deck_cycle_reload
  label: Deck cycle reload
  definition: When the deck is exhausted the player must spend vulnerable time reloading it, with reload time growing per
    cycle.
  seed_source: 'gdp: Cooldown'
- id: mechanics.cards.effect_card_buff
  label: Effect card buff
  definition: A card that grants a timed passive modifier instead of an action; one active at a time.
  seed_source: 'gdp: Power-Ups'
- id: mechanics.cards.fixed_deck_mode
  label: Fixed deck mode
  definition: Mode in which the player's deck is preset per stage instead of being built.
- id: mechanics.cards.in_battle_card_drop
  label: In-battle card drop
  definition: New cards drop during an encounter and can be picked up and used immediately.
  seed_source: 'gdp: Pick-Ups'
- id: mechanics.cards.point_budget_deckbuilding
  label: Point-budget deckbuilding
  definition: Decks are limited by a total cost budget; card cost depends on card strength and the budget grows with progression.
  seed_source: 'gdp: Resource Management'
- id: mechanics.cards.valued_cards
  label: Valued cards
  definition: Each card has a numeric value (e.g. 0-9) separate from its effect, used for contests and combinations.
- id: mechanics.combat.assist_summon
  label: Assist summon
  definition: Calling an ally or summoned creature to perform a scripted attack sequence for a limited time.
  seed_source: 'gdp: Companions'
- id: mechanics.combat.combo_move_lookup
  label: Combo move lookup
  definition: An input or resource combination is looked up in a table to produce a special move.
  seed_source: 'gdp: Combos'
- id: mechanics.combat.hit_stop
  label: Hit stop
  definition: Brief freeze of actor updates on impact to sell hits, with per-attack duration.
  seed_source: 'movement_physics_game_feel: Knockback / hit-stop'
- id: mechanics.combat.hitbox_volume_test
  label: Hitbox volume test
  definition: Attacks spawn axis-aligned boxes in world space tested against target radii and height ranges.
- id: mechanics.combat.interrupt_priority
  label: Interrupt priority
  definition: Actions in progress can be cancelled by an opposing action of higher priority, staggering the loser.
- id: mechanics.combat.melee_combo_chain
  label: Melee combo chain
  definition: Consecutive attacks advance through a fixed swing sequence ending in a finisher.
  seed_source: 'gdp: Combos'
- id: mechanics.combat.multiplicative_damage_formula
  label: Multiplicative damage formula
  definition: Damage = attacker stat x move power x situational multipliers, clamped to a minimum.
- id: mechanics.combat.real_time_action_combat
  label: Real-time action combat
  definition: Combat with continuous movement and timing, as opposed to turn-based resolution.
  seed_source: 'igdb genre: Hack and slash'
- id: mechanics.combat.vulnerability_window
  label: Vulnerability window
  definition: A required action (reload, recovery) leaves the player exposed for a period.
- id: mechanics.difficulty.linear_stat_scaling_by_stage
  label: Linear stat scaling by stage
  definition: Enemy stats are multiplied by a factor linear in the stage/floor index.
  seed_source: 'gdp: Ever Increasing Difficulty'
- id: mechanics.encounter.hold_to_flee
  label: Hold to flee
  definition: Escaping an encounter requires holding against the arena edge while a gauge fills.
- id: mechanics.encounter.overworld_first_strike
  label: Overworld first strike
  definition: Hitting a map enemy before contact gives an advantage (damage, stun) at the start of the encounter.
- id: mechanics.encounter.symbol_encounter
  label: Symbol encounter
  definition: Enemies are visible on the field map and touching one starts a separate battle.
- id: mechanics.minigame.escort_companion
  label: Escort companion
  definition: Minigame where the player guides an autonomous companion with its own needs (stamina, hunger) toward goals.
  seed_source: 'gdp: Minigames'
- id: mechanics.multiplayer.link_versus
  label: Link versus
  definition: Two players on linked devices play a head-to-head match with their own saved resources.
  seed_source: 'igdb: Multiplayer'
- id: mechanics.resource.meter_fueled_transformation
  label: Meter-fueled transformation
  definition: A meter filled by play lets the character transform into a stronger mode that drains the meter until it ends.
  seed_source: 'gdp: Power-Ups'
- id: mechanics.status.timed_status_ailment
  label: Timed status ailment
  definition: Hits inflict temporary states (stun, confuse, bind, stop) that alter control or behaviour for a fixed duration.
  seed_source: 'gdp: Status effects'
- id: movement_physics.locomotion.turn_speed_penalty
  label: Turn speed penalty
  definition: Changing direction sharply reduces or zeroes current speed.
  seed_source: 'movement_physics_game_feel: Response'
- id: narrative_delivery.structure.episodic_world_vignettes
  label: Episodic world vignettes
  definition: The story is a sequence of self-contained episodes in themed worlds, framed by an overarching plot.
  seed_source: 'narrative: Narration Structures'
- id: progression.character.choice_level_up
  label: Choice level-up
  definition: On each level-up the player chooses one of several stat or ability rewards.
  seed_source: 'gdp: Character Levels'
- id: progression.gating.value_threshold_door
  label: Value-threshold door
  definition: A door or gate accepts a key item only if its numeric value meets a rule relative to a threshold.
  seed_source: 'dormans: Lock and key'
- id: progression.structure.player_constructed_level
  label: Player-constructed level
  definition: The player decides room contents or layout as part of play by spending resources at transitions.
- id: progression.structure.player_ordered_worlds
  label: Player-ordered worlds
  definition: Sets of levels unlock together and the player chooses their order.
  seed_source: 'progression_structure: Hub'
- id: progression.structure.tower_floor_climb
  label: Tower floor climb
  definition: Progress is a linear climb through floors of a tower, each floor a self-contained stage.
  seed_source: 'progression_structure: Levels'
- id: projection.isometric.pseudo_isometric_grid
  label: Pseudo-isometric grid
  definition: 2:1 diamond-style tile grid with diagonal walls rendered as 2D tiles, giving an isometric look without true
    3D.
  seed_source: 'perspective_camera_render: Isometric (axonometric)'
- id: projection.oblique.depth_strip_2_5d
  label: Depth-strip 2.5D
  definition: Side-on view of a shallow ground plane where depth and height both map to screen Y, as in brawlers.
  seed_source: 'perspective_camera_render: 2.5D / 3/4 view'
- id: rendering.bitmap.fmv_playback
  label: FMV playback
  definition: Pre-rendered video decoded in software into a bitmap framebuffer, with streamed audio.
  seed_source: 'perspective_camera_render: GBA bitmap modes'
- id: setting.location.memory_construct_tower
  label: Memory-construct tower
  definition: A building whose floors recreate places from characters' memories.
- id: setting.theme.licensed_crossover_fantasy
  label: Licensed crossover fantasy
  definition: Fantasy setting combining characters and worlds from several existing franchises.
  seed_source: 'igdb theme: Fantasy'
- id: ui_hud.hud.card_hand_display
  label: Card hand display
  definition: HUD showing the playable cards in hand with values and the currently selected card.
- id: ui_hud.menu.codex_journal
  label: Codex journal
  definition: Menu cataloguing encountered characters, enemies and items, filled as the player discovers them.
  seed_source: 'gdp: Collecting'
- id: ui_hud.targeting.auto_lock_on
  label: Auto lock-on
  definition: Game automatically selects an enemy target by facing and distance, used to aim attacks.
  seed_source: 'gdp: Auto-Aim'
open_questions:
- 'Exact break-stagger and hurt-animation lengths for Sora live in animation data (47 + breakAnim), not in code constants;
  not converted to frames.'
- Reload cycle length (~34 frames) is an estimate from the gauge step and animation ticks; a frame-stepped capture of a
  reload would confirm it.
- The capture never reached field or battle gameplay (frontend input script stops at the opening FMV), so field/battle
  BG modes, affine floor transforms and sprite counts are from code only.
- Field enemy stun/faint duration after a first strike on the field was not found (map_faint.c only draws the icon).
- The regular field mode's BG0 blend setting was only seen in the debug field mode (Mode_MapDbg_0 SetBlendAlpha 6/10).
- Room form table gMapFormDefs units (presumably cells) and the exact effect of each green/blue room card (e.g. Sorcerous
  Waking magic boost, Guarded Trove treasure) were not traced; room_effect ids in the room shape table are listed raw.
- Only Shadow, Air Soldier and Large Body (regular) and Guard Armor, Ursula, Oogie Boogie, Larxene (bosses) were read
  in depth; Trickmaster, Jafar, Darkside, Dragon Maleficent, Parasite Cage, Marluxia final form and the other humanoids
  are known only from file names/headers.
- Moogle shop pack contents per tier (sMooglePackTiers) and per-world prize tier tables were sampled, not tabulated.
- The 106 sleight recipes were sampled (12 rows); the full LookupStockName switch was not exported.
- Movie frame rate and resolution are per-movie header data (MovieOpen) and were not read from ROM; the capture shows
  31536 Hz movie audio.
- Byte-weighted decomp completion percentage was not measured locally (published on decomp.dev only).
