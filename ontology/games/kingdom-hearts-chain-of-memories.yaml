- id: cutscene_system
  facet: narrative_delivery
  label: Keyframed in-engine events with portrait dialogue
  summary: 'Story beats are data-driven events (~197 event scripts named by floor/world, e.g. 1F entrance, per-world
    e0..e3, boss, end; Riku B12F..B1F). Each event bundles a camera keyframe track (frame, x, y, follow target, shake
    flags), per-character keyframe tracks (anim, frame, x/y/z position, callback), timed sound cues and a message script
    whose entries pick a speaker portrait and expression, window position, per-character text delay, yes/no prompts
    and silhouette/focus flags. Events run in the field engine; five beats escalate to FMV.'
  instantiates:
  - concept: narrative_delivery.cutscene.in_engine_cutscene
  - concept: narrative_delivery.dialogue.typewriter_dialogue
  - concept: narrative_delivery.structure.predetermined_story
  reads:
  - event.id
  - world.floor
  - story.flags
  writes:
  - camera.position
  - actors[*].position
  - story.flags
  params:
    event_scripts:
      value: 197
      unit: event include files
      evidence:
      - kind: decomp_source
        ref: khcom:src/evt/events/ (directory listing)
        confidence: 0.85
    text_char_delay:
      value: 1
      unit: frames per character
      variants:
      - when: version=jp
        value: 3
