- id: door_card_gate
  facet: progression
  label: Value-threshold doors and event key doors
  summary: 'A normal door accepts any non-key map card whose value is 0 or strictly greater than the current room''s
    card value, so value chains push the player to hold a spread of high cards (0 is a wildcard). Story doors carry
    EventKey requirements - kind, colour, rule (at least, at most, exact, or TOTAL where several cards'' values add up)
    and value - and the floor''s key rooms need the story key cards (Key of Beginnings, Key of Guidance, Key to Truth)
    that are granted by events. Key to Rewards opens treasure rooms.'
  instantiates:
  - concept: progression.gating.typed_lock_and_key
  - concept: progression.gating.value_threshold_door
  reads:
  - room.card_value
  - card.kind
  - card.value
  - door.event_key
  writes:
  - door.flags.open
  - cards.map_cards
  params:
    normal_door_rule:
      value: card.value == 0 or card.value > room.card_value
      evidence:
      - kind: decomp_source
        ref: khcom:src/map/map.c:DoorAcceptsMapCard
        confidence: 0.95
    event_key_rules:
      value: '[AT_LEAST, AT_MOST, EXACT, TOTAL]'
      evidence:
      - kind: decomp_source
        ref: khcom:src/map/map.c:PayEventKey
        confidence: 0.85
  invariants:
  - Key cards can never be spent on normal doors (kind must be <= Black Room).
  - The exit room stays locked until the floor's last story event step.
