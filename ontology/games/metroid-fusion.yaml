proposed_concepts:
- id: movement_physics.climb.surface_climb
  label: Surface climb
  definition: Tile-flagged walls or ceilings the avatar can attach to and traverse at a fixed slow speed, with its own shoot
    and jump-off options, independent of items.
  is_a:
  - movement_physics.ledge.ledge_grab_hang
  aliases:
  - ladder
  - monkey bars
  - climbable wall
- id: mechanics.entity.death_releases_pickup_entity
  label: Death releases mobile pickup
  definition: A defeated enemy turns into a mobile entity that the player can collect for a reward but that acts on its
    own (moves, despawns, empowers others) if not collected in time.
  seed_source: gdp Loot / Rewards (paraphrase)
- id: mechanics.entity.enemy_respawn_by_reinfection
  label: Respawn by reinfection
  definition: Defeated enemies repopulate a space because a released essence travels to and reanimates dormant enemy bodies,
    so the player controls respawns by collecting or intercepting the essence.
- id: mechanics.status.elemental_hazard_entity
  label: Resistance-flipped hazard entity
  definition: A hostile entity whose contact effect is harmful until the player gains a specific resistance, after which
    the same contact is beneficial.
- id: mechanics.status.player_freeze
  label: Player freeze
  definition: An enemy attack that immobilises the player for a fixed time instead of (or in addition to) knockback, leaving
    them open to follow-up attacks.
- id: mechanics.combat.one_shot_protection
  label: One-shot protection
  definition: A hit that would kill the player from above a threshold instead leaves them at minimum health.
- id: mechanics.combat.grab_and_drain
  label: Grab and drain
  definition: An enemy captures the player, removing control and draining health at a fixed interval until a release condition.
- id: ai.movement.overshoot_homing
  label: Overshoot homing
  definition: Seeking with bounded per-axis acceleration that overshoots the target and decelerates before reversing, producing
    orbiting, organic motion instead of direct pursuit.
- id: ai.spawn.offscreen_continual_spawner
  label: Off-screen continual spawner
  definition: An invisible emitter that keeps spawning entities just beyond the screen edge while a population cap and a
    precondition hold.
- id: ai.enemy.invulnerable_stalker
  label: Invulnerable stalker
  definition: A scripted, unkillable pursuer that patrols, detects the player by sight or sound and follows across rooms,
    forcing evasion rather than combat.
  is_a:
  - ai.enemy.patrol_detect_pursue
- id: ai.enemy.player_mirror_enemy
  label: Player-mirror enemy
  definition: An enemy that uses the player's own movement repertoire and weapon set against them.
- id: ai.enemy.damage_provoked_aggression
  label: Damage-provoked aggression
  definition: An enemy whose detection or attack range expands after it is hurt.
- id: ai.perception.posture_dependent_visibility
  label: Posture-dependent visibility
  definition: Line-of-sight checks account for the player's body height, so crouching or rolling behind low cover breaks
    detection.
  is_a:
  - ai.perception.tile_raycast_line_of_sight
- id: ai.perception.sound_alert_turn
  label: Sound alert turn
  definition: An agent turns toward the player when the player makes noise (e.g. fires) outside its field of view.
- id: ai.boss.shielded_core
  label: Shielded core
  definition: A core enemy protected by a shell or closing eye that only a specific weapon or timing window can breach.
  is_a:
  - ai.boss.weak_point_window
- id: ai.boss.multi_phase_transforming_boss
  label: Transforming multi-phase boss
  definition: A boss that changes body, move set and weakness between health phases.
- id: progression.structure.linear_event_script
  label: Linear event script
  definition: Story and world state advance through one ordered counter where only the next event can fire, from room entry,
    trigger volumes, terminals or objective callbacks; content keys off counter comparisons.
- id: progression.gating.security_clearance_levels
  label: Security clearance levels
  definition: Doors are keyed to an ordered clearance level that the player raises at scripted terminals, independent of
    weapons.
  is_a:
  - progression.gating.typed_lock_and_key
- id: progression.guidance.directed_objective_briefing
  label: Directed objective briefing
  definition: Mandatory terminals where a commander character assigns the next objective, steering a nominally open map
    along a fixed route.
  is_a:
  - progression.guidance.hint_waypoint
- id: progression.items.scripted_ability_restoration
  label: Scripted ability restoration
  definition: The player starts stripped of abilities and regains them in a fixed order from story events (downloads, boss
    rewards) rather than from freely placed pickups.
- id: progression.items.boss_drops_ability
  label: Boss drops ability
  definition: Defeating a boss releases its associated upgrade as a collectible the player must touch to gain.
- id: progression.structure.hub_and_spoke
  label: Hub and spoke
  definition: A central area connects to several otherwise separate regions via dedicated transit links.
- id: frontend.intro.new_game_prologue
  label: New-game prologue
  definition: A story sequence that plays once when a new save file is started, before first control.
- id: rendering.transition.window_iris
  label: Window iris transition
  definition: A screen transition drawn by growing or shrinking a hardware window rectangle around a point or the player.
- id: rendering.environment.story_state_room_effects
  label: Story-state room effects
  definition: Rooms change palette, lighting, raster effects and hazards based on global story progress rather than room
    data alone.
- id: rendering.sprite.mosaic_dissolve
  label: Mosaic dissolve
  definition: Sprites appear, disappear or transform through a ramped hardware mosaic effect.
- id: ui_hud.menu.equipment_status_display
  label: Equipment status display
  definition: A read-only screen listing owned equipment without toggles.
- id: narrative_delivery.dialogue.remote_commander_briefing
  label: Remote commander briefing
  definition: Story and objectives are delivered by an off-site commander through in-world terminals as text dialogue.
- id: narrative_delivery.cutscene.transit_monologue
  label: Transit monologue
  definition: Protagonist narration that plays during an elevator or travel transition when story state matches.
- id: setting.location.research_space_station
  label: Research space station
  definition: The world is an orbital research facility divided into environment-themed sectors.
- id: setting.theme.parasitic_infection
  label: Parasitic infection
  definition: A parasite that copies or possesses hosts drives the conflict and enemy roster.
- id: setting.tone.stalked_survival
  label: Stalked survival
  definition: Tension comes from being hunted by a stronger pursuer the player must evade.
- id: audio.music.story_event_music_script
  label: Story-event music script
  definition: Music changes follow an ordered script of story events, each firing only on a declared trigger type.
  is_a:
  - audio.music.state_driven_music
open_questions:
- Default button mapping (R arm weapon, L diagonal aim), file-select SOUND option, any Hard-mode unlock and the game-over
  menu are in asm; cited at low confidence or omitted.
- Jump apex heights, bomb-bounce apexes and speed-booster activation (~155 frames) are simulated from constants; the pose-request
  frame order may shift them by a few frames. Captures contain no in-game footage to confirm.
- Haze/HBlank-DMA, power-bomb window and in-game mosaic are decomp-only; the capture run covered attract and front-end phases
  only (no HBlank DMA seen there).
- Shinespark wind-up length is animation-table driven (sSamusAnim_DelayBeforeShinesparking_Right) and was not summed.
- What free X fly toward in rooms with no Target sprite (gXParasiteTargetY/X may hold a stale value) was not established.
- Range of gSpriteRandomNumber (affects Core-X escort colour odds) not verified.
- Per-boss attack timings, Ridley/Omega Metroid damage gating and Kihunter detection ranges were not extracted; host_bosses
  is a roster, not full boss FSMs.
- Whether per-part hits of 3-part beams (Wide/Plasma/Wave) all land on one enemy in the same frame depends on hit-flash
  timing; damage table lists per-part values only.
- Max power bombs from tanks is derived as 74 (10 + 32 x 2) from the tank table; whether the PB data download grants exactly
  STARTING_POWER_BOMBS was not traced.
- Room-level data (which blocks gate which rooms, event-based room swaps, item placement) lives in src/data/rooms and sEventBasedConnections
  and was not parsed into a full gating graph.
- Fusion's Metroids (restricted lab) only float and swarm the SA-X; no Metroid latch AI exists, so metroid_latch_ai has
  no counterpart.
- The look-ahead camera (ScrollFrontWideComputeTarget) appears debug-only; retail use not confirmed.
