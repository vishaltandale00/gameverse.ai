    ref: mf:src/room_effect.c:RoomEffectSetupCurrentEventBased
    confidence: 0.9
  - kind: decomp_source
    ref: mf:src/room_effect.c:RoomEffectProcessEventBased
    confidence: 0.85
- id: sprite_mosaic_dissolve
  facet: rendering
  label: OBJ mosaic dissolve for X emergence and absorption
  summary: A 45-step table ramps OBJ mosaic size 0 -> 15 -> 0. A dying infected enemy counts down 44 -> 0 through it, blinking
    every other frame, then becomes an X; a newly spawned X starts at index 22 and is untouchable until the index drops
    to 22 or below. The value is written to the MOSAIC register every frame from the in-game loop.
  instantiates:
  - concept: rendering.sprite.mosaic_dissolve
  reads:
  - sprites[*].mosaic_index
  writes:
  - io.mosaic
  params:
    mosaic_steps:
      value: 45
      evidence:
      - kind: decomp_source
        ref: mf:src/data/sprites/x_parasite.c:sXParasiteMosaicValues
        confidence: 0.95
    max_mosaic:
      value: 15
      unit: OBJ mosaic size - 1
      evidence:
      - kind: decomp_source
        ref: mf:src/data/sprites/x_parasite.c:sXParasiteMosaicValues
        confidence: 0.9
  relations:
