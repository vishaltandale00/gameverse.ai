  summary: 'All story progress is one byte, the event counter (110 events). Only event counter+1 can fire, from one of five
    trigger kinds: entering a listed room, crossing a trigger box, talking in a listed Navigation Room, finishing a data
    download, or a boss/objective callback (EventCheckAdvance requires counter == event-1). Twelve events are marked skippable
    so ignored nav briefings do not soft-lock. The counter selects event-based door destinations (60 rerouted connections),
    sprite sets, music and room effects, and disables saves/nav/recharge during the power outage, meltdown and post-orbit-change
    sequences.'
