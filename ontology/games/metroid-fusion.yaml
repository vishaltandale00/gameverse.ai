    confidence: 0.8
- id: save_and_continue
  facet: frontend
  label: Save pads, redundant SRAM slots and game-over continue
  summary: Saving happens on save pads (platform sinks, yes/no prompt banner). SRAM is 32 KiB holding three 4608-byte files,
    each with an interleaved backup copy. Saves are disabled by the event script during the power outage, the meltdown and
    after the orbit change. Game over offers continue (reload last save) or quit.
  instantiates:
  - concept: frontend.save.save_station
  - concept: frontend.save.redundant_slot_backup
  - concept: frontend.game_over.continue_from_save
  reads:
  - player.*
  - equipment.*
  - world.event_counter
  writes:
  - save.files[*]
  params:
    sram_size:
      value: 32768
      unit: bytes
      evidence:
      - kind: decomp_source
        ref: mf:include/gba/memory.h:SRAM_SIZE
        confidence: 0.95
    file_size:
      value: 4608
      unit: bytes
      evidence:
      - kind: decomp_source
        ref: mf:src/data/sram_pointers.c
        confidence: 0.85
  relations:
  - type: variant_of
    target: metroid-zero-mission/save_and_continue
  - type: gated_by
    target: event_counter_progression
    condition: power outage, meltdown, after orbit change
  - type: part_of
    target: game_mode_flow
  evidence:
  - kind: decomp_source
    ref: mf:src/sprites_AI/save_pad.c:SavePlatformSpawnSavePrompt
    confidence: 0.85
  - kind: decomp_source
    ref: mf:include/structs/save_file.h
    confidence: 0.9
  - kind: decomp_source
    ref: mf:src/sram_misc.c
    confidence: 0.8
  - kind: decomp_source
    ref: mf:src/event_checks.c:EventCheckWith_SaveDisabled
    confidence: 0.95
- id: bg_layer_stack
  facet: rendering
  label: Mode-0 four-layer tilemap room renderer with OBJ actors
  summary: Same engine as Zero Mission - gameplay is pure Mode 0 with four text BGs set per room by RoomEffectSetTransparency
    (BG0 overlay/liquid/darkness, BG1 collision layer, BG2 decoration, BG3 backdrop). Fusion adds BG0 room types for dark,
    dim, SA-X and Nightmare rooms. Captures saw Mode 0 in 8966/9000 frames with up to 88 OBJ visible.
  instantiates:
  - concept: rendering.background.tile_layer_stack
  reads:
  - room.bg_props
  - room.transparency_code
  - camera.scroll
  writes:
  - io.bgcnt[0..3]
  - io.dispcnt
  - oam.*
  params:
    gameplay_bg_layers:
      value: 4
      evidence:
      - kind: decomp_source
        ref: mf:src/room_effect.c
        confidence: 0.85
    max_sprites:
      value: 24
      evidence:
      - kind: decomp_source
        ref: mf:include/structs/sprite.h
        confidence: 0.9
    max_projectiles:
      value: 16
      evidence:
      - kind: decomp_source
        ref: mf:include/structs/projectile.h
        confidence: 0.9
  relations:
  - type: variant_of
    target: metroid-zero-mission/bg_layer_stack
  - type: part_of
    target: side_view_projection
  evidence:
  - kind: decomp_source
    ref: mf:src/room_effect.c
    confidence: 0.85
  - kind: decomp_source
    ref: mf:include/constants/room.h
    confidence: 0.9
  - kind: capture_telemetry
    ref: capture:attract+frontend:dispcnt mode 0 in 8966/9000 frames, max 88 OBJ
    confidence: 0.9
    note: front-end only; no in-game rooms captured
- id: hblank_raster_effects
  facet: rendering
  label: HBlank-DMA haze and power-bomb window with event-driven fog
  summary: Same RAM-resident per-scanline HBlank-DMA routines as Zero Mission, with 14 haze values instead of 8 (adds BG0
    haze, a cold no-op and an after-power-bomb value). Haze data also sets the room's damaging effect and water motion,
    and in fog rooms the haze value is chosen from the event counter (atmospheric stabilizers). The power-bomb window ellipse
    matches Zero Mission (BLDY 12).
  instantiates:
  - concept: rendering.raster.hblank_dma_scroll_distortion
  - concept: rendering.raster.window_shape_per_scanline
  - concept: rendering.raster.hblank_palette_gradient
    weight: 0.5
  reads:
  - room.visual_effect
  - world.event_counter
  - power_bomb.semi_minor_axis
  writes:
  - io.bg_hofs
  - io.win1h
  - io.bldcnt
  - io.bldy
  params:
    haze_values:
      value: 14
      evidence:
      - kind: decomp_source
        ref: mf:include/constants/haze.h
        confidence: 0.95
    pb_darken_bldy:
      value: 12
      unit: BLDY level (of 16)
      evidence:
      - kind: decomp_source
        ref: mf:src/haze.c:HazeSetupCode
        confidence: 0.9
  relations:
  - type: variant_of
    target: metroid-zero-mission/hblank_raster_effects
    note: 14 vs 8 haze values; event-chosen fog haze
  - type: part_of
    target: bombs_and_power_bombs
    note: power-bomb window
  evidence:
  - kind: decomp_source
    ref: mf:src/haze.c:HazeSetupCode
    confidence: 0.95
  - kind: decomp_source
    ref: mf:src/haze.c:HazeGetAtmosphericStabilizerValue
    confidence: 0.85
  - kind: capture_telemetry
    ref: capture:attract+frontend:no HBlank DMA/IRQ observed
    confidence: 0.7
    note: front end only; in-game haze unverified at runtime
- id: blend_and_palette_effects
  facet: rendering
  label: Alpha-blended overlays, dark/dim rooms, colour fades and iris window transition
  summary: BG0 overlays use BLDALPHA; dark rooms persist until the SA-X elevator cutscene ends and dim lighting follows
    an event table. There are 20 colour-fade types including an iris transition where window 1 grows from a point at (timer/2
    + 2) px per frame per edge or closes onto Samus. No Zero-Mission-style clipdata-triggered blend fades were found in
    C.
  instantiates:
  - concept: rendering.blending.alpha_layer_transparency
  - concept: rendering.blending.brightness_fade
  - concept: rendering.palette.runtime_palette_effects
  - concept: rendering.transition.window_iris
  reads:
  - room.bg0_prop
  - world.event_counter
  - player.position
  writes:
  - io.bldalpha
  - io.bldcnt
  - io.bldy
  - io.win1h
  - io.win1v
  - palram.*
  params:
    colour_fade_types:
