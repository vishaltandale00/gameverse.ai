- id: sprite_fsm_framework
  facet: ai
  label: Per-sprite pose state machines with infection classes and X pose band
  summary: As in Zero Mission, 24 sprite slots each run a pose-switch AI routine selected by sprite ID (primary and secondary
    pointer tables), with the current sprite copied in and out each frame. Fusion adds a shared pose band used by every
    enemy for dying/spawning-from-X (0x57-0x5A) and X poses (0x5B+), an infection class in each spriteset byte (0x10 uninfected/boss,
    0x20 absorbable X, 0x30 unabsorbable, hidden flag 0x80), and per-sprite RNG from a slot-indexed table. Only pose-0 or
    always-active sprites update while Samus is in a sprite-stopping pose.
