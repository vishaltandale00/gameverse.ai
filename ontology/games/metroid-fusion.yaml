- id: event_driven_room_effects
  facet: rendering
  label: Story-state room effects (fog, electrified water, meltdown, power outage)
  summary: About 23 room effects are keyed to the event counter rather than the room alone - stabilizer fog, electrified
    water with a 20-frame shake, meltdown lighting between the Ice Missile download and the cooling unit fix, auxiliary
    power off, power outage, the SA-X elevator, reactor core and boss rooms (Yakuza, Nightmare, Omega Metroid). They swap
    palettes, haze and blend and fire music events, so the same room reads differently at different story points.
  instantiates:
  - concept: rendering.environment.story_state_room_effects
  reads:
  - world.event_counter
  - world.room
  writes:
  - palram.*
  - room.visual_effect
  - io.bldalpha
  params:
    event_effects:
      value: 23
      unit: approx.
      evidence:
      - kind: decomp_source
        ref: mf:src/room_effect.c (EventBasedEffect enum)
        confidence: 0.85
  relations:
  - type: requires
    target: event_counter_progression
  - type: modulates
    target: hblank_raster_effects
  - type: modulates
    target: adaptive_music
  evidence:
