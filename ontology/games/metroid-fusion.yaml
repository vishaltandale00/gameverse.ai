- id: scroll_camera
  facet: camera
  label: Scroll-region-bounded follow camera with displacement-limited catch-up
  summary: Same anchors as Zero Mission (120 px across, 96 px down, clamped to room scroll boxes), but each axis steps by
    min(distance to target, 12 px/frame, Samus displacement + 1 px) and does not move when Samus moves away from the target.
    Screen shake alternates every 2 frames and halves in its last 15. A 32 px look-ahead camera exists only behind a debug
    option; special scrolls serve the Nightmare shadow and SR388 planet.
  instantiates:
  - concept: camera.follow.region_bounded_scroll
  - concept: camera.follow.speed_adaptive_lag
  - concept: camera.effect.screen_shake
    weight: 0.5
  reads:
  - player.position
  - player.previous_position
  - room.scroll_boxes
  writes:
  - camera.scroll.x
  - camera.scroll.y
  params:
    anchor_x:
      value: 120
      unit: px
      evidence:
      - kind: decomp_source
        ref: mf:include/structs/scroll.h
        confidence: 0.95
    anchor_y:
      value: 96
      unit: px
      evidence:
      - kind: decomp_source
        ref: mf:include/structs/scroll.h
        confidence: 0.95
    max_step:
      value: 12
      unit: px/frame
      evidence:
      - kind: decomp_source
        ref: mf:src/scroll.c:ScrollScreen
        confidence: 0.85
  relations:
  - type: variant_of
    target: metroid-zero-mission/scroll_camera
    note: catch-up bounded by Samus displacement+1 with 12 px/frame ceiling vs 2 px/frame base cap
  - type: requires
    target: side_view_projection
  evidence:
  - kind: decomp_source
    ref: mf:src/scroll.c:ScrollScreen
