schema_version: 0
id: metroid-fusion
game:
  title: Metroid Fusion
  platform: gba
  game_code: AMTE
  rom_sha1: ca33f4348c2c05dd330d37b97e2c5a69531dfe87
  year: 2002
  developer: Nintendo R&D1
  derived_genres:
  - metroidvania
  - action_platformer
  - action_adventure
  evidence_basis:
  - decomp_source
  - capture_telemetry
  - capture_frame
  - static_signature
  - derived
  - llm_knowledge
  sources:
  - kind: decomp
    ref: https://github.com/metroidret/mf @ 55b1a54bd20c0daf5a64859850b6ebc1322bf514 (local/decomps/mf; USA target sha1
      matches; README reports 3193/3607 functions decompiled, 88.5 %). Remaining asm cited as mf:asm/<file>:<symbol> covers
      file select, pause/status screens, nav-conversation panel, cutscene handler, intro stages and SRAM save code.
  - kind: rom_header
    ref: local/re/roms.json id=metroid-fusion (header title METROID4USA, maker 01, version 0, 8 MiB)
  - kind: captures
    ref: local/captures/metroid-fusion/ run 20261015T234415-8f46cf (harness 0.1.0, libmgba 0.10.5 HLE BIOS, source commit
      d431b81 dirty tree, Apple M5 Pro, script default.json); phases attract 3600 frames (no input) and frontend 5400 frames
      (START/A pulses); front end only, no in-game rooms
  - kind: extraction_run
    ref: claude-opus-5-5, brief v1, 2026-10-16T03:56:00Z-2026-10-16T04:14:20Z (~18 min wall, main agent plus two parallel
      research forks), ~95 decomp files opened or grepped (~55 read in depth) plus captures summary/keyframes and 6 repo
      inputs
conventions:
  units_convention: Same engine units as Zero Mission (mf:include/types.h, macros.h). Positions are u16 sub-pixels, 1 px
    = 4 sub-px, 1 block = 16 px = 64 sub-px. Samus velocities are s16 in 1/8 sub-px per frame (SUB_PIXEL_TO_VELOCITY = x8),
    so 1 velocity unit = 1/32 px/frame; SamusUpdateVelocityPosition adds velocity/8 sub-px per frame after clamping. Ladder/elevator
    poses write raw sub-px per frame. Sprite movement tables are in sub-px per frame. Timers are frames at 60 fps (CONVERT_SECONDS)
    except the in-game and escape timers, which count 64 ticks per displayed second. Params are converted to px and frames
    with native values kept. Screen is 240x160 px.
  zero_mission_comparison: Components marked variant_of metroid-zero-mission/<id> share code shape with the Zero Mission
    decomposition; their relation note lists the constants that differ.
  event_counter: Story state is a single byte (world.event_counter) indexing 110 ordered events; '<=' or '>=' comparisons
    on it gate rooms, doors, music and sprites.
components:
- id: game_mode_flow
  facet: frontend
  label: Top-level game-mode state machine and soft reset
  summary: AgbMain dispatches over 15 modes (TITLE, IN_GAME, SOFT_RESET, MAP_SCREEN, CUTSCENE, SA_X_CLOSE_UP, ERASE_SRAM_MENU,
    FILE_SELECT_OR_INTRO, GAME_OVER, ENDING, DIED_FROM_SR388_COLLISION, CREDITS, DEMO, plus unknown/debug). MAP_SCREEN is
    both the pause screen and the host for navigation conversations; the SA-X close-up is its own mode entered from in-game.
    Game over offers continue-from-save or soft reset. A+B+Select+Start soft-resets unless a save is in progress.
  instantiates:
  - concept: frontend.flow.mode_state_machine
  - concept: frontend.soft_reset.button_combo
  reads:
  - input.buttons.held
  - frontend.mode
  - frontend.pause_flag
  - cutscene.current
  - save.write_in_progress
  writes:
  - frontend.mode
  - frontend.submode
  params:
    game_modes:
      value: 15
      evidence:
      - kind: decomp_source
        ref: mf:include/globals.h:GameMode
        confidence: 0.95
    soft_reset_keys:
      value: A+B+Select+Start
      evidence:
      - kind: decomp_source
        ref: mf:include/softreset.h:SOFTRESET_KEYS
        confidence: 0.95
  invariants:
  - Soft reset is ignored while gDisableSoftReset is set (SRAM writes).
  - In-game exits to the SA-X close-up when the pause flag is 6, to ending when the cutscene id has bit 0x80, and to the
    SR388-collision death when it is 0x81.
  relations:
  - type: variant_of
    target: metroid-zero-mission/game_mode_flow
    note: adds SA_X_CLOSE_UP, DIED_FROM_SR388_COLLISION and nav-conversation use of MAP_SCREEN; no galleries
  evidence:
  - kind: decomp_source
    ref: mf:src/agbmain.c:AgbMain
    confidence: 0.95
  - kind: decomp_source
    ref: mf:src/softreset.c:SoftresetCheck
    confidence: 0.95
- id: intro_sequence
  facet: frontend
  label: Two-stage pre-title space intro
  summary: Before the title, IntroHandler runs two stages - a space view of the station and Samus's ship crashing through
    an asteroid field ("WARNING / TIME / DISTANCE" HUD). A or Start skips with a 20-frame sound/music fade. Both stage routines
    are still assembly.
  instantiates:
  - concept: frontend.intro.skippable_story_intro
  reads:
  - input.buttons.pressed
  writes:
  - intro.stage
  - frontend.mode
  params:
    stage_count:
      value: 2
      evidence:
      - kind: decomp_source
        ref: mf:src/new_file_intro.c:IntroHandler
        confidence: 0.85
    skip_fade_frames:
      value: 20
      unit: frames
      evidence:
      - kind: decomp_source
        ref: mf:src/new_file_intro.c:IntroHandler
        confidence: 0.85
  relations:
  - type: variant_of
    target: metroid-zero-mission/intro_sequence
    note: 2 stages vs 8; skip fade 20 vs 10 frames
  - type: part_of
    target: game_mode_flow
  evidence:
  - kind: decomp_source
    ref: mf:src/new_file_intro.c:IntroHandler
    confidence: 0.9
  - kind: decomp_source
    ref: mf:asm/disasm_0x0808F5C4.s:IntroSpaceViewInit
    confidence: 0.6
    note: stage code still asm
  - kind: capture_frame
    ref: capture:attract:keyframes f001406 (station in space), f002498 (asteroid crash HUD)
    confidence: 0.8
- id: new_file_prologue
  facet: frontend
  label: New-file prologue with paged story text and X-infection mosaic
  summary: 'Starting a new file runs an 11-stage prologue: SR388 preview, researchers and a Hornoad turning into an X (mosaic
    dissolve), the ship flight, Samus fainting and drifting into asteroids, being found and cured with the Metroid vaccine,
    then arriving at the BSL. Text pages advance with a prompt arrow. The final fade writes the file over four frames; completed
    files skip it (introPlayed).'
  instantiates:
  - concept: frontend.intro.new_game_prologue
  - concept: narrative_delivery.text.story_text_crawl
    weight: 0.6
  reads:
  - input.buttons.pressed
  - save.game_completion.intro_played
  writes:
  - save.files[*]
  - frontend.mode
  params:
    stages:
      value: 11
      evidence:
      - kind: decomp_source
        ref: mf:include/constants/new_file_intro.h
        confidence: 0.9
    initial_delay:
      value: 100
      unit: frames
      evidence:
      - kind: decomp_source
        ref: mf:src/new_file_intro.c:NewFileIntroHandler
        confidence: 0.85
  relations:
  - type: part_of
    target: game_mode_flow
  - type: requires
    target: sprite_mosaic_dissolve
    note: Hornoad-to-X transformation
  evidence:
  - kind: decomp_source
    ref: mf:src/new_file_intro.c:NewFileIntroHandler
    confidence: 0.95
  - kind: decomp_source
    ref: mf:src/new_file_intro.c:NewFileIntroProcessHornoad
    confidence: 0.9
  - kind: capture_frame
    ref: capture:frontend:keyframes f003036-f005234 (prologue text pages)
    confidence: 0.85
  - kind: capture_telemetry
    ref: capture:frontend:frames 2202-2370 MOSAIC 0x0110->0x0ff0->0x0110 in 2-frame steps
    confidence: 0.85
- id: title_and_attract_demo
  facet: frontend
  label: Title screen with 20 s idle attract demos replaying recorded input
  summary: The logo fades in by stepping BLDALPHA EVA every 5 frames; PRESS START and the copyright are semi-transparent
    sprites whose palette cycles every 12 frames. After 1200 idle frames a demo starts. Twelve demos (sector runs plus wall-jump,
    shinespark, ladder, power-bomb, Arachnus and Screw Attack showcases) play in two halves of six chosen by frame-counter
    parity; each loads a RAM snapshot and run-length input (256 slots), and any press ends it.
  instantiates:
  - concept: frontend.title.attract_demo
  - concept: frontend.attract.input_playback_demo
  reads:
  - input.buttons.held
  - title.idle_timer
  - rng.frame_counters
  writes:
  - input.buttons.held
  - equipment.*
  - equipment.security_level
  params:
    demo_idle_timeout:
      value: 1200
      unit: frames (20 s)
      evidence:
      - kind: decomp_source
        ref: mf:src/menus/title_screen.c:TitleScreenSpawningIn
        confidence: 0.9
    demo_count:
      value: 12
      evidence:
      - kind: decomp_source
        ref: mf:include/constants/demo.h
        confidence: 0.95
    demo_input_slots:
      value: 256
      unit: run-length entries
      evidence:
      - kind: decomp_source
        ref: mf:src/demo_input.c
        confidence: 0.85
  invariants:
  - Any physical input during playback ends the demo.
  relations:
  - type: variant_of
    target: metroid-zero-mission/title_and_attract_demo
    note: idle 1200 vs 1020 frames; 12 demos chained in halves
  - type: part_of
    target: game_mode_flow
  evidence:
  - kind: decomp_source
    ref: mf:src/menus/title_screen.c:TitleScreenSpawningIn
    confidence: 0.95
  - kind: decomp_source
    ref: mf:src/demo.c:DemoInit
    confidence: 0.95
  - kind: decomp_source
    ref: mf:src/demo.c (sDemoRam security level / equipment restore)
    confidence: 0.85
  - kind: capture_frame
    ref: capture:attract:keyframes f3191-3544 (title)
    confidence: 0.8
    note: capture ended before the 1200-frame demo timeout
- id: file_select_and_extras
  facet: frontend
  label: Three-slot file select with sound option, no difficulty select
  summary: File select shows slots A/B/C with SOUND and EXIT options; an erase-SRAM menu exists as its own game mode. There
    is no difficulty choice in C code; completion data holds only completedGame and introPlayed. A completed file skips
    some late event hatch locks.
  instantiates:
  - concept: frontend.menu.file_select_slots
  reads:
  - save.files[*].exists
  - save.game_completion
  writes:
