conventions:
  evidence_scope: Partial GPT extraction of directly inspected source and capture evidence; no local-model recall.
    The source contains many anonymous fields and assembly bodies. Missing system coverage is explicit in open_questions.
    Reusable strategy/skill implications are labeled inference and do not assert human performance.
  time: Native main-loop updates are reported as updates/frames, without converting them to exact seconds. Source
    comments often use 60 updates/s; capture reports ~59.73 emulated frames/s.
  coordinates: Only cited camera/entity helpers establish 16 fractional bits for positions; no global claim that
    every internal quantity uses this convention. Screen dimensions are 240x160.
  resources: Health/magic use integer points. Inventory array capacities are not catalogues of obtainable entities.
    Soul group-adder limits are not automatically invariants of unchecked raw setters.
components:
- id: mode_dispatch
  facet: frontend
  label: Discrete game modes with reset substate on transition
  summary: GameModeUpdate dispatches logo, title, file menu, in-game, game-over, credits, intro, boss rush, soul
    trade and sound test handlers. Returning -1 preserves the mode, -2 increments it, and another value selects
    that mode; changing mode clears both update-stage fields. Debug handlers exist, but their presence does not
    establish normal player access.
  instantiates:
  - concept: frontend.flow.mode_state_machine
  evidence:
  - kind: decomp_source
    ref: cvaos:src/main.c:GameModeUpdate
    confidence: 0.9
  - kind: decomp_source
    ref: cvaos:include/constants/main.h:GameMode
    confidence: 0.9
  reads:
  - frontend.mode:int
  - frontend.handler_result:int
  writes:
  - frontend.mode:int
  - frontend.stage:int
  params:
    stay_result:
      value: -1
      unit: enum
      evidence:
      - kind: decomp_source
        ref: cvaos:include/constants/main.h:GAME_MODE_SAME_MODE
        confidence: 0.9
      native_value: -1
      native_unit: enum
    next_result:
      value: -2
      unit: enum
      evidence:
      - kind: decomp_source
        ref: cvaos:include/constants/main.h:GAME_MODE_NEXT_MODE
        confidence: 0.9
      native_value: -2
      native_unit: enum
  invariants:
  - Every observed mode transition clears gameModeUpdateStage and unk_12.
- id: soft_reset
  facet: frontend
  label: Reset chord with one-update suppression
  summary: The reset check accepts the full A+B+Select+Start held chord only when some new input exists and the
    newly pressed set is not itself the entire chord. An anonymous guard bit cancels one check and clears itself.
    The main loop then invokes BIOS SoftReset with RESET_ALL; a generic hold-only reset detector would differ from
    this code.
  instantiates:
  - concept: frontend.soft_reset.button_combo
  evidence:
  - kind: decomp_source
    ref: cvaos:src/main.c:SoftResetCheck
    confidence: 0.9
  - kind: decomp_source
    ref: cvaos:src/main.c:AgbMain
    confidence: 0.9
  reads:
  - input.held:u16
  - input.new:u16
  - runtime.reset_suppression:bool
  writes:
  - runtime.reset_suppression:bool
  - runtime.boot_state
  params:
    buttons:
      value: A+B+Select+Start
      unit: buttons
      evidence:
      - kind: decomp_source
        ref: cvaos:src/main.c:SoftResetCheck
        confidence: 0.9
  invariants:
  - Pressing the entire chord simultaneously is rejected by this check.
  relations:
  - type: part_of
    target: mode_dispatch
- id: input_repeat_and_override
  facet: ui_hud
  label: Edge, held and repeated input with priority override
  summary: UpdateInput forms newly pressed bits from current and previous held inputs; menu repeat waits 32 updates
    and repeats every 6. Gameplay has separate held/new fields that a caller can override. Despite its comment claiming
    larger priorities win, SetPlayerInput actually accepts a smaller numeric priority or an empty priority slot;
    extraction follows the branch.
  instantiates:
  - concept: ui_hud.input.priority_arbitrated_override
  evidence:
  - kind: decomp_source
    ref: cvaos:src/main.c:UpdateInput
    confidence: 0.9
  - kind: decomp_source
    ref: cvaos:src/code_080009A0.c:SetPlayerInput
    confidence: 0.9
  reads:
  - input.hardware:u16
  - input.previous:u16
  - input.override_priority:u6
  writes:
  - input.new:u16
  - input.held:u16
  - input.player_new:u16
  - input.player_held:u16
  - input.repeat_timer:u10
  params:
    initial_repeat_delay:
      value: 32
      unit: updates
      evidence:
      - kind: decomp_source
        ref: cvaos:src/main.c:UpdateInput
        confidence: 0.9
      native_value: 32
      native_unit: updates
    repeat_interval:
      value: 6
      unit: updates
      evidence:
      - kind: decomp_source
        ref: cvaos:src/main.c:UpdateInput
        confidence: 0.9
      native_value: 6
      native_unit: updates
  invariants:
  - A smaller numeric override priority replaces a larger existing priority.
  - Override priority is cleared on the next UpdateInput that observes it.
  relations:
  - type: modulates
    target: red_soul_cast
- id: publisher_logo
  facet: frontend
  label: Skippable timed publisher logo
  summary: The logo handler initializes BG0, fades from brightness increase, holds for 240 updates and accepts Start/A
    to proceed early. It fades back out before returning the title mode. The same stage processes a Konami-code
    state, but its unlock consequences are not established here.
  instantiates:
