proposed_concepts:
- id: ui_hud.input.priority_arbitrated_override
  label: Edge, held and repeated input with priority override
  definition: Separates physical input from effective gameplay input, allowing prioritized systems to replace the
    action bitfield.
- id: frontend.title.idle_story_replay
  label: Animated title idles into story intro
  definition: An idle title screen returns to an authored story presentation, without asserting gameplay-demo input
    playback.
- id: frontend.save.verified_sram_record
  label: Verified SRAM records and slot lock bits
  definition: Persists structured records to SRAM using write verification and explicit per-slot operation markers.
- id: frontend.game_over.return_to_boot
  label: Game-over presentation returns to boot logo
  definition: Defeat presentation returns to the boot/title flow instead of directly restoring gameplay.
- id: progression.mode.normalized_challenge_loadout
  label: Boss-rush normalized start configuration
  definition: A separate challenge mode prepares an authored character/resource loadout before entering a fixed
    challenge script.
- id: mechanics.loadout.category_specific_slots
  label: Independent weapon, armor, accessory and soul equipment slots
  definition: Equipment is selected independently in separate category slots so different action and passive modifiers
    can coexist.
- id: economy.inventory.banked_collectible_counts
  label: Packed soul inventories with two count banks
  definition: Collectible quantities have separately stored banks and a combined query, with explicit per-bank limits.
- id: progression.collection.cumulative_counter
  label: Cumulative acquisition counter differs from current inventory
  definition: Tracks cumulative acquisition events separately from the quantity currently held.
- id: mechanics.loadout.ownership_checked_equipment
  label: Remove equipped soul when its total becomes zero
  definition: Equipment availability is checked against ownership, and losing the last owned copy unequips the corresponding
    action.
- id: mechanics.ability.resource_costed_entity_cast
  label: Red-soul cast converts MP to bounded active entities
  definition: An action consumes a resource only after successful entity allocation, subject to active-count and
    effect-type constraints.
- id: mechanics.combat.defense_subtracted_minimum_damage
  label: Defense subtraction, resistance and minimum incoming damage
  definition: Incoming damage is derived by subtracting defense, applying conditional resistance/status scaling,
    and clamping to a positive minimum.
- id: mechanics.combat.equipment_random_damage_negation
  label: Armor-specific random damage negation
  definition: A particular equipment choice adds a random predicate that cancels incoming damage before resource
    loss.
- id: mechanics.character.character_specific_initial_stats
  label: Different base-stat configurations for two character branches
  definition: Different playable-character branches initialize distinct health, magic and combat-stat vectors.
- id: progression.start.new_character_bootstrap
  label: Empty character state initializes starting room and equipment
  definition: An empty persistent character record triggers authored equipment, statistics and starting-location
    initialization.
- id: progression.completion.exploration_bitmap_percentage
  label: Exploration percentage from discovered map-cell bits
  definition: World exploration is recorded as discovered cells and converted to a percentage against an authored
    total.
- id: progression.structure.authored_room_transition_lookup
  label: Room graph encoded in map-cell area and room fields
  definition: World navigation decodes room identifiers from map cells and recognizes authored transition-room entries.
- id: movement_physics.coordinates.fixed_point_camera_relative
  label: Entity and camera fixed-point coordinate conversion
  definition: Entity screen coordinates and camera offsets are combined in a shared fixed-point representation to
    query world space.
- id: mechanics.entity.bounded_callback_pool
  label: Bounded callback-driven entity allocation
  definition: Gameplay objects occupy a fixed-size pool with explicit allocation failure and separate update/draw
    callbacks.
- id: mechanics.random.shifted_recurrence_streams
  label: Shifted recurrence with alternate RNG stream
  definition: Random queries can select independently stored recurrence streams whose state transitions differ by
    an input bit shift.
- id: rendering.tilemap.queued_wrapping_updates
  label: Deferred wrapping tilemap writes
  definition: Tilemap changes are buffered then copied into background maps with explicit wrapping at configured
    map dimensions.
- id: ui_hud.text.queued_tile_font
  label: Tile-font strings and fixed-width numbers
  definition: Interface strings and numbers are encoded as palette-indexed background tiles and queued for hardware
    transfer.
- id: rendering.transfer.queued_dma_upload
  label: Direct and indirect queued DMA3 uploads
  definition: Graphics uploads are represented by bounded direct-data or source-pointer DMA requests and drained
    at the frame boundary.
- id: rendering.background.affine_title_compositing
  label: Mode-1 affine title with blending and object window
  definition: A frontend title composes affine backgrounds, sprite/window masks and hardware blending as an animated
    presentation.
- id: setting.style.gothic_pixel_architecture
  label: Stone courtyard and supernatural title motifs
  definition: A visual setting vocabulary combining small pixel characters, stone architecture, monumental statuary,
    cool skies and supernatural celestial motifs.
- id: audio.control.priority_and_target_volume
  label: Priority arbitration and stateful song-volume ramps
  definition: Audio requests arbitrate by priority while per-player state ramps volume toward explicit targets.
open_questions:
- 'Extract the actual player movement state machine from remaining anonymous C/ASM: ground speed, acceleration,
  gravity, jump cut, coyote/buffer behavior, slide/backdash, collision edge cases and animation cancel windows.
  Fixed-point coordinate helpers are not a recovered physics model.'
- Enemy AI state/attack graphs, bosses, damage-to-enemy formulas, weakness/resistance catalogue, hitboxes, weapon
  timings, and exact drop/soul acquisition probabilities remain unmined; no enemy skill/strategy claims are supplied
  from recall.
- Trace blue/guardian, yellow/passive and ability soul implementations, equip validation and activation/drain/refresh
  rules; the persistent slots alone do not establish their complete semantics.
- Reconcile SoulInventory_GetSoulTotal type-3 double-counting and two-bank role semantics with assembly/runtime
  evidence; direct low-level setters bypass count clamps. Do not assume a conservation rule for bank transfer when
  a destination is full.
- Extract actual gates and route prerequisites, authored room topology, teleport/save rooms, endings and scenario
  flags. A room lookup and map score are insufficient for the progression graph.
- Complete resource-flow graphs for gold, shops, consumables, MP regeneration and on-hit conversions; anonymous
  callees in the incoming-damage handler cannot be assigned item/soul names yet.
- Capture did not establish interactive control or complete gameplay; many frames labeled gameplay by Qwen/d1 are
  intro/title scenes. Attract frame1052 is title/eclipse despite d1 p_gameplay=0.679178699175393; frontend866 is
  mosaic transition despite p=.6513548646660542. Calibrate labels with temporal/control evidence before mining player
  skills.
- 'Inspect actual asset catalogues: sprite/animation boundaries, palettes, tilesets, music and sound samples with
  ROM offsets and dependencies; current style cues describe four viewed keyframes only.'
- Read dialogue and event scripts for plot/factions/setting constraints and game-specific narrative conditions.
  No plot recollection was used here.
- Validate source-derived rules against the pinned USA ROM via executable probes; decomp matching is claimed upstream
  and hash-identical ROM identity is checked via manifest, but no clean build or symbol-to-ROM trace was run in
  this extraction.
- Extraction start/queue/token cost were not instrumented. Only completion timestamp and first clock observation
  are available; no claim of measured GPT-vs-Claude speedup.
