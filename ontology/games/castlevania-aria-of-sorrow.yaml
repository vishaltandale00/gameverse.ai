  - input.repeated:u16
  - frontend.idle_timer:int
  writes:
  - frontend.stage:int
  - frontend.next_mode:int
  - gpu.affine_bg2
  params:
    idle_duration:
      value: 600
      unit: updates
      evidence:
      - kind: decomp_source
        ref: cvaos:src/code_08002454.c:GameModeTitleScreenUpdate
        confidence: 0.9
      native_value: 600
      native_unit: updates
  invariants:
