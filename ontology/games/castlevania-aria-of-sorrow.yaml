    ref: https://github.com/testyourmine/cvaos @ bc23d849d578c35ae12a5cec4e66549c3021a5be; README and cvaos_us.sha1
      match local USA ROM. WIP matching decomp; no baseline build performed. License file read (MIT); ROM/data reuse
      rights not inferred.
  - kind: captures
    ref: local/captures/castlevania-aria-of-sorrow run 20261015T234415-8f46cf; source commit d431b8183f1001722d7bc9a326da28088930c344
      dirty; harness 0.1.0, libmgba 0.10.5 HLE BIOS; 3600 idle + 5400 default-input frontend frames, 4.254 s capture
