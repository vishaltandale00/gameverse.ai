- id: soul_equipment_validity
  facet: mechanics
  label: Remove equipped soul when its total becomes zero
  summary: sub_08032D58 checks the total for a soul type/index and clears its equipped byte if none remain. Inventory
    indices are zero based while equipped values are compared with index+1, leaving zero as no equipped soul. This
    is a concrete inventory-to-action availability dependency.
  instantiates:
  - concept: mechanics.loadout.ownership_checked_equipment
  evidence:
  - kind: decomp_source
    ref: cvaos:src/code_08032444.c:sub_08032D58
    confidence: 0.9
