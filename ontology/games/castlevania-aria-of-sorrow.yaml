  - Two-bank semantics are not assumed for ability souls.
  relations:
  - type: modulates
    target: soul_equipment_validity
  - type: modulates
    target: soul_completion
- id: soul_collection_counter
  facet: progression
  label: Cumulative acquisition counter differs from current inventory
  summary: SoulInventory_AddAmountToFirstGroupTotal increases a lifetime counter on positive acquisition and caps
    it at 999, even when the local count clamps at 9. Negative additions do not decrease this counter. The distinct
    AddAmountToSoulTotal helper calls the generic group adder and does not itself update this counter, so a call-site
    audit is required before assuming all acquisitions are counted identically.
  instantiates:
  - concept: progression.collection.cumulative_counter
  evidence:
  - kind: decomp_source
    ref: cvaos:src/code_08032444.c:SoulInventory_AddAmountToFirstGroupTotal
    confidence: 0.9
