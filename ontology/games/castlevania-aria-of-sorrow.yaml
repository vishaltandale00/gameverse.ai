- id: title_idle_intro
  facet: frontend
  label: Animated title idles into story intro
  summary: The title uses mode 1, affine BG2, object window and staged alpha/brightness animation. In its interactive
    state it resets a 600-update idle countdown on Up/Down repeat; expiry sets a flag that directs the exit to GAME_MODE_INTRO_CUTSCENE.
    Start/A can skip animation stages 2 through 7, so this is an intro replay path rather than evidence of a recorded
    gameplay demo.
  instantiates:
  - concept: frontend.title.idle_story_replay
  evidence:
  - kind: decomp_source
    ref: cvaos:src/code_08002454.c:GameModeTitleScreenUpdate
    confidence: 0.9
  reads:
