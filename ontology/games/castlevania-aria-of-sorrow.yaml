  summary: The completion routine counts distinct nonzero totals across 55 red, 24 blue and 35 yellow indices and
    divides count*1000 by the combined 114. Duplicate quantities do not increase this score; ability type 3 is excluded
    from its loops. The raw result is tenths of a percent and not a record of player combat skill.
  instantiates:
