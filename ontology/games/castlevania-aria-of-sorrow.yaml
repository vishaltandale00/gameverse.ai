- id: sram_records
  facet: frontend
  label: Verified SRAM records and slot lock bits
  summary: The SRAM initializer tests a 16-byte game signature and clears storage in 4096-byte chunks when initializing
    it. Save-slot writes have a 0x47C-byte stride and serialize character data, metadata and map/progress blocks.
    Writes lock then unlock the slot and verify each block, but this routine unlocks even after a reported write
    error; a slot lock is not proof of atomic durability.
  instantiates:
  - concept: frontend.save.verified_sram_record
  evidence:
  - kind: decomp_source
    ref: cvaos:src/code_08001004.c:SramInitialize
    confidence: 0.9
  - kind: decomp_source
    ref: cvaos:src/code_08001004.c:SramLockSaveSlot
    confidence: 0.9
  - kind: decomp_source
    ref: cvaos:src/code_08012744.c:SaveData_SaveSlotToSram
    confidence: 0.9
  - kind: decomp_source
    ref: cvaos:src/code_08012744.c:SaveData_LoadSlotFromSram
    confidence: 0.9
  reads:
  - save.character_record
  - save.map_progress
  - save.slot:int
  writes:
  - sram.bytes:u8[]
  - sram.slot_lock_bits:u8
  params:
    record_stride:
      value: 1148
      unit: bytes
      evidence:
      - kind: decomp_source
        ref: cvaos:src/code_08012744.c:SaveData_SaveSlotToSram
        confidence: 0.9
      native_value: 1148
      native_unit: bytes
    character_block:
      value: 400
      unit: bytes
      evidence:
      - kind: decomp_source
        ref: cvaos:src/code_08012744.c:SaveData_SaveSlotToSram
        confidence: 0.9
      native_value: 400
      native_unit: bytes
    metadata_block:
      value: 32
      unit: bytes
      evidence:
      - kind: decomp_source
        ref: cvaos:src/code_08012744.c:SaveData_SaveSlotToSram
        confidence: 0.9
      native_value: 32
      native_unit: bytes
    progress_block:
      value: 716
      unit: bytes
      evidence:
      - kind: decomp_source
        ref: cvaos:src/code_08012744.c:SaveData_SaveSlotToSram
        confidence: 0.9
      native_value: 716
      native_unit: bytes
  invariants:
  - Load checks signature and slot-unlocked status before reading record blocks.
  - No checksum or redundant record copy was established in the opened writer.
  relations:
  - type: part_of
    target: mode_dispatch
- id: game_over_return
  facet: frontend
  label: Game-over presentation returns to boot logo
  summary: GameModeGameOverUpdate builds a localized game-over presentation, runs fades and waits in stage 3 for
    any new input. After its exit transition it returns GAME_MODE_KONAMI_LOGO. The inspected handler does not directly
    reload the last save or offer a verified continue selection.
