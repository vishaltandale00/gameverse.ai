      code_08033CAC.c, code_08035930.c, code_080D73B8.c; include/structs/ewram.h and main.h, include/constants/main.h,
      macros.h; first function asm/code/code_08014548.s; README, database.json, LICENSE, cvaos_us.sha1; capture
