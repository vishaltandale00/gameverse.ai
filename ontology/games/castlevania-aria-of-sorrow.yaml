- id: soul_inventory_banks
  facet: economy
  label: Packed soul inventories with two count banks
  summary: Red, blue and yellow soul quantities are stored in two banks, with two 4-bit counts per byte. The group-add
    helper clamps a selected count to 0..9; the aggregate getter sums both banks. Ability souls use a shared array
    rather than independent bank pointers, so the aggregate helper appears to add that array twice for type 3; no
    gameplay conclusion is drawn from that unresolved behavior.
  instantiates:
  - concept: economy.inventory.banked_collectible_counts
  evidence:
  - kind: decomp_source
    ref: cvaos:src/code_08032444.c:SoulInventory_AddAmountToGroupTotal
    confidence: 0.9
  - kind: decomp_source
    ref: cvaos:src/code_08032444.c:SoulInventory_GetSoulTotal
    confidence: 0.9
  - kind: decomp_source
    ref: cvaos:src/code_08032444.c:SoulInventory_GetGroupSoulTotal
    confidence: 0.9
  - kind: decomp_source
    ref: cvaos:include/structs/ewram.h:EwramData_unk1325C
    confidence: 0.9
  reads:
  - inventory.souls.bank:u4[][]
  - soul.type:int
  - soul.index:int
  - resource.delta:int
  writes:
  - inventory.souls.bank:u4[][]
  params:
    group_min:
      value: 0
      unit: souls
      evidence:
      - kind: decomp_source
        ref: cvaos:src/code_08032444.c:SoulInventory_AddAmountToGroupTotal
        confidence: 0.9
      native_value: 0
      native_unit: souls
    group_max:
