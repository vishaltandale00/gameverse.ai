schema_version: 0
id: metroid-zero-mission
game:
  title: 'Metroid: Zero Mission'
  platform: gba
  game_code: BMXE
  rom_sha1: 5de8536afe1f0078ee6fe1089f890e8c7aa0a6e8
  year: 2004
  developer: Nintendo R&D1
  derived_genres:
  - metroidvania
  - action_platformer
  - action_adventure
  evidence_basis:
  - decomp_source
  - llm_knowledge
  - derived
  sources:
  - kind: decomp
    ref: https://github.com/metroidret/mzm @ 9caaefc0ee570f3399d86acf140fdeada9692836 (MIT; local/decomps/mzm; matches
      USA ROM per repo)
  - kind: rom_header
    ref: local/re/roms.json id=metroid-zero-mission (header title ZEROMISSIONE, maker 01, version 0, 8 MiB)
  - kind: captures
    ref: local/captures/metroid-zero-mission/ absent at extraction time; no capture_telemetry evidence used
  - kind: extraction_run
    ref: claude-opus-5-5, 2026-10-16T03:33:23Z-2026-10-16T03:54:00Z (~21 min wall), ~75 decomp files opened or grepped
      (~45 read in depth) plus 5 repo inputs
  - kind: extraction_review
    ref: Codex/GPT source audit 2026-10-16; exact model revision unavailable. Reviewed SamusApplyXAcceleration and SamusUpdateVelocityPosition, constants/types/macros; positive-velocity apex recurrences rechecked. See ontology/research/gpt-source-pilot-2026-10-16.json. No new gameplay or collision validation.
conventions:
  units_convention: 'All movement numbers come from include/types.h and include/constants/samus.h. Positions are
    u16 in sub-pixels: 1 px = 4 sub-px (SUB_PIXEL_RATIO), 1 block (metatile) = 16 px = 64 sub-px. Velocities are
    s16 in 1/8 sub-px per frame, i.e. 1 velocity unit = 1/32 px/frame; SamusUpdateVelocityPosition adds (velocity
    >> 3) sub-px to position each frame. Gravity/acceleration are velocity units per frame. Timers are frames at
    60 fps (CONVERT_SECONDS), except the in-game timer which counts 64 ticks per displayed second (SIMULATED_FPS).
    Params below are converted to px and frames; the native value is in each evidence note. Screen is 240x160 px.'
components:
- id: game_mode_flow
  facet: frontend
  label: Top-level game-mode state machine and soft reset
  summary: 'agbmain dispatches on gMainGameMode each frame: SOFT_RESET -> INTRO -> TITLE -> FILE_SELECT -> INGAME,
    with side modes MAP_SCREEN (pause), GAMEOVER, CUTSCENE, TOURIAN_ESCAPE, CHOZODIA_ESCAPE, CREDITS, DEMO and two
    galleries. Holding A+B+Start+Select triggers a soft reset unless gDisableSoftReset is set (it is set during
    SRAM writes). The soft-reset handler is a BLDY brightness fade-in (EU builds insert a language select). The
    Nintendo logo is shown by the GBA BIOS, not game code.'
  instantiates:
  - concept: frontend.flow.mode_state_machine
  - concept: frontend.soft_reset.button_combo
  reads:
  - input.buttons.held
  - frontend.mode
  - frontend.submode
  - save.write_in_progress
  writes:
  - frontend.mode
  - frontend.submode
  params:
    soft_reset_keys:
      value: A+B+Start+Select
      evidence:
      - kind: decomp_source
        ref: mzm:src/soft_reset_input.c:SoftResetCheck (SOFT_RESET_KEYS)
        confidence: 0.95
    soft_reset_fade_step:
      value: 4
      unit: BLDY levels/frame (16 = full)
      evidence:
      - kind: decomp_source
        ref: mzm:src/soft_reset.c:SoftResetHandler
        confidence: 0.9
  invariants:
  - Soft reset is ignored while a save is being written (gDisableSoftReset).
  - Title returns 1 -> file select, 2 -> demo, otherwise back to intro.
  relations:
  - type: part_of
    target: save_and_continue
    note: save writer toggles the soft-reset guard
  evidence:
  - kind: decomp_source
    ref: mzm:src/agbmain.c:AgbMain (switch gMainGameMode)
    confidence: 0.95
  - kind: decomp_source
    ref: mzm:include/constants/game_state.h:GameMode
    confidence: 0.95
  - kind: decomp_source
    ref: mzm:src/soft_reset.c:SoftResetInit
    confidence: 0.9
- id: intro_sequence
  facet: frontend
  label: Skippable story intro before title
  summary: IntroHandler fades in and runs eight stage functions in order (emergency order text, ship flying toward
    camera, Samus in her ship, exterminate order, view of Zebes, defeat, Mother Brain, TV-static fuzz), then hands
    off to the title. A, B or Start skips with a 10-frame sound/music fade.
  instantiates:
  - concept: frontend.intro.skippable_story_intro
  - concept: narrative_delivery.text.story_text_crawl
    weight: 0.5
  reads:
  - input.buttons.pressed
  - intro.stage
  writes:
  - intro.stage
  - frontend.mode
  params:
    stage_count:
      value: 8
      evidence:
      - kind: decomp_source
        ref: mzm:src/intro.c:sIntroStageFunctionsPointer
        confidence: 0.95
    skip_fade_frames:
      value: 10
      unit: frames
      evidence:
      - kind: decomp_source
        ref: mzm:src/intro.c:IntroHandler (FadeMusic(CONVERT_SECONDS(1/6)))
        confidence: 0.9
  relations:
  - type: part_of
    target: game_mode_flow
  evidence:
  - kind: decomp_source
    ref: mzm:src/intro.c:IntroHandler
    confidence: 0.95
  - kind: decomp_source
    ref: mzm:src/intro.c:IntroFuzz
    confidence: 0.8
    note: fuzz/static stage presumed TV-noise look from name and VBlank variant; not visually verified
- id: title_and_attract_demo
  facet: frontend
  label: Title screen with idle-timed attract demo using recorded input
  summary: The title fades in, plays the title music, shows a comet fly-by then fades the logo in via BLDALPHA.
    After 17 s idle it starts a demo; A/Start goes to file select. DemoStart picks the first or middle demo from
    a frame-counter parity, loads a RAM snapshot (equipment, events) for that demo, copies run-length input (button
    mask + duration) from ROM, resets both frame counters (so enemy RNG is reproducible) and feeds the inputs through
    the real game loop. Any real button press ends the demo.
  instantiates:
  - concept: frontend.title.attract_demo
  - concept: frontend.attract.input_playback_demo
  reads:
  - input.buttons.held
  - title.idle_timer
  - rng.frame_counters
  writes:
  - input.buttons.held
  - input.buttons.pressed
  - equipment.*
  - world.flags.event.*
  - rng.frame_counters
  params:
    demo_idle_timeout:
      value: 1020
      unit: frames (17 s)
      evidence:
      - kind: decomp_source
        ref: mzm:src/menus/title_screen.c:TitleScreenCheckPlayEffects (demoTimer > 60*17)
        confidence: 0.95
    title_palette_anim_start:
      value: 240
      unit: frames
      evidence:
      - kind: decomp_source
        ref: mzm:src/menus/title_screen.c:TitleScreenCheckPlayEffects
        confidence: 0.9
    input_ignore_after_fade:
      value: 30
      unit: frames
      evidence:
      - kind: decomp_source
        ref: mzm:src/menus/title_screen.c:TitleScreenCheckPlayEffects (timer > 30)
        confidence: 0.85
  invariants:
  - 'Demo playback is deterministic: frame counters (the RNG seed source) are zeroed at demo start.'
  - Any physical input during playback forces KEY_START and ends the demo.
  relations:
  - type: part_of
    target: game_mode_flow
  evidence:
  - kind: decomp_source
    ref: mzm:src/menus/title_screen.c:TitleScreenHandler
    confidence: 0.95
  - kind: decomp_source
    ref: mzm:src/menus/title_screen.c:TitleScreenIdle
    confidence: 0.9
  - kind: decomp_source
    ref: mzm:src/demo.c:DemoStart
    confidence: 0.95
  - kind: decomp_source
    ref: mzm:src/demo.c:DemoInit
    confidence: 0.95
  - kind: decomp_source
    ref: mzm:src/demo_input.c:UpdateDemoInput
    confidence: 0.95
  - kind: decomp_source
    ref: mzm:src/demo_input.c:RecordDemo
    confidence: 0.9
    note: debug-only recorder shows the run-length format
- id: file_select_and_extras
  facet: frontend
  label: Three-slot file select with difficulty choice and unlockable extras
  summary: 'File select manages three save slots (start, copy, erase, corrupted-file handling) and a difficulty
    pick for new files (Easy/Normal/Hard; Hard availability gated by unlock flags, see open questions). An options
    sub-menu holds unlockables keyed off completion flags in FileScreenOptionsUnlocked: gallery images (one bit
    per ending), sound test / original NES Metroid, time-attack records (password based) and a Metroid Fusion link
    gallery.'
  instantiates:
  - concept: frontend.menu.file_select_slots
  - concept: frontend.menu.unlockable_extras
  - concept: mechanics.difficulty.selectable_difficulty
    weight: 0.3
  reads:
  - save.files[*].exists
  - save.options_unlocked.*
  writes:
  - game.difficulty
  - save.most_recent_file
  params:
    save_slots:
      value: 3
      evidence:
      - kind: decomp_source
        ref: mzm:include/structs/save_file.h:struct Sram (files[3])
        confidence: 0.95
  relations:
  - type: requires
    target: ranked_ending
    note: gallery bits and Hard mode are set on completion
  - type: part_of
    target: game_mode_flow
  evidence:
  - kind: decomp_source
    ref: mzm:src/menus/file_select.c:OptionsHandler
    confidence: 0.85
  - kind: decomp_source
    ref: mzm:src/menus/file_select.c:OptionsNesMetroidHandler
    confidence: 0.85
  - kind: decomp_source
    ref: mzm:include/structs/game_state.h:struct FileScreenOptionsUnlocked
    confidence: 0.9
  - kind: decomp_source
    ref: mzm:src/time_attack.c:TimeAttackGeneratePassword
    confidence: 0.8
  - kind: llm_knowledge
    ref: Hard mode and extra galleries unlock after a first clear
    confidence: 0.5
- id: save_and_continue
  facet: frontend
  label: Save stations, redundant SRAM slots and game-over continue
  summary: Saving happens at save-platform sprites; SramSaveFile is a multi-frame staged write (arrays, then file
    struct with checksum, then flush, then a duplicate copy into filesCopy) during which soft reset is disabled.
    Save media is 32 KiB SRAM, verified at boot by a write/increment/readback test. On death the game enters GM_GAMEOVER
    whose menu has two options (continue / quit); continuing reloads the last save.
  instantiates:
  - concept: frontend.save.save_station
  - concept: frontend.save.redundant_slot_backup
  - concept: frontend.game_over.continue_from_save
  reads:
  - player.*
  - equipment.*
  - world.flags.event.*
  - map.explored_tiles
  writes:
  - save.files[*]
  - save.files_copy[*]
  params:
    sram_size:
      value: 32768
      unit: bytes
      evidence:
      - kind: decomp_source
        ref: mzm:include/gba/memory.h:SRAM_SIZE
        confidence: 0.9
    save_write_stages:
      value: 5
      unit: stages (one or more frames each)
      evidence:
      - kind: decomp_source
        ref: mzm:src/save_file.c:SramSaveFile
        confidence: 0.9
    game_over_options:
      value: 2
      evidence:
      - kind: decomp_source
        ref: mzm:src/menus/game_over.c:GameOverProcessInput
        confidence: 0.85
  invariants:
  - Every saved file has a backup copy written after the primary flush.
  - Soft reset is blocked until the save completes.
  relations:
  - type: part_of
    target: game_mode_flow
  evidence:
  - kind: decomp_source
    ref: mzm:src/save_file.c:SramSaveFile
    confidence: 0.95
  - kind: decomp_source
    ref: mzm:src/save_file.c:SramWrite_ToEwram
    confidence: 0.85
  - kind: decomp_source
    ref: mzm:src/save_file.c:SramTestFlash
    confidence: 0.85
  - kind: decomp_source
    ref: mzm:src/sprites_ai/save_platform.c:SavePlatformSavePrompt
    confidence: 0.8
  - kind: decomp_source
    ref: mzm:src/menus/game_over.c:GameOverHandler
    confidence: 0.85
- id: bg_layer_stack
  facet: rendering
  label: Mode-0 four-layer tilemap room renderer with OBJ actors
  summary: 'Gameplay uses tiled text backgrounds only (no in-game DCNT_MODE write besides the Tourian-escape cutscene):
    BG0 is an optional foreground/liquid/darkness overlay (512x256 or LZ77-sized), BG1 the main collision-aligned
    layer, BG2 a decorative mid layer (also used as Kraid''s body), BG3 a 256x256-class distant backdrop at low
    priority. Per-room transparency codes re-order BG priorities. Samus, enemies, projectiles and the HUD are OBJ
    sprites; Samus graphics are streamed per frame (body/arm-cannon tile DMA).'
  instantiates:
  - concept: rendering.background.tile_layer_stack
  - concept: rendering.boss.background_layer_boss
    weight: 0.3
  reads:
  - room.bg_props
  - room.transparency_code
  - camera.scroll
  writes:
  - io.bgcnt[0..3]
  - io.dispcnt
  - oam.*
  params:
    gameplay_bg_layers:
      value: 4
      evidence:
      - kind: decomp_source
        ref: mzm:src/transparency.c:TransparencySetRoomEffectsTransparency (bgCnt[0..3])
        confidence: 0.9
    max_sprites:
      value: 24
      unit: active sprite slots
      evidence:
      - kind: decomp_source
        ref: mzm:include/structs/sprite.h:MAX_AMOUNT_OF_SPRITES
        confidence: 0.95
    max_projectiles:
      value: 16
      evidence:
      - kind: decomp_source
        ref: mzm:include/structs/projectile.h:MAX_AMOUNT_OF_PROJECTILES
        confidence: 0.95
  relations:
  - type: part_of
    target: side_view_projection
  evidence:
  - kind: decomp_source
    ref: mzm:src/transparency.c:TransparencySetRoomEffectsTransparency
    confidence: 0.9
  - kind: decomp_source
    ref: mzm:src/samus.c:SamusUpdateGraphicsOam
    confidence: 0.75
    note: function name and SamusPhysics gfx pointers/sizes; per-frame tile streaming inferred
  - kind: decomp_source
    ref: mzm:src/sprites_ai/kraid.c:KraidMoveBg2ToRight
    confidence: 0.85
  - kind: decomp_source
    ref: mzm:src/hud.c:HudUpdateOam
    confidence: 0.9
- id: hblank_raster_effects
  facet: rendering
  label: HBlank-DMA raster effects (heat haze, gradient, power-bomb window)
  summary: 'Rooms select a haze value. Haze routines are copied into RAM and fill a per-scanline buffer that DMA0
    (HBlank-triggered, dest-reload) streams into a register each line: BG3HOFS (heat shimmer), BG2HOFS..BG3 (layered
    shimmer, 8 bytes/line), BG1HOFS..BG3 (12 bytes/line) or PALRAM color 0 (vertical backdrop gradient). The power-bomb
    explosion writes WIN1H per scanline to draw a growing ellipse, with BLDCNT brightness-decrease outside, white
    backdrop and a yellow palette tint inside.'
  instantiates:
  - concept: rendering.raster.hblank_dma_scroll_distortion
  - concept: rendering.raster.hblank_palette_gradient
  - concept: rendering.raster.window_shape_per_scanline
  reads:
  - room.visual_effect
  - power_bomb.semi_minor_axis
  - frame_counter
  writes:
  - io.bg1hofs
  - io.bg2hofs
  - io.bg3hofs
  - palram.backdrop
  - io.win1h
  - io.bldcnt
  - io.bldy
  params:
    haze_modes:
      value: 8
      unit: active haze values (gradient, 4 BG wobble variants, PB expand/retract, plus no-op values)
      evidence:
      - kind: decomp_source
        ref: mzm:include/constants/haze.h:HazeValue
        confidence: 0.9
    pb_darken_bldy:
      value: 12
      unit: BLDY level (of 16)
      evidence:
      - kind: decomp_source
        ref: mzm:src/haze.c:HazeSetupCode (HAZE_VALUE_POWER_BOMB_EXPANDING)
        confidence: 0.9
  relations:
  - type: modulates
    target: bg_layer_stack
  - type: part_of
    target: bombs_and_power_bombs
    note: PB window ellipse is the PB visual
  evidence:
  - kind: decomp_source
    ref: mzm:src/haze.c:HazeSetupCode
    confidence: 0.95
  - kind: decomp_source
    ref: mzm:src/haze.c:HazeTransferAndDeactivate (DMA0 dest reload)
    confidence: 0.9
  - kind: decomp_source
    ref: mzm:src/haze.c:HazeSetBackgroundEffect
    confidence: 0.9
  - kind: decomp_source
    ref: mzm:src/haze.c:Haze_PowerBombExpanding
    confidence: 0.8
- id: blend_and_palette_effects
  facet: rendering
  label: Alpha-blended foreground/liquid layers, dark rooms and palette fades
  summary: BG0 overlays (water, fog, darkness, foreground walls) use BLDALPHA; special clipdata trigger blocks walk
    the blend between 11 preset EVA/EVB pairs so a foreground wall fades out when Samus enters it. Dark rooms gate
    BG0 via DISPCNT. Palette-level effects include monochrome fade to black on death, smooth palette transitions,
    background flashes (Chozo hint, suit upgrade) and per-sprite freeze/damage palettes.
  instantiates:
  - concept: rendering.blending.alpha_layer_transparency
  - concept: rendering.palette.runtime_palette_effects
  - concept: rendering.blending.brightness_fade
    weight: 0.5
  reads:
  - player.position
  - world.tiles.clipdata_behavior
  - room.bg0_prop
  writes:
  - io.bldalpha
  - io.bldcnt
  - io.bldy
  - io.dispcnt
  - palram.*
  params:
    bg0_trigger_blend_presets:
      value: 11
      unit: EVA/EVB presets (opaque, 5 partial, fully transparent, brighter levels)
      evidence:
      - kind: decomp_source
        ref: mzm:src/data/block_data.c:sBldalphaValuesForClipdata
        confidence: 0.9
  relations:
  - type: modulates
    target: bg_layer_stack
  evidence:
  - kind: decomp_source
    ref: mzm:src/bg_clip.c:BgClipApplyClipdataChangingTransparency
    confidence: 0.8
  - kind: decomp_source
    ref: mzm:src/transparency.c:TransparencyCheckIsDarkRoom
    confidence: 0.9
  - kind: decomp_source
    ref: mzm:src/color_effects.c:ApplyMonochromeToPalette
    confidence: 0.85
  - kind: decomp_source
    ref: mzm:src/samus.c:SamusChangeToHurtPose (gMonochromeBgFading on death)
    confidence: 0.9
- id: affine_rotscale
  facet: rendering
  label: Affine BG (cutscene) and rotating/scaling OBJ
  summary: 'Affine hardware is used sparingly: the Tourian-escape cutscene switches to Mode 1 and rotates/scales
    BG2 (PA..PD from COS/SIN and inverse scale, centered on screen); in gameplay, sprites with the rotation-scaling
    status get an OBJ affine matrix built from their rotation/scaling fields (e.g. tumbling, boss parts).'
  instantiates:
  - concept: rendering.background.affine_rotscale
  - concept: rendering.sprite.affine_rotscale
  reads:
  - sprite.rotation
  - sprite.scaling
  - cutscene.bg2_rotation
  writes:
  - io.bg2pa
  - io.bg2pb
  - io.bg2pc
  - io.bg2pd
  - io.bg2x
  - oam.affine_params
  evidence:
  - kind: decomp_source
    ref: mzm:src/tourian_escape.c:TourianEscapeCalculateBg2
    confidence: 0.95
  - kind: decomp_source
    ref: mzm:src/tourian_escape.c:TourianEscapeSamusSurrounded (DCNT_MODE_1)
    confidence: 0.9
  - kind: decomp_source
    ref: mzm:src/sprite.c:SpriteDraw (rotation scaling matrix)
    confidence: 0.85
- id: scroll_camera
  facet: camera
  label: Scroll-region-bounded follow camera with speed-adaptive lag
  summary: Each frame the target is Samus's position (or a lock-screen point, or the midpoint between both for boss
    rooms). Within the room's scroll boxes the camera centers X at half the screen and Y at 60 % of screen height,
    clamped to box edges; with two overlapping boxes it averages. Camera moves toward the target with per-axis velocity
    caps of 2 px/frame that are widened to Samus's own displacement + 1 px, so the camera never falls behind at
    speed but eases on teleports; ledge hang/pull-up uses a 1 px/frame slow set. Screen shake (e.g. shinespark impact,
    Kraid hits) offsets the BG scroll.
  instantiates:
  - concept: camera.follow.region_bounded_scroll
  - concept: camera.follow.speed_adaptive_lag
  - concept: camera.lock.boss_screen_lock
  - concept: camera.effect.screen_shake
    weight: 0.5
  reads:
  - player.position
  - player.previous_position
  - player.pose
  - room.scroll_boxes
  - camera.lock
  writes:
  - camera.scroll.x
  - camera.scroll.y
  - camera.velocity
  params:
    anchor_x:
      value: 120
      unit: px from left edge (SCREEN_SIZE_X/2)
      evidence:
      - kind: decomp_source
        ref: mzm:include/structs/scroll.h:SCROLL_X_ANCHOR
        confidence: 0.95
    anchor_y:
      value: 96
      unit: px from top edge (60% of 160)
      evidence:
      - kind: decomp_source
        ref: mzm:include/structs/scroll.h:SCROLL_Y_ANCHOR
        confidence: 0.95
    default_scroll_cap:
      value: 2.0
      unit: px/frame (EIGHTH_BLOCK_SIZE = 8 sub-px)
      evidence:
      - kind: decomp_source
        ref: mzm:src/data/clipdata_data.c:sScrollVelocityCaps
        confidence: 0.95
    slow_scroll_cap:
      value: 1.0
      unit: px/frame
      evidence:
      - kind: decomp_source
        ref: mzm:src/data/clipdata_data.c:sScrollVelocityCaps
        confidence: 0.95
    cap_overshoot_margin:
      value: 1
      unit: px/frame added to Samus displacement
      evidence:
      - kind: decomp_source
        ref: mzm:src/scroll.c:ScrollProcessGeneral
        confidence: 0.9
    shinespark_shake_duration:
      value: 30
      unit: frames
      evidence:
      - kind: decomp_source
        ref: mzm:src/samus.c:SamusShinesparking (ScreenShakeStart*(CONVERT_SECONDS(.5f),1))
        confidence: 0.9
  invariants:
  - Camera X/Y never leave the active scroll box (clamped to xStart..xEnd-screen, yStart..yEnd-screen).
  - No scrolling while a color fade (door transition) is active.
  relations:
  - type: requires
    target: side_view_projection
  - type: modulates
    target: ledge_grab
    note: slow scroll timer during hang/pull-up
  evidence:
  - kind: decomp_source
    ref: mzm:src/scroll.c:ScrollProcessGeneral
    confidence: 0.95
  - kind: decomp_source
    ref: mzm:src/scroll.c:ScrollProcess
    confidence: 0.95
  - kind: decomp_source
    ref: mzm:src/scroll.c:ScrollScreen
    confidence: 0.95
  - kind: decomp_source
    ref: mzm:src/scroll.c:ScrollProcessX
    confidence: 0.95
  - kind: decomp_source
    ref: mzm:src/screen_shake.c:ScreenShakeStartVertical
    confidence: 0.8
- id: parallax_layers
  facet: camera
  label: Per-room parallax ratios and auto-scrolling layers
  summary: BG3 scroll is derived from the camera with a per-room code selecting none, quarter, half or full speed
    independently per axis (11 combinations); BG0 and BG3 can also auto-scroll (clouds, liquids) and BG2 follows
    its own offset (used for Kraid). Gives depth without affine hardware.
  instantiates:
  - concept: camera.parallax.layer_ratio_scroll
  reads:
  - camera.scroll
  - room.bg3_scrolling
  - room.bg0_movement
  writes:
  - io.bg0hofs
  - io.bg2hofs
  - io.bg3hofs
  - io.bg3vofs
  params:
    bg3_ratios:
      value:
      - 0
      - 0.25
      - 0.5
      - 1.0
      unit: fraction of camera scroll
      evidence:
      - kind: decomp_source
        ref: mzm:src/scroll.c:ScrollGetBg3Scroll
        confidence: 0.85
        note: QUARTERED/HALVED/NORMAL names; exact shift not re-read
  relations:
  - type: part_of
    target: scroll_camera
  - type: modulates
    target: bg_layer_stack
  evidence:
  - kind: decomp_source
    ref: mzm:src/scroll.c:ScrollGetBg3Scroll
    confidence: 0.9
  - kind: decomp_source
    ref: mzm:src/scroll.c:ScrollAutoBg0
    confidence: 0.75
- id: side_view_projection
  facet: projection
  label: Side-view orthographic 2D with 16 px metatile grid
  summary: 'Pure side view: world is a grid of 16x16 px blocks (clipdata) with slopes; there is no depth axis in
    gameplay. Facing-the-foreground/background poses (elevators, save, suitless back-turn) fake a z-turn with animation
    only.'
