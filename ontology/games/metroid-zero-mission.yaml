proposed_concepts:
- id: frontend.flow.mode_state_machine
  label: Game-mode state machine
  definition: Top-level loop that switches between discrete modes (boot, intro, title, menus, gameplay, pause, game
    over, credits), each with its own update/VBlank handlers.
  seed_source: front_end_flow (our vocabulary)
- id: frontend.soft_reset.button_combo
  label: Soft-reset button combo
  definition: Holding a fixed multi-button chord returns to the boot/title flow without power-cycling; may be suppressed
    during saves.
- id: frontend.intro.skippable_story_intro
  label: Skippable story intro
  definition: Pre-title narrative sequence that plays on boot and can be skipped with a button press.
  is_a:
  - frontend.flow.mode_state_machine
  seed_source: 'front_end_flow: Boot logo sequence'
- id: frontend.title.attract_demo
  label: Title attract demo
  definition: Title screen that, after an idle timeout, switches to a self-playing demonstration and returns afterwards.
  seed_source: 'front_end_flow: Title screen / attract mode / demo'
- id: frontend.attract.input_playback_demo
  label: Input-playback demo
  definition: Attract demo produced by replaying recorded controller input (often run-length encoded) through the
    real game simulation from a fixed state and RNG seed.
  is_a:
  - frontend.title.attract_demo
- id: frontend.menu.file_select_slots
  label: Multi-slot file select
  definition: Menu listing a fixed number of save slots with start/continue, copy and erase operations and new-game
    options.
  seed_source: 'gdp: Save Files'
- id: frontend.menu.unlockable_extras
  label: Unlockable extras
  definition: Menu content (galleries, modes, bundled games, sound test) unlocked by completion conditions and stored
    outside individual save slots.
- id: frontend.save.save_station
  label: Save station
  definition: Saving allowed only at specific in-world objects or rooms.
  seed_source: 'gdp: Save Points'
- id: frontend.save.redundant_slot_backup
  label: Redundant save backup
  definition: Each save slot is written with a checksum and a duplicate copy so a corrupted write can be recovered.
- id: frontend.game_over.continue_from_save
  label: Continue from last save
  definition: On death a game-over screen offers resuming from the last saved state or quitting.
  seed_source: 'gdp: Game Over'
- id: rendering.background.tile_layer_stack
  label: Multi-layer tilemap stack
  definition: Scene composed from several hardware tilemap layers with distinct roles (foreground overlay, collision
    layer, decoration, distant backdrop) and configurable priorities.
  seed_source: GBA tile-map backgrounds (Mode 0)
- id: rendering.raster.hblank_dma_scroll_distortion
  label: HBlank scroll distortion
  definition: Per-scanline rewrite of a layer's scroll offset (via HBlank DMA or interrupt) to produce wobble, heat
    haze or water ripple.
  seed_source: HBlank raster effects
- id: rendering.raster.hblank_palette_gradient
  label: HBlank palette gradient
  definition: Per-scanline rewrite of a palette entry (typically the backdrop) to draw vertical color gradients.
  is_a:
  - rendering.raster.hblank_dma_scroll_distortion
  seed_source: HBlank raster effects
- id: rendering.raster.window_shape_per_scanline
  label: Per-scanline window shape
  definition: Hardware window bounds rewritten every scanline to carve an arbitrary shape (circle, ellipse) used
    for spotlights or explosion regions.
  seed_source: OBJ ... blending, windows
- id: rendering.blending.alpha_layer_transparency
  label: Alpha-blended layer
  definition: Hardware alpha blending of a layer over others (liquids, fog, see-through foreground), possibly varied
    at runtime.
  seed_source: OBJ ... blending
- id: rendering.blending.brightness_fade
  label: Brightness fade
  definition: Hardware brightness increase/decrease used for fades to black/white and darkening effects.
- id: rendering.palette.runtime_palette_effects
  label: Runtime palette effects
  definition: Palette RAM manipulated at runtime for fades, flashes, monochrome, damage/freeze tints and animated
    colors.
- id: rendering.background.affine_rotscale
  label: Affine background
  definition: Background layer rotated/scaled via an affine matrix (GBA modes 1/2), Mode-7-like when varied per
    line.
  seed_source: GBA affine backgrounds (Mode 1/2)
- id: rendering.sprite.affine_rotscale
  label: Affine sprites
  definition: Hardware sprites drawn with rotation/scaling matrices.
  seed_source: OBJ regular and affine
- id: rendering.boss.background_layer_boss
  label: Background-layer boss
  definition: A very large enemy whose body is drawn as a scrolling background layer (moved by layer offsets) with
    sprite sub-parts, exceeding sprite size limits.
- id: camera.follow.region_bounded_scroll
  label: Region-bounded follow camera
  definition: Camera follows the avatar at an anchor point but is clamped to authored scroll regions/rooms.
  seed_source: 'gdp: Cameras'
- id: camera.follow.speed_adaptive_lag
  label: Speed-adaptive camera lag
  definition: Camera moves toward its target with a speed cap that grows to match the avatar's speed, easing on
    jumps/teleports but never falling behind sustained motion.
  is_a:
  - camera.follow.region_bounded_scroll
- id: camera.lock.boss_screen_lock
  label: Lock-screen camera
  definition: Camera target fixed to (or blended toward) an authored point during set pieces such as boss fights.
- id: camera.effect.screen_shake
  label: Screen shake
  definition: Temporary oscillating camera offset as impact feedback.
  seed_source: 'movement_physics_game_feel: Polish'
- id: camera.parallax.layer_ratio_scroll
  label: Parallax layer ratios
  definition: Background layers scroll at fixed fractions of camera motion (per axis) to imply depth.
  seed_source: Parallax scrolling
- id: projection.side_view.orthographic_2d
  label: Side-view 2D
  definition: Orthographic side view with gravity along screen-down and no depth axis in play.
  seed_source: Side-scrolling / Side view
- id: movement_physics.locomotion.accel_to_cap_run
  label: Accelerate-to-cap run
  definition: Horizontal speed increases by a constant per frame while input is held until a cap; parameters are
    acceleration, cap and stop behaviour.
  seed_source: Acceleration/deceleration/friction/top speed
- id: movement_physics.locomotion.slope_speed_modifier
  label: Slope speed modifier
  definition: Ground speed scaled or clamped depending on slope steepness and whether moving uphill or downhill.
  seed_source: Slope / loop momentum
- id: movement_physics.locomotion.skid_stop
  label: Skid stop
  definition: Releasing input at high speed enters a decelerating skid state instead of stopping instantly.
- id: movement_physics.jump.variable_height
  label: Variable jump height
  definition: Jump height depends on how long the jump button is held, via damping or cutting upward velocity on
    release.
  seed_source: Variable jump height
- id: movement_physics.jump.fixed_impulse_gravity_arc
  label: Impulse-plus-gravity jump
  definition: Jump sets an initial upward velocity then constant gravity integrates the arc; height is set by impulse
    and gravity.
  seed_source: VGDL GravityPhysics / MarioAvatar
- id: movement_physics.gravity.terminal_velocity
  label: Terminal velocity
  definition: Maximum downward (and optionally upward) displacement per frame regardless of accumulated velocity.
  seed_source: Gravity and terminal velocity
- id: movement_physics.air_control.capped_air_acceleration
  label: Capped air control
  definition: Horizontal acceleration available in the air, typically with a lower speed cap than on the ground.
- id: movement_physics.jump.spin_jump_mode
  label: Spin-jump mode
  definition: A distinct airborne state entered by jumping with momentum that changes hitbox/animation and enables
    further abilities (wall jump, body attacks).
- id: movement_physics.wall.wall_jump
  label: Wall jump
  definition: Jumping off a wall after contact, usually within a short timing window and requiring input away from
    or toward the wall.
  seed_source: Mobility upgrades
- id: movement_physics.jump.timed_air_rejump
  label: Timed air re-jump
  definition: Unlimited mid-air jumps permitted only inside a velocity or timing window, giving skill-gated infinite
    height.
  seed_source: Double jump (generalized)
- id: movement_physics.speed.sustained_run_speed_mode
  label: Sustained-run speed mode
  definition: Running at top speed for a threshold time unlocks a higher-speed state that changes interactions (breaks
    obstacles, damages enemies).
- id: movement_physics.speed.stored_dash_launch
  label: Stored dash launch
  definition: Momentum state banked for a limited time and later released as a fixed-velocity, gravity-free dash
    in a chosen direction.
  is_a:
  - movement_physics.speed.sustained_run_speed_mode
- id: movement_physics.mode.ball_form
  label: Ball form
  definition: Alternate compact avatar form with a smaller hitbox for tunnels and its own movement rules and actions.
- id: movement_physics.jump.explosive_self_propulsion
  label: Explosive self-propulsion
  definition: The avatar's own explosives impart velocity to it (bomb/rocket jump); chaining may allow unlimited
    climbing.
- id: movement_physics.ledge.ledge_grab_hang
  label: Ledge grab
  definition: Automatic catch onto a ledge edge when approaching from below/side, entering a hang state with climb-up
    options.
- id: movement_physics.medium.liquid_drag
  label: Liquid drag
  definition: Movement constants scaled down while submerged; equipment may negate the penalty.
- id: movement_physics.feedback.knockback_iframes
  label: Knockback with i-frames
  definition: Taking damage applies a launch velocity and a temporary invulnerability window.
  seed_source: Knockback / hit-stop / invincibility frames
- id: mechanics.weapon.stackable_beam_modifiers
  label: Stackable weapon modifiers
  definition: Weapon upgrades are independent flags that combine into one shot type (damage/behaviour from the combination)
    instead of replacing each other.
  seed_source: 'gdp: Improved Abilities'
- id: mechanics.weapon.charge_shot
  label: Charge shot
  definition: Holding fire accumulates charge; release above a threshold fires a stronger projectile.
  seed_source: 'gdp: Cooldown (related)'
- id: mechanics.weapon.ammo_secondary_weapon
  label: Ammo secondary weapon
  definition: Stronger weapon consuming a capped ammunition pool, selected alongside an unlimited primary.
  seed_source: 'gdp: Ammunition'
- id: mechanics.weapon.placed_explosive
  label: Placed explosive
  definition: Avatar drops a timed explosive at its position that damages entities and terrain in a radius.
- id: mechanics.weapon.screen_clearing_bomb
  label: Area-clearing bomb
  definition: Scarce explosive whose large expanding area damages all entities and destroys special terrain in range.
  is_a:
  - mechanics.weapon.placed_explosive
- id: mechanics.status.freeze_enemy_platform
  label: Freeze enemy into platform
  definition: Status effect that halts an enemy for a duration and turns it into solid, standable terrain.
- id: mechanics.combat.contact_damage
  label: Contact damage
  definition: Touching an enemy damages the player by a per-enemy amount.
  seed_source: 'gdp: Damage'
- id: mechanics.combat.damage_mitigation_equipment
  label: Damage-reducing equipment
  definition: Equipment multiplies incoming damage down; multiple pieces may stack non-additively.
  seed_source: 'gdp: Armor'
- id: mechanics.combat.invulnerability_frames
  label: Invulnerability frames
  definition: Brief window after a hit during which further damage is ignored.
  seed_source: 'gdp: Invulnerabilities'
- id: mechanics.hazard.environmental_damage_over_time
  label: Environmental damage over time
  definition: Terrain or room conditions drain health periodically at rates depending on protective equipment.
  seed_source: 'gdp: Environmental Effects'
- id: mechanics.combat.body_attack
  label: Body attack
  definition: Movement states that make the avatar's body a weapon, damaging enemies on contact instead of taking
    damage.
- id: mechanics.combat.enemy_weakness_mask
  label: Enemy weakness mask
  definition: Per-enemy bitmask of damage types that can harm or affect it; other types are deflected.
- id: mechanics.ability.temporary_ability_loss
  label: Temporary ability loss
  definition: Story-driven segment where the player loses most abilities and must play with a reduced moveset until
    restored.
  seed_source: 'gdp: Ability Losses'
- id: mechanics.stealth.detection_alarm
  label: Detection and alarm
  definition: Enemies or sensors detect the player via sight cones/rays; detection raises a timed alarm that escalates
    enemy behaviour.
  seed_source: 'gdp: Stealth / Alarms'
- id: mechanics.difficulty.selectable_difficulty
  label: Selectable difficulty
  definition: Player-chosen mode applying global multipliers to damage, resources and timers.
  seed_source: 'gdp: Difficulty Levels'
- id: mechanics.goal.timed_escape
  label: Timed escape
  definition: After a trigger the player must reach an exit before a visible countdown expires.
  seed_source: 'gdp: Time Limits'
- id: ai.framework.pose_fsm_per_entity
  label: Per-entity pose FSM
  definition: Each enemy is a finite state machine over a pose/state byte with init/update pairs, running on a shared
    entity runtime with stats tables.
  seed_source: 'game_ai_taxonomy: Finite state machine'
- id: ai.enemy.surface_crawler
  label: Surface crawler
  definition: Enemy that follows terrain contours on any surface orientation, turning at edges and corners.
  seed_source: VGDL Walker (generalized)
- id: ai.enemy.proximity_triggered_dive
  label: Proximity-triggered dive
  definition: Stationary enemy that attacks with a committed dive when the player enters a trigger zone.
  seed_source: 'game_ai_taxonomy: Aggro / detection range'
- id: ai.enemy.latch_and_drain
  label: Latch and drain
  definition: Enemy homes onto the player, attaches, impairs movement and drains health until removed by a specific
    counter.
  seed_source: VGDL Chaser (extended)
- id: ai.enemy.patrol_detect_pursue
  label: Patrol-detect-pursue
  definition: Enemy patrols until it perceives the player, then switches to alert pursuit/attack behaviour.
  seed_source: 'game_ai_taxonomy: Aggro / detection range / line of sight'
- id: ai.perception.tile_raycast_line_of_sight
  label: Tile ray line of sight
  definition: Visibility check stepping through tiles between enemy and player, blocked by solid tiles; posture
    may reduce visibility.
- id: ai.spawn.alarm_reinforcements
  label: Alarm reinforcements
  definition: Global alarm state spawns or activates extra enemies at designated points while active.
- id: ai.boss.weak_point_window
  label: Weak-point window boss
  definition: Boss damageable only through a specific part, often only during opening windows that close after enough
    damage.
  seed_source: 'gdp: Boss Monsters'
- id: ai.boss.multi_part_boss
  label: Multi-part boss
  definition: Boss assembled from several synchronised entities (body, limbs, weak points) with separate hitboxes
    and behaviours.
  seed_source: 'gdp: Boss Monsters'
- id: progression.gating.ability_gating
  label: Ability gating
  definition: World regions blocked until the player acquires a specific ability or item.
  seed_source: 'progression_structure: Ability gating'
- id: progression.gating.typed_lock_and_key
  label: Typed lock and key
  definition: Barriers typed by the key (weapon/ability) that opens them; keys are reusable abilities rather than
    consumable items.
  seed_source: 'dormans: Lock and key'
- id: progression.gating.event_locked_doors
  label: Event-locked doors
  definition: Doors locked or unlocked by world events (boss start/defeat, enemies cleared).
- id: progression.items.fixed_location_upgrade
  label: Fixed-location upgrade
  definition: Permanent upgrades placed at authored world locations, often in distinctive containers.
  seed_source: 'gdp: Power-Ups / New Abilities'
- id: progression.guidance.hint_waypoint
  label: Hint waypoint
  definition: In-world object that reveals the location of the next objective on the map.
  seed_source: 'gdp: Point of Interest Indicators'
- id: progression.items.deferred_activation_upgrade
  label: Deferred-activation upgrade
  definition: Item that can be collected early but stays unusable until a later story or state condition activates
    it.
- id: progression.world.persistent_world_flags
  label: Persistent world flags
  definition: Boolean world-state flags (bosses beaten, items taken, barriers destroyed) persisted in saves and
    checked by content.
  seed_source: 'gdp: Persistent Game World Changes'
- id: progression.structure.sequence_breaking
  label: Sequence breaking
  definition: Acquiring abilities or reaching areas out of the intended order, either tolerated by the design or
    enabled by movement tech.
  seed_source: 'progression_structure: Sequence breaking'
- id: progression.structure.backtracking
  label: Backtracking
  definition: Returning to earlier areas with new abilities to access previously blocked content.
  seed_source: 'progression_structure: Backtracking'
- id: progression.structure.interconnected_areas
  label: Interconnected areas
  definition: World made of themed areas linked by elevators/doors into a single non-linear map.
  seed_source: 'progression_structure: Interconnected map'
- id: progression.completion.ranked_ending
  label: Ranked ending
  definition: Ending presentation varies with completion percentage, clear time and difficulty, rewarding replay.
  seed_source: 'gdp: Rewards'
- id: economy.resource.capped_pool
  label: Capped resource pool
  definition: Numeric resource with current and maximum values; gains are clamped to the maximum.
  seed_source: 'gdp: Resource Caps / machinations: Pool'
- id: economy.resource.capacity_expansion
  label: Capacity expansion
  definition: Collectibles that permanently raise a resource maximum (and usually refill it).
  seed_source: 'gdp: Improved Abilities (resource)'
- id: economy.source.enemy_drop_table
  label: Enemy drop table
  definition: Defeated enemies drop resources according to per-species probability tables.
  seed_source: 'gdp: Loot / machinations: Source'
- id: economy.source.need_aware_drop_substitution
  label: Need-aware drop substitution
  definition: Drop rolls are redirected away from resources that are already full toward ones the player lacks.
  is_a:
  - economy.source.enemy_drop_table
  seed_source: 'gdp: Negative Feedback Loops'
- id: economy.source.refill_station
  label: Refill station
  definition: Fixed world object that restores resources, often gradually.
  seed_source: 'gdp: Renewable Resources'
- id: ui_hud.hud.resource_counters
  label: Resource counters HUD
  definition: Always-visible display of health and ammo values, with selection highlighting.
  seed_source: 'gdp: HUD Interfaces / Game State Indicators'
- id: ui_hud.hud.minimap
  label: Minimap
  definition: Small always-visible map of the area around the player built from explored data.
  seed_source: 'gdp: Mini-maps'
- id: ui_hud.alert.low_health_warning
  label: Low-health warning
  definition: Repeating audio/visual alert while health is below a threshold.
- id: ui_hud.menu.pause_map_screen
  label: Pause map screen
  definition: Full map shown on pause, combining explored, revealed and marked locations.
- id: ui_hud.menu.equipment_toggle_screen
  label: Equipment toggle screen
  definition: Menu listing acquired abilities that lets the player enable/disable them individually.
- id: ui_hud.input.multi_direction_aim
  label: Multi-direction aim
  definition: Avatar aims its weapon in several discrete directions via d-pad and modifier buttons.
  seed_source: VGDL AimedAvatar
- id: ui_hud.input.hold_to_arm_modifier
  label: Hold-to-arm modifier
  definition: Holding a modifier button temporarily switches the fire button to a secondary weapon.
- id: narrative_delivery.cutscene.in_engine_cutscene
  label: In-engine cutscene
  definition: Non-interactive scene rendered with game assets that interrupts play at story beats.
  seed_source: 'gdp: Cutscenes'
- id: narrative_delivery.text.story_text_crawl
  label: Story text narration
  definition: Narration delivered as text printed over still or animated backgrounds.
- id: narrative_delivery.text.item_acquisition_message
  label: Item acquisition message
  definition: Pop-up naming a newly acquired item and how to use it, usually pausing play with a jingle.
- id: narrative_delivery.diegetic.area_name_banner
  label: Area name banner
  definition: Region name shown when entering a new area.
- id: narrative_delivery.structure.predetermined_story
  label: Predetermined story
  definition: Fixed authored plot sequence delivered at set progression points.
  seed_source: 'gdp: Predetermined Story Structures'
- id: setting.theme.science_fiction
  label: Science fiction
  definition: Fiction built on future technology, space travel or alien life.
  seed_source: 'igdb theme: Science fiction'
- id: setting.location.alien_planet_ruins
  label: Alien planet with ancient ruins
  definition: Hostile alien world containing remains of an ancient civilisation that aids the player.
- id: setting.tone.isolation_exploration
  label: Isolated exploration tone
  definition: Lone protagonist, sparse dialogue and atmosphere emphasising solitude and discovery.
- id: audio.engine.sample_psg_sequencer
  label: Sample + PSG sequencer
  definition: Music/sound engine sequencing tracks over software-mixed PCM samples and hardware tone/noise channels.
- id: audio.sfx.contextual_action_sfx
  label: Contextual action SFX
  definition: Distinct sound variants for the same action depending on state (equipment, medium, form).
  seed_source: 'movement_physics_game_feel: Polish'
- id: audio.music.room_based_tracks
  label: Room-based music
  definition: Each room/area declares its track; music changes only when the declared track differs.
- id: audio.music.jingle_interrupt_queue
  label: Jingle interrupt with resume
  definition: Short event jingles interrupt the current track, which is queued and resumed afterwards.
- id: audio.music.state_driven_music
  label: State-driven music
  definition: Music switches on gameplay state such as boss fights, alarms, escapes or low health.
open_questions:
- 'Coyote time / jump buffering: none found in SamusRunning/SamusSetMidAir (jump reads gChangedInput only in grounded
  poses), but SamusCheckLandingCollision and the landing pose were not traced fully; confirm with a frame-stepped
  capture.'
- Speed-booster activation frame count (~155 from rest) is derived; slope multipliers and the order of SamusCheckShinesparking
  vs pose handlers may shift it by a few frames.
- Jump apex heights are simulated from constants; the first airborne frame after the pose request and SPOSE_STARTING_SPIN_JUMP
  may differ. Capture would confirm.
- Exact shinespark storage conditions beyond the skid-crouch path (rolling sets shinesparkTimer=6 and landing paths)
  were not fully read.
- Ruins Test boss checks a charged pistol hit (RuinsTestCheckHitByChargedPistol) - unclear from code alone which
  suit state the fight is in; left out of components.
- Ridley, Mecha Ridley, Acid Worm, Imago and many regular enemies were not decomposed; ai coverage is a representative
  subset.
- 'Bomb fuse total duration: BOMB_EXPLOSION_TIMER (16 frames) is per stage; total fuse not summed.'
- 'Sound engine identity: InitializeAudio and sound/*.s look like a Nintendo sequencer with voice groups but the
  code is custom-named; whether it is MP2K-derived is not established. Mix rate/channels only appear in a comment.'
- Room-level data (which hatches/blocks gate which rooms, per-room haze/parallax assignments, item placements) lives
  in src/data/rooms and was not parsed; a full ability-gating graph needs a data extraction pass.
- Metroid chase speed semantics in MetroidMove (caps and divisor) not traced.
- Whether gameplay ever enables DISPCNT window/OBJ-window besides power bombs, pause and suit-upgrade flash was
  not exhaustively checked.
