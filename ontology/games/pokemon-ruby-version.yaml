- id: evolution_rules
  facet: progression
  label: Rule-table evolution with mode and held-item checks
  summary: GetEvolutionTargetSpecies scans species evolution methods for normal, trade or item-use modes, checking
    level, friendship, stats, beauty and personality conditions. The prevent-evolve hold effect blocks real evolution
    but permits item-check mode. Friendship day/night branches call RTC and use 12..23 versus 0..11 hours respectively;
    these source-defined intervals should not be silently relabeled by ordinary daylight assumptions.
  instantiates:
  - concept: progression.character.conditional_evolution
  reads:
  - creature.species:u16
  - creature.level:u8
  - creature.friendship:u8
  - creature.held_item:u16
