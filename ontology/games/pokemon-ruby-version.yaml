- id: turn_order
  facet: mechanics
  label: Move priority before adjusted speed and item effects
  summary: 'GetWhoStrikesFirst compares move-priority brackets, then adjusted speed; equal speed within equal priority
    uses Random()&1. Weather abilities double speed, the third badge can multiply player speed by 110/100 outside
    link battles, Macho Brace halves it and paralysis divides by four. A Quick Claw trigger sets adjusted speed
    to UINT_MAX but still does not cross a higher move-priority bracket. Inference: speed control and priority are
    distinct tactical operators, not measured player skills.'
  instantiates:
  - concept: mechanics.combat.speed_priority_turn_order
  reads:
  - battle.moves.priority:s8[]
  - battle.speed:u16[]
  - battle.speed_stage:u8[]
  - battle.weather:u16
  - battle.status:u32[]
  - battle.held_items:u16[]
  - progress.badge3:bool
  - rng.state:u32
  writes:
  - battle.order_comparison:u8
  - rng.state:u32
  invariants:
  - Quick Claw affects speed comparison within the priority logic; it does not universally override move priority.
  evidence:
  - kind: decomp_source
    ref: pokeruby:src/battle_main.c:GetWhoStrikesFirst
    confidence: 0.9
  params:
    paralysis_speed_divisor:
      value: 4
      unit: divisor
      native_value: 4
      native_unit: divisor
      evidence:
      - kind: decomp_source
        ref: pokeruby:src/battle_main.c:GetWhoStrikesFirst
        confidence: 0.9
    weather_speed_multiplier:
      value: 2
      unit: multiplier
      native_value: 2
      native_unit: multiplier
      evidence:
