schema_version: 0
id: pokemon-ruby-version
game:
  title: Pokémon Ruby Version
  platform: gba
  game_code: AXVE
  rom_sha1: 5b64eacf892920518db4ec664e62a086dd5f5bc8
  evidence_basis:
  - decomp_source
  - capture_telemetry
  - capture_frame
  sources:
  - kind: decomp
    ref: https://github.com/pret/pokeruby @ 5784633ce4ef7ade1a7f2d2d0c288e3d5e6cdd7f; ruby_rev2.sha1 matches the
      local indexed ROM SHA1. Actual matching build not run.
  - kind: capture
    ref: local/captures/pokemon-ruby-version run 20261015T234415-8f46cf; harness 0.1.0, libmgba 0.10.5 HLE BIOS;
      9000 total frames; 3.326 s prior capture wall. Two phases only; not whole-game qualification.
  - kind: extraction_run
    ref: 'Codex/GPT, exact runtime model unavailable; brief v1; source reading began before first recorded clock
      observation 2026-10-16T04:42:28Z; completed 2026-10-16T04:46:13.431055+00:00. Three variants extracted together
      from independently inspected pokeruby and pokefirered trees. Total extraction/queue/token cost unavailable;
      no provider calls. Source files read or inspected by symbol/excerpt: include/constants/global.h, src/battle_ai_script_commands.c,
      src/battle_main.c, src/berry.c, src/bike.c, src/clock.c, src/data/wild_encounters.json, src/field_camera.c,
      src/field_player_avatar.c, src/main.c, src/overworld.c, src/pokemon_1.c, src/pokemon_3.c, src/random.c, src/save.c,
      src/script.c, src/sound.c, src/start_menu.c, src/wild_encounter.c; applicable hash file/README, capture summary
      and one inspected presenter keyframe.'
conventions:
  scope: Partial evidence-backed variant extraction; core modules share Gen-3 abstractions but each citation points
    to this game source tree. Emerald relations mean implementation variants, not proof of identical complete behavior.
    Untouched facets and deeper subsystems remain explicit questions.
  units: Source-native update counts, points and indices are retained. Integer division order is preserved; no uniform
    RNG assumption or exact probability calibration. Hardware audio Hz differs from export WAV rate.
  version: Local ROM revision 2 and hash match the source repository hash file; preprocessor-specific branches beyond
    those explicitly inspected are not assumed identical.
  inference: Strategy implications are marked inference and do not measure player skill or prove optimal play.
components:
- id: main_loop_and_callbacks
  facet: frontend
  label: Key-sampling frame loop with reset guard
  summary: AgbMain reads keys, checks the A+B+Start+Select chord unless soft reset is disabled, coordinates link
    processing, updates play time/map music and waits for VBlank. Ruby initializes the RTC and seeds its generator
    from it.
  instantiates:
  - concept: frontend.flow.mode_state_machine
  - concept: frontend.soft_reset.button_combo
  reads:
  - input.raw_held:u16
  - runtime.soft_reset_disabled:bool
  - link.queues
  writes:
  - runtime.callbacks
  - runtime.frame_state
  invariants:
  - Reset uses raw held keys rather than L=A remapped keys.
  evidence:
  - kind: decomp_source
    ref: pokeruby:src/main.c:AgbMain
    confidence: 0.9
  relations:
  - type: variant_of
    target: pokemon-emerald-version/main_loop_and_callbacks
    note: Compared as a Gen-3 implementation variant; source for this game was inspected independently. No claim
      of byte-identical behavior.
- id: input_controls
  facet: ui_hud
  label: Physical, edge and repeated keys with L=A remapping
  summary: ReadKeys derives new keys before applying L=A to held/new fields. The source explicitly records that
    repeat compares raw input with the remapped previous held keys and never remaps newAndRepeatedKeys, so L=A repeat
    has a known discrepancy. Watched-key masks latch new presses for waiting callers.
  instantiates:
  - concept: ui_hud.input.context_button_mapping
  reads:
  - input.hardware:u16
  - input.previous_held:u16
  - settings.button_mode:u8
  writes:
  - input.new:u16
  - input.held:u16
  - input.repeat:u16
  - input.watched_pressed:bool
  invariants:
  - L=A affects held/new keys but not the repeat field.
  evidence:
  - kind: decomp_source
    ref: pokeruby:src/main.c:ReadKeys
    confidence: 0.9
  relations:
  - type: variant_of
    target: pokemon-emerald-version/input_controls
    note: Compared as a Gen-3 implementation variant; source for this game was inspected independently. No claim
      of byte-identical behavior.
- id: rng_lcg
  facet: mechanics
  label: Global high-word LCG also advances at VBlank
  summary: Random updates a 32-bit state using multiplier 1103515245 and increment 24691, returning the upper 16
    bits. The inspected VBlank path calls Random in addition to event-specific callers; frame timing therefore affects
    future battle/encounter outcomes. No claim of uniform event probabilities or replay determinism follows from
    the recurrence alone.
  instantiates:
  - concept: mechanics.randomness.lcg_prng
  reads:
  - rng.state:u32
  writes:
  - rng.state:u32
  - query.random:u16
  invariants:
  - Return is the high 16 bits after state advance.
  evidence:
  - kind: decomp_source
    ref: pokeruby:src/random.c:Random
    confidence: 0.9
  - kind: decomp_source
    ref: pokeruby:src/main.c:VBlankIntr
    confidence: 0.9
  params:
    multiplier:
      value: 1103515245
      unit: u32 multiplier
      native_value: 1103515245
      native_unit: u32 multiplier
      evidence:
      - kind: decomp_source
        ref: pokeruby:src/random.c:Random
        confidence: 0.9
    increment:
      value: 24691
      unit: u32 increment
      native_value: 24691
      native_unit: u32 increment
      evidence:
      - kind: decomp_source
        ref: pokeruby:src/random.c:Random
        confidence: 0.9
  relations:
  - type: variant_of
    target: pokemon-emerald-version/rng_lcg
    note: Compared as a Gen-3 implementation variant; source for this game was inspected independently. No claim
      of byte-identical behavior.
- id: script_engine
  facet: mechanics
  label: Yielding bytecode and native-function script context
  summary: RunScriptCommand switches stopped/native/bytecode modes. Bytecode dispatch runs until a handler requests
    a yield, the script pointer becomes null or the opcode lies beyond the command table. Native mode resumes bytecode
    when the callback reports completion. An initial stopped-mode guard is present.
  instantiates:
  - concept: narrative_delivery.engine.bytecode_script_vm
  - concept: progression.world.persistent_world_flags
    weight: 0.6
  reads:
  - script.mode:u8
  - script.pc:pointer
  - script.command_table
  - script.native_callback
  writes:
  - script.pc:pointer
  - script.mode:u8
  - script.return_stack
  invariants:
  - A yielding command stops the current dispatch loop.
  evidence:
  - kind: decomp_source
    ref: pokeruby:src/script.c:RunScriptCommand
    confidence: 0.9
  - kind: decomp_source
    ref: pokeruby:src/script.c:ScriptCall
    confidence: 0.9
  - kind: decomp_source
    ref: pokeruby:src/script.c:ScriptReturn
    confidence: 0.9
  relations:
  - type: variant_of
    target: pokemon-emerald-version/script_engine
    note: Compared as a Gen-3 implementation variant; source for this game was inspected independently. No claim
      of byte-identical behavior.
- id: flash_save_system
  facet: frontend
  label: Rotating checksummed sector save slots
  summary: A full save increments its counter, rotates the starting sector modulo 14 and writes 14 chunks. Each
    chunk is placed into one of two physical slot sets selected by saveCounter%2, with ID, signature, counter and
    checksum in its footer. If damaged sectors are reported, the writer restores its prior counter/start index.
    This is source architecture, not a tested power-loss recovery campaign.
  instantiates:
  - concept: frontend.save.checksummed_flash_record
    weight: 0.5
  - concept: frontend.save.redundant_slot_backup
  - concept: frontend.save.save_anywhere
  reads:
  - save.blocks
  - save.counter:u32
  - save.first_sector:u16
  writes:
  - flash.sectors
  - save.counter:u32
  - save.first_sector:u16
  invariants:
  - Each written chunk includes a checksum and shared save counter.
  evidence:
  - kind: decomp_source
    ref: pokeruby:src/save.c:WriteSaveBlockChunks
    confidence: 0.9
  - kind: decomp_source
    ref: pokeruby:src/save.c:WriteSingleChunk
    confidence: 0.9
  - kind: decomp_source
    ref: pokeruby:src/save.c:CalculateChecksum
    confidence: 0.9
  params:
    chunks_per_slot:
      value: 14
      unit: sectors
      native_value: 14
      native_unit: sectors
      evidence:
      - kind: decomp_source
        ref: pokeruby:src/save.c:WriteSaveBlockChunks
        confidence: 0.9
    physical_slots:
      value: 2
      unit: slots
      native_value: 2
      native_unit: slots
      evidence:
      - kind: decomp_source
        ref: pokeruby:src/save.c:WriteSingleChunk
        confidence: 0.9
  relations:
  - type: variant_of
    target: pokemon-emerald-version/flash_save_system
    note: Compared as a Gen-3 implementation variant; source for this game was inspected independently. No claim
      of byte-identical behavior.
