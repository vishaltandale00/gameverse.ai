  invariants:
  - With nonnegative steps and no signed overflow, each updated increment lies between its previous value and target;
    it does not overshoot.
  - A zero increment contributes no sign bit; positive and negative bits for one axis are mutually exclusive.
  - Previous paired state is copied before new increments are added.
  - Accumulator additions are native32-bit operations; overflow/reachability and coordinate units remain unknown.
  - A nonzero return means a nonzero increment, not confirmed player movement or successful collision resolution.
