components:
- id: paired_target_approach
  facet: mechanics
  label: Two target-approach increments integrated into paired state
  summary: The helper moves signed words at offsets0x60 and0x64 toward targets0x50 and0x5c using steps0x4c and0x58,
    clipping overshoot in the direction taken. It saves words0x00/0x04 into0x6c/0x70, then adds the updated increments
    to0x00/0x04. It writes sign bits at0x24 and returns whether either increment is nonzero; which actor or camera
    uses this apparent movement kernel is not established.
  instantiates:
  - concept: mechanics.state.paired_target_approach_integration
  reads:
  - object[0x00]:u32
  - object[0x04]:u32
  - object[0x4c]:i32
  - object[0x50]:i32
  - object[0x58]:i32
  - object[0x5c]:i32
  - object[0x60]:i32
  - object[0x64]:i32
  - ram[0x03001278]:i32
  writes:
