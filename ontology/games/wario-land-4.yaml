      ROM build identity not independently rebuilt.
  - kind: rom_header
    ref: local/re/roms.json id=wario-land-4; game code AWAE; matched SHA1 in capture summary.
  - kind: capture
    ref: local/captures/wario-land-4/summary.json run_id=20261015T234415-8f46cf; source=d431b8183f1001722d7bc9a326da28088930c344
      dirty; harness=0.1.0 tree_sha1=c7b44c806b6e; libmgba=0.10.5; default.json; observed control flow has limited
      phase coverage.
  - kind: extraction_run
    ref: Codex/GPT subagent (exact model revision unavailable), brief v1; authoring stage 2026-10-16T04:37:36.951538Z
      to 2026-10-16T04:40:59.583139+00:00; preceding research wall time unavailable; no model-provider call or game
      build performed. Read C files main, game_screen, game_screen_gfx, demo_input, autosave, sprite_collision excerpts,
      sprite_util excerpts, screen_shake, transparency, hud, voice_set excerpts, sram, sram_misc; sprite_ai keyzer/vortex/rock/coins/treasure/spear_mask
      excerpts; assembly disasm_wario/scrolled-register portion of disasm_scrolling/disasm_score timer and score
      functions/sprite_ai disasm_switch handler; include wario/types/global_data/score/fixed_point; two images and
      capture summary.
conventions:
  position_units: include/types.h sets PIXEL_SIZE=4, BLOCK_SIZE_PIXELS=16; one pixel = four subpixels and one block
    = 64 subpixels. Direct sprite-position steps are converted accordingly. Actor velocity integration units were
    not fully traced; no gravity/jump impulse conversion is asserted.
  time_units: FRAME_RATE=60 and DELTA_TIME=1 in source. CONVERT_SECONDS multiplies by 60, but escape countdown display
    decrements every 64 eligible updates; do not identify displayed countdown seconds with real seconds. Capture
    reports 9000 frames as 150.689 emulated seconds, showing the hardware timing distinction.
  score_units: 'include/score.h SCORE_RATIO=10: native stored score is one tenth of displayed points. Saved high
    score/total clamp at 999990 displayed points; runtime stage accumulator is only proved to have a lower clamp,
    not the same upper clamp.'
  typed_state: reads/writes use source symbols with explicit source or interpreted types. Names such as world.scatter_coins
    describe extracted semantic state rather than original symbols. Unknown source fields retain their unknown names.
  strategy_and_skill: Player tactics described as inference are predictions from reachable rules, not measured strategies
    or validated skill requirements. No mashup proposal was generated.
components:
- id: mode_flow
  facet: frontend
  label: Explicit game-mode routing
  summary: The main loop dispatches cutscenes, file selection, stage selection, gameplay, pause, shop, minigames,
    demo and credits. Stage selection enters a minigame for stage IDs 6, 12, 18 and 24, while exit types select
    different return sequences.
  instantiates:
  - concept: frontend.flow.mode_state_machine
  evidence:
  - kind: decomp_source
    ref: warioland4:src/main.c:AgbMain
    confidence: 0.94
  reads:
  - gMainGameMode:s16 enum
  - gSubGameMode:s16
  - gStageExitType:u8
  - gCurrentStageID:u8
  writes:
  - gMainGameMode:s16 enum
  - gSubGameMode:s16
  invariants:
  - Gameplay and recorded demos share GameScreenSubroutine.
- id: recorded_demo
  facet: frontend
  label: Run-length recorded-input demo
  summary: Playback replaces held and newly pressed buttons using recorded masks and durations. Real held input
    or an exhausted/sentinel sequence injects Start to end the playback, so a visible gameplay image alone does
    not establish human control.
  instantiates:
  - concept: frontend.attract.input_playback_demo
  evidence:
  - kind: decomp_source
    ref: warioland4:src/demo_input.c:DemoInputPlayback
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:src/demo_input.c:DemoInputRecord
    confidence: 0.94
  reads:
  - gDemoInputs[]:u16 button mask
  - gDemoInputLengths[]:u16 frames
  - gDemoSequenceIndex:u16
  - gButtonsHeld:u16
  writes:
  - gButtonsHeld:u16
  - gButtonsPressed:u16
  - gDemoSequenceIndex:u16
  - gDemoButtonPressTimer:u16
  invariants:
  - Pressed buttons are rising edges of the previous and current playback masks.
  relations:
  - type: part_of
    target: mode_flow
- id: verified_save
  facet: frontend
  label: Two save files and checked SRAM writes
  summary: The save interface offers two selected files and implements bytewise write verification with at most
    three attempts. SRAM helper tables assign distinct ranges to the two files; verified bytes do not establish
    higher-level atomic recovery or checksum guarantees.
  instantiates:
  - concept: frontend.save.verified_sram_write
  - concept: frontend.menu.file_select_slots
  evidence:
  - kind: decomp_source
    ref: warioland4:src/sram.c:SramWriteChecked
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:src/sram_misc.c:sUnk_80953EC
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:include/global_data.h:SaveFile
    confidence: 0.94
  reads:
  - save.source_bytes:byte[]
  - gSelectedSaveFile:u8 enum
  writes:
  - save.sram_bytes:byte[]
  invariants:
  - A matching write stops retries; failure returns the mismatching address.
  params:
    write_attempts:
      value: 3
      unit: attempts
      evidence:
      - kind: decomp_source
        ref: warioland4:src/sram.c:SramWriteChecked
        confidence: 0.94
    save_slots:
      value: 2
      unit: slots
      evidence:
      - kind: decomp_source
        ref: warioland4:include/global_data.h:SaveFile
        confidence: 0.94
- id: soft_reset
  facet: frontend
  label: Guarded button-chord soft reset
  summary: A+B+Start+Select routes to the soft-reset game mode when reset is enabled. The handler ignores the chord
    during an already active soft reset or when the disable flag is set.
  instantiates:
  - concept: frontend.soft_reset.button_combo
  evidence:
  - kind: decomp_source
    ref: warioland4:src/main.c:CheckSoftReset
    confidence: 0.94
  reads:
  - gButtonsHeld:u16 mask
  - gDisableSoftReset:u8 bool
  - gMainGameMode:s16
  writes:
  - gMainGameMode:s16
  invariants:
  - A disabled reset flag prevents this transition.
- id: pause
  facet: ui_hud
  label: Conditional Start pause routing
  summary: Start can request the pause mode only when the player pause timer and an additional actor status byte
    permit it. Boss-related states may route to BossPause instead; pause can return to gameplay, leave a stage,
    or soft reset.
  instantiates:
  - concept: ui_hud.menu.pause_menu_hub
  evidence:
  - kind: decomp_source
    ref: warioland4:src/game_screen.c:GameScreenSubroutine
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:src/main.c:AgbMain
    confidence: 0.94
  reads:
  - gButtonsPressed:u16 mask
  - gWarioPauseTimer:u16 frames
  - gWarioData.unk_02:u8
  - gTimerState:u8
  writes:
  - gPauseFlag:s8
  - gSubGameMode:s16
  - gMainGameMode:s16
  invariants:
  - Normal movement and collision run only after the pause timer expires in the active gameplay submode.
- id: initial_health
  facet: mechanics
  label: Context and difficulty-dependent starting health
  summary: Ordinary super-hard stages initialize current health to one. Golden-passage or boss contexts instead
    initialize eight on normal difficulty and four otherwise; that branch precedes the ordinary super-hard branch.
  instantiates:
  - concept: mechanics.health.difficulty_initial_pool
  evidence:
  - kind: decomp_source
    ref: warioland4:src/game_screen.c:GameScreenInitWario
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:include/wario.h:MAX_HEARTS
    confidence: 0.94
  reads:
  - gDifficulty:u8 enum
  - gCurrentPassage:u8 enum
  - gCurrentStageNumber:u8
  - gHasTemporarySave:u8 bool
  writes:
  - gHeartMeter.current:u8
  invariants:
  - Initialization is skipped for a temporary-save restore.
  params:
    maximum_hearts:
      value: 8
      unit: hearts
      evidence:
      - kind: decomp_source
        ref: warioland4:include/wario.h:MAX_HEARTS
        confidence: 0.94
    boss_or_golden_start:
      value: 8
      unit: hearts
      evidence:
      - kind: decomp_source
        ref: warioland4:src/game_screen.c:GameScreenInitWario
        confidence: 0.94
      variants:
      - when: difficulty != normal and context is boss or golden passage
        value: 4
        unit: hearts
    ordinary_super_hard_start:
      value: 1
      unit: heart
      evidence:
      - kind: decomp_source
        ref: warioland4:src/game_screen.c:GameScreenInitWario
        confidence: 0.94
- id: health_hud
  facet: ui_hud
  label: Eight-heart health and recovery gauges
  summary: Separate graphics tables represent zero through eight hearts, a flashing one-heart state, and a second
    gauge with eight fill increments. The inspected gameplay frame visibly shows the heart row; the exact refill-to-heart
    conversion timing remains unverified.
  instantiates:
  - concept: ui_hud.resource.health_meter
  evidence:
  - kind: decomp_source
    ref: warioland4:src/hud.c:sHeartMeterGfx
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:src/hud.c:sHeartGaugeGfx
    confidence: 0.94
- id: collection_hud
  facet: ui_hud
  label: Jewel quadrants and CD status artwork
  summary: The HUD source defines full and partial variants for four jewel quadrants and a CD icon. These are authored
    display assets associated with collection state; their complete update policy has not been traced.
  instantiates:
