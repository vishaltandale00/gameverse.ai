    confidence: 0.94
- id: reaction_dispatch
  facet: mechanics
  label: Mutually exclusive reaction control regimes
  summary: The controller indexes pose and request tables by the current reaction byte, then invokes additional
    reaction-specific handlers. Collision entry also dispatches on reaction, so a transformed form changes more
    than the avatar graphics.
  instantiates:
  - concept: mechanics.state.reaction_dispatch
  evidence:
  - kind: decomp_source
    ref: warioland4:asm/disasm_wario.s:WarioProcessControls
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:asm/disasm_wario.s:WarioProcessCollision
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:include/wario.h:WarioReaction
    confidence: 0.94
  reads:
  - gWarioData.reaction:u8 enum
  - gWarioData.pose:u8
  - gWarioData.xPosition:u16 subpx
  - gWarioData.yPosition:u16 subpx
  writes:
  - gWarioData.pose:u8
  - gPreviousXPosition:u16 subpx
  - gPreviousYPosition:u16 subpx
  invariants:
  - A single reaction selects each table entry; reaction-specific jump and collision semantics must not be assumed
    interchangeable.
  params:
    reaction_regimes:
      value: 12
      unit: regimes
      evidence:
      - kind: decomp_source
        ref: warioland4:include/wario.h:WarioReaction
        confidence: 0.94
- id: contact_transform
  facet: mechanics
  label: Collision-triggered form changes
  summary: Contact helpers request flaming, fat, zombie, snowman, puffy, bouncy, bat, frozen, flat and mask reactions.
    The shared macro checks WarioCheckReaction before changing the reaction and requesting pose zero; eligibility
    and recovery details are outside this extraction.
  instantiates:
  - concept: mechanics.state.reaction_dispatch
  evidence:
  - kind: decomp_source
    ref: warioland4:src/sprite_collision.c:SpriteCollisionTransformWario
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:src/sprite_collision.c:SpriteCollisionTransformWarioFlaming
    confidence: 0.94
  reads:
  - gWarioData.reaction:u8 enum
  - reaction.request:u8 enum
  writes:
  - gWarioData.reaction:u8 enum
  - gWarioData.pose:u8
  invariants:
  - The macro writes a form only when WarioCheckReaction returns false.
  relations:
  - type: modulates
    target: reaction_dispatch
- id: movement_collision
  facet: movement_physics
  label: Motion history drives collision direction
  summary: The collision wrapper compares current and previous X/Y positions to construct horizontal and vertical
    movement-direction flags. It then invokes reaction-indexed handlers; enumerated normal poses include jumping,
    rolling, crouching, swimming-related alternatives and ladders, without establishing their numeric acceleration
    values.
  instantiates:
  - concept: mechanics.state.reaction_dispatch
  evidence:
  - kind: decomp_source
    ref: warioland4:asm/disasm_wario.s:WarioProcessCollision
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:include/wario.h:WarioPoseNormal
    confidence: 0.94
  reads:
  - gWarioData.xPosition:u16 subpx
  - gWarioData.yPosition:u16 subpx
  - gPreviousXPosition:u16 subpx
  - gPreviousYPosition:u16 subpx
  - gWarioData.reaction:u8
  writes:
  - gUnk_3001918:collision scratch struct
  invariants:
  - This wrapper dispatches collision according to the current reaction.
  relations:
  - type: requires
    target: reaction_dispatch
- id: contact_damage
  facet: mechanics
  label: Damage-pose immunity gate
  summary: Left and right damage helpers ignore contacts while damageTimer is positive. Otherwise they set a direction
    and request the taking-damage pose; the excerpt does not establish heart decrement amount or invulnerability
    duration.
  instantiates:
  - concept: mechanics.combat.contact_damage
  evidence:
  - kind: decomp_source
    ref: warioland4:src/sprite_collision.c:SpriteCollisionTakeDamageLeft
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:src/sprite_collision.c:SpriteCollisionTakeDamageRight
    confidence: 0.94
  reads:
  - gWarioData.damageTimer:u8 frames
  writes:
  - gWarioData.horizontalDirection:u16 mask
  - gWarioData.pose:u8
  invariants:
  - These helpers do not request a damage pose during a positive damage timer.
- id: carry_rock
  facet: mechanics
  label: Carryable rock state machine
  summary: A rock can enter directional lifting and carried poses, with distinct helpers that position it relative
    to the actor. Carried initialization suppresses immediate actor collision and clears a death-related flag; ground
    pound selects a directional bump according to relative X.
  instantiates:
  - concept: mechanics.interaction.carryable_world_object
  evidence:
  - kind: decomp_source
    ref: warioland4:src/sprite_ai/rock.c:RockCarriedRightInit
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:src/sprite_ai/rock.c:SpriteRock
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:src/sprite_ai/rock.c:RockGroundPounded
    confidence: 0.94
  reads:
  - gCurrentSprite.pose:u8
  - gCurrentSprite.xPosition:u16 subpx
  - gWarioData.xPosition:u16 subpx
  writes:
  - gCurrentSprite.pose:u8
  - gCurrentSprite.disableWarioCollisionTimer:u8
  - gCurrentSprite.status:u16 flags
  invariants:
  - Only the corresponding pose branch invokes each lifting/carried helper.
- id: throw_rock
  facet: mechanics
  label: Directional soft and hard throws
  summary: The rock dispatches separate left/right and upward soft/hard projectile handlers. Hard throws store directional
    continuation bits in the high nibble of health, allowing a later collision pose to choose its next motion routine.
  instantiates:
  - concept: mechanics.combat.thrown_projectile
  evidence:
  - kind: decomp_source
    ref: warioland4:src/sprite_ai/rock.c:SpriteRock
    confidence: 0.94
  reads:
  - gCurrentSprite.pose:u8
  - gCurrentSprite.health:u8 packed flags
  writes:
  - gCurrentSprite.pose:u8
  - gCurrentSprite.health:u8 packed flags
  - gCurrentSprite.work2:u8
  invariants:
  - Low-nibble health state and high-nibble throw flags have different meanings.
  relations:
  - type: requires
    target: carry_rock
    note: Carried-object interaction precedes a player throw; launch input timing not traced.
- id: escape_switch
  facet: mechanics
  label: Return switch starts the escape phase
  summary: The switch handler records persistent activation, sets gSwitchPressed and gTimerState to one, and changes
    the escape switch state. It resets the shared timer counter, spawns secondary effects and stops current music;
    the initial timer values are not established here.
  instantiates:
  - concept: mechanics.world.switch_activates_return_goal
  evidence:
  - kind: decomp_source
    ref: warioland4:asm/sprite_ai/disasm_switch.s:func_802B694
    confidence: 0.94
  reads:
  - gCurrentRoom:u8
  - gCurrentSprite.roomSlot:u8
  writes:
  - gSwitchPressed:u8 bool
  - gTimerState:u8 enum
  - gSwitchStates[4]:u8
  - gUnk_3000BEC:s32 updates
  - gPersistentSpriteData[][]:u8
  invariants:
  - Activation is remembered in room persistent state.
  relations:
  - type: modulates
    target: return_vortex
  - type: modulates
    target: timeout_drain
- id: return_vortex
  facet: mechanics
  label: Switch-gated return portal
  summary: The vortex initially shrinks and becomes noninteractive; gSwitchPressed triggers an expansion phase before
    its idle state permits actor collision. The finish callback disables control, starts a stage-clear presentation
    and calls AutosaveStageClear.
  instantiates:
  - concept: mechanics.world.switch_activates_return_goal
  evidence:
  - kind: decomp_source
    ref: warioland4:src/sprite_ai/vortex.c:SpriteVortex
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:src/sprite_ai/vortex.c:VortexFinishStage
    confidence: 0.94
  reads:
  - gSwitchPressed:u8 bool
  - gCurrentSprite.pose:u8
  - gCurrentSprite.work2:u8 scale
  writes:
  - gCurrentSprite.disableWarioCollisionTimer:u8
  - gCurrentSprite.pose:u8
  - gDisableWario:u8 bool
  - gWarioPauseTimer:u16 frames
  invariants:
  - The active idle branch releases actor-collision suppression; finish saves the stage collection.
  relations:
  - type: gated_by
    target: escape_switch
  - type: requires
    target: stage_clear_banking
- id: escape_countdown
  facet: mechanics
  label: Eligibility-gated deadline counter
  summary: The escape updater advances only in active gameplay submode two, timer states zero through three and
    with no actor pause timer. When timer state is one, a 64-update cadence decrements decimal time digits; reaching
    zero changes timer state or enters failure depending on the remaining stage score.
  instantiates:
  - concept: mechanics.goal.timed_escape
  evidence:
  - kind: decomp_source
    ref: warioland4:asm/disasm_score.s:func_8075988
    confidence: 0.94
  reads:
  - gSubGameMode:s16
  - gTimerState:u8 enum
  - gWarioPauseTimer:u16 frames
  - gHeartMeter.current:u8
  - gStageScore:s32 native score
  writes:
  - gUnk_3000BEC:s32 eligible updates
  - gUnk_3000BF0:decimal countdown digits
  - gTimerState:u8 enum
  invariants:
  - An actor pause suspends this updater.
  - Displayed countdown cadence is not the FRAME_RATE macro.
  params:
    displayed_second_updates:
      value: 64
      unit: eligible gameplay updates/displayed second
      evidence:
      - kind: decomp_source
        ref: warioland4:asm/disasm_score.s:func_8075988
        confidence: 0.94
  relations:
  - type: gated_by
    target: escape_switch
  - type: modulates
    target: timeout_drain
- id: timeout_drain
  facet: economy
  label: Timeout spends score before terminal failure
  summary: In post-countdown states above one, the updater subtracts one native score unit every eight eligible
    gameplay updates and emits a loss effect. A zero stage score changes timer state to four and starts the failure
    presentation; route planning and preserving a score reserve are inferred player strategies, not directly observed
    skill measurements.
  instantiates:
  - concept: economy.drain.post_timeout_score
  evidence:
  - kind: decomp_source
    ref: warioland4:asm/disasm_score.s:func_8075988
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:include/score.h:SCORE_RATIO
    confidence: 0.94
  reads:
  - gTimerState:u8 enum
  - gStageScore:s32 native score
  - gUnk_3000BEC:s32 updates
  writes:
  - gStageScore:s32 native score
  - gTimerState:u8 enum
  - gWarioPauseTimer:u16 frames
  invariants:
  - Score cannot become negative through ScoreGivePoints.
  params:
    drain_amount:
      value: 10
      unit: displayed points/event
      evidence:
      - kind: decomp_source
        ref: warioland4:asm/disasm_score.s:func_8075988
        confidence: 0.94
      native_value: 1
      native_unit: native score unit
    drain_interval:
      value: 8
      unit: eligible gameplay updates
      evidence:
      - kind: decomp_source
        ref: warioland4:asm/disasm_score.s:func_8075988
        confidence: 0.94
  relations:
  - type: requires
    target: escape_countdown
- id: exit_token
  facet: progression
  label: Exit-associated token persists beyond its sprite
  summary: Collecting Keyzer removes its sprite, marks the room slot despawned and sets gCollectedKeyzer. Reinitializing
    an already collected token suppresses respawn; stage-clear banking copies this flag into the persistent collection,
    while the exact stage-selection door predicate remains untraced.
  instantiates:
  - concept: progression.collectible.persistent_exit_key
  evidence:
  - kind: decomp_source
    ref: warioland4:src/sprite_ai/keyzer.c:KeyzerCollect
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:src/sprite_ai/keyzer.c:KeyzerInit
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:src/autosave.c:AutosaveStageClear
    confidence: 0.94
  reads:
  - gCollectedKeyzer:u8 bool
  - gCurrentRoom:u8
  - gCurrentSprite.roomSlot:u8
  writes:
  - gCollectedKeyzer:u8 bool
  - gPersistentSpriteData[][]:u8
  - gCurrentSprite.status:u16
  invariants:
  - An already collected token is not recreated by KeyzerInit.
- id: jewel_boss_gate
  facet: progression
  label: Complete stage jewels announce boss-door opening
  summary: Four directional jewel-piece flags are banked on stage clear. If a run flag has the special value two,
    the routine counts fully completed stage jewels and sets the boss-door presentation flag when all four ordinary
    stages, or the single entry/golden stage, are complete.
  instantiates:
  - concept: progression.gating.collect_all_tokens
  evidence:
  - kind: decomp_source
    ref: warioland4:src/autosave.c:AutosaveStageClear
    confidence: 0.94
  - kind: decomp_source
    ref: warioland4:include/global_data.h:NORMAL_STAGE_COUNT
    confidence: 0.94
  reads:
  - gCollectedNEJewelPiece:u8
  - gCollectedSEJewelPiece:u8
  - gCollectedSWJewelPiece:u8
  - gCollectedNWJewelPiece:u8
  - gCurrentCollection[][]:ItemCollection
  writes:
  - gCurrentCollection[][]:ItemCollection
  invariants:
  - All four quadrant flags must be present for a stage to count as a completed jewel.
  - The checked flag requests a boss-door-opening sequence; the full door-collision predicate has not been inspected.
  params:
    quadrants_per_jewel:
      value: 4
      unit: pieces/jewel
      evidence:
      - kind: decomp_source
        ref: warioland4:src/autosave.c:AutosaveStageClear
        confidence: 0.94
    ordinary_stages:
      value: 4
      unit: stages/passage
      evidence:
      - kind: decomp_source
        ref: warioland4:include/global_data.h:NORMAL_STAGE_COUNT
        confidence: 0.94
  relations:
  - type: requires
    target: stage_clear_banking
- id: final_passage_gate
  facet: progression
  label: Four completed passage bosses unlock the final passage
  summary: Boss clear banks the collected boss rewards and boss-defeated state. Defeating all four central passage
    bosses changes the current passage to Golden.
  instantiates:
  - concept: progression.gating.event_locked_doors
  evidence:
