proposed_concepts:
- id: mechanics.state.reaction_dispatch
  label: Reaction-specific control dispatch
  definition: A mutually exclusive reaction state selects control and collision handlers and legal action poses.
- id: mechanics.interaction.carryable_world_object
  label: Carryable world object
  definition: A world entity can transition through lifting, carried, thrown, and collision response states.
- id: mechanics.world.switch_activates_return_goal
  label: Switch activates return goal
  definition: A world switch changes a previously unavailable return endpoint into a usable completion goal.
- id: mechanics.health.difficulty_initial_pool
  label: Difficulty-dependent initial health
  definition: Initial health depends on difficulty and encounter context rather than a permanent capacity upgrade.
- id: progression.collectible.persistent_exit_key
  label: Persistent run exit token
  definition: A collected exit-related token is remembered independently of the visible entity, including across
    room reloads.
- id: progression.difficulty.completion_unlock
  label: Completion-conditioned difficulty unlock
  definition: An additional difficulty option is unlocked only when completion predicates hold.
- id: economy.drain.post_timeout_score
  label: Post-timeout score drain
  definition: A deadline transitions into repeated score loss; exhausting that reserve triggers failure.
- id: economy.converter.remaining_health_bonus
  label: Remaining health converted into score
  definition: Successful completion awards a bounded amount of score per remaining health unit.
- id: frontend.save.verified_sram_write
  label: Verified SRAM write
  definition: Save bytes are written to SRAM and compared with source bytes, with a bounded retry count.
- id: ui_hud.resource.health_meter
  label: Health and auxiliary recovery meters
  definition: Discrete visual meters expose current health and an auxiliary recovery collection state.
- id: ui_hud.collection.goal_status_icons
  label: Goal collection status icons
  definition: HUD icons show possession of discrete progression collectibles.
- id: rendering.transfer.vblank_obj_dma
  label: VBlank object graphics streaming
  definition: A VBlank callback transfers buffered object attributes, animation tiles, and palettes into display
    memory.
- id: rendering.pipeline.multimode_display
  label: Phase-dependent display mode pipeline
  definition: Different phases use distinct hardware display modes, rather than one permanent rendering mode.
- id: audio.voice.random_noninterrupting_barks
  label: Noninterrupting sampled voice variation
  definition: An event selects a voice sample from a set while respecting an already playing voice channel.
- id: setting.environment.masonry_treasure_spaces
  label: Masonry and treasure spaces
  definition: A visual setting uses constructed stone interiors and collectible-rich exploration spaces.
