proposed_concepts:
- id: ai.boss.scale_shift_interior_boss
  label: Scale-shift interior boss
  definition: Boss fight with a phase that requires the player to change size (or form) to enter the boss's body
    or a hidden part of it, continuing the fight in another space with shared boss state.
  is_a:
  - ai.boss.multi_part_boss
- id: ai.enemy.ambush_grab
  label: Ambush grab
  definition: Enemy that appears or drops onto the player after a telegraph, captures them on contact and displaces
    them (to an entrance, into its body) or holds them until escape.
  seed_source: 'game_ai_taxonomy: Scripted / pattern-based AI'
- id: ai.enemy.erratic_flyer
  label: Erratic flyer
  definition: Flying enemy that changes heading at random intervals, alternating flight and rest phases, often waking
    on player proximity.
  seed_source: VGDL RandomNPC (generalized)
- id: ai.enemy.guard_counter_melee
  label: Guard-and-counter melee
  definition: Melee enemy that keeps a fighting distance, blocks frontal attacks, and becomes vulnerable only around
    its own attacks or after being staggered.
  seed_source: 'game_ai_taxonomy: Finite state machine'
- id: ai.enemy.line_of_sight_charge
  label: Alignment charge
  definition: Enemy that wanders until the player is aligned on an axis or in clear line of sight, then charges in
    a straight line at increased speed.
  seed_source: 'game_ai_taxonomy: Aggro / detection range'
- id: ai.enemy.proximity_hop_attack
  label: Proximity hop attack
  definition: Enemy that creeps toward the player and, inside a trigger radius, launches a committed hop or lunge
    with its own arc.
- id: ai.enemy.random_walk_shooter
  label: Random-walk shooter
  definition: Enemy that alternates pauses and short walks in random directions and fires a projectile when facing
    the player.
  seed_source: VGDL RandomNPC + Missile
- id: ai.movement.home_territory_leash
  label: Home territory leash
  definition: Enemy movement constrained to an authored home region; outside it the enemy steers back, and some
    behaviours trigger only when the player is inside the region.
  seed_source: 'game_ai_taxonomy: Steering behaviors'
- id: ai.perception.scale_filtered_target_selection
  label: Scale-filtered targeting
  definition: Enemies acquire the player as a target only when the player's size or form matches the enemy's scale
    class, so changing size changes which enemies are threats.
- id: ai.spawn.wave_until_cleared
  label: Clear-the-room ambush
  definition: Room spawns a monitored group of enemies (often sealing exits or changing music) and sets a completion
    flag once all are defeated.
  seed_source: 'gdp: Arenas'
- id: camera.parallax.foreground_overspeed_scale_cue
  label: Overspeed foreground parallax
  definition: Layers scroll faster than the camera to read as objects close to the lens, used to sell a small avatar
    scale.
  is_a:
  - camera.parallax.layer_ratio_scroll
- id: camera.transition.edge_slide_scroll
  label: Edge-slide room transition
  definition: Leaving a room by its edge scrolls the view a full screen to the adjacent room at a fixed speed while
    the avatar is moved a short distance inside.
  seed_source: flip-screen / room scrolling (our vocabulary)
- id: economy.converter.collection_gacha
  label: Collection gacha
  definition: A currency is converted into random draws from a collectible set, with the chance of a new item depending
    on collection completeness, extra currency spent and a minimum floor.
  seed_source: 'machinations: Converter; gdp: Collecting'
- id: economy.trade.fixed_price_shop
  label: Fixed-price shop
  definition: Vendor exchanging currency for items at authored prices, refusing purchases the player cannot afford.
  seed_source: 'gdp: Trading'
- id: frontend.boot.publisher_logos
  label: Publisher logo sequence
  definition: Boot sequence showing publisher/developer logos for a fixed time or until a button press.
  seed_source: 'front_end_flow: Boot logo sequence'
- id: frontend.menu.name_entry_grid
  label: Name entry grid
  definition: On-screen character grid for naming the save or avatar with paging, backspace and confirm.
- id: frontend.save.save_anywhere
  label: Save anywhere
  definition: Saving is allowed at any time from a menu; loading resumes at a recorded checkpoint such as the last
    room or area entry.
  seed_source: 'gdp: Save Files'
- id: frontend.title.idle_loop_to_logos
  label: Idle loop to intro
  definition: An idle title screen restarts the boot/intro sequence after a timeout instead of playing a gameplay demo.
  is_a:
  - frontend.flow.mode_state_machine
- id: mechanics.avatar.mirrored_clones
  label: Mirrored clones
  definition: The player temporarily spawns copies that replicate the avatar's movement and actions, used to press
    multiple switches or combine strength.
- id: mechanics.combat.auto_revive_consumable
  label: Auto-revive consumable
  definition: A carried consumable is automatically used at zero health to restore some health instead of ending the
    game.
  seed_source: 'gdp: Extra Lives (related)'
- id: mechanics.combat.button_mash_escape
  label: Button-mash escape
  definition: When grabbed, repeated button presses fill an escape meter before a harmful timer completes.
- id: mechanics.combat.equipment_theft
  label: Equipment theft
  definition: Enemy action that removes a piece of the player's equipment, which must be recovered or re-bought.
  seed_source: 'gdp: Ability Losses'
- id: mechanics.combat.tool_specific_enemy_reaction
  label: Tool-specific enemy reaction
  definition: Enemies react differently to each tool (sucked in, flipped, stripped of armour, stunned) so tools act
    as typed keys in combat.
  is_a:
  - mechanics.combat.enemy_weakness_mask
- id: mechanics.hazard.pit_respawn_breadcrumb
  label: Pit respawn at last safe tile
  definition: Falling into a pit or deadly liquid costs a small penalty and returns the avatar to the most recent
    safe ground position instead of killing it.
  seed_source: 'gdp: Penalties'
- id: mechanics.hazard.sinking_floor
  label: Sinking floor
  definition: Terrain that slows the avatar and progressively sinks it, causing a penalty unless the player leaves
    in time or moves fast enough.
  is_a:
  - mechanics.hazard.environmental_damage_over_time
- id: mechanics.puzzle.push_pull_block
  label: Push/pull blocks
  definition: Movable blocks or furniture that the avatar pushes or pulls along a grid after sustained contact.
  seed_source: VGDL Passive / bounceForward
- id: mechanics.scale.portal_size_toggle
  label: Portal size toggle
  definition: The avatar switches between a normal and a tiny scale only at designated points; scale changes hitbox,
    speed, usable actions, passable terrain, hazards and which enemies perceive it.
  seed_source: 'gdp: Abilities / Alternative Realities (related)'
- id: mechanics.weapon.health_conditional_projectile
  label: Health-conditional projectile
  definition: Melee attack that also fires a projectile only when health meets a condition (full health, or critically
    low).
- id: movement_physics.collision.corner_nudge_assist
  label: Corner nudge
  definition: When the avatar walks into the edge of a wall and only part of its leading side is blocked, movement
    is redirected sideways around the corner.
  seed_source: 'movement_physics_game_feel: Polish'
- id: movement_physics.collision.tile_mask_wall_slide
  label: Tile-mask wall slide
  definition: Sub-tile collision masks and per-axis blocking let diagonal movement slide along walls instead of stopping.
- id: movement_physics.dash.charge_dash
  label: Charge dash
  definition: After a short charge the avatar dashes at high fixed speed with limited steering, crashing back on
    walls.
- id: movement_physics.dash.dodge_roll
  label: Dodge roll
  definition: Short burst roll with scripted speed per frame used to reposition quickly.
- id: movement_physics.jump.z_axis_hop
  label: Top-down height jump
  definition: In a top-down view, jumping changes only a height coordinate (with shadow), letting the avatar cross
    gaps and pits while ground movement continues.
  is_a:
  - movement_physics.jump.fixed_impulse_gravity_arc
- id: movement_physics.ledge.one_way_ledge_hop
  label: One-way ledge hop
  definition: Pushing against a ledge edge for a short time hops the avatar down to the lower level; the ledge cannot
    be climbed back.
- id: movement_physics.locomotion.action_speed_penalty
  label: Action speed penalty
  definition: Walking speed is replaced by a slower value while performing actions such as guarding, aiming or charging.
- id: movement_physics.locomotion.instant_eight_way_walk
  label: Instant 8-way walk
  definition: Top-down movement in 8 directions with no acceleration, constant speed and normalised diagonals.
  seed_source: VGDL GridPhysics / ContinuousPhysics (top-down)
- id: movement_physics.medium.swim_with_item
  label: Item-gated swimming
  definition: Deep water drowns the avatar unless an item enables swimming, which has its own slower speed, bursts
    and diving.
  is_a:
  - movement_physics.medium.liquid_drag
- id: movement_physics.surface.conveyor_push
  label: Conveyor push
  definition: Floor tiles that move the avatar in a fixed direction while standing on them.
  seed_source: VGDL Conveyor / conveySprite
- id: movement_physics.surface.ice_momentum
  label: Ice momentum
  definition: Slippery floor switching movement to low acceleration, low friction velocity physics.
  seed_source: VGDL slipForward
- id: narrative_delivery.dialogue.typewriter_dialogue
  label: Typewriter dialogue box
  definition: Text revealed character by character in a box with speed settings, page advance and simple choices.
  seed_source: 'gdp: Dialogues'
- id: progression.gating.consumable_key_lock
  label: Consumable key lock
  definition: Locks opened by spending a counted key scoped to a region; the opened lock persists.
  is_a:
  - progression.gating.typed_lock_and_key
  seed_source: 'dormans: Lock and key (single-use)'
- id: progression.guidance.companion_hint
  label: Companion hints
  definition: A companion character offers context-sensitive hints chosen from the player's current progress.
  is_a:
  - progression.guidance.hint_waypoint
- id: progression.skills.learned_technique_flags
  label: Learned techniques
  definition: Extra combat moves unlocked permanently as individual flags, typically taught by NPCs, each with its
    own trigger condition.
  seed_source: 'gdp: New Abilities'
- id: progression.structure.dungeon_with_boss_key
  label: Dungeon with boss key
  definition: Self-contained level with local keys, a map/compass aid, a unique boss key and a boss whose defeat
    marks completion and grants a progression token.
  seed_source: 'progression_structure: Levels'
- id: progression.structure.global_progress_level
  label: Global progress level
  definition: A single ordinal value summarising story milestones, used by many systems to gate content.
- id: progression.structure.scale_layered_world
  label: Scale-layered world
  definition: The same world contains a parallel layer of spaces reachable only at a different avatar scale, entered
    at specific transition points.
  is_a:
  - progression.structure.interconnected_areas
- id: progression.travel.unlockable_fast_travel_points
  label: Unlockable fast travel
  definition: Fixed travel points activated by visiting them, later selectable from a menu to warp.
  seed_source: 'progression_structure: Fast travel / save points'
- id: progression.unlock.distributed_matching_token_fusion
  label: Distributed matching-token unlocks
  definition: Players collect token halves and match them, by shape, with halves held by many NPCs or objects; each
    match permanently changes some remote part of the world (new chests, paths, enemies), often revealed by a cutscene
    and map marker.
  seed_source: 'gdp: Collecting / Trading (combined)'
- id: progression.world.recent_room_enemy_memory
  label: Recent-room enemy memory
  definition: Defeated enemies stay defeated only for a short list of recently visited rooms, so enemies respawn
    after travelling far enough.
- id: projection.top_down.three_quarter_view
  label: Top-down 3/4 view
  definition: Overhead view with a slight tilt so vertical faces are visible, movement on a ground plane.
  seed_source: Top-down / bird's-eye
- id: projection.top_down.z_height_layering
  label: Height axis and floor layers
  definition: A top-down world adds a height coordinate for jumps and falls and two or more collision layers for
    bridges and upper floors.
- id: rendering.raster.per_scanline_affine
  label: Per-scanline affine
  definition: Affine background parameters rewritten every scanline (HBlank DMA) to warp a layer, e.g. a rotating
    cylinder or Mode-7 floor.
  is_a:
  - rendering.background.affine_rotscale
  seed_source: HBlank raster effects / Mode 7
- id: setting.theme.high_fantasy
  label: High fantasy
  definition: Fiction set in an invented world with magic, kingdoms, monsters and legendary artefacts.
  seed_source: 'igdb theme: Fantasy'
- id: setting.tone.whimsical_scale_shift
  label: Whimsical scale shift
  definition: Light-hearted tone built on seeing everyday places and objects from a tiny creature's perspective.
- id: ui_hud.hud.context_action_label
  label: Context action label
  definition: HUD label naming what a context button will do right now (talk, roll, shrink, open).
  seed_source: 'gdp: Tooltips'
- id: ui_hud.input.two_slot_item_assignment
  label: Two-slot item assignment
  definition: The player assigns tools from an inventory to two action buttons and swaps them through a menu.
- id: ui_hud.menu.inventory_equip_grid
  label: Inventory equip grid
  definition: Pause screen grid of collected tools where selecting one equips it to an action button.
open_questions:
- Sword damage per tier and move, enemy contact damage, and per-pair knockback/i-frames live in the binary collision
  matrix (data_080B7B74/gCollisionMtx.bin, 173x34 entries), which is not extracted in this checkout; damage params
  are therefore missing. Extracting assets from the ROM would resolve this.
- Sub-tile collision shape tables (data_08007DF4/*.bin) are not extracted, so exactly which shapes open only to Minish
  Link is unknown.
- Kinstone colour mapping (palette 4/0/1/2 = gold/red/blue/green) and counts (9/24/18/49) are derived from palette
  indices, not from named colour constants.
- Ice, air-control and corner-nudge numbers come from hand-written ASM (asm/src/player.s, code_08001A7C.s) and should
  be confirmed by a frame-stepped gameplay capture; current captures only cover the front end and the first seconds
  of play.
- Captures did not reach gameplay rooms with raster effects, so HBlank-DMA uses (iris, dark-room light, barrel,
  steam) are code-only.
- Decomp completeness was not measured (progress.py needs a build map; no build directory). src/ contains no NONMATCH
  or ASM_FUNC markers; residual hand-written ASM (~6.2k lines in asm/src, incl. player.s, intr.s, collision and
  GravityUpdate helpers) is likely original hand-ARM code.
- Hit-type ids (e.g. Darknut 0x56 vs 0x51, contact type 0x13 as Gust Jar suction) are interpreted from usage, not
  named constants.
- Per-room data (which tiles, obstacles and items sit where; the item order across dungeons) was not parsed; a full
  gating graph needs a room-data extraction pass.
- Many enemies (Gleerok, Gyorg pair, Vaati forms, Moldorm, Madderpillar, Acro Bandits, Wizzrobes) were not decomposed
  in detail.
- The save.h comment for dungeonItems contradicts the code; the code (map 1, compass 2, big key 4) was followed.
