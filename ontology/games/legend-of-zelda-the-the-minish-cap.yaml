schema_version: 0
id: legend-of-zelda-the-the-minish-cap
game:
  title: 'The Legend of Zelda: The Minish Cap'
  platform: gba
  game_code: BZME
  rom_sha1: b4bd50e4131b027c334547b4524e2dbbd4227130
  year: 2005
  developer: Capcom / Flagship (published by Nintendo)
  derived_genres:
  - action_adventure
  - top_down_adventure
  evidence_basis:
  - decomp_source
  - capture_telemetry
  - capture_frame
  - derived
  - llm_knowledge
  sources:
  - kind: decomp
    ref: https://github.com/zeldaret/tmc @ 6fb6dfb4a7efbe24d0fd1dda5097af6131faacde (local/decomps/tmc; USA target
      sha1 b4bd50e4...; no NONMATCH/ASM_FUNC in src/, ~6.2k lines hand ASM in asm/src; binary data blobs such as
      gCollisionMtx.bin not extracted; progress % not computed - no build map)
  - kind: rom_header
    ref: local/re/roms.json id=legend-of-zelda-the-the-minish-cap (header GBAZELDA MC, maker 01, version 0, 16 MiB)
  - kind: captures
    ref: local/captures/legend-of-zelda-the-the-minish-cap run 20261015T234415-8f46cf (attract 3600 + frontend 5400
      frames, mGBA 0.10.5 HLE BIOS, harness 0.1.0, source commit d431b81 dirty tree)
  - kind: extraction_run
    ref: claude-opus-5-5, brief v1, 2026-10-16T03:56:00Z-2026-10-16T04:12:34Z, ~140 decomp files opened or grepped (lead + 3 parallel
      research subagents) plus 2 capture phases and 12 keyframes
conventions:
  units_convention: 'Positions x/y/z are Q16.16 px (z negative = above ground). Entity speed is s16 Q8.8 px/frame
    (0x100 = 1 px/frame) applied along one of 32 directions (0 = north, 8 = east, 0x80 bit = not moving) via a 256-step
    Q8.8 sine table, so diagonals are normalised. zVelocity is Q16.16 px/frame and GravityUpdate subtracts a Q16.16
    gravity per frame (Q_8_8(32) = 0.125 px/frame^2). Tiles are 16x16 px; collision data is per 8x8 quarter or per-pixel
    shape. Health is 8 units per heart. Timers are frames at ~59.73 fps. Params are converted to px and frames, with
    native values noted.'
  enemy_speed_column: enemy_stats speed values are definition speed / 256 (px/frame).
components:
- id: game_mode_flow
  facet: frontend
  label: Top-level task state machine with soft reset and sleep mode
  summary: 'AgbMain runs one task handler per frame (TITLE, FILE_SELECT, GAME, GAMEOVER, STAFFROLL, DEBUG), then
    the message, fade and audio updates. The GAME task has its own transition/init/main/exit states and main
    sub-states (init room, change room, update, change area, Minish portal, barrel update, subtask). Pause menus,
    the kinstone menu, world-event reveals, map hints and fast travel run as subtasks inside GAME. Holding A+B+Select+Start
    soft-resets. The pause menu also offers sleep mode (GBA Stop), woken with L+R+Select.'
  instantiates:
  - concept: frontend.flow.mode_state_machine
  - concept: frontend.soft_reset.button_combo
  reads:
  - input.buttons.held
  - main.task
  writes:
  - main.task
  - game.state
  - game.substate
  params:
    soft_reset_keys:
      value: A+B+Select+Start
      evidence:
      - kind: decomp_source
        ref: tmc:src/main.c:SoftResetKeysPressed
        confidence: 0.95
    top_level_tasks:
      value:
      - title
      - file_select
      - game
      - gameover
      - staffroll
      - debug
      evidence:
      - kind: decomp_source
        ref: tmc:src/main.c:sTaskHandlers
        confidence: 0.95
    subtasks:
      value: 11
      unit: subtask ids (exit, pause menu, map hint, kinstone menu, aux cutscene, portal cutscene, figurine menu,
        world event, fast travel, local map hint, ...)
      evidence:
      - kind: decomp_source
        ref: tmc:include/subtask.h
        confidence: 0.9
  relations:
  - type: part_of
    target: save_system
    note: game-over and staffroll end in save prompts
  evidence:
  - kind: decomp_source
    ref: tmc:src/main.c:AgbMain
    confidence: 0.9
  - kind: decomp_source
    ref: tmc:include/game.h (GameTask states and GameMain substates)
    confidence: 0.9
  - kind: decomp_source
    ref: tmc:src/main.c:SetSleepMode
    confidence: 0.85
- id: logos_and_title
  facet: frontend
  label: Nintendo/Capcom logos, zooming-sword title and idle loop back to logos (no attract demo)
  summary: 'Boot shows the Nintendo and Capcom logos (120-frame timer or key press). The USA title fades in the title
    BGM, zooms the Picori sword on an affine layer for 15 frames, holds 40 frames, then spawns the logo object for
    a 300-frame intro before showing a blinking PRESS START. A or Start (after fades) goes to file select. After 3600
    idle frames (60 s) the sequence returns to the logos; the retail game has no gameplay attract demo (demo.c is a
    kiosk scenario picker compiled only into the USA demo build). The 60 s attract capture stayed on the title.'
  instantiates:
  - concept: frontend.boot.publisher_logos
  - concept: frontend.title.idle_loop_to_logos
  reads:
  - input.buttons.pressed
  - title.timer
  writes:
  - main.task
  - title.state
  params:
    logo_timer:
      value: 120
      unit: frames
      evidence:
      - kind: decomp_source
        ref: tmc:src/title.c:HandleNintendoCapcomLogos
        confidence: 0.95
    title_intro_hold:
      value: 300
      unit: frames (360 JP/EU)
      evidence:
      - kind: decomp_source
        ref: tmc:src/title.c:HandleTitlescreenAnimationIntro
        confidence: 0.95
    title_idle_timeout:
      value: 3600
      unit: frames (60 s), then back to logos
      evidence:
      - kind: decomp_source
        ref: tmc:src/title.c:HandleTitlescreen (timer = 3600) / GetAdvanceState
        confidence: 0.9
  invariants:
  - Retail builds never play recorded gameplay on the title; idle only restarts the intro.
  relations:
  - type: part_of
    target: game_mode_flow
  - type: requires
    target: affine_title_and_sprites
  evidence:
  - kind: decomp_source
    ref: tmc:src/title.c:HandleTitlescreen
    confidence: 0.95
  - kind: decomp_source
    ref: tmc:src/demo.c:DemoTask (DEMO_USA only)
    confidence: 0.85
  - kind: capture_frame
    ref: capture:attract:keyframes f000078_scene (Nintendo/Capcom logos), f000290_scene (sword), f003543 (title)
    confidence: 0.95
- id: file_select_and_naming
  facet: frontend
  label: Three-slot file select with copy/erase, options and 6-character name entry
  summary: File select lists 3 slots; empty slots open name entry, valid slots open a view with Start / Copy / Erase,
    R opens options (message speed, brightness). Name entry is a 13x6 character grid with page switching on L/R, B
    as backspace and Start jumping to END; names are up to 6 characters and cannot be empty. New files start with
    3 hearts. The capture shows the name grid and a "Saving file..." dialog when the slot is created.
  instantiates:
  - concept: frontend.menu.file_select_slots
  - concept: frontend.menu.name_entry_grid
  reads:
  - save.header
  - save.files[*].valid
  - input.buttons.pressed
  writes:
  - save.files[*]
  - save.header.name
  params:
    save_slots:
      value: 3
      evidence:
      - kind: decomp_source
        ref: tmc:include/main.h:NUM_SAVE_SLOTS
        confidence: 0.95
    name_length:
      value: 6
      unit: characters
      evidence:
      - kind: decomp_source
        ref: tmc:include/save.h:FILENAME_LENGTH
        confidence: 0.95
    file_operations:
      value:
      - start
      - copy
      - erase
      evidence:
      - kind: decomp_source
        ref: tmc:src/fileselect.c:sub_08050C54
        confidence: 0.85
    message_speeds:
      value:
      - 5
      - 3
      - 1
      unit: frames per character (slow/normal/fast; default normal)
      evidence:
      - kind: decomp_source
        ref: tmc:src/message.c:TextDispUpdate
        confidence: 0.85
  relations:
  - type: part_of
    target: game_mode_flow
  - type: requires
    target: save_system
  evidence:
  - kind: decomp_source
    ref: tmc:src/fileselect.c:sub_08050940
    confidence: 0.85
  - kind: decomp_source
    ref: tmc:src/fileselect.c:ResetSaveFile
    confidence: 0.9
  - kind: capture_frame
    ref: capture:frontend:keyframes f000670 (ENTER A NAME grid), f000820_scene (Saving file dialog)
    confidence: 0.95
- id: save_system
  facet: frontend
  label: Anywhere-save to mirrored, checksummed EEPROM records
  summary: 'The player can save from the pause menu at any time (and at game over / after credits); loading resumes
    at the last recorded room-entry status. Saves go to 8 KiB EEPROM: a header plus three 0x500-byte slots, each written
    twice (primary and mirror at +0x1000) with status words (valid / untouched / deleted) and a two-part checksum;
    reads fall back to the mirror. Saving is a staged state machine that fades master volume out by 8 per frame,
    waits 8 frames, writes, then fades volume back in.'
  instantiates:
  - concept: frontend.save.save_anywhere
  - concept: frontend.save.redundant_slot_backup
  reads:
  - save.*
  writes:
  - eeprom.slots[3]
  - eeprom.header
  params:
    save_media_bytes:
      value: 8192
      unit: bytes EEPROM (64 Kbit)
      evidence:
      - kind: decomp_source
        ref: tmc:src/eeprom.c:gEEPROMConfig8k
        confidence: 0.9
    save_file_bytes:
      value: 1204
      unit: bytes (0x4B4) per slot
      evidence:
      - kind: decomp_source
        ref: tmc:include/save.h:SaveFile
        confidence: 0.9
    copies_per_record:
      value: 2
      evidence:
      - kind: decomp_source
        ref: tmc:src/save.c:DataDoubleWriteWithStatus
        confidence: 0.9
  invariants:
  - A record is accepted only if its checksum pair sums to 0x10000; otherwise the mirror is tried, then the slot
    reads as empty.
  relations:
  - type: part_of
    target: game_mode_flow
  evidence:
  - kind: decomp_source
    ref: tmc:src/save.c:HandleSave
    confidence: 0.9
  - kind: decomp_source
    ref: tmc:src/save.c:CalculateChecksum
    confidence: 0.85
  - kind: decomp_source
    ref: tmc:src/save.c:gSaveFileEEPROMAddresses
    confidence: 0.9
  - kind: decomp_source
    ref: tmc:src/menu/pauseMenu.c:sub_080A59C8 (save popup)
    confidence: 0.8
- id: game_over_continue
  facet: frontend
  label: Game over with save prompt, continue at last entrance with 3 hearts
  summary: When health reaches 0 (and no bottled fairy auto-revives), the game-over task fades in, raises the GAME
    OVER text, asks whether to save, then offers Continue or Quit. Continue reloads from the saved room status with
    health set to 24 units (3 hearts); Quit soft-resets.
  instantiates:
  - concept: frontend.game_over.continue_from_save
  reads:
  - player.health
  - inventory.bottles
  writes:
  - player.health
  - main.task
  params:
    respawn_health:
      value: 24
      unit: health units (3 hearts)
      evidence:
      - kind: decomp_source
        ref: tmc:src/gameOverTask.c:GameOver_Init
        confidence: 0.9
  relations:
  - type: part_of
    target: game_mode_flow
  - type: modulates
    target: health_and_damage
    note: a bottled fairy pre-empts game over
  evidence:
  - kind: decomp_source
    ref: tmc:src/gameOverTask.c:GameOver_Update
    confidence: 0.85
  - kind: decomp_source
    ref: tmc:src/player.c:sub_08071D04 (fairy revive)
    confidence: 0.85
- id: top_down_projection
  facet: projection
  label: Top-down 3/4 view with a z-height axis and two floor layers
  summary: 'The world is a top-down grid of 16x16 px tiles (rooms up to 64 tiles wide) viewed at a slight 3/4 angle.
    Entities have a separate z coordinate (negative = up) used for jumps, falling objects and shadows; hit tests
    include a z half-depth. Each room has a bottom and a top collision layer, and entities carry a collision layer
    (1, 2 or 3 = both) switched by stairs/ladder/bridge tiles, giving multi-level rooms without 3D.'
  instantiates:
  - concept: projection.top_down.three_quarter_view
  - concept: projection.top_down.z_height_layering
  params:
    tile_size:
      value: 16
      unit: px
      evidence:
      - kind: decomp_source
        ref: tmc:include/entity.h:TILE
        confidence: 0.95
    room_max_width_tiles:
      value: 64
      evidence:
      - kind: decomp_source
        ref: tmc:include/entity.h:TILE_LOCAL (6-bit x/y tile index)
        confidence: 0.9
    screen:
      value: 240x160
      unit: px
      evidence:
      - kind: decomp_source
        ref: tmc:src/scroll.c:Scroll1 (0xf0 width, DISPLAY_HEIGHT)
        confidence: 0.95
    collision_layers:
      value: 2
      unit: floor layers (bottom/top), entity layer mask 1/2/3
      evidence:
      - kind: decomp_source
        ref: tmc:include/entity.h:CollisionLayer
        confidence: 0.9
  evidence:
  - kind: decomp_source
    ref: tmc:include/entity.h:Entity (x/y/z Q16.16)
    confidence: 0.95
  - kind: decomp_source
    ref: tmc:src/collision.c:IsColliding (z half-depth)
    confidence: 0.85
  - kind: capture_frame
    ref: capture:frontend:keyframes f004503, f005344_scene (Link's house area)
    confidence: 0.9
- id: follow_camera
  facet: camera
  label: Centred follow camera clamped to room bounds with capped speed and screen shake
  summary: Each frame the camera moves toward the target (normally Link) so that the target sits at screen (120,
    80), with no dead zone, by at most scrollSpeed px per axis (4 by default; scripts and boss rooms set 1-2), and
    clamped to the room rectangle. Screen shake adds offsets up to +-3 px from a 6x8 table, advancing every 2 frames.
    Camera targets can be retargeted to objects (Minish form, cutscenes, world-event reveals).
  instantiates:
  - concept: camera.follow.region_bounded_scroll
  - concept: camera.effect.screen_shake
    weight: 0.5
  reads:
  - camera.target.position
  - room.bounds
  writes:
  - camera.scroll.x
  - camera.scroll.y
  params:
    anchor:
      value: 120,80
      unit: px (screen centre)
      evidence:
      - kind: decomp_source
        ref: tmc:src/scroll.c:Scroll1 (target - 0x78 / - 0x50)
        confidence: 0.95
    scroll_speed_cap:
      value: 4
      unit: px/frame per axis
      evidence:
      - kind: decomp_source
        ref: tmc:src/scroll.c:Scroll0 (scrollSpeed = 4)
        confidence: 0.95
    shake_max_offset:
      value: 3
      unit: px
      evidence:
      - kind: decomp_source
        ref: tmc:asm/src/script.s:gShakeOffsets
        confidence: 0.8
  invariants:
  - scroll_x stays within [origin_x, origin_x + width - 240] and scroll_y within [origin_y, origin_y + height - 160].
  relations:
  - type: requires
    target: top_down_projection
  evidence:
  - kind: decomp_source
    ref: tmc:src/scroll.c:Scroll1
    confidence: 0.95
  - kind: decomp_source
    ref: tmc:src/scroll.c:UpdateScreenShake
    confidence: 0.85
- id: room_transitions
  facet: camera
  label: Room-edge slide scrolling, door warps and typed fades
  summary: 'Walking off a room edge either follows a border warp record or, within an area, slides the camera to the
    neighbour room at 4 px/frame (40 frames vertically, 60 horizontally) while nudging Link 0.375 or 0.25 px/frame
    so he ends inside. Doors, stairs and area rectangles use warp records (border, area-rect with 4 shapes, and
    variants) that pick a fade: default, black, white, mosaic cut or iris; durations are 256/speed frames (e.g. 16
    frames at speed 16, 64 at speed 4). Spawn types include normal, drop-in, step-forward, stair exit and Minish
    variants.'
  instantiates:
  - concept: camera.transition.edge_slide_scroll
  - concept: rendering.blending.brightness_fade
    weight: 0.3
  reads:
  - player.position
  - room.transitions
  writes:
  - camera.scroll
  - player.position
  - world.area
  - world.room
  params:
    slide_speed:
      value: 4
      unit: px/frame
      evidence:
      - kind: decomp_source
        ref: tmc:src/scroll.c:Scroll2Sub2
        confidence: 0.95
    slide_frames_vertical:
      value: 40
      unit: frames (160 px)
      evidence:
      - kind: decomp_source
        ref: tmc:src/scroll.c:Scroll2Sub2 (unk_18 == 0x28)
        confidence: 0.95
    slide_frames_horizontal:
      value: 60
      unit: frames (240 px)
      evidence:
      - kind: decomp_source
        ref: tmc:src/scroll.c:Scroll2Sub2 (unk_18 == 0x3c)
        confidence: 0.95
    player_nudge:
      value: 0.375 vertical / 0.25 horizontal
      unit: px/frame during slide (15 px total)
      evidence:
      - kind: decomp_source
        ref: tmc:src/scroll.c:Scroll2Sub2
        confidence: 0.95
    default_fade_frames:
      value: 16
      unit: frames (256/speed with speed 16)
      evidence:
      - kind: decomp_source
        ref: tmc:src/fade.c:SetFade / tmc:src/gameUtils.c:CheckRoomExit
        confidence: 0.85
  relations:
  - type: part_of
    target: follow_camera
  - type: requires
    target: overworld_structure
  evidence:
  - kind: decomp_source
    ref: tmc:src/scroll.c:Scroll2Sub2
    confidence: 0.95
  - kind: decomp_source
    ref: tmc:include/transitions.h:Transition
    confidence: 0.9
  - kind: decomp_source
    ref: tmc:src/scroll.c:IsPosInTransitionRect
    confidence: 0.85
  - kind: decomp_source
    ref: tmc:src/gameUtils.c:CheckRoomExit
    confidence: 0.85
- id: bg_layer_stack
  facet: rendering
  label: Mode-0 tilemap rooms on two collision layers with OBJ actors
  summary: 'Gameplay runs in Mode 0 with up to four text BGs: two map layers (LAYER_BOTTOM/LAYER_TOP) carry
    collision-bearing 16x16 metatiles, the others hold the HUD/text window and per-room decorative or parallax
    backdrops installed by background managers. Actors are OBJ sprites (up to 62 visible in the frontend capture).
    Map edits at runtime (kinstone world events, bombed walls, opened chests) rewrite tile types in place.'
  instantiates:
  - concept: rendering.background.tile_layer_stack
  reads:
  - room.tilemaps
  - camera.scroll
  writes:
  - io.bgcnt[0..3]
  - io.dispcnt
  - oam.*
  params:
    gameplay_video_mode:
      value: 0
      evidence:
      - kind: capture_telemetry
        ref: capture:frontend:frames 4120-5400 DISPCNT 0x1740 (mode 0, BG0-2 + OBJ)
        confidence: 0.85
    max_obj_visible_observed:
      value: 62
      unit: sprites (frontend phase, file select/intro/early gameplay)
      evidence:
      - kind: capture_telemetry
        ref: capture:frontend:max_obj_visible
        confidence: 0.9
  relations:
  - type: part_of
    target: top_down_projection
  evidence:
  - kind: decomp_source
    ref: tmc:src/interrupts.c:DispCtrlSet
    confidence: 0.8
  - kind: decomp_source
    ref: tmc:src/interrupts.c:UpdateDisplayControls
    confidence: 0.8
  - kind: decomp_source
    ref: tmc:src/kinstone.c:sub_0801876C (SetTileType on LAYER_BOTTOM/LAYER_TOP)
    confidence: 0.9
  - kind: capture_telemetry
    ref: capture:frontend:frames 4120-5400 video mode 0
    confidence: 0.85
- id: hblank_raster_effects
  facet: rendering
  label: HBlank-DMA window and affine raster effects (iris wipes, dark-room light circle, barrel, heat shimmer)
  summary: 'A shared helper fills a per-scanline buffer and arms DMA0 (HBlank start, dest reload) to stream it into
    a register each line. Uses found: WIN0H per line for circular iris fades and the Minish-portal close-up, and a
    light circle centred on Link in dark rooms (radius eased in 4 px steps with a sine wobble); BG2PA..BG2PD-style
    affine parameters per line for the Deepwood Shrine rolling-barrel interior; BG3HOFS per line for steam overlays,
    light rays and Vaati''s appearing effect; BG3CNT per line in one pause screen; a rotating white-triangle polygon
    window. The captured front end did not exercise any of them (no HBlank DMA recorded).'
  instantiates:
  - concept: rendering.raster.window_shape_per_scanline
  - concept: rendering.raster.hblank_dma_scroll_distortion
  - concept: rendering.raster.per_scanline_affine
  reads:
  - fade.iris_center
  - fade.iris_size
  - player.position
  - area.light_level
  writes:
  - io.win0h
  - io.bg2pa
  - io.bg3hofs
  - io.bg3cnt
  - io.winin
  - io.winout
  params:
    hdma_window_targets:
      value:
      - WIN0H (iris fade, portal close-up, dark-room light, triangle effect)
      - BG2PA (rolling barrel, 8 halfwords/line)
      - BG3HOFS (steam overlay, light rays, Vaati appearing)
      - BG3CNT (pause menu screen 6)
      evidence:
      - kind: decomp_source
        ref: tmc:src/common.c:sub_0801E1EC (SetVBlankDMA -> REG_ADDR_WIN0H, HBlank repeat)
        confidence: 0.95
      - kind: decomp_source
        ref: tmc:src/manager/rollingBarrelManager.c:RollingBarrelManager_Main (REG_ADDR_BG2PA)
        confidence: 0.95
      - kind: decomp_source
        ref: tmc:src/manager/steamOverlayManager.c (REG_ADDR_BG3HOFS)
        confidence: 0.9
      - kind: decomp_source
        ref: tmc:src/manager/lightRayManager.c (REG_ADDR_BG3HOFS)
        confidence: 0.9
    dark_room_min_light_radius:
      value: 17
      unit: px (radius floor 0x11, eased by 4 px/step)
      evidence:
      - kind: decomp_source
        ref: tmc:src/manager/lightManager.c (uVar3 floor 0x11, +-4 steps)
        confidence: 0.75
  relations:
  - type: modulates
    target: bg_layer_stack
  - type: part_of
    target: room_transitions
    note: iris wipes
  evidence:
  - kind: decomp_source
    ref: tmc:src/common.c:sub_0801E160
    confidence: 0.9
  - kind: decomp_source
    ref: tmc:src/fade.c (sub_0801E1EC iris calls)
    confidence: 0.9
  - kind: decomp_source
    ref: tmc:src/object/minishPortalCloseup.c (sub_0801E1EC)
    confidence: 0.9
  - kind: decomp_source
    ref: tmc:src/object/whiteTriangleEffect.c (sub_0801E49C)
    confidence: 0.85
  - kind: decomp_source
    ref: tmc:src/manager/lightManager.c (sub_0801E160 at player screen pos)
    confidence: 0.9
  - kind: capture_telemetry
    ref: capture:attract+frontend:hblank_dma_targets [] (front end only)
    confidence: 0.9
- id: affine_title_and_sprites
  facet: rendering
  label: Mode-1 affine title zoom and affine BG set pieces
  summary: The title switches to Mode 1 and draws the Picori sword on affine BG2 (256-colour, 512x256 wrap) with
    BLDALPHA 9/9 between BG0 and BG1; the sword zooms out from a scale ratio of 0x10 to 0x100 in 0x10 steps (15
    frames) via BgAffineSet, centred at (120, 72). In play, affine hardware appears in set pieces (rolling barrel)
    rather than routine actors; no affine OBJs were seen in the captured front end.
  instantiates:
  - concept: rendering.background.affine_rotscale
  - concept: rendering.blending.alpha_layer_transparency
    weight: 0.5
  reads:
  - title.sword_scale
  writes:
  - io.bg2pa
  - io.bg2pb
  - io.bg2pc
  - io.bg2pd
  - io.bg2x
  - io.bg2y
  - io.bldalpha
  params:
    zoom_frames:
      value: 15
      unit: frames
      evidence:
      - kind: decomp_source
        ref: tmc:src/title.c:HandleTitlescreenAnimationIntro (+0x10 per frame to 0x100)
        confidence: 0.95
      - kind: capture_telemetry
        ref: capture:attract:affine_bg_transformed_frames 15 (frames 232-264 mode 1, BG2PA 0x0010 at start)
        confidence: 0.95
    title_blend:
