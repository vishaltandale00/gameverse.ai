- id: scale_dependent_targeting
  facet: ai
  label: Size-filtered enemy target selection (full-size vs Minish-scale threats)
  summary: 'Enemies ask for a target through one of four selector functions. Selector 0 accepts the player unless
    busy/hidden/falling; selector 1 additionally ignores a Minish-sized player; selector 2 accepts the player only
    while Minish-sized; selector 3 ignores Minish, captured and item-disabled states. Almost every full-size species
    (Octorok, Darknut, Chuchu, Moblins, Wallmaster, Ghini, Gibdo, Puffstool) uses selector 1, so shrinking makes Link
    invisible to them, while Minish-scale critters (e.g. the aggressive cucco chick) use selector 2. The same world
    is therefore populated by two disjoint threat sets keyed on player scale.'
  instantiates:
  - concept: ai.perception.scale_filtered_target_selection
  reads:
  - player.flags.minish
  - player.flags.*
  - player.killed
  writes:
  - ai.enemy_target
  params:
    selectors:
      value:
      - any_available
      - full_size_only
      - minish_only
      - not_minish_not_captured
      evidence:
      - kind: decomp_source
