  summary: 'Each 16x16 tile per layer has a collision byte: values 1-15 are a 4-bit mask of solid 8x8 quarters, larger
    values select 16x16 per-pixel shape masks (diagonals, half tiles). The player samples 8 probe points around a
    12x12 hitbox and writes per-side collision bits; a per-direction mask cancels only the blocked axis, so diagonal
    input slides along walls. Walking straight into a wall edge where only one leading probe is blocked redirects
    the move 90 degrees toward the open side at 1 px/frame (corner nudge), and cardinal input into a diagonal shape
    tile rotates the heading 45 degrees. After moving, edge points are pushed pixel by pixel out of shape masks. The
    shape-mask table is chosen by state (normal, Minish, jumping, carrying, beetle, swimming), which is how small
