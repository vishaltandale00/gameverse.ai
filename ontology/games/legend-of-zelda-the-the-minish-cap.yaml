  summary: 'Flags are encoded with a 2-bit scope (local bank of the current area, global, room) and a 10-bit index.
    Persistent flags live in 512 bytes (4096 bits) split into a global bank and 13 local banks assigned per area
    (overworld, town, caves, each dungeon). Room flags (416 bits) are cleared on every room load. A separate 8-room
