        confidence: 0.95
      - kind: decomp_source
        ref: tmc:src/code_08049DF4.c:sub_08049E4C
        confidence: 0.95
      - kind: decomp_source
        ref: tmc:src/code_08049DF4.c:sub_08049E80
        confidence: 0.95
  invariants:
