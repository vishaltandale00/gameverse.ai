components:
- id: cyclic_choice_list_controller
  facet: frontend
  label: Priority-based confirm/cancel and wrapping vertical choices
  summary: A ROM-recovered selection controller at 0x0801d100 consumes the global new-press mask and updates a list
    index and cursor-position fields in its supplied UI context. Confirm has priority over cancel, then up over
    down; up/down wrap at list ends and accepted/cancelled paths write mode 10. Its exact menu screen and which
    half of this dual-game cartridge uses it remain unverified.
  instantiates:
  - concept: ui_hud.selection.cyclic_list_step
  reads:
  - ram[0x02001df4]:u16 newly pressed buttons
  - context[0x21b8]:i32 previous list index
  - context[0x21bc]:u16 choice count
  writes:
  - context[0x21b8]:i32 selected index or cancel sentinel 2
  - context[0x21a8]:u8 mode
  - context[0x520]:u16 cursor coordinate 0x54
  - context[0x522]:u16 cursor coordinate 10*index+0x68
  invariants:
  - Branch priority is A(0x1), B(0x2), UP(0x40), DOWN(0x80). Simultaneous A+B takes confirm; simultaneous UP+DOWN
    takes up.
  - Confirm writes mode=10 without changing the index. Cancel writes index=2 and mode=10, then skips cursor writes.
  - Assuming count>0 and 0<=index<count, up maps 0 to count-1 and otherwise subtracts one; down maps count-1 to
    0 and otherwise adds one.
  - With count!=0, non-cancel paths store cursor coordinates 0x54 and 10*newIndex+0x68, truncated to 16 bits. Coordinate
    projection/pixel units require a renderer witness.
  - 'No safe empty-list behavior is claimed: up at count=0 may produce -1. A caller must establish count>0 before
    reuse.'
  - External calls to 0x0818c250 carry immediates 0x65, 0x6f or 0x64 and callback 0x0818abfd. Their audiovisual
    meaning and callback ABI remain unverified.
  - The final pop {r0}; bx r0 is a saved-LR return, not a real unknown indirect call as printed by the raw decompiler.
