proposed_concepts:
- id: ui_hud.selection.cyclic_list_step
  label: Cyclic list selection
  definition: A bounded list index updated by priority-ordered confirm/cancel/directional inputs, with wrapping
    and explicit cursor projection.
open_questions:
- Map this context and callback chain to a rendered, player-accessible screen in an isolated session.
- Verify count>0 and index-range preconditions in its caller before packaging the list controller.
- Map both engines, movement, battle, quest flags, story and asset layouts independently.
