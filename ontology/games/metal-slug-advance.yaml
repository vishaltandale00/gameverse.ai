- id: packed_pair_bit_query
  facet: mechanics
  label: Read one bit from an indexed packed halfword
  summary: Instructions truncate index and bit-offset inputs to 16 bits, load a halfword at base+2*(index>>3), then
    arithmetic-shift the zero-extended value by the low8 bits of 2*(index&7)+offset and mask bit0. Offset0 or 1
    would select either bit of a two-bit cell, but the caller is not proven to restrict the offset to those values.
  instantiates:
  - concept: mechanics.data.packed_pair_bit_query
  reads:
  - arg.index:u16
  - arg.bit_offset:u16
  - arg.bank:ptr32
  - bank[index>>3]:u16
  writes:
  - return:u1
  invariants:
  - The result is always0 or 1.
  - No bounds or bit-offset validation occurs.
  - Because the loaded value is zero-extended, effective shifts16..255 produce0; do not model the shift as modulo16.
  evidence:
  - kind: ghidra_function
    ref: ghidra:0x080076f4
