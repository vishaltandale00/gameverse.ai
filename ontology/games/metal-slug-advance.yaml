- id: monotone_bitset_insert
  facet: mechanics
  label: Set a bit in a16-bit-word bitset
  summary: The low16 input bits choose word index i>>4 and bit i&15. A halfword load, OR and halfword store set
    the selected bit without clearing other bits; no index bounds or ownership checks are included.
  instantiates:
  - concept: mechanics.flags.monotone_word_bitset_insert
  reads:
  - arg.index:u16
  - arg.bitset:ptr32
  - bitset[index>>4]:u16
  writes:
  - bitset[index>>4]:u16
  invariants:
  - Repeating the operation with the same index is idempotent.
