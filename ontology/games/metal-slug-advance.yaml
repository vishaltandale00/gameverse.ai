proposed_concepts:
- id: mechanics.data.parallel_halfword_write
  label: Parallel halfword write
  definition: Write two values at the same index in two halfword-addressed banks.
- id: mechanics.data.parallel_indexed_field_clear
  label: Parallel indexed field clear
  definition: Reset selected fields in two indexed banks with distinct strides.
- id: mechanics.data.packed_pair_bit_query
  label: Packed pair bit query
  definition: Select a bit from a halfword bank using a two-bit-cell index plus an explicit bit offset.
- id: mechanics.flags.monotone_word_bitset_insert
  label: Monotone word bitset insert
  definition: Insert a flag into a word-addressed bitset while preserving existing flags.
- id: mechanics.data.two_byte_context_decode
  label: Two byte context decode
  definition: Consume two sequential bytes into context fields and return the advanced input cursor.
- id: mechanics.state.raw_code_table_projection
  label: Raw code table projection
  definition: Preserve a raw code while mapping it through a byte table into another field.
- id: mechanics.data.indirect_three_word_template
  label: Indirect three word template
  definition: Select a pointer-table entry and copy its three words into specified target fields.
