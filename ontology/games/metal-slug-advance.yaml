- id: three_word_template_application
  facet: mechanics
  label: Apply a ROM-selected three-word template
  summary: A u8 selector indexes a ROM pointer table at 0x083ce0e4 with 4-byte entries. Three consecutive words
    from the selected target are copied into object+0x3c,+0x38,+0x40 in that order; these are raw parameters with
