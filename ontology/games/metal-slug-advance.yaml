  label: Consume two bytes into an indirect context
  summary: The helper reads an object-owned pointer at+0xcc, copies the next two stream bytes to context+2 and+3,
    and returns stream+2 in r0 before BX LR. This is a bounded stream-consumption primitive; the encoded command
    and field roles are unknown.
