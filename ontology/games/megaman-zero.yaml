- id: three_record_initialization
  facet: mechanics
  label: Three fixed-stride records enter state1
  summary: Instruction-verified helper zeroes words at 0x03001740 and 0x02000000, stores its argument at 0x03001744,
    then sets three state bytes at 0x03001748+i*24 to 1. The three records are an observed initialization span;
    allocation capacity and whether they are tasks, channels or actors remain unknown.
  instantiates:
  - concept: mechanics.data.fixed_stride_record_initialization
  reads:
  - arg.context:word32
  writes:
  - ram[0x03001740]:u32
  - ram[0x03001744]:u32
  - ram[0x02000000]:u32
  - records[i].offset_0:u8
  invariants:
  - Exactly three byte stores occur, for i=0,1,2.
  - Other record fields are not cleared by this helper.
