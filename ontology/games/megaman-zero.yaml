- id: free_head_to_linked_node
  facet: mechanics
  label: Conditional pool-node transfer with16-bit count decrement
  summary: The helper loads pool+0x10 as a candidate node. If nonzero, it pops the next pointer from node+0, decrements
    pool+0x0a as a16-bit quantity, rewires node links and pool+0x18 through an existing writable link, and clears
    node+0x0a,+0x0c,+0x10; otherwise it returns zero without these writes. This resembles pool allocation, but node
    role and pool invariants are not supplied by names.
  instantiates:
  - concept: mechanics.pool.free_head_to_linked_node
  reads:
  - pool.offset_10:ptr32
  - pool.offset_0a:u16
  - pool.offset_18:ptr32
  - node.offset_0:ptr32
  writes:
  - pool.offset_10:ptr32
  - pool.offset_0a:u16
  - pool.offset_18:ptr32
  - node.offset_0:ptr32
  - node.offset_4:ptr32
  - old_pool18.deref:ptr32
  - node.offset_0a:u16
  - node.offset_0c:u32
  - node.offset_10:u32
  - return:ptr32
  invariants:
  - Null free head returns 0 and skips all node/count mutations.
  - The count decrement wraps modulo65536 if a malformed pool has count0 with a nonnull free head; this helper does
    not clamp.
  - Caller must supply valid pool/node/link memory; ownership and allocation capacity remain unknown.
  evidence:
  - kind: ghidra_function
    ref: ghidra:0x08005428
    confidence: 0.8
    note: local/re/experiments/20261016-corpus-decompile/shard-b/megaman-zero/functions.jsonl:114; pseudo-C SHA256
