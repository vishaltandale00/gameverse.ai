conventions:
  coverage_scope: PARTIAL instruction-grounded engine/data operators. Entity roles, combat, progression, player
    movement, economy, assets and story are not comprehensively recovered. Component count is not completeness.
    No player skill or strategy is claimed.
  state_types: u8/u16/u32 mean instruction access widths, ptr32 means a 32-bit address. Semantic paths containing
    offsets identify unknown layouts, not reverse-engineered actor names. Caller-owned memory validity and table
    extents remain preconditions.
  units: Offsets, record strides and allocation counts use bytes or raw scalar counts. No raw number is converted
    to pixels, seconds or player-physics units without evidence.
  proof_scope: Consequential loads/stores, shifts, comparisons and return instructions were read directly from ROM
    disassembly. Decompiler types, return signatures and IO-direction hints remain untrusted where not confirmed.
    Literal-pool data printed by objdump is not treated as executed instructions.
  inference_scope: Names such as record, pool and mask describe operations, not known gameplay meaning. Potential
    reuse follows from the operator algebra; no gameplay trajectory or successful composition has been tested.
