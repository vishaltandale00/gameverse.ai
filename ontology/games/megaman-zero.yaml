- id: guarded_record_lookup
  facet: mechanics
  label: Cross-table key equality gates a16-bit value
  summary: The helper truncates its input to 16 bits and selects an8-byte descriptor at 0x080d2c04. Its u16 selector
    at+4 indexes a12-byte table at 0x080d2b5c whose first word is a record pointer; the pointed record key must
    equal the descriptor key before the helper returns the halfword at record+4, otherwise it returns 0. The value
    is a halfword load, even though generated C misleadingly casts a word expression.
  instantiates:
  - concept: mechanics.data.key_guarded_indirect_lookup
  reads:
  - arg.index:u16
  - descriptor.key:u32
  - descriptor.offset_4:u16
  - pointer_table[selector].offset_0:ptr32
  - record.offset_0:u32
  - record.offset_4:u16
  writes:
  - return:u16
  invariants:
  - A key mismatch returns 0.
  - No bounds, null-pointer guard or interpretation of key/value is established.
  - A legitimate matched value 0 is indistinguishable from mismatch through this return alone.
  evidence:
  - kind: ghidra_function
    ref: ghidra:0x08001e7c
    confidence: 0.8
    note: local/re/experiments/20261016-corpus-decompile/shard-b/megaman-zero/functions.jsonl:72; pseudo-C SHA256
