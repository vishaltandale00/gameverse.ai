- id: mechanics.data.fixed_stride_record_initialization
  label: Fixed stride record initialization
  definition: Initialize selected fields in a fixed number of strided records.
- id: mechanics.data.indexed_record_activation
  label: Indexed record activation
  definition: Activate an indexed record after initializing its payload, workspace pointer and counters.
- id: mechanics.pool.free_head_to_linked_node
  label: Free head to linked node
  definition: Transfer a node from a free-head chain into an intrusive linked structure with explicit initialization.
- id: mechanics.data.indexed_intrusive_prepend
  label: Indexed intrusive prepend
  definition: Prepend a caller-supplied node to a pointer chain selected by index.
- id: mechanics.data.key_guarded_indirect_lookup
  label: Key guarded indirect lookup
  definition: Return a small value from an indirectly selected record only when its key matches a descriptor.
- id: rendering.registers.blend_shadow_commit
  label: Blend shadow commit
  definition: Copy a small blend-register shadow block to hardware in a defined order.
