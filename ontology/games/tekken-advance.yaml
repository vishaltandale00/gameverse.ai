components:
- id: paired_active_box_separation
  facet: mechanics
  label: Paired active-box separation with a proximity gate
  summary: "A native two-record operator at 0x080130e8 compares up to four active boxes per record after a second-coordinate\
    \ proximity gate. Inclusive overlaps select the largest-magnitude signed separation, then opposite adjustments\
    \ are applied to the records\u2019 offset-0x14 coordinates and a shared contact bit is set. The fighter update\
    \ at 0x0800d1f4 calls it after input routing; exact world/projection units and gameplay actor identity remain\
    \ unverified."
  instantiates:
  - concept: mechanics.collision.paired_active_box_separation
  reads:
  - a/b[0x48]:u32 exclusion flags
  - a/b[0x1c]:i32 proximity coordinate
  - a/b[0x20]:i32 ordering coordinate
  - a/b[0x14]:i32 adjusted coordinate
  - a/b[0x534 +20*i]:u16 active flags, i=0..3
  - a/b[0x538 +20*i,0x53c +20*i,0x540 +20*i,0x544 +20*i]:i32 box bounds
  writes:
  - a/b[0x44]:u32 contact flag bit0x8
  - a[0x14]:i32 previous value minus correction
  - b[0x14]:i32 previous value plus correction
  invariants:
  - Contact bit0x8 is cleared in both records at entry even on an early-out; other bits are preserved.
  - If either record flags0x48 has bit0x8, or abs(a[0x1c]-b[0x1c])>0x13ff, no boxes are tested.
  - Each record has four boxes of stride20. A box participates when its first halfword has bit0x1. Bounds comparisons
    are inclusive, so touching edges participate.
  - For overlapping boxes, ordering a[0x20]<b[0x20] chooses a.right-(b.left-1); otherwise chooses (a.left-1)-b.right.
    Largest absolute candidate wins; equal magnitudes retain earlier iteration order.
  - A nonzero selected overlap sets contact bit0x8 in both records. Initial correction=selected*64; absolute corrections
    below256 are replaced with magnitude64, preserving sign. Additional coordinate-order/gap rules can replace this
    correction; exact code is in the own recovered lift.
  - Within the reviewed finite no-overflow domain, final updates preserve a[0x14]+b[0x14]. Neither record is assumed
    immovable or mass weighted.
  - Recovered C requires differences, negations and products to fit signed32-bit, especially avoiding abs(INT32_MIN).
    Full native overflow behavior and valid gameplay ranges remain unqualified.
  - 'Do not substitute this directly for a single-plane terrain collider: it consumes paired four-box records, a
    separate proximity coordinate and an ordering coordinate.'
