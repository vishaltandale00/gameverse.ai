- id: conditional_mask_queries
  facet: mechanics
  label: Conditionally remap a mask and query one or two context bitfields
  summary: Three verified leaf helpers use a mode halfword at object+0x7e and a global context pointer at 0x03001270.
    If mode=0 or(mask&0xf0)=0, the mask is unchanged; otherwise the full32-bit mask shifts right1 when(mask&0xa0)!=0
    and left1 otherwise, then intersects context+4. Entry 0x08016434 returns whether that intersection is zero,
    while 0x08016480 additionally intersects context+6; no gameplay interpretation of the mode or context bits is
    established.
  instantiates:
  - concept: mechanics.data.mode_conditioned_mask_query
  reads:
  - object.offset_7e:u16
  - arg.mask:u32
  - global[0x03001270]:ptr32
  - context.offset_4:u16
  - context.offset_6:u16
  writes:
  - return.filtered_mask:u32
  - return.zero_predicate:u1
  invariants:
  - The bypass condition is mode=0 OR no 0xf0 bits, not both.
  - On the remap path, any 0xa0 bit selects right shift for the entire mask.
  - Left shift uses32-bit register truncation; do not reinterpret it as a per-direction lookup table.
  - The extra+6 intersection is specific to entry 0x08016480.
  evidence:
  - kind: ghidra_function
    ref: ghidra:0x080163f8
    confidence: 0.8
    note: local/re/experiments/20261016-corpus-decompile/shard-b/prince-of-persia-the-sands-of-time/functions.jsonl:59;
