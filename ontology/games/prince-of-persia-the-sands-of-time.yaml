- id: wrapped_index_bitmap_read
  facet: mechanics
  label: Query a bit using an8-bit byte index
  summary: The helper computes byteIndex=(input>>3)&255, loads one byte from global context+0xc2+byteIndex and returns
    the selected bit. Its explicit shift-count arithmetic reduces to input&7, so higher input bits beyond bit10
    do not affect the result; the logical query aliases modulo2048, but the actual allocated bitset size remains
    unverified.
  instantiates:
  - concept: mechanics.flags.wrapped_index_byte_bitset_query
  reads:
  - arg.index:u32
  - global[0x03000fc0]:ptr32
  - context.offset_c2_plus_byte_index:u8
  writes:
  - return:u1
  invariants:
  - Return is 0 or 1.
  - Inputs differing only in bits11..31 select the same byte and bit.
  - Caller must provide readable storage;8-bit indexing does not prove a256-byte allocation.
  evidence:
