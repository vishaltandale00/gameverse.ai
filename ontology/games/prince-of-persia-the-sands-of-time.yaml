proposed_concepts:
- id: mechanics.state.independent_threshold_increment
  label: Independent threshold increment
  definition: Independently increment fields below fixed thresholds while preserving values already at or above
    them.
- id: mechanics.data.mode_conditioned_mask_query
  label: Mode conditioned mask query
  definition: Remap a bitmask under an explicit mode gate, then evaluate intersection or its zero predicate.
- id: mechanics.flags.wrapped_index_byte_bitset_query
  label: Wrapped index byte bitset query
  definition: Read a bit from a byte bank after truncating the byte index to a fixed width.
- id: mechanics.state.three_byte_sentinel_initialization
  label: Three byte sentinel initialization
  definition: Initialize three state bytes to a shared sentinel value and one separate byte to zero.
- id: rendering.background.affine_identity_setup
  label: Affine identity setup
  definition: Reset affine origins and matrix coefficients to a hardware identity transform.
- id: rendering.raster.structure_sourced_scroll_dma
  label: Structure sourced scroll dma
  definition: Configure a scanline-scroll transfer from a source pointer owned by a caller structure.
- id: mechanics.data.selected_field_record_gather
  label: Selected field record gather
  definition: Gather selected object fields into a fixed-width indexed record.
open_questions:
- Identify callers, actual object/entity ownership, valid index ranges, memory extents and update cadence before
  binding these operators to player or enemy behavior.
- Extract combat, resource meanings, AI, traversal, story, assets and progression from further source/disassembly
  and controlled trajectories; do not substitute model recall.
- These exports cover observed call targets only. Unknown indirect branches, ABI recovery and unexecuted ROM regions
  limit discovery completeness.
- The thresholded bytes at+0x84/+0x85 must not be labeled health, sand, stamina, animation timers or physics without
  caller/trajectory evidence.
- The three mask helpers may relate to controls, but orientation, input semantics and update cadence are unproven.
- 'Field gathering does not prove rewind/history behavior despite the title: establish write-index lifecycle and
  a matching restoration reader first.'
- No affine BG use was measured in the retained phases even though the identity setup routine exists; routine existence
  and captured use are distinct.
