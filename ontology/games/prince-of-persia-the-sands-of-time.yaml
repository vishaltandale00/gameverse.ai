- id: independent_threshold_increments
  facet: mechanics
  label: Increment two bytes only while each is below its threshold
  summary: The helper increments object+0x84 when its unsigned byte value is below 16 and independently increments+0x85
    when below 10. Values already at or above a threshold are left unchanged, so this is directional threshold-limited
    growth rather than a clamp that repairs arbitrary out-of-range states; actor and resource meanings are unknown.
  instantiates:
  - concept: mechanics.state.independent_threshold_increment
  reads:
  - object.offset_84:u8
  - object.offset_85:u8
  writes:
  - object.offset_84:u8
  - object.offset_85:u8
  invariants:
  - For initial0..16, the first field stays within 0..16; for initial0..10, the second stays within 0..10.
  - Initial values above 16 or 10 are preserved, not reduced.
  - Each field changes by at most1 per call; no time unit is established.
