- id: save_and_quicksave
  facet: frontend
  label: Duplicated flash save plus consumable in-dungeon quicksave
  summary: 'Saves go to 128 KiB FLASH1M: the 22,484-byte main save is written twice (primary and backup, checksum
    and magic) with per-sector verify-and-retry. In a dungeon the player can quicksave: the 18 KiB dungeon state is
    serialised to sector 16 and a status record marks it present; resuming marks it consumed, so a reset after resuming
    without re-saving counts the outing as a defeat (all money and items lost). The game also auto-saves before entering
    most dungeons.'
  instantiates:
  - concept: frontend.save.redundant_slot_backup
  - concept: frontend.save.suspend_save_consumed_on_load
  reads:
  - save.*
  - dungeon.state
  writes:
  - flash.sectors
  params:
    flash_size:
      value: 131072
      unit: bytes (32 x 4 KiB sectors)
      evidence:
      - kind: decomp_source
        ref: pmd-red:src/flash.c:ReadFlashData
        confidence: 0.85
    main_save_size:
      value: 22484
      unit: bytes
      evidence:
      - kind: decomp_source
        ref: pmd-red:include/save.h:UnkStruct_sub_8011DAC
        confidence: 0.85
    quicksave_size:
      value: 18432
      unit: bytes
      evidence:
      - kind: decomp_source
        ref: pmd-red:src/run_dungeon.c:RunDungeon_Async (ReadDungeonState 0x4800)
        confidence: 0.9
  invariants:
  - A quicksave can be resumed once; afterwards the status record reads consumed.
  relations:
  - type: modulates
    target: faint_and_item_loss
    note: reset-after-resume penalty
  evidence:
  - kind: decomp_source
    ref: pmd-red:src/save.c:WriteSavetoPak
    confidence: 0.8
  - kind: decomp_source
    ref: pmd-red:src/quick_save_write.c:WriteQuickSave
    confidence: 0.8
  - kind: decomp_source
    ref: pmd-red:src/main_loops.c:LoadAndRunQuickSaveDungeon_Async
    confidence: 0.9
- id: dungeon_tile_renderer
  facet: rendering
  label: Mode-0 dungeon renderer with 24 px metatiles streamed into BG3
  summary: 'Gameplay runs in video mode 0 throughout. The dungeon map is drawn on BG3 from 24x24 px metatiles (3x3
    hardware tiles) of the floor''s tileset, streaming edge rows/columns as the camera moves and redrawing fully on
    jumps over 7 px; BG0 carries text windows, the HUD row and the floor map, BG1 window backgrounds and translucent
    overlays, BG2 the rotate-mode grid. Pokemon are multi-part OBJ animations with terrain-dependent shadows; weather
    tints the palette via per-weather 256-entry colour ramps stepping 10 per channel per frame.'
  instantiates:
  - concept: rendering.background.tile_layer_stack
  - concept: rendering.background.metatile_streaming
  - concept: rendering.palette.runtime_palette_effects
    weight: 0.4
  reads:
  - map.tiles[*]
  - camera.pixel
  - weather.current
  writes:
  - io.bg3hofs
  - io.bg3vofs
  - vram.bg3_map
  - oam.*
  - palram.*
  params:
    metatile_size:
      value: 24
      unit: px
      evidence:
      - kind: decomp_source
        ref: pmd-red:include/structs/str_position.h:X_POS_TO_PIXELPOS
        confidence: 0.95
    video_mode:
      value: 0
      evidence:
      - kind: capture_telemetry
        ref: 'capture:attract+frontend:video_modes_frames mode0=8982'
        confidence: 0.9
    max_visible_sprites:
      value: 16
      unit: OBJ in frontend capture (19 active)
      evidence:
      - kind: capture_telemetry
        ref: capture:frontend:max_obj_visible 16, max_obj_active 19
        confidence: 0.8
    full_redraw_threshold:
      value: 7
      unit: px camera jump
      evidence:
      - kind: decomp_source
        ref: pmd-red:src/dungeon_tilemap.c:UpdateCamera
        confidence: 0.85
  relations:
  - type: part_of
    target: top_down_tile_projection
  evidence:
  - kind: decomp_source
    ref: pmd-red:src/dungeon_vram.c:sub_803E490
    confidence: 0.75
  - kind: decomp_source
    ref: pmd-red:src/dungeon_tilemap.c:UpdateCamera
    confidence: 0.85
  - kind: decomp_source
    ref: pmd-red:src/weather.c:sub_807E698
    confidence: 0.75
  - kind: capture_telemetry
    ref: capture:frontend:affine_bg_frames 0, obj_affine_frames 0, mosaic_frames 0
    confidence: 0.85
- id: window_hdma_vision
  facet: rendering
  label: Per-scanline WIN0H/WIN1H via HBlank DMA for text-box shapes and darkness vision
  summary: 'Every VBlank, DMA0 is armed in HBlank-repeat mode to copy a WIN0H/WIN1H pair per scanline from a double-buffered
    160-line table. WIN0 shapes the text windows; WIN1 draws dungeon darkness: in dark corridors a precomputed circle
    around the leader (small or large by floor visibility range), in rooms a rounded rectangle matching the room
    bounds, with the outside dimmed via BG1 translucency (constant 8/8 alpha in dungeons). Fully lit floors skip WIN1.'
  instantiates:
  - concept: rendering.raster.window_shape_per_scanline
  - concept: rendering.lighting.window_mask_vision_radius
  - concept: rendering.blending.alpha_layer_transparency
    weight: 0.5
  reads:
  - floor_props.visibility_range
  - leader.room
  - camera.pixel
  - ui.windows
  writes:
  - io.win0h
  - io.win1h
  - io.bldcnt
  - io.bldalpha
  params:
    lines_per_frame:
      value: 160
      unit: scanlines (2 halfwords each)
      evidence:
      - kind: decomp_source
        ref: pmd-red:src/cpu.c:VBlank_CB
        confidence: 0.9
      - kind: capture_telemetry
        ref: capture:frontend:raster.window hdma_max_lines 160, hdma_frames 5372/5400; hblank_dma_targets ch0->0x04000040
        confidence: 0.95
    dungeon_alpha:
      value: 8/8
      unit: EVA/EVB
      evidence:
      - kind: decomp_source
        ref: pmd-red:src/run_dungeon.c:RunDungeon_Async (gUnknown_2026E4E = 2056)
        confidence: 0.9
    visibility_levels:
      value: 3
      unit: 0 lit, 1 small circle, 2 larger circle (2-bit field)
      evidence:
      - kind: decomp_source
        ref: pmd-red:src/dungeon_tilemap.c:sub_803F27C
        confidence: 0.8
      - kind: derived
        ref: tallied FloorProperties.visibilityRange (0:205, 1:42, 2:103 floors)
        inputs:
        - pmd-red:data/dungeon/*/main_data.inc
        confidence: 0.8
  relations:
  - type: modulates
    target: dungeon_tile_renderer
  - type: modulates
    target: enemy_chase_and_wander_ai
    note: same visibility range feeds AI sight in corridors
  evidence:
  - kind: decomp_source
    ref: pmd-red:src/cpu.c:VBlank_CB
    confidence: 0.9
  - kind: decomp_source
    ref: pmd-red:src/window_buffer.c:CopyWindowBgBuffer
    confidence: 0.8
  - kind: decomp_source
    ref: pmd-red:src/dungeon_tilemap.c:sub_803F7BC
    confidence: 0.75
  - kind: capture_telemetry
    ref: capture:frontend:blend_frames alpha 5397/5400; windows true; summary flags hdma_window_shape true
    confidence: 0.9
