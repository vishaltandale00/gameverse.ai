- id: status_conditions
  facet: mechanics
  label: Turn-counted status conditions and residual damage
  summary: 'Statuses live in exclusive classes (sleep, burn/poison, frozen/wrap/ingrain, cringe/paralysis, reflect,
    curse, leech seed, sure-shot, invisible, blinker, muzzled), each with a turn counter decremented every turn. Many
    durations are drawn from configured ranges (sleep 3-7, confusion 6-12, paralysis 1-2, freeze 3-5); burn and poison
    last until cured. Residual damage uses countdown periods: burn 5 HP every 20 turns, poison 4 every 10, bad poison
    6 every 2, wrap 6 and constriction 5 every 2, curse 1/4 max HP every 10. Status gates action: sleep/frozen/petrified
    skip the turn; confusion randomises facing; blinker restricts attacks to the facing tile.'
  instantiates:
  - concept: mechanics.status.turn_counted_status_effects
  reads:
  - entities[*].status.*
  writes:
  - entities[*].status.*
  - entities[*].hp
  tables:
    status_durations:
      description: Turn ranges [min, max]; 127 means until cured.
      columns:
      - status
      - turns
      rows:
      - [sleep, 3-7]
      - [confusion, 6-12]
      - [paralysis, 1-2]
      - [freeze, 3-5]
      - [cringe, '1']
      - [burn, until cured (127)]
      - [poison, until cured (127)]
      - [reflect / light screen, 10-12]
      - [safeguard, 15-20]
      - [petrified (leader), 20-30]
      - [decoy, 20-50]
      - [invisible, 10-20]
      - [perish song, '3']
      evidence:
      - kind: decomp_source
        ref: pmd-red:src/dungeon_config.c:gSleepTurnRange
        confidence: 0.95
    residual_damage:
      description: Residual damage amount and repeat period in turns.
      columns:
      - status
      - damage
      - period_turns
      rows:
      - [burn, 5, 20]
      - [poison, 4, 10]
      - [bad poison, 6, 2]
      - [constriction, 5, 2]
      - [wrapped, 6, 2]
      - [curse, maxHP/4, 10]
      - [leech seed, 10, 2]
      - [hail/sandstorm, 5, 10]
      evidence:
