- id: personality_quiz
  facet: frontend
  label: Personality quiz as character creation (nature to starter species)
  summary: 'A new game opens with a questionnaire: 8 questions drawn from a pool of 55, each from a different category
    (13 natures x 4 plus 3 misc), each answer adding 1-4 points to one or more natures, then a gender question. The
    highest-scoring nature (ties broken by a random walk start) selects the player species from a 13x2 nature-gender
    table; the player then picks a partner from 10 starters, excluding any sharing a type with the player. The capture
    shows the quiz on full-screen colour-changing zigzag backdrops with Yes/No and multi-choice menus.'
  instantiates:
  - concept: frontend.new_game.questionnaire_character_creation
  - concept: narrative_delivery.framing.player_avatar_identity
    weight: 0.4
  reads:
  - input.menu_choice
  - rng.global
  writes:
  - player.species
  - player.nature
  - player.gender
  - partner.species
  params:
    questions_asked:
      value: 8
      evidence:
      - kind: decomp_source
        ref: pmd-red:include/constants/personality_test.h:MAX_ASKED_QUESTIONS
        confidence: 0.95
    question_pool:
      value: 55
      evidence:
      - kind: decomp_source
        ref: pmd-red:include/constants/personality_test.h:NUM_QUIZ_QUESTIONS
        confidence: 0.95
    natures:
      value: 13
      evidence:
      - kind: decomp_source
        ref: pmd-red:include/constants/personality_test.h:NUM_PERSONALITIES
        confidence: 0.95
    partner_candidates:
      value: 10
