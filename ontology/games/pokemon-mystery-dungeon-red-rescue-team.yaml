  label: Run failure rule - leader faint loses money, held items and half the bag
  summary: 'A run fails if the leader faints (or a client or required partner is lost), the wind ejects the team,
    or the player gives up; 50 exit reasons below 550 are failures and 5 at or above are successes. On a plain failure
    the town restart removes each bag item with 50% chance, all held items of team members and all carried money;
    other abnormal returns (e.g. a consumed quicksave) wipe the whole bag. If rescue is allowed the run is instead
    suspended: the dungeon location and 23-bit seed are quicksaved so a friend can rescue the team via mail or password,
    after which the run continues. A thief who faints has every item turned into a Plain Seed.'
