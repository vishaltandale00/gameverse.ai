    confidence: 0.9
  - kind: capture_frame
    ref: capture:frontend:f001223 (top-down room with oblique sprites)
    confidence: 0.8
- id: walk_animation_and_dash
  facet: movement_physics
  label: 24-frame tile-to-tile walk interpolation, fast option and dash skip
  summary: 'Logic is discrete, but each tile step is animated at 1 px/frame, 24 frames per tile (12 with the Fast dungeon
    speed option); all monsters that moved in a turn animate together, and fast monsters that moved 2-4 tiles compress
    their steps into the same 24 frames. Holding B while moving dashes: the walk animation is skipped until something
    interesting happens.'
  instantiates:
  - concept: movement_physics.grid.interpolated_tile_animation
  reads:
  - input.buttons.held.b
  - options.dungeon_speed
  writes:
  - entities[*].pixel_pos
  params:
    walk_speed:
      value: 1
      unit: px/frame
      native_value: 256
      native_unit: 1/256 px per frame
      evidence:
      - kind: decomp_source
        ref: pmd-red:src/dungeon_pos_data.c:gUnknown_80F4D44
        confidence: 0.85
    frames_per_tile:
      value: 24
      unit: frames (0.4 s)
      variants:
