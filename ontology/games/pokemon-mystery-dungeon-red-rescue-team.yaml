  label: Grid-of-cells room placement for procedural dungeon floors
  summary: 'Each floor is a 56x32-tile map divided into a gridSizeX x gridSizeY lattice of cells (random 2..8 x 2..7,
    rejected until <=6x4, else 4x4; layout presets force 4 x 2-3 for small/medium floors and invalidate the right half
    or quarter of the grid). AssignRooms marks roomDensity+rand(0..2) cells as rooms (or exactly |roomDensity| when
    negative) by shuffling a bit array with 64 random swaps; the rest become 1x1 hallway anchors. Each room is a random
    rectangle inside its cell with a 2-tile margin, width >=5, height >=4, odd dimensions preferred and aspect ratio
    clamped to 2/3..3/2. Rooms are flagged 80% for a secondary structure (when the budget allows) or for imperfections
    if the floor allows them.'
