- id: leader_lock_camera
  facet: camera
  label: Hard-locked leader camera on the tile grid
  summary: 'The dungeon camera has no easing: each frame it centres the target (normally the leader) at screen (120,
    96) from its pixel position, so it moves in lockstep with the 24-frame walk interpolation. A vertical shake offset
    is applied for quakes; the camera may be pointed at other monsters for messages and wind warnings. Visible area
    is about +-6 x +-5 tiles.'
  instantiates:
  - concept: camera.follow.hard_lock_center
  reads:
  - leader.pixel_pos
  - camera.target
  writes:
  - camera.pixel
  params:
    anchor:
      value: 120x96
      unit: px from top-left
      evidence:
      - kind: decomp_source
        ref: pmd-red:src/dungeon_tilemap.c:UpdateCamera
        confidence: 0.85
    visible_tiles:
      value: '+-6 x, +-5 y'
      unit: tiles
      evidence:
      - kind: decomp_source
        ref: pmd-red:src/dungeon_tilemap.c:sub_803F428
        confidence: 0.8
  relations:
  - type: requires
    target: top_down_tile_projection
  evidence:
  - kind: decomp_source
    ref: pmd-red:src/dungeon_tilemap.c:UpdateCamera
    confidence: 0.85
