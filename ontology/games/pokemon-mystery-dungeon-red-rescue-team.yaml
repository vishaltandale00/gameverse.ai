- id: hallway_connectivity
  facet: progression
  label: Momentum random-walk cell connections, L-shaped hallways and connectivity repair
  summary: 'From a random start cell, a walker makes floorConnectivity steps: each step keeps its heading with 50%
    probability, otherwise picks a random cardinal, rotating counter-clockwise off the grid border, and links the two
    cells. Unless the floor allows dead ends, hallway-anchor cells with exactly one link get an extra link, repeated
    until stable. Each link becomes a hallway from a random interior point (or the anchor tile) that runs straight to
    the cell boundary, jogs perpendicular, then continues, stopping early when it meets open floor. Linked rooms merge
    into one larger room with ~9.75% chance (two 5% rolls). EnsureConnectedGrid then links any unconnected room to a
    connected neighbour or deletes it; finally numExtraHallways random walks tunnel out of rooms in strides of 3-5
    tiles, turning left/right at random and refusing to create 2x2 open squares.'
