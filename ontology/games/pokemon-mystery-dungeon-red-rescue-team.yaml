  label: Top-down (slightly oblique) tile grid
  summary: 'Both dungeon and town use a top-down view with sprites drawn in a slight three-quarter perspective; dungeon
    logic is a pure 2D grid of 24 px tiles (56x32), entity pixel position = tile x 24 + (12, 16).'
  instantiates:
