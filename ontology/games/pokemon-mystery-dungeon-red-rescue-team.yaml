proposed_concepts:
- id: mechanics.pokemon.elemental_type_chart
  label: Elemental type chart
  definition: Every creature and attack has one or more elemental types; a fixed attacker-type by defender-type table
    scales damage (immune, resisted, neutral, super effective), combined across a defender's types.
  aliases:
  - type effectiveness
  seed_source: 'gdp: Rock-Paper-Scissors'
- id: mechanics.pokemon.stat_stage_multipliers
  label: Stat stage multipliers
  definition: Temporary buffs and debuffs move a stat along a bounded ladder of discrete stages, each mapped to a fixed
    multiplier applied in damage or accuracy calculations.
- id: mechanics.combat.stat_difference_damage_formula
  label: Stat-difference damage formula
  definition: Damage is computed from attacker power plus move power minus defender defense, shaped by a nonlinear
    curve and a level term, clamped to a minimum of 1, then scaled by type, crits and a random spread.
- id: mechanics.turn.player_paced_roguelike_turns
  label: Player-paced roguelike turns
  definition: The world advances only when the player acts; every entity then takes its queued action, so one player
    step equals one world turn.
  seed_source: 'igdb genre: Turn-based (unverified)'
- id: mechanics.turn.speed_scheduled_turns
  label: Speed-scheduled turns
  definition: Entities act on a fixed fractional-tick schedule indexed by a discrete speed stage, so faster entities
    get proportionally more actions per player turn.
  is_a:
  - mechanics.turn.player_paced_roguelike_turns
- id: mechanics.survival.hunger_clock
  label: Hunger clock
  definition: A food resource drains steadily per turn or time; at zero it causes ongoing health loss or blocks recovery,
    forcing the player to find or carry food.
  aliases:
  - belly
  - food clock
- id: mechanics.health.passive_regeneration
  label: Passive health regeneration
  definition: Health recovers automatically over time or turns at a rate that can depend on max health, items or
    conditions, and stops under specified states.
- id: mechanics.status.turn_counted_status_effects
  label: Turn-counted status effects
  definition: Conditions such as sleep, poison or confusion carry their own turn counters, alter what the affected
    entity can do, and may deal periodic damage until they expire or are cured.
- id: mechanics.environment.weather_states
  label: Weather states
  definition: A level-wide weather value that periodically damages some entities and modifies attacks, abilities and
    healing; it can be changed by actions for a limited time.
- id: mechanics.pressure.turn_limit_ejection
  label: Turn-limit ejection
  definition: Each level allows a fixed number of turns; escalating warnings precede forced removal of the player
    when the count runs out.
  seed_source: 'gdp: Time Limits'
- id: mechanics.failure.partial_inventory_loss_on_defeat
  label: Partial inventory loss on defeat
  definition: A failed expedition returns the player to the hub but destroys carried money and a random share of
    carried items, while character progression is kept.
  seed_source: 'gdp: Penalties'
- id: mechanics.failure.rescuable_defeat
  label: Rescuable defeat
  definition: Instead of resolving immediately, a defeat can be suspended so that another player (or a later action)
    rescues the party and the run resumes where it fell.
- id: mechanics.spawning.timed_wild_respawn
  label: Timed wild respawn
  definition: New enemies appear at intervals during a level up to a population cap, punishing lingering.
- id: mechanics.spawning.ambush_room
  label: Ambush room
  definition: A room that looks normal or holds loot and, when first entered, spawns a large group of enemies around
    the intruder.
  aliases:
  - monster house
- id: mechanics.inventory.shared_slot_bag
  label: Shared slot bag
  definition: The party carries items in one fixed-size slot list shared by all members; full slots block pickups.
  seed_source: 'gdp: Inventories'
- id: mechanics.inventory.held_item_passive
  label: Held-item passive
  definition: Each character can hold one item whose passive effect applies only while held.
- id: mechanics.items.consumable_effect_categories
  label: Consumable effect categories
  definition: Consumables grouped into families (food, healing, status, stat boosters, throwables, one-shot spells)
    sharing use rules within each family.
- id: mechanics.combat.thrown_projectile
  label: Thrown projectile item
  definition: A consumable thrown in a direction or at a target, travelling a limited distance and dealing damage
    or applying an effect to the first entity hit or the target square.
- id: mechanics.hazard.hidden_trap_tiles
  label: Hidden trap tiles
  definition: Floor tiles conceal traps with varied effects that trigger, sometimes probabilistically, when stepped
    on and become visible once triggered or revealed.
  seed_source: 'gdp: Traps'
- id: mechanics.crime.theft_escalation
  label: Theft escalation
  definition: Leaving a shop without paying is allowed but switches the level into a hostile state (stronger pursuing
    guards, more spawns, blocked escapes) until the player leaves or wins.
- id: mechanics.party.leader_plus_ai_companions
  label: Leader with AI companions
  definition: The player directly controls one leader while a small party of companions acts under AI; losing the
    leader ends the attempt.
  seed_source: 'gdp: Companions'
- id: mechanics.progression_stat.skill_unlock_by_points
  label: Skill unlock by points
  definition: A per-character points total raised by consumables or play unlocks passive skills at fixed thresholds;
    unlocked skills can be toggled.
- id: movement_physics.grid.eight_direction_tile_step
  label: Eight-direction tile step
  definition: Characters occupy single grid cells and move exactly one cell per action in one of eight directions.
  seed_source: 'vgdl: GridPhysics'
- id: movement_physics.grid.no_corner_cutting
  label: No corner cutting
  definition: A diagonal grid move is allowed only when both orthogonally adjacent cells are passable.
  is_a:
  - movement_physics.grid.eight_direction_tile_step
- id: movement_physics.grid.terrain_crossing_classes
  label: Terrain crossing classes
  definition: Each mover has a crossing class (ground, liquid, chasm, wall) that determines which terrain types it
    can enter; items or skills can upgrade the class.
- id: movement_physics.grid.interpolated_tile_animation
  label: Interpolated tile animation
  definition: Discrete grid moves are shown as smooth pixel interpolation over a fixed number of frames per cell, with
    options to speed up or skip the animation.
- id: ai.framework.priority_decision_pipeline
  label: Priority decision pipeline
  definition: Each turn an agent tries actions in a fixed priority order (status gate, item use, attack, movement),
    taking the first that applies.
  seed_source: 'game_ai_taxonomy: Decision tree'
- id: ai.framework.objective_state_per_entity
  label: Per-entity objective state
  definition: Each agent stores a current objective (chase, roam, flee, take item) with a target and remembered target
    positions, recomputed every turn.
- id: ai.enemy.greedy_chase_nearest_visible
  label: Greedy chase of nearest visible target
  definition: Agent picks the nearest visible hostile and steps directly toward it each turn with small detours, without
    global pathfinding, falling back to last-seen positions.
  seed_source: VGDL Chaser
- id: ai.navigation.room_exit_wander
  label: Room-exit wandering
  definition: With no target, an agent walks to a random exit of its current room and follows corridors, choosing
    random branches at junctions.
- id: ai.perception.room_or_radius_visibility
  label: Room-or-radius visibility
  definition: Visibility is the whole current room when inside a room, otherwise a small radius around the viewer.
- id: ai.companion.follow_leader
  label: Follow the leader
  definition: Companion agents move toward the player-controlled leader when no enemy is engaged, re-ordered so the
    nearest move first.
- id: ai.companion.selectable_tactics
  label: Selectable companion tactics
  definition: The player sets each companion's behaviour policy from a list (follow, hunt, keep distance, wait, flee),
    changing its target selection and movement.
  is_a:
  - ai.companion.follow_leader
- id: ai.combat.weighted_action_selection
  label: Weighted action selection
  definition: An agent chooses among available attacks by weighted random roll, filtered by targeting validity and
    skill-based heuristics such as type advantage.
- id: ai.items.situational_item_use
  label: Situational item use
  definition: Agents use or throw items with per-item probabilities conditioned on health, hunger, status and enemy
    adjacency.
- id: ai.enemy.flee_from_threat
  label: Flee from threat
  definition: Under fear or low health an agent moves away from the nearest threat, preferring exits that increase
    distance, and stops attacking.
- id: camera.follow.hard_lock_center
  label: Hard-locked centre follow
  definition: The camera is fixed to the target's position every frame at a constant screen offset, with no lag or
    dead zone.
- id: rendering.background.metatile_streaming
  label: Metatile streaming
  definition: A large map is stored as metatiles (blocks of hardware tiles) and only the rows and columns entering
    the view are written to the hardware tilemap as the camera moves.
- id: rendering.lighting.window_mask_vision_radius
  label: Window-mask vision radius
  definition: Darkness or limited vision drawn by reshaping hardware windows per scanline (circle in corridors, room
    rectangle in rooms) and dimming outside it with blending.
  is_a:
  - rendering.raster.window_shape_per_scanline
- id: economy.currency.capped_wallet
  label: Capped wallet
  definition: Carried currency has a hard maximum and is exposed to loss; excess must be stored elsewhere.
  is_a:
  - economy.resource.capped_pool
- id: economy.shop.in_world_shop_room
  label: In-world shop room
  definition: Merchandise lies on the floor of a room in a level; picking it up adds to a bill settled with the shopkeeper
    on leaving, and the player can sell by dropping items.
- id: economy.shop.town_shop_restock
  label: Restocking hub shop
  definition: A hub vendor whose stock is regenerated periodically from weighted item sets that change with story
    progress.
  is_a:
  - economy.trade.fixed_price_shop
- id: economy.storage.safe_stash
  label: Safe stash
  definition: A hub storage for items or money that is immune to expedition loss, creating a carry-versus-store trade-off.
- id: frontend.flow.hub_and_expedition_loop
  label: Hub and expedition loop
  definition: Play alternates between a safe hub (shops, jobs, story) and expeditions into separate levels whose result
    (success, failure, suspended) determines the hub state on return.
- id: frontend.menu.main_menu
  label: Main menu
  definition: Front-end menu after the title listing new game or continue plus auxiliary functions (logs, link features,
    passwords, delete save).
- id: frontend.new_game.questionnaire_character_creation
  label: Questionnaire character creation
  definition: A new game asks personality questions whose scored answers determine the player's character (class,
    species or traits) instead of direct selection.
- id: frontend.save.suspend_save_consumed_on_load
  label: Consumable suspend save
  definition: Mid-level suspend that can be resumed exactly once; quitting after resuming without re-saving counts
    as a failure.
  seed_source: 'gdp: Save Files'
- id: narrative_delivery.dialogue.portrait_emotion_dialogue
  label: Portrait emotion dialogue
  definition: Dialogue boxes paired with a speaker portrait selected from a set of emotion variants per character.
  is_a:
  - narrative_delivery.dialogue.typewriter_dialogue
- id: narrative_delivery.engine.bytecode_script_vm
  label: Bytecode script VM
  definition: Story and scene logic runs as data-driven bytecode on cooperative actor threads (move, talk, camera,
    music, flag-conditional jumps) rather than hard-coded routines.
- id: narrative_delivery.framing.player_avatar_identity
  label: Player avatar identity framing
  definition: The story frames the avatar as the player themself (e.g. derived from the player's answers), making
    character creation part of the narrative.
- id: progression.level_generation.procedural_floor
  label: Procedural floor
  definition: Each level (floor) is generated anew from parameters and a seed when entered, so layout, items and enemies
    differ between visits.
  seed_source: 'gdp: Procedurally Generated Game Worlds'
- id: progression.level_generation.grid_cell_rooms_and_corridors
  label: Grid-cell rooms and corridors
  definition: The map is divided into a lattice of cells; selected cells receive rectangular rooms, the rest corridor
    anchors, and adjacent cells are joined by corridors.
  is_a:
  - progression.level_generation.procedural_floor
- id: progression.level_generation.random_walk_corridor_links
  label: Random-walk corridor links
  definition: Which cells are connected is decided by a random walk over the cell lattice (with momentum and dead-end
    repair) before corridors are carved.
  is_a:
  - progression.level_generation.grid_cell_rooms_and_corridors
- id: progression.level_generation.special_room_roll
  label: Special room roll
  definition: After layout, one eligible room may be converted by a per-level chance into a special room (shop, ambush,
    maze).
- id: progression.level_generation.room_template_variants
  label: Room template variants
  definition: Rooms are decorated from a small set of procedural templates (pools, islands, dividers, checkerboards)
    using secondary terrain under a per-level budget.
- id: progression.level_generation.parameterized_floor_profile
  label: Parameterized floor profile
  definition: Each level of a dungeon is described by a compact record of generator parameters (layout type, densities,
    chances, music, visibility) that designers tune per floor.
- id: progression.level_generation.layout_archetypes
  label: Layout archetypes
  definition: The generator supports several named whole-level shapes (standard grid, ring, cross, line, single room)
    selected per level.
- id: progression.level_generation.rule_filtered_spawn_placement
  label: Rule-filtered spawn placement
  definition: Exits, items, traps, enemies and the player are placed on tiles that pass per-class filters (room tiles,
    not junctions, not shops), drawn from a shuffled candidate list.
- id: progression.level_generation.generate_validate_retry
  label: Generate-validate-retry
  definition: Generation retries a bounded number of times until validity checks pass (room counts, exit reachability)
    and falls back to a trivially valid layout.
- id: progression.level_generation.seeded_reproducible_generation
  label: Seeded reproducible generation
  definition: Levels are generated from a stored seed so the same level can be regenerated exactly, enabling sharing
    or rescue by another player.
- id: progression.level_generation.authored_room_injection
  label: Authored room injection
  definition: Hand-authored rooms or whole floors (boss arenas) are inserted into or replace procedural generation.
- id: progression.structure.linear_floor_descent
  label: Linear floor descent
  definition: An expedition is an ordered stack of floors joined by one exit each; reaching the last floor completes
    it.
- id: progression.structure.boss_floor
  label: Boss floor
  definition: A dedicated final floor or arena where a scripted boss encounter concludes a dungeon.
  seed_source: 'gdp: Boss Monsters'
- id: progression.collection.defeat_to_recruit
  label: Defeat to recruit
  definition: Defeated enemies may join the player's roster by a chance roll modified by items and level, subject
    to licence and capacity rules.
- id: progression.collection.purchasable_roster_capacity
  label: Purchasable roster capacity
  definition: Roster space for groups of recruitable characters is bought or earned; a group's space must be owned
    before its members can be recruited.
- id: progression.character.exp_levels
  label: Experience levels
  definition: Defeating enemies grants experience points that raise a character's level and stats along per-character
    growth tables.
- id: progression.character.conditional_evolution
  label: Conditional evolution
  definition: A character transforms into a stronger form when level, item or other conditions are met, possibly
    gated by story progress.
- id: progression.missions.procedural_job_board
  label: Procedural job board
  definition: A hub board offers generated missions (rescue, escort, fetch, deliver) bound to a level and floor, with
    difficulty-scaled rewards.
  seed_source: 'gdp: Quests'
- id: progression.meta.reputation_rank
  label: Reputation rank
  definition: Points from completed missions accumulate into named ranks that signal progress and may gate mission
    types.
- id: progression.sharing.password_encoded_content
  label: Password-encoded content
  definition: Game content (missions, rescue requests) serialised to a checksummed text password that players exchange
    outside the game.
  seed_source: 'gdp: Password Save Files'
- id: progression.sharing.asynchronous_player_rescue
  label: Asynchronous player rescue
  definition: A defeated player exports a rescue request; another player replays the same seeded level and returns
    a token that revives the first player's party.
- id: setting.theme.creature_world_fantasy
  label: Creature-world fantasy
  definition: A world populated entirely by talking creature species living in towns, with no human society on screen.
- id: setting.framing.transformed_human_protagonist
  label: Transformed human protagonist
  definition: The protagonist is a human who has become one of the world's creatures and seeks the reason.
- id: ui_hud.feedback.scrolling_combat_log
  label: Scrolling combat log
  definition: Every action and result is narrated as text lines in a popup log with a reviewable history.
- id: ui_hud.input.chorded_turn_commands
  label: Chorded turn commands
  definition: A small button set maps many turn actions through held-button chords (attack, rest, dash, diagonal lock,
    turn in place, throw).
- id: ui_hud.menu.in_turn_command_menu
  label: In-turn command menu
  definition: A menu opened during a turn exposes moves, items, team orders and options; choosing an action consumes
    the turn.
open_questions:
- No in-dungeon capture exists (the default script only reached the personality quiz); darkness window shapes, HUD
  layout, walk timing and dungeon music should be confirmed with a scripted dungeon capture.
- GenerateSecondaryTerrainFormations (rivers/lakes) is still inline asm in the matching build; lake/river parameters
  were not extracted.
- The minimum-room-tile check is 30 in code but 20 in the function's header comment; code value used.
- 'Wild respawn cap: TrySpawnWildMonster applies gMaxWildMonsInMonsterHouse (10) when monsterHouseRoom == 0xFF (no
  monster house) and gMaxWildMonsInRoom (4) otherwise; the config names look swapped, behaviour recorded as coded.'
- enemyDensity is stored unsigned, so the 20 floor records holding 255 were meant as negative "exact" counts; actual
  spawn counts for those floors (e.g. Meteor Cave) were not traced.
- The in-story team limit (3 vs 4) depends on a requireHm/post-game flag in BufferDungeonRequirementsText; not confirmed.
- Item spawn category/item tables (data/dungeon/dungeon_item_data.json, 178 tables) and trap tables (148) were summarised,
  not tabulated per floor.
- Per-species regen speed, movement speed, crossable terrain and exp curves live in data/monster/monster_data.json
  and were not tabulated.
- Per-move AI weights and ranges (move data) were not tabulated.
- Exact Kecleon shop billing state machine and hostile-Kecleon stats were not traced.
- The Keep-your-distance turn-around code appears unreachable for partners and Get-away flees only wild Pokemon (source
  reading by a delegated agent); not verified at runtime.
- Whether Emerald's type chart and stat-stage tables are identical to this game's was not checked; link the mechanics.pokemon.*
  concepts once pokemon-emerald-version.yaml exists.
- Ground-mode (town) walking speed and the world map dungeon selection UI were not traced.
- Story content (scripts) was not read beyond CheckQuest stage thresholds; setting summary is llm_knowledge.
