  - kind: decomp
    ref: https://github.com/pret/pmd-red @ 013475aa04f5be3191e5527c186d9bfceae7cae0 (matching decomp of pmd_red.gba
      B24E; no license file per local/decomps/survey.json; local/decomps/pmd-red; symbols/pmd_red.sym present, not used)
  - kind: rom_header
    ref: local/re/roms.json id=pokemon-mystery-dungeon-red-rescue-team (header title POKE DUNGEON, maker 01, version
      0, 32 MiB)
  - kind: captures
    ref: local/captures/pokemon-mystery-dungeon-red-rescue-team run 20261015T234415-8f46cf (harness 0.1.0, libmgba
      0.10.5 HLE BIOS, source commit d431b81 dirty tree; attract 3600 frames idle, frontend 5400 frames START/A every
      90 frames); 128 keyframes, telemetry, WAVs. No gameplay inside a dungeon was captured.
  - kind: ghidra
    ref: local/re/pokemon-mystery-dungeon-red-rescue-team/functions.jsonl absent; not used
  - kind: extraction_run
    ref: 'claude-opus-5-5, brief v1, 2026-10-16T03:56:00Z-2026-10-16T04:15:30Z (~20 min wall), ~30 decomp files read
      directly (dungeon_generation, dungeon_engine, dungeon_turn_effects, dungeon_config, dungeon_random, run_dungeon,
      main_loops, dungeon_wind, dungeon_wild_mon_spawn, dungeon_monster_house, dungeon_logic, dungeon_map_access, dungeon_damage,
      dungeon_exit, data/dungeon/*.json/.inc) plus ~120 more opened by 4 parallel read-only sub-agents (AI, items/economy,
      missions/progression, frontend/rendering/audio); 13 capture keyframes viewed'
conventions:
  units_convention: 'Dungeon space is a 56x32 grid of 24x24 px tiles; an entity''s pixel position is (tile*24+12,
    tile*24+16) in 1/256 px (24.8 fixed). Time inside dungeons is turn-based: a "turn" is one normal-speed (stage
    1) action = 4 of the 24 fractional ticks in gSpeedTurns; all status durations, belly drain, respawn timers and
    turn limits count these turns, not frames, even where the source names them "frames". Walk animation takes 24
    frames per tile at 60 fps (12 on Fast). Probabilities written as % are DungeonRandInt(100) < p; recruit rolls
    are per-mille (rand(1000)); spawn tables use weights out of 10000. DungeonRandRange(lo, hi) is half-open [lo,
    hi). Belly and some multipliers are s48.16 fixed point (65536 = 1.0); damage multipliers are s24.8. Floor parameters
    come from 28-byte FloorProperties records in data/dungeon/<Dungeon>/main_data.inc (350 records), decoded with
    the field order of include/structs/str_dungeon.h:FloorProperties.'
  shared_pokemon_concepts: 'Types (17 + none), the type chart, physical/special split by type, stat stages and moves
    are shared Pokemon-franchise concepts. They are proposed here with general definitions (mechanics.pokemon.*);
    the main-series battle engine itself is left to the Emerald decomposition. This game combines dual types through
    a 4x4 effectiveness table rather than multiplying; its chart was not cross-checked against Emerald.'
components:
- id: game_mode_flow
  facet: frontend
  label: Ground-dungeon dispatcher driven by script return codes
  summary: 'After boot, GameLoop_Async runs four demo ground scripts (warning, logo, intro, title), then the main menu;
    New Game / Continue enter RunGameMode_Async, which alternates between the ground (town/overworld script engine)
    and dungeons. The ground engine returns codes selecting the friend-areas map, the world map, or a dungeon variant;
    the dungeon returns a result (won, lost, quicksaved, fainted awaiting rescue) that becomes the next ground start
    mode and picks the return script. Before most dungeons the game auto-saves.'
  instantiates:
  - concept: frontend.flow.mode_state_machine
  - concept: frontend.flow.hub_and_expedition_loop
  reads:
  - ground.return_code
  - dungeon.result
  writes:
  - frontend.start_mode
  - save.*
  params:
    mode_switch_music_fade:
      value: 16
      unit: frames
      evidence:
      - kind: decomp_source
        ref: pmd-red:src/main_loops.c:RunGameMode_Async
        confidence: 0.85
  relations:
  - type: requires
    target: save_and_quicksave
  evidence:
  - kind: decomp_source
    ref: pmd-red:src/main_loops.c:GameLoop_Async
    confidence: 0.85
  - kind: decomp_source
    ref: pmd-red:src/main_loops.c:RunGameMode_Async
    confidence: 0.85
  - kind: decomp_source
    ref: pmd-red:src/ground_main.c:xxx_script_related_8098468_Async
    confidence: 0.8
- id: boot_and_title
  facet: frontend
  label: Warning, logo, attract intro and randomised title screen
  summary: 'Boot plays ground maps in sequence: health-and-safety warning (held until input in the capture), The Pokemon
    Company logo, an in-engine intro scene at the Pelipper post office with sprites over the BG, then the title (logo
    over a sunset; one of 3 backgrounds picked at random) which fades in over 32 frames. Any of A/B/Select/Start/L/R
    cancels a demo with a 30-frame music fade. The main menu offers New Game or Continue, Adventure Log, Friend Rescue,
    Trade Items, Wonder Mail and Delete Save.'
