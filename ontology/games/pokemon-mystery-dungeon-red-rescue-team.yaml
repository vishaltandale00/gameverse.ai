  summary: 'RunMonsterAI is the shared brain for allies and wild Pokemon. Each turn: blocking statuses (sleep, freeze,
    petrify, paralysis-class) pass the turn; blinker, cross-eyed and confusion randomise movement; otherwise the monster
    considers using an item (AIDecideUseItem), then picks a move or regular attack (ChooseAIMove), then moves (AIMovement).
    The Dedicated Traveler IQ skill flips this to movement first. Per-monster AI state is an objective (chase target,
    chase remembered target, roam, leave room, run away, stand still, take item), a target entity and position, and
    the target''s last 4 positions.'
