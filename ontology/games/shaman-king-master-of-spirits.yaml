conventions:
  scope: 'Partial ROM self-decompilation: one locally qualified display component plus unverified gameplay candidates.'
  units: Scroll buffer and native BG register offsets, modulo512. Upstream world/fixed-point representation and
    tick schedule require separate qualification.
components:
- id: buffered_modular_bg_scroll
  facet: camera
  label: Four background scroll buffers with modulo-512 offsets
  summary: "The native setter at 0x08000e20 stores horizontal and vertical offsets for a selected background in\
    \ one of four 0x810-byte contexts, masks each offset to nine bits and marks its scroll state dirty. A recovered\
    \ renderer prefix sends those buffers to BG0\u2013BG3 scroll registers, optionally adding signed layer-specific\
    \ shake offsets. This is a reusable display/camera seam, not a recovered complete player camera or world coordinate\
    \ model."
  instantiates:
  - concept: camera.scroll.buffered_modular_layer_offsets
  reads:
  - input.layer:u32 with caller precondition 0..3
  - input.x:u32 low nine bits used
  - input.y:u32 low nine bits used
  - ram[0x030011d1]:u8 shake enable (flush prefix)
  - ram[0x030011d0]:u8 per-layer shake mask (flush prefix)
  - ram[0x030011d3/0x030011d4]:i8 additive shake offsets (flush prefix)
  writes:
  - ram[0x02004000 + layer*0x810 +0x16]:u16 horizontal offset
  - ram[0x02004000 + layer*0x810 +0x18]:u16 vertical offset
  - ram[0x02004000 + layer*0x810 +0x11]:u8 scroll dirty
  - MMIO[0x04000010 + layer*4]:u16 BGxHOFS (flush prefix)
  - MMIO[0x04000012 + layer*4]:u16 BGxVOFS (flush prefix)
  invariants:
  - Setter stores x & 0x1ff and y & 0x1ff and dirty=1 for exactly the selected layer; it does not clamp at world
    edges.
  - 'Layer range is a caller precondition: native setter contains no bounds check. Independently enforce 0..3 when
    adapting it.'
  - Flusher iterates four layers and advances the hardware destination by four bytes per layer.
  - When shake is disabled or the layer mask bit is clear, flusher writes stored offsets and clears its dirty byte.
    With shake active for the layer, it writes (stored + signed shake) & 0x1ff and does not clear that dirty byte
    in this prefix.
  - Setter qualification compared the full 0x2040-byte context region including canaries; the test did not run or
    qualify the full renderer, DMA transfers or gameplay camera.
  - The caller at 0x08021dd4 converts its interpolated values with arithmetic >>8 before calling this setter. Its
    complete movement/collision linkage and invocation cadence remain outside this component.
