conventions:
  scope: Own-ROM local run/jump/cape/integration and accepted spin-stomp/particle/reward systems. Shared IR builds
    native full-ROM replacements and natural ordinary/spin movement and first-enemy destruction match stock. Terrain/general
    enemy ecology and full progression remain partial.
  units: Positions signed16 pixel integer plus u8subpixel (1/256pixel). Velocity signed16 underlying units1/4096pixel;
    only signed high byte integrated as1/16pixel/invocation. Native frame schedule retained.
components:
- id: charged_run_and_normal_spin_jump
  facet: movement_physics
  label: Charged running and normal/spin jump initiation
  summary: Full local horizontal control selects facing, skidding, run acceleration and caps, surface-specific convergence,
    run-charge gain/decay, and normal versus spin takeoff. Jump onset depends on speed, character and riding state;
    contact and native mode flags explicitly gate initiation.
  instantiates:
  - concept: movement_physics.controller.charged_run_spin_jump
  reads:
  - 'player at03003fa0: velocity x signed16 at+08, high byte signed1/16pixel per frame; airborne byte+01 and contacts+06'
  - held03002b94:u16 and pressed03002b96:u16; A=bit0,R=bit8,B=bit1, left/right bits5/4, downbit7
  - player+43:u8 movement mode, +46:u8 run charge, +54/+55 special traversal, +6e cape mode, +71 spin state
  - 'engine pointer03003f98: +10fa riding state; profile03002360:+dc character; map03003f9c:+5c mode; scene03007a48
    level ID,edb/edc mode flags'
  - exact immutable onset,acceleration,target speed,charge and character tables within08109e00..0810a5ff
  writes:
  - player vx+08,vy high+0d, facing+05, airborne+01, duck+02, charge+46, spin+71, character float+87, charge timer+95
    and related native traversal bytes
  - ground effect records in scene+02f0..032f and sound context03002b68 plus ordered audio events
  invariants:
  - Only grounded state and pressed A/R can initiate ordinary takeoff; existing contact and special level-mode gates
    remain active.
  - Jump speed index=(abs(signed vx high)>>2)&0xfe. Spin adds1; onset comes from exact character table. Mario onset
    pairs range -80/-74 to -97/-90; Luigi -46/-43 to -62/-58.
  - R spin initiates sound0x29 and increments spin state; ordinary jump sound0x23. Riding/special scene state changes
    allowed spin path.
  - Charge update adds exact table[-1,-1,2,4] for native selector0..3; wrapped negative charge resets0, charge above111
    saturates112 and advances returned cap mode.
  - Controller owns acceleration, facing and jump onset; input polling, terrain contact production and frame scheduling
    are explicit host dependencies.
