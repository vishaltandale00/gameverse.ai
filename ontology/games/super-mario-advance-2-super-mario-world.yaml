- id: spin_stomp_particles_and_chain_rewards
  facet: mechanics
  label: Spin stomps destroy enemies, spawn particles and chain rewards
  summary: The complete accepted spin-contact response chooses a player bounce, gives the enemy a terminal state/timer,
    allocates impact particles and publishes a chained reward through a recovered native reward pool. Saturated
    chains increment the active player life counter; reusing occupied reward slots flushes pending score/life effects.
    Contact eligibility and enemy walking remain separate native systems.
  instantiates:
  - concept: mechanics.combat.spin_stomp_chain_reward_pool
  reads:
  - r0 native enemy actor100 bytes, world position at+10/+12, type+1a, suppression+2e/+2f, chain modifier+3a
  - 'player at03003fa0: special bounce inhibit+03, full vy+0c, y+34, chaini16+ec'
  - held03002b94 A/R; character profile+dc, riding engine+10fa, active-player variant engine+1158
  - 'scene03007a48 context: impact/effect slots,particle slots,reward pool,cursor6a7,chain sound selectorf33'
  - exact bounce/particle/chain/ring payout tables; camera X03002c04,Y03002c08
  writes:
  - enemy state+1c=4 and timer+22=31
  - player full vy+0c=0xf800 (-8 highbyte); riding branch can choose held/character bounce if no special inhibit
  - player chaini16+ec increment; scene particle/effect/reward records and ring cursor
  - scene life counteri16+6be or+6c0 on saturated-chain path, chosen by active-player variant
  - profile scoreu32+68 and engine scoreu32+00, or engine life fieldi16+10f0 when overwriting a pending reward
  - sound spatial context03002b68 set from enemy x minus camera X
  invariants:
  - Upstream native contact dispatcher must already accept a spin stomp; this component is not a general overlap
    detector.
  - Native impact effect uses original actor r0 even though Ghidra omitted the fc0c parameter. Actor flags2e/2f
    may suppress that effect.
  - Particle allocator scans slots7 down1; creates up to4 distinct fragments with original position offsets,velocities,type0x17
    and lifetime; occupied slots remain occupied.
  - Chain is a wrapping signed16 field. Reward index=(u16(oldChain+actorModifier)+1)&0xffff; values>=8 saturate
    visual reward8 and increment selected life counter.
  - Reward pool scans5..0 or4..0 depending scene mode. If full, decrements wrapping ring cursor and flushes a still-pending
    overwritten reward into original score/life fields before reuse.
  - Natural witness validates first native type0xbd only; no complete asset name/ecology claim or full campaign
    completion.
  evidence:
  - kind: static_signature
    ref: research/corpus-mining/20261016-binary-corpus-round2/reviewed/sma2-spin-lift-evidence.json
    confidence: 0.98
    note: Own-ROM ten-function closure, exact code/table hashes; native-review transcript records saved-LR returns
      and correct fc0c r0 actor/d804 result ABI. Original accepted contact eligibility remains upstream.
  - kind: capture_telemetry
    ref: research/corpus-mining/20261016-binary-corpus-round2/reviewed/sma2-native-spin-receipt.json
    confidence: 0.98
    note: 4096 finite original-ROM/C/emitted-native comparisons cover actor/player/world/profile/engine,particle/reward
      slots,wrapping chains,character/riding/input and score/life effects.
  - kind: capture_telemetry
    ref: research/corpus-mining/20261016-binary-corpus-round2/reviewed/sma2-spin-gameplay-receipt.json
    confidence: 0.99
    note: Actual first-stage enemy native type0xbd spin-destroyed in stock and shared-IR generated game; state8->4,timer31,bounce-8,chain0->1;
      all sampled player/enemy/scene/engine/profile states and rendered frames equal over52 natural frames.
