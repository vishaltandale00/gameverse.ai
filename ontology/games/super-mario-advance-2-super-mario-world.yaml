- id: split_fixed_point_position_integration
  facet: movement_physics
  label: Two-axis split fixed-point position and redirected vertical motion
  summary: The native integration phase preserves integer/subpixel carry separately for each axis, consumes signed
    high velocity bytes, and supports a mode that temporarily redirects vertical speed from horizontal speed before
    restoring it.
  instantiates:
  - concept: movement_physics.integration.split_fixed_point_motion
  reads:
  - x signed16 pixels atplayer+30 and u8fraction+3c; y signed16pixels+34 and u8fraction+3e
  - velocity high bytes at+09/+0d signed1/16pixel per invocation; underlying signed16 fields retain acceleration
    fraction
  - player+45:u8 vertical redirection selector
  writes:
  - x/y integer and subpixel fields; player+24 temporary saved vertical byte; original vertical speed restored
  invariants:
  - Subpixel += u8(vHigh)*16 modulo256; integer += arithmetic_shift_right(i8(vHigh),4) plus unsigned low-nibble
    carry.
  - When redirect selector is nonzero, integration uses x-speed as temporary y-speed; odd selector negates it. Stored
    original y-speed is restored after both axes.
  - Original frame wrappers integrate then sample/resolve terrain before control and gravity. Do not silently change
    phase order when composing another controller.
  - No terrain collision is hidden in this operator; clamping and grounded/contact flags remain native host responsibilities.
  evidence:
  - kind: static_signature
    ref: research/corpus-mining/20261016-binary-corpus-round2/reviewed/sma2-motion-lift-evidence.json
