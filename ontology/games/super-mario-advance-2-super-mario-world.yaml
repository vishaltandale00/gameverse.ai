- id: gravity_and_cape_flight_policy
  facet: movement_physics
  label: Input-shaped gravity and cape/riding flight state
  summary: The full local vertical policy retains held-jump gravity, character differences, fall speed clamps, run-charged
    cape entry, directional cape states and riding-related float behavior. It consumes explicit form, riding, contact
    and charge state rather than assuming a generic universal jump.
  instantiates:
  - concept: movement_physics.controller.cape_gravity
  reads:
  - player vy high+0d, airborne+01, movement modifier+43, cape state+6e/+6f, cape rise cap+70, charge timer+95,
    phase timers+9a/+9b
  - held/pressed jump and run/direction buttons; profile character+dc and powerup+e0; engine riding flags+10fa/+114f
  - exact gravity,fall cap,cape state transition and vertical limit tables
  writes:
  - player vy high+0d, airborne phase+01, cape state+6e/+6f/+70 and timers+95/+9a/+9b
  - ordered native sound and spatial context
  invariants:
  - Ordinary Mario gravity adds6 when jump unheld and3 while held; Luigi ordinary unmodified/unmounted branch adds2
    or1. Native helper caps prior nonnegative vy at64 before adding gravity, so resulting value may exceed64.
  - Normal airborne phase11 becomes36 when vertical velocity is nonnegative. Special state and riding branches select
    additional modes, preserved in the full lift.
  - Cape flight requires recovered form2 plus context gates; its mode, direction, run input, timers and coefficient
    tables select transitions and vertical caps.
  - Natural Mario ordinary/spin arcs qualified; cape,riding and Luigi branches have finite original/native differential
    evidence only. Form acquisition and projectile ability are separate dependencies.
