components:
- id: actor_input_edges_and_direction_repeat
  facet: mechanics
  label: Input suppression, press/release edges and directional repeat
  summary: A fixed actor-like record at 0x020205a0 receives input through 0x080149dc. Flag bit 0x400 suppresses
    the shared held mask; the routine stores held, newly pressed and newly released masks and creates a separate
    repeat stream with a 16-invocation initial delay and 8-invocation repeat cycle. Downstream handlers consume
    these fields, but actor identity, named actions and invocation-to-frame timing remain unverified.
  instantiates:
  - concept: mechanics.input.actor_edges_and_direction_repeat
  reads:
  - ram[0x03003100]:u16 shared held mask
  - object[0x0c]:u32 suppression flags
  - object[0xe2]:u16 previous held mask
  - object[0xe1]:u8 directional repeat countdown
  writes:
  - object[0xe2]:u16 held
  - object[0xe4]:u16 pressed
  - object[0xe6]:u16 released
  - object[0xe8]:u16 repeat stream
  - object[0xe1]:u8 repeat countdown
  invariants:
  - held = 0 when object[0x0c] & 0x400; otherwise held = shared held mask.
  - pressed = held & ~previousHeld; released = previousHeld & ~held. Masks truncate to 16 bits.
  - Base repeat stream = pressed & 0x030f. Held directions (0x00f0) are ORed in when the old countdown is 0 or 16.
  - When no direction is held countdown becomes 16. Otherwise old zero resets to 8 before decrement, so stored value
    becomes 7; ordinary nonzero values decrement by one.
  - For a reset countdown of 16 and continuously held direction, first repeat is immediate; the next occurs 16 invocations
    later, subsequent repeats every 8 invocations. Native frame cadence is not established.
  - The apparent indirect call at 0x08014a68 in generated C is a saved-LR return (pop {r0}; bx r0), verified in
    instructions, and is not a gameplay dispatch.
  - One countdown is shared across all direction bits; a direction change does not itself reset it while some direction
    remains held.
