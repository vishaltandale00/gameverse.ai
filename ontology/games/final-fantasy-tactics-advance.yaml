- id: inventory_byte_counts
  facet: economy
  label: Partitioned inventory with byte arithmetic before count cap
  summary: Addition searches the item partition for an existing item, then an empty slot, and rejects zero item/quantity
    or no available slot. The quantity addition wraps in the native byte before a99 cap is applied; this differs
    from saturating an unbounded sum. Removal reduces the count to zero when exhausted but leaves the item ID stored,
    so an empty count is not itself an empty slot. Caller limits on quantities and valid IDs remain unresolved.
  instantiates:
  - concept: economy.inventory.byte_count_before_cap
  reads:
  - argument.item_id:u16
  - argument.quantity:u8
  - inventory.entries[].item_id:u16
  - inventory.entries[].quantity:u8
  writes:
  - inventory.entries[].item_id:u16 (only assigning an empty slot on add)
  - inventory.entries[].quantity:u8
  - return:i32 (0, failure-1, or native signed-byte excess)
  params:
    entry_bytes:
      value: 4
      unit: bytes
      native_value: 4
      native_unit: sizeof InventoryEntry
      evidence:
      - kind: decomp_source
        ref: ffta-decomp:include/inventory.h:InventoryEntry
        confidence: 0.95
    count_cap:
      value: 99
      unit: items per entry after byte wrapping
      native_value: 99
      native_unit: u8 count
      evidence:
      - kind: decomp_source
        ref: ffta-decomp:src/inventory.c:AddInventoryItem
        confidence: 0.95
    partition_slots:
      value:
      - 361
      - 14
      unit: entry slots (ordinary, special IDs362..375)
