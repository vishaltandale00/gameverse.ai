- The equipment preview temporarily mutates the unit and restores it. Review all callers before treating its response
  flags as a player-visible UI guarantee.
- Ability name text has documented edit tooling but full dialogue/story and UI layout were not extracted. No original
  ROM strings or code were copied into this ontology.
- Retained capture contains an introductory snowy settlement and dialogue. Gameplay classification from a local
  model does not prove that the frame shows tactical combat or controllable exploration.
- No post-intro combat frame or audio waveform was personally inspected/listened to; hardware audio facts are capture
  telemetry only.
- Validate per-byte unsigned/signed promotion edge cases against compiled source before changing numerical rules.
  Original routines often omit bounds checks.
