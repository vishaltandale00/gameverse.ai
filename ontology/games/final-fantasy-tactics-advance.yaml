proposed_concepts:
- id: economy.inventory.byte_count_before_cap
  label: Byte count with wrap before cap
  definition: Inventory counts are stored in bytes, so arithmetic wraps before a separate count cap is tested; slot
    identity and zero quantity are distinct state.
- id: progression.skills.equipment_available_mastered
  label: Equipment availability distinct from mastery
  definition: Equipment can make an ability available while permanent mastery is tracked separately by progress
    toward a requirement.
- id: progression.skills.job_ability_range_unlock
  label: Ability-range job flag unlock
  definition: An acquired ability within a job-specific index range enables a corresponding persistent job flag.
- id: mechanics.loadout.job_category_restrictions
  label: Job-conditioned equipment eligibility
  definition: Job properties, item categories and explicit exceptions determine whether equipment is allowed.
- id: mechanics.loadout.ability_loss_preview
  label: Equipment change previews ability loss
  definition: A tentative equipment replacement checks whether selected unmastered abilities lose their remaining
    source.
- id: mechanics.data.inherited_job_properties
  label: Inherited job properties
  definition: A job-property lookup can redirect to another job record or a caller-provided fallback before resolving
    a value.
- id: mechanics.status.opposing_counters
  label: Opposing state counters cancel
  definition: Two status quantities subtract from each other and leave at most one active residual counter.
- id: mechanics.status.indefinite_counter_bit
  label: Sentinel bit suppresses status ticking
  definition: A status duration counter with a sentinel bit is preserved while ordinary counters decrement.
- id: mechanics.ability.data_driven_definition
  label: Data-driven ability definitions
  definition: Ability definitions expose cost, range, area, power, effects and flags through an indexed property
    API.
- id: mechanics.ability.synchronized_pair
  label: Paired ability state synchronization
  definition: A conditional ability relationship copies availability and progress state between linked indices.
- id: economy.item.save_dependent_modifier
  label: Save-conditioned item modifier
  definition: An item property incorporates a persistent adjustment subject to a selected rule and clamp.
- id: economy.item.adjusted_positive_amount
  label: Adjusted positive item amount
  definition: An item-associated numeric amount applies a percentage reduction and a minimum bound before returning
    a positive result.
- id: rendering.raster.hblank_dma_palette
  label: Per-scanline palette DMA
  definition: Horizontal-blank DMA changes palette entries across scanlines to produce scanline-dependent colors.
- id: rendering.raster.hblank_dma_blend
  label: Per-scanline blend DMA
  definition: Horizontal-blank DMA changes blend coefficients across scanlines.
- id: rendering.raster.hblank_dma_display_control
  label: Per-scanline display-control DMA
  definition: Horizontal-blank DMA changes display or background control registers across scanlines.
- id: setting.environment.snowy_settlement
  label: Snow-covered settlement
  definition: The visible setting presents a settlement whose outdoor ground and structures include snow.
- id: rendering.pipeline.tile_mode0
  label: Hardware tile mode zero
  definition: A captured display pipeline uses hardware tile mode zero, without implying every layer is enabled.
- id: narrative_delivery.dialogue.speaker_portrait
  label: Speaker portrait dialogue
  definition: Dialogue text is accompanied by a portrait identifying or depicting the speaker.
open_questions:
