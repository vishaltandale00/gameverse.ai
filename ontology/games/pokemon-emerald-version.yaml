- id: catch_formula
  facet: mechanics
  label: Ball-throw capture formula with four shake checks
  summary: 'Throwing a ball at a wild mon computes a = floor(catchRate * ballBonus/10 * (3*MaxHP - 2*HP) / (3*MaxHP)),
    x2 for sleep/freeze or x1.5 for poison/burn/paralysis. If a > 254 the catch succeeds; otherwise b = floor(1048560
    / floor(sqrt(floor(sqrt(floor(16711680 / a)))))) and up to four checks Random() < b each add a shake; four passes
    catch the mon (shown as three shakes then success). Master Ball always catches. Trainer-owned mons cannot be caught;
    the Wally tutorial always succeeds.'
  instantiates:
  - concept: mechanics.collection.capture_probability
  reads:
  - target.species.catch_rate
  - target.hp
  - target.max_hp
  - target.status1
  - item.ball_type
  - battle.turn_counter
  - pokedex.caught
  - map.type
  writes:
  - party
  - pc_storage
  - pokedex.caught
  params:
    shake_checks:
      value: 4
      evidence:
      - kind: decomp_source
        ref: pokeemerald:src/battle_script_commands.c:Cmd_handleballthrow (shakes < BALL_3_SHAKES_SUCCESS)
        confidence: 0.95
    sleep_freeze_bonus:
