- id: title_screen
  facet: frontend
  label: Mode-1 title with affine logo, wavy clouds and intro loop
  summary: 'Title setup fades from white, slides the Pokémon logo (256-colour affine BG2) up, shines it, alpha-fades
    in the EMERALD VERSION banner, then shows PRESS START over Rayquaza (BG0) and clouds (BG1) whose horizontal scroll
    is rippled per scanline by an HBlank-DMA sine wave. A/B/Start/Select skip each phase; A or Start opens the main
    menu. There is no gameplay demo: when the non-looping title BGM ends the game fades back to the copyright screen
    and replays the intro. Held combos open maintenance screens (B+Select+Up clear save, B+Select+Left reset RTC,
    B+Select berry-glitch fix).'
  instantiates:
  - concept: frontend.title.press_start_menu
    weight: 0.5
  - concept: frontend.title.idle_loop_to_logos
  - concept: frontend.title.hidden_maintenance_combos
  - concept: rendering.background.affine_rotscale
    weight: 0.5
  - concept: rendering.raster.hblank_dma_scroll_distortion
    weight: 0.5
  reads:
  - input.buttons.pressed
  - input.buttons.held
  - bgm.status
  writes:
  - main.callback2
  - io.bg2x
  - io.bg2y
  - io.bg1hofs
  - io.bldalpha
  params:
