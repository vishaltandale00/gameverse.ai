- id: main_menu_and_new_game
  facet: frontend
  label: Continue/New Game menu, professor introduction and character creation
  summary: 'The main menu offers CONTINUE (if a valid save exists), NEW GAME, OPTION and, when unlocked, MYSTERY GIFT
    and MYSTERY EVENTS. New Game runs Professor Birch''s speech on a spotlight platform with Lotad, a boy/girl choice,
    the naming keyboard and a yes/no confirmation, then shrinks the player sprite into the truck intro. The trainer
    ID is the value of hardware Timer 1, started when the naming screen opens and read when it closes. New saves start
    with 3000 money and the player in the moving truck.'
  instantiates:
  - concept: frontend.intro.new_game_prologue
    weight: 0.5
  - concept: frontend.menu.main_menu
  - concept: frontend.menu.name_entry_grid
  - concept: narrative_delivery.dialogue.typewriter_dialogue
    weight: 0.4
  reads:
  - save.status
  - input.buttons.pressed
  - timer1.counter
  writes:
  - player.gender
  - player.name
  - player.trainer_id
  - rng.state
  - save.*
  params:
    menu_layouts:
      value: 4
      unit: 'layouts: no save / save / +mystery gift / +mystery events'
      evidence:
      - kind: decomp_source
        ref: pokeemerald:src/main_menu.c (HAS_NO_SAVED_GAME..HAS_MYSTERY_EVENTS)
        confidence: 0.95
    starting_money:
      value: 3000
      unit: money
      evidence:
      - kind: decomp_source
        ref: pokeemerald:src/new_game.c:NewGameInitData (SetMoney 3000)
        confidence: 0.95
    birch_speech_steps:
      value: 32
      unit: task states
      evidence:
      - kind: decomp_source
        ref: pokeemerald:src/main_menu.c (Task_NewGameBirchSpeech_* functions)
        confidence: 0.8
  invariants:
  - The trainer ID and the RNG seed come from the same Timer 1 read (SeedRngAndSetTrainerId), so time spent naming
    determines both.
  - New Game resets the RTC only when the save is empty or corrupt.
  relations:
  - type: requires
    target: flash_save_system
  - type: modulates
    target: rng_lcg
    note: naming-screen exit seeds the RNG
  evidence:
  - kind: decomp_source
    ref: pokeemerald:src/main_menu.c:Task_MainMenuCheckSaveFile
    confidence: 0.8
  - kind: decomp_source
    ref: pokeemerald:src/main.c:SeedRngAndSetTrainerId
    confidence: 0.95
  - kind: decomp_source
    ref: pokeemerald:src/naming_screen.c (StartTimer1 / SeedRngAndSetTrainerId call sites)
    confidence: 0.85
  - kind: decomp_source
    ref: pokeemerald:src/new_game.c:NewGameInitData
    confidence: 0.95
  - kind: capture_frame
    ref: capture:frontend:keyframes f000694..f005385 (Birch, Lotad, gender sprite, name prompt, LITTLEROOT dialogue)
    confidence: 0.9
  - kind: capture_telemetry
    ref: capture:frontend:frames 504-681 DISPCNT 0x3140 + WIN0 menu highlight; 683-4165 BLDCNT 0x0250 sprite fades; 4172 all four BGs (naming screen)
    confidence: 0.75
- id: flash_save_system
  facet: frontend
  label: Save-anywhere 128 KiB flash with rotating two-slot sector saves
  summary: 'The player saves anywhere from the start menu. Flash is 32 sectors of 4 KiB: two 14-sector save slots
    (SaveBlock2, four SaveBlock1 sectors, nine PC-storage sectors) that alternate on each save, plus Hall of Fame (2),
    Trainer Hill and recorded-battle sectors. Each sector has a 3968-byte payload, a 16-bit folded checksum, a signature
    and a save counter; the slot with the higher valid counter loads. The sector order inside a slot rotates by one
    per save to spread flash wear, and the save blocks are relocated at a random RAM offset with a random encryption
    key for money/items (anti-memory-editing).'
  instantiates:
  - concept: frontend.save.checksummed_flash_record
    weight: 0.5
  - concept: frontend.save.redundant_slot_backup
  - concept: frontend.save.save_anywhere
  reads:
  - save.counter
  - save.sectors[*]
  writes:
  - save.sectors[*]
  - save.counter
  - save.encryption_key
  params:
    sector_count:
      value: 32
      evidence:
      - kind: decomp_source
        ref: pokeemerald:include/save.h:SECTORS_COUNT
        confidence: 0.95
    sectors_per_slot:
      value: 14
      evidence:
      - kind: decomp_source
        ref: pokeemerald:include/save.h:NUM_SECTORS_PER_SLOT
        confidence: 0.95
    sector_payload:
      value: 3968
      unit: bytes (plus 128-byte footer)
      evidence:
      - kind: decomp_source
        ref: pokeemerald:include/save.h:SECTOR_DATA_SIZE
        confidence: 0.95
    checksum:
      value: sum of u32 words, then (sum >> 16) + sum truncated to u16
      evidence:
      - kind: decomp_source
        ref: pokeemerald:src/save.c:CalculateChecksum
        confidence: 0.95
  invariants:
  - A failed write restores the previous sector rotation and save counter so the older slot stays authoritative.
  - Soft reset is disabled while sectors are written.
  relations:
  - type: part_of
    target: main_loop_and_callbacks
  evidence:
  - kind: decomp_source
    ref: pokeemerald:src/save.c:WriteSaveSectorOrSlot
    confidence: 0.95
  - kind: decomp_source
    ref: pokeemerald:src/save.c:UpdateSaveAddresses
    confidence: 0.85
  - kind: decomp_source
    ref: pokeemerald:src/load_save.c (SaveBlock ASLR offset = (offset + Random()) & mask; encryptionKey from Random)
    confidence: 0.85
  - kind: decomp_source
    ref: pokeemerald:src/start_menu.c:sStartMenuItems (MENU_ACTION_SAVE)
    confidence: 0.9
- id: whiteout_respawn
  facet: frontend
  label: Whiteout to last heal point with half-money penalty
  summary: 'When every party Pokémon faints (or the player loses a trainer battle) there is no game over screen: the
    whiteout script runs, money is halved, the party is fully healed and the player warps to the last Pokémon Center
    or home used as a heal location. Progress since the last save is kept because nothing is reloaded.'
  instantiates:
  - concept: frontend.game_over.respawn_at_checkpoint_with_penalty
  reads:
  - party[*].hp
  - player.last_heal_location
  writes:
  - player.money
  - party[*].hp
  - party[*].status
  - player.position
  params:
    money_penalty:
      value: 0.5
      unit: fraction of money kept (integer halving)
      evidence:
      - kind: decomp_source
        ref: pokeemerald:src/overworld.c:DoWhiteOut
        confidence: 0.95
  invariants:
  - Whiteout never reloads the save file; world state persists.
  relations:
  - type: modulates
    target: money_and_prize
  - type: requires
    target: battle_engine_core
  evidence:
  - kind: decomp_source
    ref: pokeemerald:src/overworld.c:DoWhiteOut
    confidence: 0.95
- id: bg_window_sprite_engine
  facet: rendering
  label: Mode-0 four-BG tile engine with text windows, 64-sprite OAM and palette fades
  summary: 'Nearly everything renders in mode 0 with four text backgrounds managed through buffered BG templates,
    up to 32 text windows drawn into BG tilemaps, and a 64-slot sprite system with animation and affine command scripts
    that builds OAM each frame. A global palette-fade engine blends the buffered palettes toward a colour (typically
    black or white) and BLDY/BLDALPHA are used for screen and sprite fades. Battle animations and the intro lean on
    affine sprites (ObjAffineSet is the second most frequent BIOS call in the capture). Mode 1 is used only for affine
    title/intro layers and a few special screens.'
  instantiates:
  - concept: rendering.background.tile_layer_stack
  - concept: rendering.sprite.affine_rotscale
    weight: 0.6
  - concept: rendering.blending.brightness_fade
    weight: 0.6
  - concept: rendering.blending.alpha_layer_transparency
    weight: 0.4
  reads:
  - sprites[*]
  - windows[*]
  - palette.unfaded
  writes:
  - oam.*
  - io.bgcnt[0..3]
  - io.dispcnt
  - palette.faded
  - io.bldcnt
  - io.bldy
  params:
    sprite_slots:
      value: 64
      evidence:
      - kind: decomp_source
        ref: pokeemerald:include/sprite.h:MAX_SPRITES
        confidence: 0.95
    text_windows:
      value: 32
      evidence:
      - kind: decomp_source
        ref: pokeemerald:include/window.h:WINDOWS_MAX
        confidence: 0.95
    mode0_frame_share:
      value: 0.89
      unit: fraction of captured frames in mode 0 (7991 of 8976 non-blank)
      evidence:
      - kind: derived
        ref: capture summary video_modes_frames {0:7991, 1:985}
        inputs:
        - capture:summary.derived.video_modes_frames
        confidence: 0.8
    max_sprites_visible:
      value: 33
      unit: sprites (front-end only)
      evidence:
      - kind: capture_telemetry
        ref: capture:summary.derived.max_sprites_visible=33, max_affine_sprites=13
        confidence: 0.8
    obj_affine_bios_calls:
      value: 6159
      unit: ObjAffineSet SWI calls over 9000 frames
      evidence:
      - kind: capture_telemetry
        ref: capture:summary.derived.swi_top10 (CpuSet 11177, ObjAffineSet 6159, BgAffineSet 415)
        confidence: 0.85
  invariants:
  - GPU register writes are buffered and copied in VBlank, so mid-frame register state changes only through HBlank
    DMA (scanline effects) or VCount handlers.
  relations:
  - type: part_of
    target: main_loop_and_callbacks
  evidence:
  - kind: decomp_source
    ref: pokeemerald:src/overworld.c (overworld BgTemplates bg0-3 priority 0-3, mapBase 31/29/28/30)
    confidence: 0.85
  - kind: capture_telemetry
    ref: capture:attract+frontend video.mode_frames, blend_frames (alpha 4026, brighten 401, darken 155), obj_affine_frames 692
    confidence: 0.85
