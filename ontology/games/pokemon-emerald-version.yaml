- id: damage_formula
  facet: mechanics
  label: Gen-3 damage formula
  summary: 'Base damage = floor(floor(floor(A_eff * Power * (floor(2*L/5) + 2)) / D_eff) / 50), where A/D are Atk/Def
    for physical types or SpA/SpD for special types after stage ratios and modifiers; burn halves physical damage (not
    with Guts); Reflect/Light Screen halve it (2/3 in doubles with two targets); spread moves halve it in doubles;
    rain/sun scale Water/Fire x1.5 or x0.5; then +2. The script then multiplies by the crit multiplier (x2), Charge
    (x2 Electric) and Helping Hand (x1.5), applies STAB x1.5 and each defending type''s effectiveness in turn, and
    finally a random factor of (100 - rand%16)/100 (0.85-1.00). Every step truncates, and damage is at least 1 unless
    immune. Crits ignore the attacker''s negative and the defender''s positive stat stages and the screens.'
  instantiates:
  - concept: mechanics.combat.stat_ratio_damage_formula
  reads:
  - attacker.level
  - attacker.stats
  - attacker.stat_stages
  - attacker.ability
  - attacker.item
