proposed_concepts:
- id: ai.decision.utility_scoring_scripts
  label: Script-scored action utility
  definition: Each candidate action starts from a base score; a chain of rule modules selected per opponent adds or
    subtracts points from game-state conditions (some randomised), and the highest-scoring action is chosen with random
    tie-breaking.
  seed_source: 'game_ai_taxonomy: Utility AI'
- id: ai.decision.personality_weighted_action
  label: Personality-weighted action choice
  definition: An agent's persistent personality trait sets the probabilities of choosing among action categories, with
    a different distribution under a condition such as low health.
  is_a:
  - ai.combat.weighted_action_selection
- id: ai.decision.rule_based_switching
  label: Rule-based unit switching
  definition: Before acting, an agent checks ordered rules (imminent loss, immunity, counters, status cure) to swap
    its active unit for a better-matched reserve.
- id: ai.npc.ambient_movement_patterns
  label: Ambient NPC movement patterns
  definition: Non-hostile characters follow a per-instance pattern (stand, look around, wander in a box, pace, fixed
    route, mirror the player) chosen from a library and set in level data.
  seed_source: 'vgdl: RandomNPC'
- id: camera.follow.player_centered_tile_camera
  label: Player-locked tile camera
  definition: The camera stays rigidly centred on the avatar and scrolls in lockstep with its tile-to-tile movement,
    streaming new map rows/columns at each tile boundary.
- id: economy.currency.challenge_points
  label: Challenge-earned side currency
  definition: A separate currency earned only by clearing challenge runs, scaled by streak or difficulty, and spent
    on exclusive rewards.
- id: economy.inventory.categorized_pockets
  label: Categorised inventory pockets
  definition: The inventory is split into per-category pockets, each with its own fixed slot count and sorting.
  seed_source: 'gdp: Inventories'
- id: economy.inventory.creature_storage_boxes
  label: Creature storage boxes
  definition: Collected creatures beyond the active team are kept in a large paged storage system that the player
    accesses at terminals.
- id: economy.source.battle_reward
  label: Battle reward payout
  definition: Winning a battle pays currency computed from the opponent's class and strength, optionally multiplied
    by held items or formats.
  seed_source: 'gdp: Rewards'
- id: economy.source.renewable_crop_growth
  label: Real-time crop growth
  definition: Planted resources grow through stages on a timer (often real time), with care actions such as watering
    increasing yield, and regrow or wither afterwards.
  seed_source: 'gdp: Renewable Resources'
- id: frontend.game_over.respawn_at_checkpoint_with_penalty
  label: Respawn at checkpoint with penalty
  definition: Defeat does not end or reload the game; the player is restored at the last rest point with a resource
    penalty while world progress is kept.
  seed_source: 'gdp: Death Consequences'
- id: frontend.title.hidden_maintenance_combos
  label: Hidden title-screen maintenance combos
  definition: Held button chords on the title screen open maintenance screens such as save erase, clock reset or data
    repair.
- id: mechanics.collection.breeding_inheritance
  label: Breeding with inheritance
  definition: Two compatible creatures produce offspring over time whose species, stats, traits and moves are partly
    inherited from the parents by rule and chance.
- id: mechanics.collection.capture_probability
  label: Capture probability roll
  definition: Weakened or disabled opponents can be captured by a probabilistic roll that improves with lower health,
    status effects and better capture tools.
- id: mechanics.collection.creature_collection
  label: Creature collection
  definition: The core loop is acquiring and keeping many distinct creature species/individuals, each a persistent
    unit with its own stats and moves.
  seed_source: 'gdp: Collecting'
- id: mechanics.combat.critical_hit
  label: Critical hits
  definition: Attacks have a small, modifiable chance to deal multiplied damage and bypass some defensive modifiers.
  seed_source: 'gdp: Critical Hits'
- id: mechanics.combat.double_battle_format
  label: Double battle format
  definition: Battles where each side fields two units at once, adding targeting choices, spread attacks and ally
    interactions.
- id: mechanics.combat.passive_trait_modifiers
  label: Passive trait and held-item modifiers
  definition: Units carry an innate trait and an equipped item that hook fixed points of the combat rules (entry,
    damage, accuracy, turn end) to modify outcomes.
- id: mechanics.combat.speed_priority_turn_order
  label: Priority-then-speed turn order
  definition: All participants choose actions simultaneously, then actions resolve by action priority and, within a
    priority, by a speed stat with random tie-breaking.
- id: mechanics.combat.stat_ratio_damage_formula
  label: Stat-ratio damage formula
  definition: Damage scales with attacker level and move power times the ratio of attacking to defending stat, followed
    by multiplicative modifiers (same-type bonus, type effectiveness, critical, random spread).
- id: mechanics.combat.turn_based_party_battle
  label: Turn-based party battle
  definition: Separate battle mode where sides each field units from a reserve party, choose one action per turn
    (attack, item, switch, flee) and resolve them in order until one side has no usable units.
  seed_source: 'igdb genre: Turn-based / RPG'
- id: mechanics.customization.player_base_decoration
  label: Decoratable player base
  definition: The player claims a personal space in the world and arranges collected decorations in it; bases may
    be shared with and visited by other players.
  seed_source: 'gdp: Bases'
- id: mechanics.encounter.random_step_encounter
  label: Random step encounter
  definition: Moving on designated terrain rolls a per-step chance to start a battle with an opponent drawn from that
    area's table, without the opponent being visible beforehand.
- id: mechanics.encounter.slot_weighted_encounter_table
  label: Slot-weighted encounter table
  definition: Each area lists fixed slots with species and level ranges; encounters pick a slot from a fixed probability
    ladder so some entries are rare.
- id: mechanics.encounter.roaming_encounter
  label: Roaming encounter
  definition: A unique opponent moves between areas on its own schedule and can only be met by chance where it currently
    is, usually fleeing when found.
- id: mechanics.entity.personality_seeded_attributes
  label: Seed-derived individual attributes
  definition: A single random value stored per individual deterministically derives several of its traits (gender,
    temperament, rare variant, ability), making each individual unique.
- id: mechanics.minigame.appeal_contest
  label: Appeal contest
  definition: A non-combat judged competition where units score points from prepared condition stats and from performing
    moves over several rounds, with crowd and combo modifiers.
  seed_source: 'gdp: Minigames'
- id: mechanics.progression.stat_formula_iv_ev
  label: Hidden-potential stat formula
  definition: Stats are computed from species base values plus per-individual hidden potentials and trainable effort
    points, scaled by level and a temperament modifier.
- id: mechanics.randomness.lcg_prng
  label: Linear congruential PRNG
  definition: A global linear congruential generator supplies all random rolls; its state advances per call and often
    per frame, making outcomes depend on timing.
  seed_source: 'gdp: Randomness'
- id: mechanics.status.persistent_status_ailments
  label: Persistent status ailments
  definition: A single major ailment (sleep, poison, burn, paralysis, freeze) stays on a unit across battles until cured,
    affecting actions, speed or damage over time.
  is_a:
  - mechanics.status.turn_counted_status_effects
- id: mechanics.time.real_time_clock_events
  label: Real-time clock events
  definition: A battery clock drives world changes by real elapsed time (daily resets, growth, tides, time-of-day conditions)
    even while the game is off.
- id: movement_physics.collision.tile_collision_grid
  label: Tile collision grid
  definition: Passability is stored per map tile (plus directional and occupancy rules) and checked before each discrete
    move.
- id: movement_physics.grid.four_direction_tile_step
  label: Four-direction tile stepping
  definition: The avatar occupies one grid cell and moves exactly one cell per step in one of four cardinal directions,
    with input sampled only between steps.
  seed_source: 'vgdl: GridPhysics'
- id: movement_physics.mode.water_traversal_mode
  label: Water traversal mode
  definition: A transport mode entered by an ability that lets the avatar move over water tiles, with its own speed,
    encounters and exit rules, often extended by diving and climbing waterfalls.
- id: movement_physics.speed.hold_to_run
  label: Hold to run
  definition: Holding a button multiplies movement speed with no acceleration phase, possibly disabled on some terrain.
- id: movement_physics.surface.ice_slide_until_blocked
  label: Ice slide until blocked
  definition: On slippery tiles the avatar keeps moving in its direction, one tile at a time, until it reaches non-slippery
    ground or an obstacle; used for sliding puzzles.
  seed_source: 'vgdl: slipForward'
- id: movement_physics.vehicle.momentum_bike
  label: Momentum vehicle
  definition: A rideable vehicle that accelerates through discrete speed tiers while input is held and decelerates
    tier by tier, with top speed required by some terrain.
  seed_source: 'gdp: Vehicles'
- id: movement_physics.vehicle.trick_bike
  label: Trick vehicle
  definition: A rideable vehicle with trick states (wheelie, hops, side jumps) driven by button history that cross
    special terrain such as rails and gaps.
  seed_source: 'gdp: Vehicles'
- id: progression.completion.collection_log
  label: Collection log goal
  definition: An in-game catalogue records which members of a large set have been seen and obtained, making full
    completion an optional long-term goal.
  seed_source: 'gdp: Collecting'
- id: progression.postgame.challenge_facilities
  label: Postgame challenge facilities
  definition: After the main story, rule-variant battle venues offer repeatable runs with win streaks, records and
    exclusive rewards.
- id: progression.replay.trainer_rematch
  label: Opponent rematches
  definition: Defeated opponents become available again later, triggered by time, steps or calls, with stronger teams.
- id: progression.structure.gym_badge_ladder
  label: Gym badge ladder
  definition: The main path is a fixed sequence of leader battles whose badges unlock traversal abilities, control
    and stat bonuses before a final league.
- id: rendering.background.metatile_occlusion_layers
  label: Metatile occlusion layers
  definition: Each metatile is drawn on two of three background layers chosen by a per-metatile layer type, so that
    authored parts of the map draw above characters for depth.
  is_a:
  - rendering.background.tile_layer_stack
- id: rendering.tiles.animated_tile_swap
  label: Animated tile swap
  definition: Map animation (water, flowers) is done by periodically copying new graphics into shared tile slots so
    every use of that tile animates at once.
- id: rendering.transition.screen_wipe_effect
  label: Screen wipe transition
  definition: A short full-screen effect (wipes, swirls, shatter, iris) masks the switch from exploration to another
    mode such as battle, often chosen by context.
- id: setting.location.tropical_island_region
  label: Tropical island region
  definition: A world of islands, coastlines, volcano and sea routes with a warm, tropical feel.
- id: setting.theme.creature_companions
  label: Creature companions
  definition: Fiction in which people live with, collect and battle alongside wild creatures as partners.
  seed_source: 'igdb theme: Fantasy'
- id: ui_hud.input.context_button_mapping
  label: Context button mapping
  definition: A small fixed button set whose meaning depends on context (interact/confirm, cancel/run, menu, registered
    item).
- id: ui_hud.menu.battle_command_menu
  label: Battle command menu
  definition: Turn-based battle UI listing top-level commands (fight, items, party, run) that open sub-menus such as
    a move grid with remaining uses.
- id: ui_hud.menu.pause_menu_hub
  label: Pause menu hub
  definition: A pause menu that hubs every out-of-play screen (party, inventory, encyclopedia, map, save, options).
open_questions:
- Overworld gameplay was not captured (the frontend capture loops on the naming/Birch speech); grid stepping speeds,
  camera and weather rendering are from code only. A capture into Littleroot/Route 101 would confirm frames per tile
  and BG layer usage in play.
- Mach Bike top-speed timing is inferred from step-count gears; whether gear advance happens per step or per frame
  of held input when a step is blocked was not traced.
- AI_CheckViability (largest AI module) was summarised, not decomposed effect by effect; per-effect score deltas
  are in data/battle_ai_scripts.s for a later pass.
- The Battle Factory flag schedule (GetAiScriptsInBattleFactory), Dome tournament seeding, Pike room odds and Pyramid
  floor generation were not read.
- Contest move effects (jam, startle, combos) and the per-move appeal/jam table were not extracted; only scoring
  totals and the applause meter were.
- Trainer-ID / RNG behaviour on Continue (no reseed found besides naming) should be confirmed in a capture; the claim
  that retail power-on seed is 0 relies on the BUGFIX guard around SeedRngWithRtc.
- 'Number of usable script opcodes (228) and specials (528) are line counts of the tables and may include aliases.'
- Capture keyframes show the Birch dialogue repeating because the input script mashes A; the naming screen telemetry
  (frame 4172) was not verified against a keyframe.
- Day/night tinting does not exist in Emerald's overworld per the code read (time only affects events and evolution);
  confirm no palette time tint exists in field_weather or overworld palette code.
- Ruby/Sapphire/FireRed/LeafGreen differences (no Frontier, no Match Call, different AI score reset order noted in
  BattleAI_SetupAIData comments, FRLG removing RTC) should be recorded as variants against these component ids.
