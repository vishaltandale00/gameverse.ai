        confidence: 0.95
    random_branch_scale:
      value: 256
      unit: if_random_less_than N fires with probability N/256
      evidence:
      - kind: decomp_source
        ref: pokeemerald:src/battle_ai_script_commands.c:Cmd_if_random_less_than
        confidence: 0.95
    score_floor:
      value: 0
      evidence:
      - kind: decomp_source
        ref: pokeemerald:src/battle_ai_script_commands.c:Cmd_score
