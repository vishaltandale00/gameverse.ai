- id: stat_stages_accuracy_crit
  facet: mechanics
  label: Stat stages, accuracy/evasion check and critical-hit stages
  summary: 'Battle-only stat stages run -6..+6. Atk/Def/Spe/SpA/SpD use ratios (2+n)/2 for boosts and 2/(2-n) for drops
    (x0.25..x4). Accuracy uses the move accuracy times a separate ratio table indexed by (attacker accuracy stage - target
    evasion stage), then Compound Eyes x1.3, Sand Veil in sandstorm x0.8, Hustle (physical) x0.8 and BrightPowder/Lax
    Incense; the move hits if rand(1..100) <= result. Critical hits use a stage count (Focus Energy +2, high-crit moves
    +1, Scope Lens +1, Lucky Punch/Stick +2 for their species) into chances 1/16, 1/8, 1/4, 1/3, 1/2; Battle Armor and
    Shell Armor prevent crits, and the tutorial battles never crit.'
  instantiates:
  - concept: mechanics.pokemon.stat_stage_multipliers
  - concept: mechanics.combat.critical_hit
  reads:
  - battlers[*].stat_stages
  - move.accuracy
  - attacker.ability
  - attacker.item
  - battle.weather
  writes:
  - battle.move_result_flags
  - battle.crit_multiplier
  params:
    stage_range:
      value: [-6, 6]
      evidence:
      - kind: decomp_source
        ref: pokeemerald:src/pokemon.c:gStatStageRatios
        confidence: 0.95
