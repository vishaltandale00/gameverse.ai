schema_version: 0
id: pokemon-emerald-version
game:
  title: Pokémon Emerald Version
  platform: gba
  game_code: BPEE
  rom_sha1: f3ae088181bf583e55daf962a92bb46f4f1d07b7
  year: 2004
  developer: Game Freak
  derived_genres:
  - monster_collecting_rpg
  - turn_based_rpg
  - top_down_adventure
  evidence_basis:
  - decomp_source
  - capture_telemetry
  - capture_frame
  - derived
  - llm_knowledge
  sources:
  - kind: decomp
    ref: https://github.com/pret/pokeemerald @ 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881 (local/decomps/pokeemerald; rom.sha1
      in repo matches this ROM's SHA1 f3ae0881...; symbols/pokeemerald.sym present)
  - kind: rom_header
    ref: local/re/roms.json id=pokemon-emerald-version (header title POKEMON EMER, maker 01, version 0, 16 MiB)
  - kind: captures
    ref: local/captures/pokemon-emerald-version/ run 20261015T234415-8f46cf (attract 3600 frames no input; frontend
      5400 frames with START x2 then A every 60 frames; RTC fixed at 2024-01-01T00:00Z); never reaches the overworld
  - kind: extraction_run
    ref: claude-opus-5-5, brief v1, 2026-10-16T03:56Z-2026-10-16T04:21Z (~25 min wall), ~45 decomp files opened or
      grepped (~30 read at function level), capture summary/phase/telemetry for 2 phases, 24 keyframes viewed
  - kind: extraction_review
    ref: Codex/GPT source audit 2026-10-16; exact model revision unavailable. Reviewed GetWhoStrikesFirst, random.c/random.h and ITEM_QUICK_CLAW; corrected and expanded turn-order evidence. See ontology/research/gpt-source-pilot-2026-10-16.json. No win-rate or strategy validation.
conventions:
  units_convention: 'Overworld positions are in pixels on a grid of 16x16 px metatiles ("tiles"); sprites move in
    whole pixels per frame (no sub-pixel accumulation). Durations are frames at ~59.73 Hz (the decomp fanfare comment
    uses 59.7275 fps); seconds = frames / 59.73. Screen is 240x160 px = 15x10 metatiles. Battle quantities are integers
    with truncating division at every step (order of operations matters; multipliers are written as N/10 or N/100
    as in the source). Probabilities from Random() are u16 draws (0..65535); "x % N" draws are treated as uniform.'
  rng_convention: 'Random() is a 32-bit LCG x = 1103515245*x + 24691 returning the high 16 bits; it advances once
    per VBlank outside link/frontier/recorded battles in addition to every call site.'
  component_scope: 'Gen-3 engine components shared with Ruby/Sapphire/FireRed/LeafGreen (pending their own decomposition):
    main_loop_and_callbacks, flash_save_system, whiteout_respawn, bg_window_sprite_engine, metatile_map_renderer, overworld_weather_effects,
    scanline_effects_and_transitions, player_locked_tile_camera, top_down_oblique_projection, grid_step_locomotion,
    tile_collision_and_elevation, ledge_jump, forced_movement_tiles, mach_bike, acro_bike, water_traversal, script_engine,
    rng_lcg, monster_data_model, stat_calculation, battle_engine_core, turn_order, damage_formula, type_chart, stat_stages_accuracy_crit,
    status_conditions, abilities_and_held_items, battle_weather, double_battles, catch_formula, wild_encounter_tables,
    breeding_daycare, rtc_time_events, pokemon_contests, secret_bases, trainer_ai_move_scoring, trainer_ai_switch_and_items,
    contest_ai, trainer_line_of_sight, npc_movement_types, exp_and_leveling, evolution_rules, gym_badge_progression,
    hm_field_move_gating, pokedex_completion, money_and_prize, inventory_and_storage, berry_farming, battle_interface,
    start_menu_hub, input_controls, dialogue_text_printer, m4a_sound_engine, map_music_and_fanfares. Emerald-specific
    content or variants: copyright_and_intro_cinematic, title_screen, main_menu_and_new_game (Birch/Lotad version),
    battle_frontier, battle_palace_nature_ai, trainer_rematches_match_call, scripted_story_events, hoenn_setting (Hoenn
    shared with R/S). Engine components are still extracted from Emerald code, so Emerald-only branches are called
    out in variants or invariants.'
  stat_notation: 'Stats: HP, Atk, Def, Spe, SpA, SpD. Stat stages run -6..+6 (stored 0..12, 6 = neutral). Types 0-8
    (Normal..Steel) are physical, 10-17 (Fire..Dark) special; type 9 is the ??? (Mystery) type.'
components:
- id: main_loop_and_callbacks
  facet: frontend
  label: Two-callback main loop with task scheduler and soft reset
  summary: 'AgbMain reads keys, checks the soft-reset chord, then calls gMain.callback1 and callback2 each frame and
    waits for VBlank; every screen (copyright, title, menus, overworld, battle) is a callback2 with its own gMain.state
    machine, and cooperative work runs as up to 16 tasks. VBlank copies buffered GPU registers, services DMA3 requests,
    runs the m4a sound mixer and advances the RNG once. A VCount interrupt is armed at line 150. Key repeat starts after
    40 frames and repeats every 5.'
  instantiates:
  - concept: frontend.flow.mode_state_machine
  - concept: frontend.soft_reset.button_combo
  reads:
  - input.buttons.held
  - main.callback1
  - main.callback2
  - save.soft_reset_disabled
  writes:
  - main.callback2
  - main.state
  - rng.state
  - io.*
  params:
    soft_reset_keys:
      value: A+B+Start+Select
      evidence:
      - kind: decomp_source
        ref: pokeemerald:src/main.c:AgbMain (JOY_HELD_RAW(A_BUTTON) && B_START_SELECT)
        confidence: 0.95
    task_slots:
      value: 16
      evidence:
      - kind: decomp_source
        ref: pokeemerald:include/task.h:NUM_TASKS
        confidence: 0.95
    key_repeat_start_delay:
      value: 40
      unit: frames
      evidence:
      - kind: decomp_source
        ref: pokeemerald:src/main.c:InitKeys (gKeyRepeatStartDelay)
        confidence: 0.95
    key_repeat_continue_delay:
      value: 5
      unit: frames
      evidence:
      - kind: decomp_source
        ref: pokeemerald:src/main.c:InitKeys (gKeyRepeatContinueDelay)
        confidence: 0.95
    vcount_irq_line:
      value: 150
      unit: scanline
      evidence:
      - kind: decomp_source
        ref: pokeemerald:src/main.c:EnableVCountIntrAtLine150
        confidence: 0.95
      - kind: capture_telemetry
        ref: capture:attract:raster.vcount_irq_frames=3598/3600; capture:frontend:vcount_irq_frames=5398/5400
        confidence: 0.9
  invariants:
  - Soft reset is ignored while gSoftResetDisabled is set (save writes).
  - SetMainCallback2 always resets gMain.state to 0, so every screen starts its init state machine from scratch.
  - Without flash memory present the game sets callback2 to NULL and stops.
  relations:
  - type: requires
    target: rng_lcg
    note: VBlankIntr advances Random() every frame
  - type: requires
    target: m4a_sound_engine
    note: m4aSoundMain runs in VBlank
  evidence:
  - kind: decomp_source
    ref: pokeemerald:src/main.c:AgbMain
    confidence: 0.95
  - kind: decomp_source
    ref: pokeemerald:src/main.c:VBlankIntr
    confidence: 0.95
  - kind: decomp_source
    ref: pokeemerald:src/main.c:SetMainCallback2
    confidence: 0.95
