    then the intro: scene 1 Game Freak logo over dripping leaves with a Flygon silhouette, scene 2 the player cycling
    with Torchic, Manectric, Volbeat and Flygon, scene 3 Groudon vs Kyogre ending with Rayquaza, then the title. Any
    new key press (once no palette fade is active) jumps to the title. In the capture the full cinematic runs ~3230
    frames (~54 s) before the title appears.'
