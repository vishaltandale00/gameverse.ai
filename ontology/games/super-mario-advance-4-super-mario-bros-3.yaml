- id: vertical_velocity_integration
  facet: movement_physics
  label: One-sided fall-speed cap and orientation-aware vertical movement
  summary: The vertical integrator caps only nonnegative falling velocity at64 native units and integrates it into
    player position. In ordinary mode it updates y; orientation mode projects through a second signed table into
    x and y. Gravity, jump initiation, early-release behavior, grounded state and collision are upstream/downstream
    policies, not part of this leaf.
  instantiates:
  - concept: movement_physics.integration.signed_fall_velocity
  reads:
  - ram[0x03007818]:ptr player record, live witness 0x03003f28; dynamic allocation, do not hardcode witness pointer
  - player[0x00]:i32 world x in 1/256-pixel units
  - player[0x04]:i32 world y in 1/256-pixel units
  - player[0x93]:u8 transform selector; zero ordinary, nonzero selects low3 bits
  - player[0x1d]:i8 vertical velocity in 1/16-pixel units per invocation
  - rom[0x0815e3b4]:i16[16] vertical transform coefficients
  writes:
  - player[0x1d]:i8 upper-capped falling speed
  - player[0x00]:i32 wrapped integrated x when transform nonzero
  - player[0x04]:i32 wrapped integrated y
  invariants:
  - If signed vy >=64, store64. All negative velocities remain unchanged; this operator does not symmetrically cap
    rising speed.
  - Ordinary mode adds signedVelocity*16 to y modulo2^32. With 1/256-pixel position interpretation,64 corresponds
    to4 pixels per invocation.
  - Nonzero transform selector uses low3 bits and signed table products arithmetic-shift-right4 for both position
    axes. No trig dependency or approximated sine table is substituted.
  - This function never applies gravity or decides whether A starts a jump. A separate native experiment demonstrates
    variable-height jump behavior but does not reconstruct that complete policy.
  - State owns velocity and coordinates; scheduling and contact response must be retained or explicitly adapted
    before composition.
  evidence: *id003
  params:
    fall_speed_cap:
      value: 64
      unit: native 1/16-pixel per integration invocation
      native_value: 64
      native_unit: i8 velocity units
      evidence:
      - *id002
  tables:
    orientation_coefficients:
      description: Eight x terms followed by eight y terms recovered exactly from ROM.
      columns:
      - index
      - x
      - y
