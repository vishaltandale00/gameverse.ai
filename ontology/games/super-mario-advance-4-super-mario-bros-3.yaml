components:
- id: horizontal_velocity_integration
  facet: movement_physics
  label: Speed-limited horizontal movement with carrier and orientation inputs
  summary: The native player integrator clamps signed horizontal speed using a per-player limit, adds an auxiliary
    signed byte with native wrap semantics, and updates position. A nonzero orientation selector projects displacement
    through an eight-direction coefficient table; a mode flag controls the left boundary clamp. This is a qualified
    integration operator, while acceleration, contacts and transform-state production remain dependencies.
  instantiates:
  - concept: movement_physics.integration.oriented_signed_velocity
  reads:
  - ram[0x03007818]:ptr player record, live witness 0x03003f28; dynamic allocation, do not hardcode witness pointer
  - player[0x00]:i32 world x in 1/256-pixel units
  - player[0x04]:i32 world y in 1/256-pixel units
  - player[0x93]:u8 transform selector; zero ordinary, nonzero selects low3 bits
  - player[0x1c]:i8 horizontal speed in 1/16-pixel units per invocation
  - player[0x8a]:u16 cap source, shifted right2
  - ram[0x0300781c]:ptr auxiliary record; auxiliary[0x0a]:u8 additive motion byte
  - player[0xa0]:i16 left boundary in pixels
  - ram[0x03003cb3]:u8 nonzero bypasses boundary clamp
  - rom[0x0815e394]:i16[16] x/y orientation coefficients
  writes:
  - player[0x1c]:i8 capped horizontal speed
  - player[0x00]:i32 wrapped integrated x
  - player[0x04]:i32 wrapped integrated y when transform nonzero
  invariants:
  - Cap = u16(player[0x8a]) >>2. If abs(i8 vx) >= cap, store signed cap truncated to8 bits; oversized synthetic
    caps preserve native behavior rather than assume a well-formed caller.
  - Combined velocity = i8(u8(auxiliary[0x0a] + player[0x1c])); overflow wraps before scaling.
  - Ordinary mode adds combinedVelocity*16 to x, modulo2^32. Nonzero mode uses index=selector&7 and adds arithmetic-shift-right4(table[index]*combinedVelocity)
    to x and corresponding table[index+8] term to y.
  - When bypass==0, clamp signed integrated x to at least i16(player[0xa0])*256. This is a separate edge constraint,
    not a terrain solver.
  - Both integration operators write the same world coordinates. Host adapters must define update order and authority;
    never run alongside a competing unadapted Sonic or Metroid position writer.
  - Native stage1 witness supports player/world field assignment and ordinary movement; transform modes are instruction-qualified
    but not demonstrated in natural play.
  relations:
  - type: requires
    target: movement_physics.integration.signed_fall_velocity
    note: Shared player frame and coordinate units; larger native update caller orders integration, contacts and
      state changes.
  evidence: &id003
  - &id002
    kind: static_signature
    ref: research/corpus-mining/20261016-binary-corpus-round2/reviewed/sma4-motion-evidence.json
    confidence: 0.98
